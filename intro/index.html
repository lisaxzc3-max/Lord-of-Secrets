<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07050d">
<title>Приглашение — Повелитель тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#e8e0cf;--muted:#9d92b2;--gold:#cdb27a;--gold2:#8f7a4c;--line:#3d3352;--pc:#cdb27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07050d;color:var(--text);font:14px/1.5 Inter,system-ui,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#scene{position:fixed;inset:0;z-index:0;background:#07050d}
#scene svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s ease}
#scene svg.on{opacity:1}
.fog{position:fixed;left:-30%;width:160%;height:46%;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 30% 50%,#9d92b233,transparent 60%),radial-gradient(ellipse at 75% 60%,#8d86a62a,transparent 60%);animation:fogm 26s ease-in-out infinite alternate}
.fog.f1{bottom:18%}
.fog.f2{bottom:2%;height:40%;animation-duration:38s;animation-direction:alternate-reverse;opacity:.8}
@keyframes fogm{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;width:100%;height:100%}
.vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,#000b 100%);transition:background 1.4s}
.vig.red{background:radial-gradient(ellipse at 50% 45%,transparent 35%,#3a0a14cc 100%)}
.flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;animation:fl 1.4s ease-out}
@keyframes fl{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.dots{display:flex;gap:7px;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:#251d38;border:1px solid #54456f;transition:.6s}
.dot.on{background:radial-gradient(circle,#fff3cf,#cdb27a);border-color:var(--gold);box-shadow:0 0 10px #cdb27a99}
.dot.done{background:#6e5d38;border-color:#8f7a4c}
.mind{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.mind i{width:9px;height:9px;background:#b9a6e0;transform:rotate(45deg);transition:background 1s,box-shadow 1s,opacity 1s;box-shadow:0 0 6px #b9a6e088}
.mind i.off{background:#2a2238;box-shadow:none;opacity:.6}
#skip{background:none;border:1px solid #3d3352;color:var(--muted);border-radius:10px;padding:5px 9px;font-size:11px}
#skip.sure{border-color:#b2505a;color:#e9b0b6}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 14px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#07050dfa 55%,#07050d00);min-height:36%;display:flex;flex-direction:column;justify-content:flex-end}
.who{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:26px}
.who .ic{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold2);background:#17102a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.who .ic svg{width:20px;height:20px}
.who b{font:700 11px Georgia,serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
#tx{font:16px/1.55 Georgia,serif;color:#ece4d2;min-height:76px;max-width:520px;margin:0 auto;width:100%}
#tx.n{color:#c9c0d8;font-style:italic}
#tx:after{content:"";}
#tx.typing:after{content:"▍";color:var(--gold);animation:bl .9s steps(2) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}
#hint{text-align:center;color:var(--gold2);font-size:12px;height:16px;opacity:0;transition:opacity .4s;animation:bob 1.6s ease-in-out infinite}
#hint.on{opacity:.8}
@keyframes bob{50%{transform:translateY(3px)}}
#choices{display:grid;gap:9px;max-width:520px;margin:6px auto 0;width:100%}
.ch{padding:13px 14px;border-radius:14px;border:1px solid #5a4a80;background:linear-gradient(160deg,#241a38ee,#130d20ee);text-align:left;font:15px Georgia,serif;color:#efe5cc;opacity:0;transform:translateY(12px);animation:chIn .5s forwards;position:relative;overflow:hidden;transition:border-color .25s,box-shadow .25s}
.ch:active{transform:scale(.98)}
.ch:hover{border-color:var(--gold);box-shadow:0 0 16px #cdb27a33}
@keyframes chIn{to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:#05030acc;opacity:0;transition:opacity .6s}
.ov.on{display:flex}.ov.show{opacity:1}
.letter{position:relative;width:100%;max-width:380px;padding:26px 22px 20px;border-radius:6px;background:linear-gradient(160deg,#1b1528,#0f0b18);border:1px solid #6a5a3a;box-shadow:0 0 40px #cdb27a22,inset 0 0 30px #000a;text-align:center}
.letter:before{content:"";position:absolute;inset:6px;border:1px solid #6a5a3a55;pointer-events:none}
.seal{width:62px;height:62px;margin:-52px auto 12px;transition:transform 1s,opacity 1s}
.seal.crack{animation:crack 1.2s forwards}
@keyframes crack{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(4deg)}100%{transform:translateY(40px) scale(.7) rotate(-14deg);opacity:0}}
.ln{font:15px/1.6 Georgia,serif;color:#e6dcc4;margin:0 0 8px;opacity:0;transition:opacity 1.2s}
.ln.on{opacity:1}
.sig{font:italic 15px Georgia,serif;color:#cdb27a;margin-top:12px;opacity:0;transition:opacity 1.4s}
.sig.on{opacity:1}
.sig.hand{font:italic 20px "Bradley Hand","Segoe Script","Comic Sans MS",cursive;color:#e4cf9a}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:14px;font-weight:800;font-size:14px;letter-spacing:.5px;border:1px solid var(--gold2);background:linear-gradient(145deg,#6a5420,#2e220e);color:#fff0c4;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn:not(:disabled):after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#fff5,transparent);animation:sw 2.6s ease-in-out infinite}
@keyframes sw{0%,50%{left:-60%}100%{left:130%}}
.rd{width:100%;max-width:380px;padding:20px 18px;border-radius:16px;background:linear-gradient(160deg,#211832f2,#110b1cf2);border:1px solid #6a58a0;box-shadow:0 0 40px #6a58a044}
.rd h3{margin:0 0 10px;font:700 11px Georgia,serif;letter-spacing:3px;color:var(--gold);text-align:center;text-transform:uppercase}
.rd .rq{font:16px/1.6 Georgia,serif;text-align:center;color:#ece2cb;margin-bottom:12px}
.rd .rq p{margin:0 0 6px;opacity:0;transition:opacity 1.1s}
.rd .rq p.on{opacity:1}
.rd input{width:100%;padding:13px;border-radius:12px;border:1px solid #5a4a80;background:#0f0919;color:#fff;font:700 17px Georgia,serif;text-align:center;outline:none}
.rd input.bad{border-color:#b2505a;box-shadow:0 0 14px #b2505a66}
.rd input.ok{border-color:#7bbf93;box-shadow:0 0 16px #7bbf9366}
.rd .hn{min-height:36px;margin-top:8px;text-align:center;font-size:12px;color:#b8a9d6;font-style:italic}
.rd .at{display:flex;justify-content:center;gap:6px;margin-top:6px}
.rd .at i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);transition:.5s}
.rd .at i.off{background:#2a2238}
.rw{width:100%;max-width:380px;padding:22px 18px;border-radius:18px;background:linear-gradient(160deg,#241a38f5,#120b1ff5);border:1px solid var(--gold2);box-shadow:0 0 50px #cdb27a33;text-align:center}
.rw h2{margin:0 0 4px;font:900 20px Georgia,serif;color:#f3e6bd;letter-spacing:1px}
.rw .sb{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.rwi{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;margin:8px 0;border-radius:12px;border:1px solid #4a3d64;background:#ffffff08;opacity:0;transform:translateY(10px);animation:chIn .6s forwards}
.rwi .e{width:34px;height:34px;flex:0 0 34px;color:var(--gold)}
.rwi b{display:block;font:700 13px Georgia,serif;color:#f0e4c2}
.rwi small{color:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);max-width:88%;z-index:60;background:#3a1620f2;border:1px solid #d9443c;color:#ffd0cc;padding:10px 14px;border-radius:13px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cand{animation:cand 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes cand{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.08) scaleX(.94)}}
.rays{animation:breath 7s ease-in-out infinite}
@keyframes breath{50%{opacity:.5}}
.river{animation:rv 6s linear infinite}
@keyframes rv{to{stroke-dashoffset:-120}}
.lampG{opacity:1}
.lampG.off{animation:lampOff 2.2s forwards}
@keyframes lampOff{to{opacity:0}}
.rune{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fig{opacity:0;transition:opacity 2.4s}
.fig.on{opacity:1}
.glint{animation:gl 5s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.35}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script src="../shared/fast.js"></script>
<script src="../shared/auth.js"></script>
<script>document.documentElement.setAttribute("data-nochat","1")</script>
<script src="../shared/sound.js"></script>
</head>
<body>
<div id="scene"></div>
<div class="fog f1"></div><div class="fog f2"></div>
<canvas id="fx"></canvas>
<div class="vig" id="vig"></div>
<header class="top"><div class="dots" id="dots"></div><div class="mind" id="mind"></div><button id="skip" type="button">Пропустить</button></header>

<div class="ov" id="ovLetter"><div class="letter" id="letter">
  <svg class="seal" id="seal" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#6b1f2a" stroke="#a3434f" stroke-width="2"/><circle cx="32" cy="32" r="21" fill="none" stroke="#a3434f88" stroke-width="1"/><path d="M14 32q18-17 36 0q-18 17-36 0z" fill="none" stroke="#e0b3b8" stroke-width="2"/><circle cx="32" cy="32" r="5" fill="#e0b3b8"/></svg>
  <div id="lns"></div><div class="sig" id="sig"></div>
  <button class="btn" id="lbtn" type="button" disabled>Дальше</button>
</div></div>

<div class="ov" id="ovRiddle"><div class="rd">
  <h3>Загадка Привратника</h3>
  <div class="rq" id="rq"></div>
  <input id="ri" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Твой ответ">
  <div class="at" id="at"></div>
  <div class="hn" id="hn"></div>
  <button class="btn" id="rb" type="button">Назвать</button>
</div></div>

<div class="ov" id="ovReward"><div class="rw">
  <h2>Дар Привратника</h2><div class="sb" id="rwSub"></div>
  <div id="rwList"></div>
  <button class="btn" id="rwGo" type="button">В Тинген</button>
</div></div>

<main class="dlg" id="dlg">
  <div class="who"><span class="ic" id="whoIc"></span><b id="who"></b></div>
  <div id="tx"></div>
  <div id="choices"></div>
  <div id="hint">▼ коснись, чтобы продолжить</div>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.setHeaderColor("#07050d")}catch(_){}
const qs=new URLSearchParams(location.search);
const UID=qs.get("u")||"0";
const aEnc=qs.get("a_enc")||qs.get("a")||"";
const ACTION_URL=aEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(aEnc):"";
const pEnc=qs.get("p_enc")||qs.get("p")||"";
const PROFILE_URL=pEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(pEnc):"";
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const sfx=(n,d)=>{try{window.snd&&window.snd(n,d)}catch(_){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const HOME="../index.html"+location.search;
function unwrap(v){for(let i=0;i<3;i++){if(v&&v.result&&typeof v.result==="object")v=v.result;else break}return v}
async function api(p){
  if(!ACTION_URL)return needStart();
  const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p),cache:"no-store"});
  if(!r.ok)throw new Error("Ошибка сервера (HTTP "+r.status+")");
  const d=unwrap(await r.json());if(!d||typeof d!=="object")throw new Error("Некорректный ответ сервера");return d;
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2800)}
function flash(c){if(reduce)return;const d=document.createElement("div");d.className="flash";d.style.background="radial-gradient(circle,"+c+"cc,transparent 70%)";document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}

/* ---------- состояние ---------- */
const S={nick:"Путник",f:0,mind:5,dal:0,mark:"silence",way:"",solved:false,ans:"",tries:0,replay:false,busy:false};
const MARKS={name:["Метка Имени","Мост получил твоё имя."],mask:["Метка Маски","Мост получил твоё лицо."],silence:["Метка Тишины","Мост получил твоё молчание."]};

/* ---------- картинки: всё рисуется кодом ---------- */
const SKY='<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0820"/><stop offset=".6" stop-color="#1c1236"/><stop offset="1" stop-color="#0a0714"/></linearGradient><radialGradient id="mg"><stop offset="0" stop-color="#fff7dd"/><stop offset=".55" stop-color="#e3d29c"/><stop offset="1" stop-color="#b89a5a"/></radialGradient><radialGradient id="mh"><stop offset="0" stop-color="#e8d49a66"/><stop offset="1" stop-color="#e8d49a00"/></radialGradient><radialGradient id="lg"><stop offset="0" stop-color="#ffd27acc"/><stop offset="1" stop-color="#ffd27a00"/></radialGradient></defs><rect width="400" height="800" fill="url(#sk)"/>';
function stars(n,seed){let s="",x=seed;const r=()=>(x=(x*9301+49297)%233280)/233280;for(let i=0;i<n;i++)s+='<circle cx="'+(r()*400).toFixed(0)+'" cy="'+(r()*420).toFixed(0)+'" r="'+(r()*1.1+.3).toFixed(1)+'" fill="#fff" opacity="'+(r()*.6+.2).toFixed(2)+'"/>';return s}
function moon(cx,cy,r){return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*2.6)+'" fill="url(#mh)"/><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="url(#mg)"/><circle cx="'+(cx-r*.3)+'" cy="'+(cy-r*.1)+'" r="'+(r*.18)+'" fill="#b89a5a55"/><circle cx="'+(cx+r*.25)+'" cy="'+(cy+r*.3)+'" r="'+(r*.13)+'" fill="#b89a5a44"/>'}
function skyline(y,c,seed,h){let s="",x=-10,k=seed;const r=()=>(k=(k*9301+49297)%233280)/233280;while(x<410){const w=18+r()*26,hh=h*(.4+r()*.6);s+='<rect x="'+x.toFixed(0)+'" y="'+(y-hh).toFixed(0)+'" width="'+w.toFixed(0)+'" height="'+(hh+400).toFixed(0)+'" fill="'+c+'"/>';if(r()>.55)s+='<path d="M'+x.toFixed(0)+' '+(y-hh).toFixed(0)+' l'+(w/2).toFixed(0)+' -'+(10+r()*16).toFixed(0)+' l'+(w/2).toFixed(0)+' '+(10+r()*16).toFixed(0)+'z" fill="'+c+'"/>';x+=w+2}return s}
function wins(y,seed,n){let s="",k=seed;const r=()=>(k=(k*9301+49297)%233280)/233280;for(let i=0;i<n;i++)s+='<rect x="'+(r()*390).toFixed(0)+'" y="'+(y+r()*120).toFixed(0)+'" width="3" height="4" fill="#ffd27a" opacity="'+(r()*.5+.3).toFixed(2)+'"/>';return s}
function lamp(x,y,s,cls,d){return '<g class="lampG '+cls+'" style="animation-delay:'+d+'s"><circle cx="'+x+'" cy="'+(y-60*s)+'" r="'+(46*s)+'" fill="url(#lg)"/><rect x="'+(x-1.5*s)+'" y="'+(y-52*s)+'" width="'+(3*s)+'" height="'+(52*s)+'" fill="#0a0612"/><rect x="'+(x-6*s)+'" y="'+(y-62*s)+'" width="'+(12*s)+'" height="'+(10*s)+'" rx="'+(2*s)+'" fill="#ffe9a8"/></g>'}
const ART={
 room:()=>SKY+stars(40,3)+
  '<rect y="0" width="400" height="800" fill="#0b0715" opacity=".55"/>'+
  '<polygon class="rays" points="130,250 270,250 340,800 60,800" fill="#c9d4ff" opacity=".045"/>'+
  '<path d="M120 460V250a80 80 0 0 1 160 0V460z" fill="#10163a"/>'+moon(215,250,34)+
  '<path d="M120 460V250a80 80 0 0 1 160 0V460z" fill="none" stroke="#06040c" stroke-width="10"/><path d="M200 170V460M120 320H280" stroke="#06040c" stroke-width="7"/>'+
  '<rect x="100" y="456" width="200" height="16" fill="#120c1e"/>'+
  '<g><rect x="168" y="436" width="62" height="22" rx="2" fill="#17101f" stroke="#cdb27a55"/><path d="M168 438l31 14 31-14" fill="none" stroke="#cdb27a66"/><circle cx="199" cy="447" r="6" fill="#6b1f2a"/></g>'+
  '<rect y="560" width="400" height="240" fill="#0a0612"/><g stroke="#ffffff08">'+[0,1,2,3,4,5].map(i=>'<path d="M'+(i*80)+' 560L'+(i*130-120)+' 800"/>').join("")+'</g>'+
  '<g><rect x="40" y="470" width="8" height="70" fill="#1a1226"/><rect x="30" y="540" width="28" height="8" rx="3" fill="#1a1226"/><circle cx="44" cy="456" r="34" fill="url(#lg)"/><path class="cand" d="M44 440q-8 10 0 18q8-8 0-18z" fill="#ffd27a"/></g>'+
  '<rect x="318" y="320" width="82" height="300" fill="#0c0816"/>'+[0,1,2,3].map(i=>'<rect x="326" y="'+(332+i*70)+'" width="66" height="8" fill="#1a1226"/>').join("")+'<rect x="0" y="690" width="400" height="110" fill="#06040c"/>',
 street:()=>SKY+stars(50,7)+moon(310,120,30)+
   '<g transform="translate(0,-90)">'+skyline(520,"#120d24",11,230)+wins(330,5,22)+skyline(580,"#0b0716",23,260)+wins(400,9,26)+
  '<path d="M0 800V640L180 560H220L400 640V800z" fill="#0a0612"/><path d="M200 560L-60 800M200 560L460 800M200 560L110 800M200 560L290 800" stroke="#ffffff0a" fill="none"/>'+
  lamp(150,640,.7,"l1",.6)+lamp(260,640,.7,"l2",1.6)+lamp(70,720,1,"l3",2.8)+lamp(335,730,1.05,"l4",4)+
  '<rect x="0" y="700" width="400" height="200" fill="#04030a" opacity=".6"/></g>',
 bridge:()=>SKY+stars(60,13)+moon(200,190,64)+
  '<g transform="translate(0,-120)">'+skyline(470,"#0e0a1c",31,170)+wins(300,2,16)+
  '<rect x="26" y="250" width="34" height="230" fill="#0c0816"/><path d="M22 250l21-44 21 44z" fill="#0c0816"/><circle cx="43" cy="282" r="10" fill="#e9d79b" opacity=".85"/><path d="M43 282V275M43 282l4 2" stroke="#2a1a08" stroke-width="1.5"/>'+
  '<rect y="480" width="400" height="460" fill="#070512"/>'+
  [0,1,2,3,4,5,6,7].map(i=>'<path class="river" d="M'+(20+i*47)+' '+(520+(i%3)*50)+'h50" stroke="#c9d4ff" stroke-opacity=".25" stroke-width="2" stroke-dasharray="14 34" fill="none" style="animation-delay:-'+i+'s"/>').join("")+
  '<path d="M-20 560Q200 400 420 560V800H-20z" fill="#0c0919"/><path d="M-20 560Q200 400 420 560" fill="none" stroke="#2a2142" stroke-width="10"/>'+
  [30,90,150,250,310,370].map(x=>'<rect x="'+x+'" y="'+(500-Math.abs(x-200)*.13)+'" width="5" height="46" fill="#1a1330"/>').join("")+
  '<g class="fig" id="fig"><ellipse cx="200" cy="640" rx="60" ry="9" fill="#00000088"/><path d="M200 456c-40 0-62 42-66 98l-16 92h164l-16-92c-4-56-26-98-66-98z" fill="#060410"/><path d="M164 520q36-22 72 0" fill="none" stroke="#2a2142" stroke-width="2"/><ellipse class="glint" cx="200" cy="500" rx="17" ry="24" fill="#c9d4ff" opacity=".5"/><path class="glint" d="M192 488q8-8 14 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g></g>',

let typing=false,skipTyping=false,waitTap=null,curScene="";
const TX=$("tx");
function setWho(w){$("who").textContent=WHO[w]||"";$("whoIc").innerHTML=PORT[w]||PORT.n;$("whoIc").style.visibility=w==="n"?"hidden":"visible";TX.className=w==="n"?"n":""}
async function typeText(text){
  typing=true;skipTyping=false;TX.classList.add("typing");TX.textContent="";
  if(reduce)skipTyping=true;
  for(let i=1;i<=text.length;i++){if(skipTyping)break;TX.textContent=text.slice(0,i);await sleep(text[i-1]==="."||text[i-1]==="?"?150:text[i-1]===","?80:22)}
  TX.textContent=text;TX.classList.remove("typing");typing=false;
}
function waitForTap(){
  return new Promise(res=>{$("hint").classList.add("on");waitTap=()=>{$("hint").classList.remove("on");waitTap=null;res()}});
}
document.addEventListener("pointerdown",e=>{if(e.target.closest(".ch,.ov,button"))return;if(typing){skipTyping=true;return}if(waitTap)waitTap()});
async function say(b){
  if(b.if&&!b.if())return;
  setWho(b.w);if(b.fx)try{b.fx()}catch(_){}
  const t=typeof b.t==="function"?b.t():b.t;
  await typeText(t);await waitForTap();
}
function loseMind(n){
  S.mind=Math.max(0,S.mind-n);sfx("bad");
  const v=$("vig");v.classList.add("red");setTimeout(()=>v.classList.remove("red"),1500);
  renderMind();
}
function renderMind(){const m=$("mind");m.innerHTML="<span>Рассудок</span>"+[0,1,2,3,4].map(i=>'<i class="'+(i<S.mind?"":"off")+'"></i>').join("")}
function dots(n){const d=$("dots");d.replaceChildren();for(let i=1;i<=6;i++){const e=document.createElement("i");e.className="dot"+(i===n?" on":i<n?" done":"");d.appendChild(e)}}
function choose(list){
  return new Promise(res=>{
    const box=$("choices");box.replaceChildren();$("who").textContent="";$("whoIc").style.visibility="hidden";TX.textContent="";
    list.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.className="ch";b.style.animationDelay=(i*.12)+"s";b.textContent=c.t;
      b.addEventListener("click",()=>{sfx("tap");box.replaceChildren();res(c)});box.appendChild(b)});
  });
}
async function runScene(id){
  const sc=SC[id];curScene=id;setBg(sc.bg);dots(sc.step);
  await sleep(450);
  for(const b of sc.beats){
    if(b.letter){await showLetter(b.letter);continue}
    if(b.riddle){await showRiddle();continue}
    if(b.reward){await showReward();return}
    await say(b);
  }
  if(sc.ch){
    const c=await choose(sc.ch);
    if(c.set)Object.assign(S,c.set);
    if(c.mind)loseMind(-c.mind);
    if(c.pre)for(const b of c.pre)await say(b);
    return runScene(c.nx);
  }
  if(sc.nx)return runScene(sc.nx);
}

/* письмо */
async function showLetter(kind){
  const ov=$("ovLetter"),lns=$("lns"),sig=$("sig"),btn=$("lbtn"),seal=$("seal");
  lns.replaceChildren();sig.className="sig";sig.textContent="";btn.disabled=true;seal.classList.remove("crack");seal.style.display="";
  const first=["«"+nick()+", в тумане звучит шёпот. Мы тоже его слышим.","Если хочешь узнать, чей он, приходи на Старый мост до полуночи.","Света не бери. Имени тоже.»"];
  const lines=first;
  lines.forEach(t=>{const p=document.createElement("p");p.className="ln";p.textContent=t;lns.appendChild(p)});
  ov.classList.add("on");requestAnimationFrame(()=>ov.classList.add("show"));
  $("tx").textContent="";$("who").textContent="";$("whoIc").style.visibility="hidden";
  sfx("scroll");
  if(kind==="first"){
    await sleep(700);seal.classList.add("crack");sfx("stamp");await sleep(700);
    for(const p of lns.children){p.classList.add("on");sfx("whisper",.1);await sleep(1500)}
    sig.textContent="— Тот, кто ждёт";sig.classList.add("on");await sleep(900);
  }else{
    seal.style.display="none";
    for(const p of lns.children)p.classList.add("on");
    sig.textContent="— Тот, кто ждёт";sig.classList.add("on");await sleep(1800);
    sfx("divine");sig.classList.remove("on");await sleep(1500);
    sig.textContent="— "+nick();sig.classList.add("hand","on");flash("#cdb27a");await sleep(2200);
  }
  btn.disabled=false;
  await new Promise(res=>{btn.onclick=()=>{sfx("tap");btn.onclick=null;res()}});
  ov.classList.remove("show");await sleep(600);ov.classList.remove("on");sig.classList.remove("hand");
}

/* загадка */
const RIDDLE=["Я не имею веса, но тяну на дно.","Меня хранят все, а показывают лишь единицы.","Чем больше обо мне говорят, тем меньше меня остаётся.","Я живу в этом городе, и я же даю ему имя."];
const HINTS=["Подумай, чей титул вынесен в название этой игры.","Это слово из пяти букв. Оно начинается на «Т».","Привратник шепчет: «Тайна. Назови её».", ""];
async function showRiddle(){
  const ov=$("ovRiddle"),rq=$("rq"),ri=$("ri"),hn=$("hn"),at=$("at"),rb=$("rb");
  rq.replaceChildren();hn.textContent="";ri.value="";ri.className="";S.tries=0;
  RIDDLE.forEach(t=>{const p=document.createElement("p");p.textContent=t;rq.appendChild(p)});
  const drawAt=()=>{at.innerHTML=[0,1,2].map(i=>'<i class="'+(i<3-S.tries?"":"off")+'"></i>').join("")};drawAt();
  $("tx").textContent="";$("who").textContent="";$("whoIc").style.visibility="hidden";
  ov.classList.add("on");requestAnimationFrame(()=>ov.classList.add("show"));
  for(const p of rq.children){p.classList.add("on");sfx("whisper",.05);await sleep(1100)}
  setTimeout(()=>{try{ri.focus()}catch(_){}},300);
  await new Promise(res=>{
    let lock=false;
    const go=async()=>{
      if(lock)return;const v=ri.value.trim();if(!v){ri.classList.add("bad");return}
      lock=true;rb.disabled=true;sfx("tap");
      try{
        const d=await api({action:"intro_ans",ans:v});
        if(d.right){S.solved=true;S.ans=v;ri.className="ok";sfx("divine");hn.textContent="Дверь слышит тебя.";flash("#7bbf93");await sleep(1400);rb.onclick=null;ri.onkeydown=null;res();return}
        S.tries++;ri.className="bad";sfx("bad");drawAt();hn.textContent=HINTS[Math.min(S.tries-1,2)];
        if(S.tries>=3){await sleep(1800);rb.onclick=null;ri.onkeydown=null;res();return}
        ri.value="";
      }catch(e){toast(e.message||"Нет связи")}
      lock=false;rb.disabled=false;
    };
    rb.onclick=go;ri.onkeydown=e=>{if(e.key==="Enter")go()};
  });
  ov.classList.remove("show");await sleep(600);ov.classList.remove("on");
}

async function showReward(){
  $("tx").textContent="";$("who").textContent="";$("whoIc").style.visibility="hidden";
  let d=null,err="";
  try{d=await api({action:"intro_done",mark:S.mark,ans:S.solved?S.ans:""})}catch(e){err=e.message||"Нет связи"}
  const list=$("rwList");list.replaceChildren();
  const add=(g,t,s,i)=>{const r=document.createElement("div");r.className="rwi";r.style.animationDelay=(.4+i*.35)+"s";r.innerHTML=GL[g]+"<div><b></b><small></small></div>";r.querySelector("b").textContent=t;r.querySelector("small").textContent=s;list.appendChild(r)};
  const m=MARKS[S.mark];let i=0;
  if(!d||!d.ok){$("rwSub").textContent="Награду не удалось получить";add("mark",m[0],err||"Попробуй пройти вступление позже из настроек.",i++)}
  else if(d.already){$("rwSub").textContent="Награда получена ранее";add("mark",d.mark&&MARKS[d.mark]?MARKS[d.mark][0]:m[0],"Твоя метка моста",i++)}
  else{
    $("rwSub").textContent="За путь до двери";
    add("gold","+"+d.gold+" фунтов","Лежат в твоём кошельке",i++);
    if(d.art)add("art",d.art.name,"Реликвия Серого Тумана · "+d.art.bonus,i++);
    if(d.thread)add("thr","Нить судьбы","Редкий ингредиент за верный ответ",i++);
    add("mark",m[0],"Знак того, что ты оставил мосту",i++);
  }
  const ov=$("ovReward");ov.classList.add("on");requestAnimationFrame(()=>ov.classList.add("show"));
  sfx("win");flash("#cdb27a");
  $("rwGo").onclick=()=>{sfx("open");try{localStorage.setItem("lotm_intro_skip_"+UID,"1")}catch(_){}location.replace(HOME)};
}

/* пропуск */
$("skip").addEventListener("click",()=>{
  const b=$("skip");
  if(!b.classList.contains("sure")){b.classList.add("sure");b.textContent="Точно? Без награды";setTimeout(()=>{b.classList.remove("sure");b.textContent="Пропустить"},3000);return}
  try{localStorage.setItem("lotm_intro_skip_"+UID,"1")}catch(_){}
  location.replace(HOME);
});

/* частицы: пыль и мотыльки */
(function(){
  const cv=$("fx"),c=cv.getContext("2d");let w=0,h=0,P=[];
  function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight;P=Array.from({length:46},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.4,s:Math.random()*.25+.05,p:Math.random()*6}))}
  rs();addEventListener("resize",rs);if(reduce)return;
  (function f(t){c.clearRect(0,0,w,h);for(const d of P){d.y-=d.s;if(d.y<-4){d.y=h+4;d.x=Math.random()*w}
    c.beginPath();c.arc(d.x+Math.sin(t/1700+d.p)*9,d.y,d.r,0,6.283);c.fillStyle="rgba(214,196,150,"+(.2+.3*Math.sin(t/1000+d.p)).toFixed(2)+")";c.fill()}
    if(!document.hidden)requestAnimationFrame(f);else setTimeout(()=>requestAnimationFrame(f),500)})(0);
})();

/* запуск */
(async function boot(){
  renderMind();dots(1);setBg("room");
  try{sndMusic("calm")}catch(_){}
  try{
    if(PROFILE_URL){
      const r=await fetch(PROFILE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}",cache:"no-store"});
      const p=unwrap(await r.json());
      if(p&&p.nickname&&p.nickname!=="Без имени")S.nick=p.nickname;
      if(p&&p.gender==="female")S.f=1;
    }else{
      const st=await api({action:"start_state"});
      if(st&&st.nick)S.nick=st.nick;
    }
  }catch(_){}
  try{const d=await api({action:"intro_state"});if(d&&d.done)S.replay=true}catch(_){}
  if(S.replay)toast("Повторный просмотр: награда уже получена");
  runScene("room");
})();
