<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07050d">
<title>Приглашение — Повелитель тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#e8e0cf;--muted:#9d92b2;--gold:#cdb27a;--gold2:#8f7a4c;--line:#3d3352;--pc:#cdb27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07050d;color:var(--text);font:14px/1.5 Inter,system-ui,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#stage{position:fixed;inset:0;z-index:0;background:#07050d;overflow:hidden}
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.dots{display:flex;gap:7px;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:#251d38;border:1px solid #54456f;transition:.6s}
.dot.on{background:#e9d9a8;border-color:var(--gold);transform:scale(1.25)}
.dot.done{background:#6e5d38;border-color:#8f7a4c}
.mind{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.mind i{width:9px;height:9px;background:#b9a6e0;transform:rotate(45deg);transition:background 1s,opacity 1s}
.mind i.off{background:#2a2238;opacity:.6}
#skip{background:none;border:1px solid #3d3352;color:var(--muted);border-radius:10px;padding:5px 9px;font-size:11px}
#skip.sure{border-color:#b2505a;color:#e9b0b6}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 14px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#07050dfa 55%,#07050d00);min-height:36%;display:flex;flex-direction:column;justify-content:flex-end}
.who{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:26px}
.who .ic{width:26px;height:26px;border-radius:50%;border:1px solid var(--pc);transition:border-color .4s;background:#17102a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.who .ic svg{width:20px;height:20px}
.who b{font:700 11px Philosopher,Georgia,serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--pc);transition:color .4s}
#tx{font:16px/1.55 Philosopher,Georgia,serif;color:#ece4d2;min-height:76px;max-width:520px;margin:0 auto;width:100%}
#tx.n{color:#c9c0d8;font-style:italic}
#tx:after{content:"";}
#tx.typing:after{content:"▍";color:var(--gold);animation:bl .9s steps(2) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}
#hint{text-align:center;color:var(--gold2);font-size:12px;height:16px;opacity:0;transition:opacity .4s}
#hint.on{opacity:.85;animation:hp 1.9s ease-in-out infinite}
@keyframes hp{50%{opacity:.3}}
#choices{display:grid;gap:9px;max-width:520px;margin:6px auto 0;width:100%}
.ch{padding:13px 14px;border-radius:14px;border:1px solid #5a4a80;background:linear-gradient(160deg,#241a38ee,#130d20ee);text-align:left;font:15px Philosopher,Georgia,serif;color:#efe5cc;opacity:0;transform:translateY(12px);animation:chIn .5s forwards;position:relative;overflow:hidden;transition:border-color .25s,box-shadow .25s}
.ch:active{transform:scale(.98)}
.ch:hover{border-color:var(--gold)}
@keyframes chIn{to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:#05030acc;opacity:0;transition:opacity .6s}
.ov.on{display:flex}.ov.show{opacity:1}
.letter{position:relative;width:100%;max-width:380px;padding:26px 22px 20px;border-radius:6px;background:linear-gradient(160deg,#1b1528,#0f0b18);border:1px solid #6a5a3a;box-shadow:inset 0 0 30px #000a;text-align:center}
.letter:before{content:"";position:absolute;inset:6px;border:1px solid #6a5a3a55;pointer-events:none}
.seal{width:62px;height:62px;margin:-52px auto 12px;transition:transform 1s,opacity 1s}
.seal.crack{animation:crack 1.2s forwards}
@keyframes crack{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(4deg)}100%{transform:translateY(40px) scale(.7) rotate(-14deg);opacity:0}}
.ln{font:15px/1.6 Philosopher,Georgia,serif;color:#e6dcc4;margin:0 0 8px;opacity:0;transition:opacity 1.2s}
.ln.on{opacity:1}
.sig{font:italic 15px Philosopher,Georgia,serif;color:#cdb27a;margin-top:12px;opacity:0;transition:opacity 1.4s}
.sig.on{opacity:1}
.sig.hand{font:italic 20px "Bradley Hand","Segoe Script","Comic Sans MS",cursive;color:#e4cf9a}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:14px;font-weight:800;font-size:14px;letter-spacing:.5px;border:1px solid var(--gold2);background:linear-gradient(145deg,#6a5420,#2e220e);color:#fff0c4;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.rw{width:100%;max-width:380px;padding:22px 18px;border-radius:18px;background:linear-gradient(160deg,#241a38f5,#120b1ff5);border:1px solid var(--gold2);text-align:center}
.rw h2{margin:0 0 4px;font:900 20px Philosopher,Georgia,serif;color:#f3e6bd;letter-spacing:1px}
.rw .sb{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.rwi{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;margin:8px 0;border-radius:12px;border:1px solid #4a3d64;background:#ffffff08;opacity:0;transform:translateY(10px);animation:chIn .6s forwards}
.rwi .e{width:34px;height:34px;flex:0 0 34px;color:var(--gold)}
.rwi b{display:block;font:700 13px Philosopher,Georgia,serif;color:#f0e4c2}
.rwi small{color:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);max-width:88%;z-index:60;background:#3a1620f2;border:1px solid #d9443c;color:#ffd0cc;padding:10px 14px;border-radius:13px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script src="../shared/fast.js?v=a6"></script>
<script src="../shared/auth.js"></script>
<script>document.documentElement.setAttribute("data-nochat","1")</script>
<script src="../shared/sound.js?v=a4"></script>
<script src="../shared/qfx.js"></script>
</head>
<body>
<div id="stage"></div>
<header class="top"><div class="dots" id="dots"></div><div class="mind" id="mind"></div><button id="skip" type="button">Пропустить</button></header>

<div class="ov" id="ovLetter"><div class="letter" id="letter">
  <svg class="seal" id="seal" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#6b1f2a" stroke="#a3434f" stroke-width="2"/><circle cx="32" cy="32" r="21" fill="none" stroke="#a3434f88" stroke-width="1"/><path d="M14 32q18-17 36 0q-18 17-36 0z" fill="none" stroke="#e0b3b8" stroke-width="2"/><circle cx="32" cy="32" r="5" fill="#e0b3b8"/></svg>
  <div id="lns"></div><div class="sig" id="sig"></div>
  <button class="btn" id="lbtn" type="button" disabled>Дальше</button>
</div></div>

<div class="ov" id="ovReward"><div class="rw">
  <h2>Дар Привратника</h2><div class="sb" id="rwSub"></div>
  <div id="rwList"></div>
  <button class="btn" id="rwGo" type="button">В Тинген</button>
</div></div>

<main class="dlg" id="dlg">
  <div class="who"><span class="ic" id="whoIc"></span><b id="who"></b></div>
  <div id="tx"></div>
  <div id="choices"></div>
  <div id="hint">▼ коснись, чтобы продолжить</div>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.setHeaderColor("#07050d")}catch(_){}
const qs=new URLSearchParams(location.search);
const UID=qs.get("u")||"0";
const aEnc=qs.get("a_enc")||qs.get("a")||"";
const ACTION_URL=aEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(aEnc):"";
const pEnc=qs.get("p_enc")||qs.get("p")||"";
const PROFILE_URL=pEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(pEnc):"";
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const Q=window.QFX||new Proxy({},{get:()=>()=>{}});
const sfx=(n,d)=>{try{window.snd&&window.snd(n,d)}catch(_){}try{Q.vis(n)}catch(_){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const HOME="../index.html"+location.search;
function unwrap(v){for(let i=0;i<3;i++){if(v&&v.result&&typeof v.result==="object")v=v.result;else break}return v}
async function api(p){
  if(!ACTION_URL)return needStart();
  const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p),cache:"no-store"});
  if(!r.ok)throw new Error("Ошибка сервера (HTTP "+r.status+")");
  const d=unwrap(await r.json());if(!d||typeof d!=="object")throw new Error("Некорректный ответ сервера");return d;
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2800)}
function flash(c){try{Q.flash(c)}catch(_){}}

/* ---------- состояние ---------- */
const S={nick:"Путник",f:0,mind:5,dal:0,mark:"silence",way:"",solved:false,ans:"",tries:0,replay:false,busy:false};
const MARKS={name:["Метка Имени","Мост получил твоё имя."],mask:["Метка Маски","Мост получил твоё лицо."],silence:["Метка Тишины","Мост получил твоё молчание."]};

/* ---------- арты сцен: ./img/<имя>.jpg + эффекты QFX ---------- */
const SCENE_MUSIC={room:"calm",street:"city",bridge:"lake",door:"tingen"};
let curBg="";
function setBg(n){
  if(curBg===n)return;curBg=n;Q.scene(n);
  const m=SCENE_MUSIC[n];if(m)try{sndMusic(m)}catch(_){}
}

/* портреты */
const PORT={
 n:'<svg viewBox="0 0 24 24" fill="none" stroke="#cdb27a" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 12C6 6.5 18 6.5 21.5 12 18 17.5 6 17.5 2.5 12z"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="1" fill="#cdb27a"/></svg>',
 d:'<svg viewBox="0 0 24 24"><path d="M5 9c0-4 3-6 7-6s7 2 7 6v6c0 4-3 6-7 6s-7-2-7-6z" fill="#3a2f52" stroke="#cdb27a" stroke-width="1.2"/><circle cx="9" cy="10" r="2.6" fill="#f5e6b0"/><circle cx="15" cy="10" r="2.6" fill="#f5e6b0"/><circle cx="9" cy="10" r="1" fill="#120c1e"/><circle cx="15" cy="10" r="1" fill="#120c1e"/><path d="M11 12.5h2l-1 2z" fill="#cdb27a"/></svg>',
 g:'<svg viewBox="0 0 24 24"><path d="M12 2c-5 0-8 5-8 12l-1 8h18l-1-8c0-7-3-12-8-12z" fill="#0a0713" stroke="#54456f" stroke-width="1"/><ellipse cx="12" cy="10" rx="3.4" ry="4.6" fill="#c9d4ff" opacity=".7"/></svg>'
};
const WHO={n:"",d:"Далия",g:"Привратник"};
const PCOL={n:"#cdb27a",d:"#e6b98a",g:"#bcc8f2"};

/* ---------- сюжет ---------- */
const nick=()=>S.nick;
const gv=(m,f)=>S.f?f:m;
const SC={
 room:{bg:"room",step:1,beats:[
  {w:"n",t:"Ночь. Тинген спит, и лишь далёкий колокол отсчитывает часы. Тебя будит тихий стук. Не в дверь, а в само окно.",fx:()=>sfx("bell")},
  {w:"n",t:"На подоконнике лежит конверт из чёрной бумаги. Воск на нём без печати. И он ещё тёплый.",fx:()=>sfx("qpage")}],
  ch:[{t:"Вскрыть конверт",nx:"letter"},
      {t:"Сначала осмотреть воск",nx:"letter",mind:-1,pre:[{w:"n",t:"Воск пахнет дымом и старой бумагой. В застывшей капле виден крошечный глаз. Он следит за тобой.",fx:()=>sfx("whisper")}]},
      {t:"Бросить конверт в камин",nx:"letter",pre:[{w:"n",t:"Бумага не горит. Пламя гаснет, едва коснувшись её. Похоже, прочесть всё же придётся."}]}]},
 letter:{bg:"room",step:2,beats:[{letter:"first"}],nx:"owl"},
 owl:{bg:"room",step:2,beats:[
  {w:"d",t:"Письмо прочитано дважды, а я успела трижды. Письма без подписи — как улыбки без глаз.",fx:()=>sfx("raven")},
  {w:"d",t:"Если пойдёшь, я пойду с тобой. Если не пойдёшь, всё равно пойду. Просто скажи, как мне сделать это красиво."}],
  ch:[{t:"«Летим вместе, Далия»",set:{dal:1},nx:"street"},
      {t:"«Я пойду один»",set:{dal:0},nx:"street",pre:[{w:"d",t:"Хм. Одиночки в тумане живут недолго и интересно. Я буду смотреть сверху."}]}]},
 street:{bg:"street",step:3,beats:[
  {w:"n",t:"Туман густой, как молоко. Фонари гаснут один за другим, стоит тебе пройти мимо.",fx:()=>setTimeout(()=>Q.lampsOff(()=>sfx("qlamp")),900)},
  {w:"d",if:()=>S.dal,t:"Они не гаснут. Они закрывают глаза. Не смотри им в зрачки."},
  {w:"n",t:"Впереди три пути: слабый свет, звук шагов и тишина."}],
  ch:[{t:"Идти на последний фонарь",nx:"bridge",set:{way:"light"},mind:-1,pre:[{w:"n",t:"Свет оказывается пустой оболочкой. Внутри лампы только отражение луны. Но оно моргает."}]},
      {t:"Идти на звук шагов",nx:"bridge",set:{way:"steps"},mind:-1,pre:[{w:"n",t:"Шаги замирают, когда замираешь ты. Они повторяют тебя на полшага позже."}]},
      {t:"Стоять и слушать",nx:"bridge",set:{way:"listen"},pre:[{w:"n",t:"В тишине кто-то шёпотом считает до тринадцати. Ты досчитываешь вместе с ним, и туман расступается.",fx:()=>sfx("whisper")}]}]},
 bridge:{bg:"bridge",step:4,beats:[
  {w:"n",t:"Старый мост выгнулся над чёрной водой, как кошка. Часы на башне показывают без одной минуты полночь.",fx:()=>sfx("qclock")},
  {w:"n",t:"Посреди моста стоит фигура в плаще. Ты не слышал, как она подошла. Она тоже не слышала, как подошёл ты.",fx:()=>sfx("qwhoosh")},
  {w:"g",t:()=>"Ты "+gv("пришёл","пришла")+", "+nick()+". Это уже ответ."},
  {w:"d",if:()=>S.dal,t:"У него нет лица. Или оно просто в другом месте."}],
  ch:[{t:"«Кто ты?»",nx:"toll",pre:[{w:"g",t:"Тот, кто стережёт дверь, которой нет."}]},
      {t:"«Это ты прислал письмо?»",nx:"toll",pre:[{w:"g",t:"Письмо писал не я. Я лишь принёс. Рук у меня две, голосов много."}]},
      {t:"«Чего ты хочешь?»",nx:"toll",pre:[{w:"g",t:"Мне ничего не нужно. Платы требует мост."}]}]},
 toll:{bg:"bridge",step:4,beats:[
  {w:"g",t:"Каждый, кто хочет пройти, оставляет мосту одну вещь. Что оставишь ты?"}],
  ch:[{t:"Своё имя",nx:"final",set:{mark:"name"},mind:-1,pre:[{w:"n",t:"Имя повисает над водой и медленно тонет. Ты чувствуешь, как оно становится чуть меньше твоим.",fx:()=>sfx("whisper")}]},
      {t:"Своё лицо",nx:"final",set:{mark:"mask"},pre:[{w:"g",t:"Привратник кивает. Маска ложится на лицо так, словно всегда там была."}]},
      {t:"Ничего. Просто промолчать",nx:"final",set:{mark:"silence"},pre:[{w:"g",t:"Он долго смотрит. «Тишину берут охотнее всего», — говорит он. Вода под мостом на миг замирает."}]}]},
 final:{bg:"door",step:5,beats:[
  {w:"g",t:()=>"Дверь признаёт тебя. Ты "+gv("дошёл","дошла")+" до конца.",fx:()=>{sfx("qdoor");setTimeout(()=>sfx("divine"),1200)}},
  {w:"n",t:"Привратник поднимает руки к капюшону и снимает его. Под ним нет лица. Там зеркало, и в нём стоишь ты. Только глаза другие."},
  {w:"d",if:()=>S.dal,t:"Не смотри долго. Зеркала в этом городе привыкают к тем, кто в них смотрит."},
  {w:"g",t:()=>MARKS[S.mark][1]+" Возьми то, что оставили для тебя.",fx:()=>sfx("stamp")},
  {w:"g",t:"И последнее. Взгляни ещё раз на своё письмо. Внимательнее.",fx:()=>sfx("whisper")},
  {letter:"twist"},
  {w:"n",t:()=>"Почерк знаком. "+nick()+", ты не помнишь, чтобы писал"+gv("","а")+" это письмо. Пока не помнишь."},
  {reward:true}]}
};

/* ---------- движок ---------- */
let typing=false,skipTyping=false,waitTap=null,curScene="";
const TX=$("tx");
function setWho(w){document.documentElement.style.setProperty("--pc",PCOL[w]||"#cdb27a");$("who").textContent=WHO[w]||"";$("whoIc").innerHTML=PORT[w]||PORT.n;$("whoIc").style.visibility=w==="n"?"hidden":"visible";TX.className=w==="n"?"n":""}
async function typeText(text){
  typing=true;skipTyping=false;TX.classList.add("typing");TX.textContent="";
  if(reduce)skipTyping=true;
  for(let i=1;i<=text.length;i++){if(skipTyping)break;TX.textContent=text.slice(0,i);if(i%3===0)try{window.snd&&window.snd("qtick")}catch(_){}await sleep(text[i-1]==="."||text[i-1]==="?"?150:text[i-1]===","?80:22)}
  TX.textContent=text;TX.classList.remove("typing");typing=false;
}
function waitForTap(){
  return new Promise(res=>{$("hint").classList.add("on");waitTap=()=>{$("hint").classList.remove("on");waitTap=null;res()}});
}
document.addEventListener("pointerdown",e=>{if(e.target.closest(".ch,.ov,button"))return;if(typing){skipTyping=true;return}if(waitTap)waitTap()});
async function say(b){
  if(b.if&&!b.if())return;
  setWho(b.w);if(b.fx)try{b.fx()}catch(_){}
  const t=typeof b.t==="function"?b.t():b.t;
  await typeText(t);await waitForTap();
}
function loseMind(n){
  S.mind=Math.max(0,S.mind-n);sfx("bad");Q.hurt();
  renderMind();
}
function renderMind(){const m=$("mind");m.innerHTML="<span>Рассудок</span>"+[0,1,2,3,4].map(i=>'<i class="'+(i<S.mind?"":"off")+'"></i>').join("");Q.mind(S.mind)}
function dots(n){const d=$("dots");d.replaceChildren();for(let i=1;i<=5;i++){const e=document.createElement("i");e.className="dot"+(i===n?" on":i<n?" done":"");d.appendChild(e)}}
function choose(list){
  return new Promise(res=>{
    const box=$("choices");box.replaceChildren();$("who").textContent="";$("whoIc").style.visibility="hidden";TX.textContent="";
    list.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.className="ch";b.style.animationDelay=(i*.12)+"s";b.textContent=c.t;
      b.addEventListener("click",()=>{sfx("tap");box.replaceChildren();res(c)});box.appendChild(b)});
  });
}
async function runScene(id){
  const sc=SC[id];curScene=id;setBg(sc.bg);dots(sc.step);
  await sleep(450);
  for(const b of sc.beats){
    if(b.letter){await showLetter(b.letter);continue}
    if(b.reward){await showReward();return}
    await say(b);
  }
  if(sc.ch){
    const c=await choose(sc.ch);
    if(c.set)Object.assign(S,c.set);
    if(c.mind)loseMind(-c.mind);
    if(c.pre)for(const b of c.pre)await say(b);
    return runScene(c.nx);
  }
  if(sc.nx)return runScene(sc.nx);
}

/* письмо */
async function showLetter(kind){
  const ov=$("ovLetter"),lns=$("lns"),sig=$("sig"),btn=$("lbtn"),seal=$("seal");
  lns.replaceChildren();sig.className="sig";sig.textContent="";btn.disabled=true;seal.classList.remove("crack");seal.style.display="";
  const first=["«"+nick()+", в тумане звучит шёпот. Мы тоже его слышим.","Если хочешь узнать, чей он, приходи на Старый мост до полуночи.","Света не бери. Имени тоже.»"];
  const lines=first;
  lines.forEach(t=>{const p=document.createElement("p");p.className="ln";p.textContent=t;lns.appendChild(p)});
  ov.classList.add("on");requestAnimationFrame(()=>ov.classList.add("show"));
  $("tx").textContent="";$("who").textContent="";$("whoIc").style.visibility="hidden";
  sfx("scroll");
  if(kind==="first"){
    await sleep(700);seal.classList.add("crack");sfx("stamp");await sleep(700);
    for(const p of lns.children){p.classList.add("on");sfx("whisper",.1);await sleep(1500)}
    sig.textContent="— Тот, кто ждёт";sig.classList.add("on");await sleep(900);
  }else{
    seal.style.display="none";
    for(const p of lns.children)p.classList.add("on");
    sig.textContent="— Тот, кто ждёт";sig.classList.add("on");await sleep(1800);
    sfx("divine");sig.classList.remove("on");await sleep(1500);
    sig.textContent="— "+nick();sig.classList.add("hand","on");flash("#cdb27a");await sleep(2200);
  }
  btn.disabled=false;
  await new Promise(res=>{btn.onclick=()=>{sfx("tap");btn.onclick=null;res()}});
  ov.classList.remove("show");await sleep(600);ov.classList.remove("on");sig.classList.remove("hand");
}

/* награда */
const GL={
 gold:'<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9 9.5h4.5a1.8 1.8 0 0 1 0 3.5H9"/></svg>',
 art:'<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z"/><path d="M12 8v6M9 11h6"/></svg>',
 thr:'<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 18c0-6 6-3 6-8S6 6 9 4M12 14c5 0 8 2 8 5M12 14c0-2 3-3 5-1"/><circle cx="9" cy="4" r="1.2"/></svg>',
 mark:'<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 12C6 6.5 18 6.5 21.5 12 18 17.5 6 17.5 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>'
};
async function showReward(){
  $("tx").textContent="";$("who").textContent="";$("whoIc").style.visibility="hidden";
  const ov=$("ovReward"),list=$("rwList"),go=$("rwGo");
  ov.classList.add("on");requestAnimationFrame(()=>ov.classList.add("show"));
  const m=MARKS[S.mark];
  async function claim(){
    go.disabled=true;go.textContent="Получаем награду…";
    let d=null,err="";
    try{d=await api({action:"intro_done",mark:S.mark,ans:""})}catch(e){err=e.message==="need_start"?"Открой игру через бота командой /start":(e.message||"Нет связи")}
    list.replaceChildren();let i=0;
    const add=(g,t,s2)=>{const r=document.createElement("div");r.className="rwi";r.style.animationDelay=(.4+i++*.35)+"s";r.innerHTML=GL[g]+"<div><b></b><small></small></div>";r.querySelector("b").textContent=t;r.querySelector("small").textContent=s2;list.appendChild(r)};
    go.disabled=false;
    if(!d||!d.ok){
      $("rwSub").textContent="Награда ещё не получена";add("mark",m[0],err||"Нет связи с сервером");
      go.textContent="Повторить";go.onclick=()=>{sfx("tap");claim()};return;
    }
    if(d.already){$("rwSub").textContent="Награда получена ранее";add("mark",d.mark&&MARKS[d.mark]?MARKS[d.mark][0]:m[0],"Твоя метка моста")}
    else{
      $("rwSub").textContent="За путь до двери";
      add("gold","+"+d.gold+" фунтов","Лежат в твоём кошельке");
      if(d.art)add("art",d.art.name,"Реликвия Серого Тумана · "+d.art.bonus);
      if(d.thread)add("thr","Нить судьбы","Редкий ингредиент");
      add("mark",m[0],"Знак того, что ты оставил мосту");
    }
    sfx("win");sfx("qchime",.4);
    go.textContent="В Тинген";
    go.onclick=()=>{sfx("open");try{localStorage.setItem("lotm_intro_skip_"+UID,"1")}catch(_){}location.replace(HOME)};
  }
  await claim();
}

/* пропуск */
$("skip").addEventListener("click",()=>{
  const b=$("skip");
  if(!b.classList.contains("sure")){b.classList.add("sure");b.textContent="Точно? Без награды";setTimeout(()=>{b.classList.remove("sure");b.textContent="Пропустить"},3000);return}
  try{localStorage.setItem("lotm_intro_skip_"+UID,"1")}catch(_){}
  location.replace(HOME);
});

/* запуск */
(async function boot(){
  Q.init($("stage"),{base:"./img/",ver:2});
  renderMind();dots(1);setBg("room");Q.preload(["street","bridge","door"]);
  try{
    if(PROFILE_URL){
      const r=await fetch(PROFILE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}",cache:"no-store"});
      const p=unwrap(await r.json());
      if(p&&p.nickname&&p.nickname!=="Без имени")S.nick=p.nickname;
      if(p&&p.gender==="female")S.f=1;
    }else{
      const st=await api({action:"start_state"});
      if(st&&st.nick)S.nick=st.nick;
    }
  }catch(_){}
  try{const d=await api({action:"intro_state"});if(d&&d.done)S.replay=true}catch(_){}
  if(S.replay)toast("Повторный просмотр: награда уже получена");
  runScene("room");
})();
</script>
