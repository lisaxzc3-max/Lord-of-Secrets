<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Повелитель Тайн v6.1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial}
body{background:#07070a;color:#e9d8a6;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:10px 10px 70px}
.top{display:flex;gap:10px;background:linear-gradient(135deg,#14141b,#1a1a2e);border:1px solid #c9a86a;border-radius:16px;padding:10px}
.avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#c9a86a,#8b6914);display:flex;align-items:center;justify-content:center;color:#000;font-size:20px}
.bar{height:8px;background:#2a2a33;border-radius:8px;margin:4px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e63946,#ff7b7b);transition:width .6s}
.card{background:#14141b;border:1px solid rgba(201,168,106,.3);border-radius:16px;padding:12px;margin:8px 0}
.btn{border:1px solid #c9a86a;background:#1c1c24;border-radius:10px;padding:10px;text-align:center;font-size:13px;margin:4px 0;cursor:pointer}
.btn.gold{background:linear-gradient(135deg,#c9a86a,#8b6914);color:#000;font-weight:700}
.btn:active{transform:scale(.97)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{flex:1;padding:8px;text-align:center;border-radius:10px;background:#1c1c24;border:1px solid #333;font-size:11px;cursor:pointer}
.tab.active{background:#c9a86a;color:#000}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0d;border-top:1px solid rgba(201,168,106,.3);display:flex;justify-content:space-around;padding:8px 0}
.nav a{font-size:11px;color:#e9d8a6;text-decoration:none}
.hidden{display:none}
.item{border:1px solid #2a2a33;border-radius:10px;padding:8px;margin:4px 0;background:#1e1e28;display:flex;justify-content:space-between;align-items:center}
small{opacity:.6;font-size:10px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="avatar">𓂀</div>
<div style="flex:1">
<div style="font-size:13px"><b id="nick">Загрузка...</b> · Ур.<span id="lvl">-</span></div>
<div class="bar"><i id="hpbar" style="width:0%"></i></div>
<div style="font-size:10px">❤️ <span id="hp">-</span> · 💷 <span id="pounds">-</span> · 🧪 <span id="potion">-</span>% · UID <span id="uid">-</span></div>
</div>
<div style="text-align:right;font-size:11px">⭐ <span id="exp">-</span><br><span id="pts" style="color:#f4d35e"></span></div>
</div>

<div class="tabs">
<div class="tab active" id="t-hall" onclick="showTab('hall')">◈ Зал</div>
<div class="tab" id="t-travel" onclick="showTab('travel')">🧭 Путь</div>
<div class="tab" id="t-city" onclick="showTab('city')">⌖ Город</div>
<div class="tab" id="t-bag" onclick="showTab('bag')">🎒 Сумка</div>
</div>

<div id="hall" class="card">
<h3>◈ Профиль</h3>
<div id="hallInfo" style="font-size:12px;white-space:pre-wrap">Загрузка...</div>
<div id="statsBox" style="margin-top:8px"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><div class="btn" onclick="loadProfile()">🔄 Обновить</div><div class="btn" onclick="Telegram.WebApp.close()">✕ Закрыть</div></div>
<small id="debug"></small>
</div>

<div id="travel" class="card hidden">
<h3>🧭 Путешествие</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="btn gold" onclick="openTravel('lake')">🌊 Озеро</div><div class="btn" onclick="openTravel('podval')">🕳 Подвал</div></div>
<div id="travelInfo" style="font-size:12px;margin-top:8px;white-space:pre-wrap"></div><div id="travelBtns"></div>
</div>

<div id="city" class="card hidden">
<h3>⌖ Тинген</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div class="btn" onclick="openLoc('market')">🍎 Рынок</div><div class="btn" onclick="openLoc('dragon_tavern')">🐉 Таверна</div>
<div class="btn" onclick="openLoc('station')">🚂 Вокзал</div><div class="btn" onclick="openLoc('houses')">🏠 Дома</div>
</div>
<div id="locInfo" style="font-size:12px;margin-top:8px;white-space:pre-wrap"></div><div id="locBtns"></div>
</div>

<div id="bag" class="card hidden">
<h3>🎒 Инвентарь <span id="bagCnt" style="font-size:11px;opacity:.6"></span></h3><div id="invList"></div>
<h3 style="margin-top:10px">⬢ Надето</h3><div id="eqList"></div>
</div>

<div id="eventCard" class="card hidden"><h3 id="eventTitle">Событие</h3><div id="eventText" style="font-size:12px;white-space:pre-wrap"></div><div id="eventBtns"></div></div>
<div id="battleCard" class="card hidden"><h3 id="battleTitle">⚔ Бой</h3><div id="battleText" style="font-size:12px;white-space:pre-wrap"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><div class="btn gold" onclick="doBattle('basic')">⚔ Базовая</div><div class="btn" onclick="doBattle('flee')">🏃 Сбежать</div></div></div>
</div>

<div class="nav"><a onclick="showTab('hall')" id="n-hall">◈ Зал</a><a onclick="showTab('travel')" id="n-travel">🧭 Путь</a><a onclick="showTab('city')" id="n-city">⌖ Город</a><a onclick="showTab('bag')" id="n-bag">🎒 Сумка</a></div>

<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const qs=new URLSearchParams(location.search);
let uid=qs.get("u")||tg.initDataUnsafe?.user?.id||"7320193489";
document.getElementById('uid').innerText=uid;
let p_enc=qs.get("p_enc")||qs.get("p")||"",a_enc=qs.get("a_enc")||qs.get("a")||"";
let PROFILE_URL=p_enc?"https://api.telebotcreator.com/new-webhook?data="+p_enc:"";
let ACTION_URL=a_enc?"https://api.telebotcreator.com/new-webhook?data="+a_enc:"";
const HANDSHAKE="https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_145d9fce";
function log(s){document.getElementById('debug').innerText+="\n"+s}
function unwrap(j){return j&&j.result&&typeof j.result==='object'?j.result:j}
function showTab(id){
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
document.getElementById('t-'+id).classList.add('active');
['hall','travel','city','bag'].forEach(x=>document.getElementById(x).classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
if(id==='bag')renderBag();
}
let G={inv:[],eq:{}};
async function ensureUrls(){
if(PROFILE_URL&&ACTION_URL)return true;
try{
const r=await fetch(HANDSHAKE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:String(uid)})});
const t=await r.text();log("hs "+t.slice(0,200));
const j=unwrap(JSON.parse(t));
if(j.ok){PROFILE_URL=j.profile_url;ACTION_URL=j.action_url;return true}
}catch(e){log("hs err "+e)}
return false;
}
async function loadProfile(){
if(!PROFILE_URL)await ensureUrls();
try{
const r=await fetch(PROFILE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
const t=await r.text();log("pr "+t.slice(0,200));
let j=JSON.parse(t);let d=unwrap(j);
if(!d.ok&&!d.nickname)throw d.error;
document.getElementById('nick').innerText=d.nickname;
document.getElementById('lvl').innerText=d.level;
document.getElementById('hp').innerText=d.hp+"/"+d.max_hp;
document.getElementById('hpbar').style.width=(d.hp/d.max_hp*100)+"%";
document.getElementById('pounds').innerText=d.pounds;
document.getElementById('exp').innerText=d.exp;
document.getElementById('potion').innerText=d.potion;
document.getElementById('pts').innerText=d.stat_points>0?"✦ "+d.stat_points:"";
document.getElementById('hallInfo').innerText="Путь: "+d.path+"\n❤️ "+d.hp+"/"+d.max_hp+" · Ур."+d.level+" · 💷 "+d.pounds+" · ⭐ "+d.exp+"\n🧪 "+d.potion+"% · 🌀 "+d.madness+"%";
let s='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span style="border:1px solid #333;border-radius:6px;padding:2px 6px">💪 '+d.str+'</span><span style="border:1px solid #333;border-radius:6px;padding:2px 6px">🏃 '+d.agi+'</span><span style="border:1px solid #333;border-radius:6px;padding:2px 6px">🧠 '+d.int+'</span><span style="border:1px solid #333;border-radius:6px;padding:2px 6px">🔮 '+d.spi+'</span><span style="border:1px solid #333;border-radius:6px;padding:2px 6px">❤️ '+d.con+'</span></div>';
if(d.stat_points>0)s+='<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">'+['str','agi','int','spi','con'].map(k=>'<span class="btn" style="padding:6px 8px" onclick="addStat(\''+k+'\')">+1 '+k+'</span>').join('')+'</div>';
document.getElementById('statsBox').innerHTML=s;
G.inv=d.inventory||[];G.eq=d.equipped||{};
renderBag();
}catch(e){document.getElementById('hallInfo').innerText="Ошибка: "+e;log("pr err "+e)}
}
async function api(p){
if(!ACTION_URL)await ensureUrls();
const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
const t=await r.text();log(p.action+" -> "+t.slice(0,200));let j=JSON.parse(t);return unwrap(j);
}
function renderBag(){
document.getElementById('bagCnt').innerText=G.inv.length+"/50";
let h="";if(G.inv.length===0)h="<small>Пусто</small>";else G.inv.forEach((it,i)=>{h+='<div class="item"><div><b>'+(it.name||it)+'</b> <small> '+(it.slot||'')+'</small></div><div class="btn gold" style="padding:6px 8px" onclick="doEquip('+i+')">Надеть</div></div>'});
document.getElementById('invList').innerHTML=h;
let e="";["head","face","body","weapon","legs","necklace","ring"].forEach(s=>{let it=G.eq[s];if(it)e+='<div class="item"><div><b>'+it.name+'</b> <small>'+s+'</small></div><div class="btn" style="padding:6px 8px" onclick="doUnequip(\''+s+'\')">Снять</div></div>';else e+='<div class="item" style="opacity:.4">'+s+' — пусто</div>'});
document.getElementById('eqList').innerHTML=e;
}
async function doEquip(i){let d=await api({action:"equip",idx:""+i});alert(d.text||d.error);loadProfile()}
async function doUnequip(s){let d=await api({action:"unequip",slot:s});alert(d.text||d.error);loadProfile()}
async function addStat(s){let d=await api({action:"addstat",stat:s});alert(d.text||d.error);loadProfile()}
function openLoc(id){
const m={market:"🍎 Рынок — специи и весы",dragon_tavern:"🐉 Таверна — Бармен",station:"🚂 Вокзал — Бомж",houses:"🏠 Дома — Подвал"};
document.getElementById('locInfo').innerText=m[id]||id;
let b=document.getElementById('locBtns');b.innerHTML="";
if(id==='market')b.innerHTML='<div class="btn gold" onclick="doTrader()">🧺 Торговец</div>';
if(id==='station')b.innerHTML='<div class="btn gold" onclick="alert(\'Бомж: 4 вопроса в боте\')">🧙 Бомж</div>';
if(id==='houses')b.innerHTML='<div class="btn gold" onclick="openTravel(\'podval\')">🕳 Подвал</div>';
if(id==='dragon_tavern')b.innerHTML='<div class="btn gold" onclick="alert(\'Бармен: Глаз Жабы 25%\')">🍺 Бармен</div>';
}
function openTravel(id){
document.getElementById('eventCard').classList.add('hidden');document.getElementById('battleCard').classList.add('hidden');
if(id==='lake'){document.getElementById('travelInfo').innerText="🌊 Озеро — 30% события · 70% монстры";document.getElementById('travelBtns').innerHTML='<div class="btn gold" onclick="doExplore(\'explore_lake\')">🔍 Исследовать берег</div>'}
if(id==='podval'){document.getElementById('travelInfo').innerText="🕳 Подвал — Крысы";document.getElementById('travelBtns').innerHTML='<div class="btn gold" onclick="doExplore(\'explore_rats\')">🔍 Исследовать</div>'}
}
async function doExplore(a){
try{
let d=await api({action:a});
if(d.type==="event"){
document.getElementById('eventCard').classList.remove('hidden');
document.getElementById('eventTitle').innerText=d.event;
document.getElementById('eventText').innerText=d.text;
let box=document.getElementById('eventBtns');box.innerHTML="";
d.actions.forEach(x=>{let b=document.createElement('div');b.className='btn gold';b.innerText=x.label;b.onclick=()=>doEvent(x.id);box.appendChild(b)});
}else if(d.type==="battle"){
document.getElementById('battleCard').classList.remove('hidden');
document.getElementById('battleTitle').innerText="⚔ "+d.enemy;
document.getElementById('battleText').innerText="👹 "+d.enemy+" "+d.enemy_hp+"/"+d.enemy_max+" · "+d.enemy_dmg+"\n❤️ "+d.hp+"/"+d.max_hp;
}else if(d.error)alert(d.error);
}catch(e){log("explore err "+e)}
loadProfile();
}
async function doEvent(id){let d=await api({action:"event_choice",move:id});alert(d.text);document.getElementById('eventCard').classList.add('hidden');loadProfile()}
async function doBattle(m){let d=await api({action:"battle",move:m});if(d.type==="victory")alert("Победа "+d.enemy+" +"+d.exp_add);else if(d.type==="defeat")alert("Поражение");document.getElementById('battleCard').classList.add('hidden');loadProfile()}
async function doTrader(){let d=await api({action:"trader_offer"});if(d.ok){document.getElementById('eventCard').classList.remove('hidden');document.getElementById('eventTitle').innerText="🧺 Торговец";document.getElementById('eventText').innerText=d.offer.name+" · "+d.offer.price+"💷";document.getElementById('eventBtns').innerHTML='<div class="btn gold" onclick="traderBuy()">Купить</div><div class="btn" onclick="traderHaggle()">Торговаться</div>'}else alert(d.error)}
async function traderBuy(){let d=await api({action:"trader_buy"});alert(d.text||d.error);document.getElementById('eventCard').classList.add('hidden');loadProfile()}
async function traderHaggle(){let d=await api({action:"trader_haggle"});alert(d.text);loadProfile()}
ensureUrls().then(loadProfile);
</script>
</body>
</html>
