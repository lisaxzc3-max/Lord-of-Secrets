<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Повелитель Тайн v2.2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial}
body{background:#0a0a0d;color:#e9d8a6;min-height:100vh}
.wrap{max-width:420px;margin:0 auto;padding:12px;padding-bottom:70px}
.top{display:flex;align-items:center;gap:10px;background:#14141b;border:1px solid #c9a86a;border-radius:14px;padding:10px}
.avatar{width:48px;height:48px;border-radius:12px;background:#c9a86a;display:flex;align-items:center;justify-content:center;font-size:22px;color:#000}
.bars{flex:1}
.bar{height:8px;background:#2a2a33;border-radius:8px;margin:4px 0;overflow:hidden}
.bar i{display:block;height:100%;background:#e63946}
.money{text-align:right;font-size:12px}
.card{background:#14141b;border:1px solid #c9a86a;border-radius:14px;padding:14px;margin:10px 0}
.btn{border:1px solid #c9a86a;background:#1c1c24;border-radius:12px;padding:12px;text-align:center;font-size:13px}
.hidden{display:none}
small{opacity:.6;font-size:10px;word-break:break-all;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="avatar">𓂀</div>
    <div class="bars">
      <div style="font-size:13px"><b id="nick">Загрузка...</b> · Ур.<span id="lvl">-</span></div>
      <div class="bar"><i id="hpbar" style="width:0%"></i></div>
      <div style="font-size:10px"><span id="hp">-</span> · 🧪 <span id="potion">-</span>% · UID <span id="uid">-</span></div>
    </div>
    <div class="money">💷 <b id="pounds">-</b><br>⭐ <span id="exp">-</span></div>
  </div>
  <div class="card">
    <h3>◈ Дела дня</h3>
    <div id="profileText" style="font-size:11px;white-space:pre-wrap">Подключение...</div>
    <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="btn" onclick="doExplore()">🌊 Озеро · Исследовать</div>
      <div class="btn" onclick="loadProfile()">🔄 Обновить</div>
    </div>
    <small id="debug"></small>
  </div>
  <div class="card hidden" id="eventCard">
    <h3 id="eventTitle">Событие</h3>
    <div id="eventText" style="font-size:12px"></div>
    <div id="eventBtns" style="margin-top:10px"></div>
  </div>
  <div class="card hidden" id="battleCard">
    <h3 id="battleTitle">⚔ Бой</h3>
    <div id="battleText" style="font-size:12px;white-space:pre-wrap"></div>
    <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="btn" onclick="doBattle('basic')">⚔ Базовая</div>
      <div class="btn" onclick="doBattle('flee')">🏃 Сбежать</div>
    </div>
  </div>
</div>
<script>
const tg=Telegram.WebApp; tg.ready(); tg.expand();
let uid = tg.initDataUnsafe?.user?.id || "";
if(!uid) uid="7320193489";
document.getElementById('uid').innerText=uid;
const HANDSHAKE="https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_5eceb241";
let PROFILE_URL="",ACTION_URL="";
function log(s){ document.getElementById('debug').innerText+="\n"+s; console.log(s); }
async function handshake(){
 log("handshake "+HANDSHAKE+" uid="+uid);
 try{
  const r=await fetch(HANDSHAKE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid})});
  const t=await r.text(); log("hs raw "+t.slice(0,600));
  const j=JSON.parse(t);
  if(j.ok){ PROFILE_URL=j.profile_url; ACTION_URL=j.action_url; log("hs ok"); return true;}
  log("hs not ok "+JSON.stringify(j));
 }catch(e){ log("hs err "+e); }
 return false;
}
async function loadProfile(){
 if(!PROFILE_URL) await handshake();
 if(!PROFILE_URL){ document.getElementById('profileText').innerText="Нет PROFILE_URL - handshake заблокирован (CORS). Открой именно из @ltmgame_bot → Открыть игру"; return; }
 document.getElementById('profileText').innerText="Запрос профиля...";
 try{
  const r=await fetch(PROFILE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
  const t=await r.text(); log("profile raw "+t.slice(0,600));
  const d=JSON.parse(t); if(!d.ok) throw d.error;
  document.getElementById('nick').innerText=d.nickname;
  document.getElementById('lvl').innerText=d.level;
  document.getElementById('hp').innerText=d.hp+"/"+d.max_hp;
  document.getElementById('hpbar').style.width=(d.hp/d.max_hp*100)+"%";
  document.getElementById('pounds').innerText=d.pounds;
  document.getElementById('exp').innerText=d.exp;
  document.getElementById('potion').innerText=d.potion;
  document.getElementById('profileText').innerText=`Путь: ${d.path}\n❤️ ${d.hp}/${d.max_hp} · 🌀 ${d.madness}%\n✨ ${d.bomzh_left}с · 🤢 ${d.rot_left}с`;
 }catch(e){ document.getElementById('profileText').innerText="Ошибка профиля: "+e; log("profile err "+e); }
}
async function doExplore(){
 if(!ACTION_URL) await handshake();
 try{
  const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"explore_lake"})});
  const t=await r.text(); log("explore raw "+t.slice(0,600)); const d=JSON.parse(t);
  if(d.type==="event"){
   document.getElementById('eventCard').classList.remove('hidden');
   document.getElementById('eventTitle').innerText=d.event;
   document.getElementById('eventText').innerText=d.text;
   const box=document.getElementById('eventBtns'); box.innerHTML="";
   d.actions.forEach(a=>{ const b=document.createElement('div'); b.className='btn'; b.innerText=a.label; b.onclick=()=>doEvent(a.id); box.appendChild(b);});
  } else if(d.type==="battle"){ document.getElementById('battleCard').classList.remove('hidden'); document.getElementById('battleTitle').innerText=d.enemy; document.getElementById('battleText').innerText=`❤️ ${d.hp}/${d.max_hp}\n👹 ${d.enemy} ${d.enemy_hp}/${d.enemy_max}`; }
  else alert(JSON.stringify(d));
 }catch(e){ log("explore err "+e); }
 loadProfile();
}
async function doEvent(id){
 const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"event_choice",move:id})});
 const d=await r.json(); alert(d.text); document.getElementById('eventCard').classList.add('hidden'); loadProfile();
}
async function doBattle(m){
 const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"battle",move:m})});
 const d=await r.json(); if(d.type==="victory") alert("Победа +"+d.exp_add); else if(d.type==="defeat") alert("Поражение"); loadProfile();
}
handshake().then(loadProfile);
</script>
</body>
</html>
