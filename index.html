*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial}
body{background:#07070a;color:#e9d8a6;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:10px;padding-bottom:70px}
.top{position:sticky;top:8px;z-index:10;display:flex;gap:10px;background:linear-gradient(135deg,#14141b,#1a1a2e);border:1px solid #c9a86a;border-radius:16px;padding:10px;box-shadow:0 4px 20px rgba(201,168,106,.25);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.avatar{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#c9a86a,#8b6914);display:flex;align-items:center;justify-content:center;font-size:22px;color:#000;box-shadow:0 0 12px rgba(201,168,106,.4)}

.hp i{background:linear-gradient(90deg,#e63946,#ff7b7b);box-shadow:0 0 8px #e63946}
.money{text-align:right;font-size:11px;line-height:1.2}
.money b{color:#f4d35e}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto;padding-bottom:4px}
.tab{flex:1;min-width:70px;padding:9px 6px;text-align:center;border-radius:10px;background:#1c1c24;border:1px solid #333;font-size:11px;cursor:pointer;transition:.2s}
.tab.active{background:linear-gradient(135deg,#c9a86a,#8b6914);color:#000;border-color:#c9a86a;box-shadow:0 2px 10px rgba(201,168,106,.4);transform:translateY(-1px)}
.card{background:linear-gradient(180deg,#14141b,#11111a);border:1px solid rgba(201,168,106,.35);border-radius:16px;padding:14px;margin:8px 0;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.btn{border:1px solid #c9a86a;background:linear-gradient(180deg,#1c1c24,#181820);border-radius:12px;padding:11px;text-align:center;font-size:13px;cursor:pointer;margin:4px 0;transition:.15s}
.btn:active{transform:scale(.97);opacity:.8}
.btn.gold{background:linear-gradient(135deg,#c9a86a,#8b6914);color:#000;font-weight:700}
.btn:disabled{opacity:.4}
