<!doctype html>
<html lang="ru">
<head>

<title>Церковь Ночи — Повелитель Тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#08060a;--panel:rgba(18,13,22,.95);--line:#3a2f44;--text:#d8cfb8;--muted:#8f8798;--bone:#cdbf9f;--bronze:#8a7a58;--crim:#a3262e;--crimb:#d4343f;--vio:#a98fd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--ink)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font:14px/1.45 Inter,system-ui,Arial,sans-serif;overflow-x:hidden;background:radial-gradient(120% 60% at 50% 0,#2a1238,#09060c 62%,#050306)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:active{transform:scale(.97)}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:480px;margin:auto;padding:10px 12px calc(50px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.back{color:var(--bone);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#120c16cc;font-size:12px}
.eyebrow{font-size:9px;letter-spacing:.3em;color:var(--bronze);text-transform:uppercase}
.head h1{font:400 20px Georgia,serif;letter-spacing:.1em;margin:2px 0 0;color:#e8dcc0;text-shadow:0 0 14px #a3262e}
.hidden{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:0 8px 26px #0009;animation:cin .5s ease-out backwards}
@keyframes cin{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
.card h3{margin:0 0 8px;font:700 12px Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:var(--bone)}
.muted{color:var(--muted);font-size:12px}
/* церковь */
.church{position:relative;height:210px;border-radius:20px;overflow:hidden;border:1px solid #3a2a44;box-shadow:0 0 40px #4a1a5a55,inset 0 0 60px #000;margin-bottom:12px;animation:cin .8s ease-out}
.church svg{position:absolute;inset:0;width:100%;height:100%}
.church .ttl{position:absolute;left:0;right:0;bottom:10px;text-align:center;z-index:2}
.church .ttl b{display:block;font:400 22px Georgia,serif;letter-spacing:.24em;color:#e8dcc0;text-shadow:0 0 18px #a3262e}
.church .ttl small{font-size:11px;color:#a89cb8;letter-spacing:.1em}
.glass{animation:glw 5s ease-in-out infinite}@keyframes glw{50%{opacity:.6}}
.cfl{animation:cf .2s steps(2) infinite alternate}@keyframes cf{to{opacity:.65}}
/* баннер клана */
.ban{position:relative;border-radius:20px;border:1px solid var(--ec);padding:14px;margin-bottom:12px;background:radial-gradient(120% 140% at 0% 0%,var(--eg),transparent 65%),linear-gradient(160deg,#1c1224,#0a070d);overflow:hidden;box-shadow:0 0 30px var(--eg)}
.ban:after{content:"";position:absolute;top:0;bottom:0;width:70px;left:-90px;background:linear-gradient(100deg,transparent,#ffffff14,transparent);transform:skewX(-18deg);animation:shn 7s ease-in-out infinite}
@keyframes shn{0%,65%{left:-90px}100%{left:120%}}
.ban .row{display:flex;gap:12px;align-items:center;position:relative;z-index:1}
.emb{flex:0 0 64px;height:64px;border-radius:16px;background:#050306cc;border:1px solid var(--ec);display:flex;align-items:center;justify-content:center;color:var(--ec);box-shadow:inset 0 0 16px #000,0 0 18px var(--eg);animation:ep 4.5s ease-in-out infinite}
@keyframes ep{50%{box-shadow:inset 0 0 16px #000,0 0 30px var(--eg)}}
.emb svg{width:38px;height:38px;filter:drop-shadow(0 0 5px var(--eg))}
.ban h2{margin:0;font:400 20px Georgia,serif;letter-spacing:.05em;color:#eadfc4}
.ban .tg{color:var(--ec);font-size:12px;letter-spacing:.2em}
.bar{height:6px;border-radius:6px;background:#000a;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a1a6a,var(--ec));box-shadow:0 0 8px var(--ec);transition:width .8s}
.motd{position:relative;z-index:1;margin-top:10px;padding:8px 10px;border-left:2px solid var(--ec);background:#0006;border-radius:0 8px 8px 0;font-style:italic;font-size:12px;color:#c9bfd8}
.stats{display:flex;gap:8px;margin-top:10px;position:relative;z-index:1}
.stats div{flex:1;text-align:center;border:1px solid #ffffff12;border-radius:10px;padding:6px 2px;background:#0005;font-size:10px;color:var(--muted)}
.stats b{display:block;font-size:15px;color:var(--bone)}
/* вкладки */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#120c16;font-size:12px;letter-spacing:.04em;color:var(--muted);transition:.25s}
.tab.on{color:#eadfc4;border-color:var(--ec);background:linear-gradient(#2a1430,#120c16);box-shadow:0 0 14px var(--eg)}
.tab .dot{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--crim);color:#fff;font-size:10px;text-align:center;margin-left:5px}
/* списки */
.it{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid #2c2234;border-radius:12px;background:linear-gradient(145deg,#1a1220,#0d0910);margin-bottom:8px;animation:cin .4s ease-out backwards}
.it .l{flex:1;min-width:0}.it b{display:block;color:#e0d4b8;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{display:block;color:var(--muted);font-size:11px;line-height:1.35}
.me{border-color:var(--ec);box-shadow:0 0 12px var(--eg)}
.rk{flex:0 0 34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#050306;display:flex;align-items:center;justify-content:center;font:700 13px Georgia,serif;color:var(--bone)}
.rk.r4{color:#ffd98a;border-color:#8a6a28;box-shadow:0 0 12px #c9a45a66}.rk.r3{color:#c9b8e8;border-color:#6a4a8a}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid #4a3a5a;color:#b8a8d8;margin-left:5px;vertical-align:1px}
.on1{color:#8fd6a6!important}
.btn{border:1px solid var(--line);background:linear-gradient(#241a2c,#120c16);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--bone);letter-spacing:.03em}
.btn.main{border-color:var(--crim);background:linear-gradient(#4a1219,#22090e);color:#f1e6d0}
.btn.sm{padding:5px 9px;font-size:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.bad{border-color:#6a2028;color:#e08a90}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,textarea,select{width:100%;background:#0a060d;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--vio);box-shadow:0 0 12px #6a3a9a55}
label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;letter-spacing:.06em}
.big{font:400 34px Georgia,serif;color:#ffd98a;text-shadow:0 0 18px #c9a45a88;text-align:center;font-variant-numeric:tabular-nums}
.pg{display:flex;gap:3px;margin-top:4px}.pg i{flex:1;height:5px;border-radius:3px;background:#000a;border:1px solid #2c2234}.pg i.f{background:var(--ec);box-shadow:0 0 6px var(--ec);border-color:var(--ec)}
.ico{flex:0 0 38px;height:38px;border-radius:10px;background:#050306;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--bone)}
.ico svg{width:24px;height:24px}
.embpick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.embpick button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#0a060d;display:flex;align-items:center;justify-content:center;padding:0}
.embpick button svg{width:60%;height:60%}.embpick button.on{box-shadow:0 0 12px currentColor;border-color:currentColor}
.ter{position:relative;overflow:hidden}
.ter.mine{border-color:#6fae92;box-shadow:0 0 16px #2a7a5a55}
.ter.hos{border-color:#6a2028}
.sk .pt{font:700 11px Georgia;color:var(--bone)}
.lg{font-size:12px;padding:7px 0;border-bottom:1px solid #ffffff0d;color:#b8afc4}.lg time{color:var(--bronze);font-size:10px;margin-right:6px}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-style:italic;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:60;background:#1a0f20f0;border:1px solid var(--crim);color:#eadfc4;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center;box-shadow:0 0 24px #a3262e66}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:70;background:#000b;display:flex;align-items:flex-end;justify-content:center;animation:sIn .25s}
@keyframes sIn{from{opacity:0}}
.sheet>div{width:100%;max-width:480px;background:linear-gradient(#1c1224,#0b0710);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));animation:sUp .3s ease-out;box-shadow:0 -10px 40px #4a1a5a66}
@keyframes sUp{from{transform:translateY(60px)}}
.sheet h4{margin:0 0 10px;font:400 17px Georgia,serif;color:#eadfc4;letter-spacing:.06em}
.sheet .btn{display:block;width:100%;margin:6px 0;padding:11px;text-align:center}
.seal{position:fixed;inset:0;z-index:90;background:radial-gradient(circle,#2a0a30,#030204 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:sIn .6s;text-align:center;padding:20px}
.seal .emb{width:110px;height:110px;flex-basis:auto;border-radius:26px}.seal .emb svg{width:70px;height:70px}
.seal h2{font:400 24px Georgia,serif;letter-spacing:.14em;color:#eadfc4;margin:18px 0 6px;text-shadow:0 0 18px #a3262e}

/* ===== оформление v2 ===== */
.card{position:relative;background:linear-gradient(160deg,#1a1120f2,#0c0810f7)}
.card:before,.card:after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--bronze);opacity:.55;pointer-events:none}
.card:before{top:6px;left:6px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.card:after{bottom:6px;right:6px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.card h3{display:flex;align-items:center;gap:10px}
.card h3:after{content:"ᛟ";margin-left:auto;color:var(--bronze);opacity:.5;font-size:14px;animation:rn 4s ease-in-out infinite}
@keyframes rn{50%{opacity:1;color:var(--vio);text-shadow:0 0 8px var(--vio)}}
.btn{position:relative;overflow:hidden;border:1px solid #5a4a64;background:linear-gradient(180deg,#2c2034,#140d19);box-shadow:inset 0 1px 0 #ffffff14,0 3px 12px #000a;transition:box-shadow .3s,transform .15s,border-color .3s;letter-spacing:.05em}
.btn:before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff22,transparent);transform:skewX(-20deg);animation:bsh 5s ease-in-out infinite}
@keyframes bsh{0%,70%{left:-60%}100%{left:130%}}
.btn:hover{border-color:var(--vio);box-shadow:0 0 18px #6a3a9a88,inset 0 0 12px #6a3a9a44}
.btn.main{border-color:#c0343e;background:linear-gradient(180deg,#5a1620,#220810);color:#fff0dc;box-shadow:inset 0 1px 0 #ffffff1a,0 0 14px #a3262e66;animation:mp 3.6s ease-in-out infinite}
@keyframes mp{50%{box-shadow:inset 0 1px 0 #ffffff1a,0 0 26px #d4343faa}}
.btn.bad{background:linear-gradient(180deg,#2a1014,#12070a)}
.rip{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffffff55,transparent 70%);transform:scale(0);animation:rp .7s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(2.4);opacity:0}}
.tab{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;background:linear-gradient(#1a1220,#0c080f)}
.tab svg{width:14px;height:14px;opacity:.8}
.tab.on:after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;background:var(--ec);box-shadow:0 0 8px var(--ec);animation:ul 2.5s ease-in-out infinite}
@keyframes ul{50%{left:2%;right:2%}}
.it{position:relative;transition:transform .2s,box-shadow .3s,border-color .3s}
.it:hover{border-color:#5a4a64;box-shadow:0 0 16px #6a3a9a44}
.it[data-m]{cursor:pointer}.it[data-m]:active{transform:scale(.99)}
.ban .emb:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed var(--ec);opacity:.5;animation:spn 24s linear infinite}
.emb{position:relative}
@keyframes spn{to{transform:rotate(360deg)}}
.ban:before{content:"ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ";position:absolute;right:10px;top:6px;letter-spacing:.4em;font-size:12px;color:var(--ec);opacity:.25;animation:rn 5s infinite}
.stats div{transition:.3s;background:linear-gradient(#150e1a,#0a060d)}.stats div:hover{border-color:var(--ec);box-shadow:0 0 12px var(--eg)}
/* война за континенты */
.war{position:relative;border-radius:16px;padding:12px 14px;margin-bottom:12px;border:1px solid #4a3a5a;background:linear-gradient(135deg,#1a1022,#0b070f);overflow:hidden}
.war.sun{border-color:var(--crimb);background:linear-gradient(135deg,#3a0c14,#0e060a);animation:wsun 2.4s ease-in-out infinite}
@keyframes wsun{50%{box-shadow:0 0 30px #d4343f77}}
.war b{display:block;font:400 15px Georgia,serif;letter-spacing:.08em;color:#eadfc4}
.war .tm{font:400 24px Georgia,serif;color:#ffd98a;font-variant-numeric:tabular-nums;text-shadow:0 0 14px #c9a45a77}
.mapw{position:relative;border-radius:18px;overflow:hidden;border:1px solid #3a2f44;background:radial-gradient(ellipse at 50% 50%,#1a1024,#07050a);margin-bottom:12px;box-shadow:inset 0 0 50px #000}
.mapw svg{display:block;width:100%;height:auto}
.land{cursor:pointer;transition:filter .3s;stroke-width:1.6}.land:hover{filter:brightness(1.5)}
.land.mine{animation:lm 3s ease-in-out infinite}@keyframes lm{50%{filter:brightness(1.6) drop-shadow(0 0 8px currentColor)}}
.land.hot{animation:lh 1.2s ease-in-out infinite}@keyframes lh{50%{filter:brightness(1.8) drop-shadow(0 0 10px #d4343f)}}
.lbl{font:700 10px Georgia,serif;letter-spacing:.2em;fill:#eadfc4;pointer-events:none;text-anchor:middle;text-shadow:0 0 4px #000}
.lbl2{font:9px Inter,sans-serif;fill:#b8afc4;pointer-events:none;text-anchor:middle}
.wv{animation:wvf 6s ease-in-out infinite}@keyframes wvf{50%{transform:translateY(3px);opacity:.6}}
.cmp{animation:cmpr 40s linear infinite;transform-origin:180px 135px}@keyframes cmpr{to{transform:rotate(360deg)}}
.cl{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px}
.cl .bar{flex:1;margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="wrap">
  <div class="head"><a class="back" id="back" href="../index.html">← Город</a><div><div class="eyebrow">Центр · Тинген</div><h1>Церковь Ночи</h1></div></div>
  <div id="app"><div class="empty">Свечи зажигаются…</div></div>
</div>
<div class="toast" id="toast"></div>
<div id="layer"></div>
<script src="../shared/vip.js"></script>
<script src="../shared/fast.js"></script>

<script>
"use strict";
const A=window.LOTM_ALCH,tg=window.Telegram&&window.Telegram.WebApp;
try{tg&&tg.ready();tg&&tg.expand()}catch(_){}
const qs=new URLSearchParams(location.search),aEnc=qs.get("a_enc")||qs.get("a")||"";
const ACTION_URL=aEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(aEnc):"";
const $=id=>document.getElementById(id);
const sfx=n=>{try{window.snd&&window.snd(n)}catch(_){}};
$("back").href="../index.html"+location.search;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function unwrap(v){for(let i=0;i<3;i++){if(v&&v.result&&typeof v.result==="object")v=v.result;else break}return v}
async function api(p){
 if(!ACTION_URL)return Promise.reject(new Error("need_start"));
 const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p),cache:"no-store"});
 if(!r.ok)throw new Error("Ошибка сервера (HTTP "+r.status+").");
 const d=unwrap(await r.json());if(!d||typeof d!=="object")throw new Error("Некорректный ответ.");return d;
}
function toast(t,bad){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2800);if(bad)sfx("deny")}
/* ---------- эмблемы ---------- */
const EMB=[
 '<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
 '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 '<path d="M5 12a7 7 0 1 1 14 0v3l-2 1v3H7v-3l-2-1z"/><circle cx="9.5" cy="12" r="1.3"/><circle cx="14.5" cy="12" r="1.3"/><path d="M11 17v2M13 17v2"/>',
 '<path d="M3 18c5 0 8-3 9-8l4-4 5 2-3 2 2 2-5 1c-1 4-5 7-12 7z"/><circle cx="17" cy="8" r=".6"/>',
 '<circle cx="8" cy="8" r="4"/><path d="M11 11l9 9M16 16l2-2M18 18l2-2"/>',
 '<path d="M12 2l3 10-3 3-3-3z"/><path d="M8 15h8M12 15v7"/>',
 '<path d="M12 22V10M12 15l-5-4M12 13l5-5M12 10L9 5M12 8l4-4"/>',
 '<path d="M12 2c2 3 2 5 0 6-2-1-2-3 0-6zM9 11h6v11H9z"/><path d="M12 9v2"/>'
];
const ECOL=["#a98fd0","#c9a45a","#cdbf9f","#8fb3a6","#d6b779","#d4343f","#6fae92","#e0a050"];
const ENAME=["Луна","Око","Череп","Ворон","Ключ","Кинжал","Древо","Свеча"];
const embSvg=(i,cls)=>'<svg class="'+(cls||"")+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+(EMB[i%8]||EMB[0])+'</svg>';
const ecss=i=>"--ec:"+ECOL[i%8]+";--eg:"+ECOL[i%8]+"44";
const IC={
 coin:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 10h6M9 14h6"/>',
 chest:'<rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3 13h18M4 9a8 5 0 0 1 16 0M12 12v3"/>',
 crown:'<path d="M3 18l2-10 5 5 2-7 2 7 5-5 2 10z"/>',
 scroll:'<path d="M6 3h12v15a3 3 0 0 1-3 3H6zM6 3a3 3 0 0 0-3 3v1h3M9 8h6M9 12h6M9 16h4"/>',
 land:'<path d="M3 20l5-9 4 6 3-4 6 7zM12 3v5M12 3l4 2-4 2"/>',
 star:'<path d="M12 2l2.6 6.4 6.9.5-5.3 4.4 1.7 6.7L12 16.5 6.1 20l1.7-6.7L2.5 8.9l6.9-.5z"/>'
};
const ico=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>';
const ROM=["I","II","III","IV","V"];
function ago(ts){if(!ts)return"—";const d=Math.max(0,(S.now||Date.now()/1000)-ts);if(d<120)return"только что";if(d<3600)return(d/60|0)+" мин назад";if(d<86400)return(d/3600|0)+" ч назад";return(d/86400|0)+" дн назад"}
function left(s){s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0;return h>=24?(h/24|0)+" д "+h%24+" ч":h+" ч "+m+" мин"}
let S=null,tab="mem",busy=false,view="find",lastLv=null;
/* ---------- загрузка ---------- */
async function load(q){
 if(!S&&!q&&window.LOTM_FAST){const c=LOTM_FAST.get("clan_state",600000);if(c&&c.ok!==false){S=c;render()}}
 try{S=await api({action:"clan_state",q:q||""});if(!q&&S&&S.ok!==false&&window.LOTM_FAST)LOTM_FAST.set("clan_state",S)}catch(e){if(e.message!=="need_start")toast(e.message,1);return}
 if(S.ok===false){toast(S.text||"Ошибка",1);return}
 if(S.in&&lastLv!==null&&S.lv>lastLv){sfx("level");sfx("bell")}
 if(S.in)lastLv=S.lv;
 render();
}
async function act(p,okSnd){
 if(busy)return null;busy=true;

 const dc=d.querySelector("#dc");if(dc)dc.onclick=async()=>{closeSheet();const r=await act({action:"clan_terr_claim",tid:id},"stamp");if(r){sfx("bell");setTimeout(()=>sfx("whisper"),500)}};
}
function pSk(){
 const p=S.perm;
 return S.sk.map((s,i)=>'<div class="it sk" style="display:block;animation-delay:'+i*60+'ms"><div class="row2" style="justify-content:space-between"><b>'+esc(s.n)+'</b><span class="pt">'+s.lv+'/'+s.max+'</span></div><small>'+esc(s.d)+'</small><div class="pg">'+[1,2,3,4,5].map(n=>'<i class="'+(n<=s.lv?"f":"")+'"></i>').join("")+'</div>'+(p.skill?'<div style="margin-top:8px"><button class="btn sm main" data-sk="'+s.k+'" '+(s.open&&s.lv<5?"":"disabled")+'>'+(s.lv>=5?"Предел":s.open?"Усилить · "+s.cost+" ₤":"Нужен уровень клана")+'</button></div>':"")+'</div>').join("")+(p.skill?"":'<div class="muted">Навыки развивают Жрецы-Советники, Предводитель и Казначей, тратя казну.</div>');

function pLog(){
 const d=new Date();
 return '<div class="card"><h3>Журнал</h3>'+(S.log.length?S.log.map(l=>{const t=new Date(l.t*1000);return '<div class="lg"><time>'+String(t.getDate()).padStart(2,"0")+"."+String(t.getMonth()+1).padStart(2,"0")+" "+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")+'</time>'+esc(l.x)+'</div>'}).join(""):'<div class="empty">Летопись пуста.</div>')+'</div>';
}
function pAdm(){
 const p=S.perm;let h='';
 h+='<div class="card"><h3>Заявки</h3>';
 if(!S.ap.length)h+='<div class="empty">Заявок нет.</div>';
 S.ap.forEach(a=>{h+=row('<span>'+ico("star")+'</span>',a.n,"ур. "+a.l+" · "+ago(a.t),'<button class="btn sm main" data-acc="'+esc(a.uid)+'">Принять</button><button class="btn sm bad" data-dec="'+esc(a.uid)+'">✕</button>')});
 h+='</div>';
 h+='<div class="card"><h3>Объявление и устав</h3>';
 if(p.motd)h+='<label>Объявление клана (до 160)</label><textarea id="motd" rows="2" maxlength="160">'+esc(S.motd)+'</textarea><div style="margin-top:6px"><button class="btn sm" id="svMotd">Сохранить объявление</button></div>';
 if(p.settings){
  h+='<label>Описание (до 80)</label><input id="dsc" maxlength="80" value="'+esc(S.d)+'"><label>Минимальный уровень</label><input id="mlv" type="number" min="1" max="20" value="'+S.minlv+'"><label>Вступление</label><div class="row2"><button class="btn sm '+(S.open?"main":"")+'" data-op="1">Свободное</button><button class="btn sm '+(!S.open?"main":"")+'" data-op="0">По заявкам</button></div><label>Эмблема</label><div class="embpick" id="ep2">'+EMB.map((_,i)=>'<button type="button" data-e2="'+i+'" class="'+(i===S.e?"on":"")+'" style="color:'+ECOL[i]+'">'+embSvg(i)+'</button>').join("")+'</div><div style="margin-top:10px"><button class="btn main" id="svSet">Сохранить устав</button></div>';
 }
 h+='</div><div class="card"><h3>Опасная черта</h3><div class="row2">';
 h+='<button class="btn bad" id="leave">Покинуть клан</button>'+(p.leader?'<button class="btn bad" id="disb">Распустить клан</button>':"")+'</div></div>';
 return h;
}
/* ---------- обработчики ---------- */
function bindIn(){
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;sfx(tab==="log"?"scroll":"tap");render()});
 bindPane();
}
function bindPane(){
 const q=s=>document.querySelectorAll(s);
 q("[data-m]").forEach(b=>b.onclick=()=>memberSheet(b.dataset.m));
 q("[data-pf]").forEach(b=>b.onclick=e=>{e.stopPropagation();const m=S.mem.find(x=>x.uid===b.dataset.pf);if(window.PCard)PCard.open(b.dataset.pf,m&&m.n)});
 const amt=()=>parseInt($("amt").value)||0;
 q("[data-q]").forEach(b=>b.onclick=()=>{$("amt").value=b.dataset.q;sfx("tap")});
 if($("dep"))$("dep").onclick=()=>act({action:"clan_deposit",n:amt()},"coin");
 if($("wd"))$("wd").onclick=()=>act({action:"clan_withdraw",n:amt()},"coin");
 q("[data-put]").forEach(b=>{const[k,id]=b.dataset.put.split(":");b.onclick=()=>act({action:"clan_put",kind:k,key:id,n:1},"chest")});
 q("[data-put5]").forEach(b=>{const[k,id]=b.dataset.put5.split(":");b.onclick=()=>act({action:"clan_put",kind:k,key:id,n:S.my_ingr[id]||1},"chest")});
 q("[data-take]").forEach(b=>{const[k,id]=b.dataset.take.split(":");b.onclick=()=>act({action:"clan_take",kind:k,key:id,n:1},"chest")});
 q("[data-ctake]").forEach(b=>b.onclick=()=>act({action:"clan_ct_take",tid:b.dataset.ctake},"stamp"));
 q("[data-give]").forEach(b=>b.onclick=()=>act({action:"clan_ct_give",i:+b.dataset.give,n:99},"dew"));
 q("[data-land]").forEach(b=>b.onclick=()=>{sfx("rune");landSheet(b.dataset.land)});
 if($("col"))$("col").onclick=()=>act({action:"clan_terr_collect"},"coin");
 q("[data-sk]").forEach(b=>b.onclick=async()=>{const d=await act({action:"clan_skill",k:b.dataset.sk},"level");if(d)sfx("whisper")});
 q("[data-acc]").forEach(b=>b.onclick=()=>act({action:"clan_member",op:"accept",uid:b.dataset.acc},"win"));
 q("[data-dec]").forEach(b=>b.onclick=()=>act({action:"clan_member",op:"decline",uid:b.dataset.dec},"back"));
 if($("svMotd"))$("svMotd").onclick=()=>act({action:"clan_set",motd:$("motd").value},"scroll");
 let op=null;window._e2=S.e;
 q("[data-op]").forEach(b=>b.onclick=()=>{op=b.dataset.op;sfx("tap");q("[data-op]").forEach(x=>x.classList.toggle("main",x===b))});
 q("[data-e2]").forEach(b=>b.onclick=()=>{window._e2=+b.dataset.e2;sfx("rune");q("#ep2 button").forEach(x=>x.classList.toggle("on",x===b))});
 if($("svSet"))$("svSet").onclick=()=>{const p={action:"clan_set",d:$("dsc").value,minlv:$("mlv").value,emb:window._e2};if(op!==null)p.open=op;act(p,"stamp")};
 if($("leave"))$("leave").onclick=()=>confirmBox("Покинуть клан?","Ты потеряешь доступ к казне, складу и землям.",async()=>{const d=await act({action:"clan_leave"},"back");if(d)view="find"});
 if($("disb"))$("disb").onclick=()=>confirmBox("Распустить клан?","Казна, склад и земли будут утеряны навсегда.",async()=>{const d=await act({action:"clan_disband",confirm:"1"},"bad");if(d)view="find"});
}
function sheet(html){closeSheet();const d=document.createElement("div");d.className="sheet";d.innerHTML="<div>"+html+"</div>";d.onclick=e=>{if(e.target===d){sfx("back");d.remove()}};$("layer").appendChild(d);sfx("open");return d}
function closeSheet(){$("layer").innerHTML=""}
function confirmBox(t,s,fn){const d=sheet('<h4>'+esc(t)+'</h4><div class="muted" style="margin-bottom:8px">'+esc(s)+'</div><button class="btn bad" id="y">Да, подтверждаю</button><button class="btn" id="n">Отмена</button>');d.querySelector("#y").onclick=()=>{closeSheet();fn()};d.querySelector("#n").onclick=()=>{closeSheet();sfx("back")}}
function memberSheet(uid){
 const m=S.mem.find(x=>x.uid===uid);if(!m)return;const p=S.perm;
 let h='<h4>'+esc(m.n)+'</h4><div class="muted" style="margin-bottom:8px">'+esc(rankName(m))+(m.p?" · "+esc(S.posts[m.p]):"")+' · ур. '+m.l+' · вклад '+m.c+'</div>';
 h+='<button class="btn" id="pf">👤 Профиль игрока</button>';
 if(!m.me){
  const eff=Math.max(p.rank,p.post==="recruiter"?2:0);
  if(p.promote&&m.r<p.rank){
   if(m.r+1<p.rank)h+='<button class="btn" data-op="promote">▲ Возвысить до «'+esc(S.ranks[m.r+1])+'»</button>';
   if(m.r>0)h+='<button class="btn" data-op="demote">▼ Понизить до «'+esc(S.ranks[m.r-1])+'»</button>';
  }
  if(p.post_set&&(m.r<p.rank||p.rank>=4)){h+='<div class="muted" style="margin:8px 0 2px">Назначить пост</div>';Object.keys(S.posts).forEach(k=>{h+='<button class="btn" data-post="'+k+'" '+(m.p===k?"disabled":"")+'>'+esc(S.posts[k])+'</button>'});if(m.p)h+='<button class="btn" data-post="">Снять с поста</button>'}
  if(p.kick&&m.r<eff)h+='<button class="btn bad" data-op="kick">Изгнать из клана</button>';
  if(p.leader)h+='<button class="btn bad" data-op="leader">Передать печать Предводителя</button>';
 }else h+='<div class="muted">Это ты.</div>';
 h+='<button class="btn" id="cl">Закрыть</button>';
 const d=sheet(h);
 d.querySelector("#cl").onclick=()=>{closeSheet();sfx("back")};
 d.querySelector("#pf").onclick=()=>{closeSheet();if(window.PCard)PCard.open(uid,m.n)};
 d.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{const op=b.dataset.op;const go=async()=>{closeSheet();await act({action:"clan_member",op,uid},op==="kick"?"hurt":"good")};if(op==="kick"||op==="leader")confirmBox(op==="kick"?"Изгнать "+m.n+"?":"Передать печать?",op==="kick"?"Он потеряет место в клане.":"Ты станешь Жрецом-Советником.",go);else go()});
 d.querySelectorAll("[data-post]").forEach(b=>b.onclick=async()=>{closeSheet();await act({action:"clan_member",op:"post",uid,val:b.dataset.post},"stamp")});
}
function seal(s,t){
 const d=document.createElement("div");d.className="seal";d.style.cssText=ecss(s.e);
 d.innerHTML='<div class="emb">'+embSvg(s.e)+'</div><h2>'+esc(t)+'</h2><div class="muted">['+esc(s.tg)+'] '+esc(s.n)+'</div><button class="btn main" style="margin-top:22px;padding:11px 28px">Войти</button>';
 d.querySelector("button").onclick=()=>{d.remove();sfx("open")};
 document.body.appendChild(d);
}
/* ---------- атмосфера ---------- */
(function(){
 const cv=$("cv"),x=cv.getContext("2d");let w,h;
 const fit=()=>{w=cv.width=innerWidth;h=cv.height=innerHeight};fit();addEventListener("resize",fit);
 const RU="ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒ",P=[],F=[];
 for(let i=0;i<30;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:.12+Math.random()*.35,a:Math.random()*6.28,r:.5+Math.random()*1.3,g:Math.random()<.3?RU[Math.random()*RU.length|0]:null});
 for(let i=0;i<6;i++)F.push({x:Math.random()*innerWidth,y:innerHeight*(.3+Math.random()*.7),r:120+Math.random()*140,v:.1+Math.random()*.2,d:Math.random()<.5?1:-1});
 if(!reduce)(function loop(){
  x.clearRect(0,0,w,h);const t=Date.now()/1000;
  F.forEach(f=>{f.x+=f.v*f.d;if(f.x>w+f.r)f.x=-f.r;if(f.x<-f.r)f.x=w+f.r;const g=x.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,"rgba(120,80,160,.10)");g.addColorStop(1,"rgba(120,80,160,0)");x.fillStyle=g;x.beginPath();x.arc(f.x,f.y,f.r,0,6.28);x.fill()});
  P.forEach(p=>{p.y-=p.v;p.x+=Math.sin(t+p.a)*.35;if(p.y<-10){p.y=h+10;p.x=Math.random()*w}x.globalAlpha=.15+.4*Math.abs(Math.sin(t*.7+p.a));
   if(p.g){x.fillStyle="#b48bd0";x.font="13px serif";x.fillText(p.g,p.x,p.y)}else{x.fillStyle="#d4a05a";x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()}});
  x.globalAlpha=1;requestAnimationFrame(loop);
 })();
 setInterval(()=>{if(!document.hidden&&Math.random()<.6)sfx("whisper")},13000);
 setInterval(()=>{if(!document.hidden&&Math.random()<.5)sfx("bell")},21000);
 try{window.sndMusic&&sndMusic("city")}catch(e){}
})();
document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest(".btn,.tab");if(!el)return;const r=el.getBoundingClientRect(),z=Math.max(r.width,r.height),sp=document.createElement("span");sp.className="rip";sp.style.cssText="width:"+z+"px;height:"+z+"px;left:"+(e.clientX-r.left-z/2)+"px;top:"+(e.clientY-r.top-z/2)+"px";el.appendChild(sp);setTimeout(()=>sp.remove(),700)});
setInterval(()=>{const e=$("wtm");if(e&&S&&S.war){S.war.to_sun=Math.max(0,S.war.to_sun-1);e.textContent=dhm(S.war.to_sun)}},1000);
load();
setInterval(()=>{if(!document.hidden&&!busy&&S&&S.in&&!document.querySelector(".sheet,.seal")&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||"")&&!document.querySelector("#amt[value],#motd:focus"))load()},60000);
</script>
