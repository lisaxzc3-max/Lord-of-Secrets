<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль — Повелитель Тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial}
body{background:linear-gradient(rgba(10,10,14,.88),rgba(10,10,14,.96)),url('../i-72.jpeg') center/cover fixed no-repeat,#0a0a0e;color:#b8b5ad;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:10px 10px 60px}
.head{padding:12px 0;display:flex;align-items:center;gap:10px}
.head a{color:#b8b5ad;text-decoration:none;font-size:18px}
.card{background:rgba(22,22,26,.94);border:1px solid #3a3a3e;border-radius:16px;padding:14px;margin:10px 0}
.avatar{width:72px;height:72px;border-radius:50%;background:#2b2b2e;border:2px solid #4a4a4e;display:flex;align-items:center;justify-content:center;font-size:32px}
.badge{background:#3a3a3e;border:1px solid #4a4a4e;border-radius:8px;padding:5px 8px;font-size:11px;margin:3px;display:inline-block}
.timerRow{display:flex;gap:8px;margin:8px 0}
.timerBox{flex:1;border-radius:12px;padding:10px;text-align:center}
.timerBox.dead{background:rgba(60,20,20,.92);border:1px solid #6a2a2a}
.timerBox.regen{background:rgba(20,55,20,.92);border:1px solid #2a6a2a}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><a id="backHome" href="../index.html">← На главную</a><b style="margin-left:8px">Профиль</b></div>
<div class="timerRow">
<div id="deadBox" class="timerBox dead hidden"><div style="font-weight:700;font-size:18px">💀 <span id="deadTimer">10:00</span></div><div style="font-size:10px;opacity:.6">воскрешение</div></div>
<div id="regenBox" class="timerBox regen hidden"><div style="font-weight:700;font-size:18px">🩹 <span id="regenTimer">10:00</span></div><div style="font-size:10px;opacity:.6">реген <span id="regenHp">0/50</span></div></div>
</div>
<div id="prof" class="card">Загрузка...</div>
<div id="invCard" class="card hidden"><b>🎒 Инвентарь</b><div id="invList" style="margin-top:8px;font-size:12px"></div></div>
<div class="card"><div style="font-size:11px;opacity:.7">⟡ ЧТО ТЕБЕ ПОМОГАЕТ</div><div id="help" style="margin-top:6px"></div></div>
</div>
<script>
const tg=Telegram.WebApp;tg.ready();
const qs=new URLSearchParams(location.search);
let p_enc=qs.get("p_enc")||qs.get("p")||"",a_enc=qs.get("a_enc")||qs.get("a")||"";
let PROFILE_URL=p_enc?"https://api.telebotcreator.com/new-webhook?data="+p_enc:"";
const HANDSHAKE="https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_99d5d708";
function unwrap(j){return j&&j.result&&typeof j.result==='object'?j.result:j}
// FIX: На главную сохраняет ?p_enc=&a_enc=&u=
document.addEventListener('DOMContentLoaded', ()=>{
  let a=document.getElementById('backHome');
  if(a) a.href="../index.html"+location.search;
});
async function ensure(){
 if(PROFILE_URL) return true;
 let uid=qs.get("u")||tg.initDataUnsafe?.user?.id;
 let r=await fetch(HANDSHAKE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:String(uid)})});
 let j=unwrap(await r.json()); PROFILE_URL=j.profile_url; return true;
}
let dt=null,rt=null;
function setTimers(j){
 let d=document.getElementById('deadBox'), rg=document.getElementById('regenBox');
 if(j.dead){
  d.classList.remove('hidden'); rg.classList.remove('hidden');
  let dl=j.dead_left; document.getElementById('deadTimer').innerText=Math.floor(dl/60).toString().padStart(2,'0')+":"+(dl%60).toString().padStart(2,'0');
  document.getElementById('regenTimer').innerText=Math.floor(dl/60).toString().padStart(2,'0')+":"+(dl%60).toString().padStart(2,'0');
  document.getElementById('regenHp').innerText=j.hp+"/"+j.max_hp;
  if(dt) clearInterval(dt); dt=setInterval(()=>{dl=Math.max(0,dl-1);document.getElementById('deadTimer').innerText=Math.floor(dl/60).toString().padStart(2,'0')+":"+(dl%60).toString().padStart(2,'0');document.getElementById('regenTimer').innerText=document.getElementById('deadTimer').innerText; if(dl<=0) location.reload();},1000);
 } else {
  d.classList.add('hidden');
  if(j.regen_left && j.hp<j.max_hp){
   rg.classList.remove('hidden'); let rl=j.regen_left; document.getElementById('regenTimer').innerText=Math.floor(rl/60).toString().padStart(2,'0')+":"+(rl%60).toString().padStart(2,'0'); document.getElementById('regenHp').innerText=j.hp+"/"+j.max_hp;
   if(rt) clearInterval(rt); rt=setInterval(()=>{rl=Math.max(0,rl-1);document.getElementById('regenTimer').innerText=Math.floor(rl/60).toString().padStart(2,'0')+":"+(rl%60).toString().padStart(2,'0'); if(rl<=0) location.reload();},1000);
  } else rg.classList.add('hidden');
 }
}
async function load(){
 await ensure();
 let r=await fetch(PROFILE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
 let j=unwrap(await r.json());
 let lvl=j.level, exp=j.exp, need=lvl>=5?100:10*(2**(lvl-1)), pct=lvl>=5?100:Math.round(exp/need*100);
 document.getElementById('prof').innerHTML=`
  <div style="display:flex;gap:14px;align-items:center">
   <div class="avatar">𓂀</div>
   <div>
    <div style="font-size:20px;font-weight:800">⭐ ${j.nickname}</div>
    <div style="font-size:11px;opacity:.6">ID ${j.uid} · Ур.${j.level} · ${j.path}</div>
    <div style="font-size:11px">❤️ ${j.hp}/${j.max_hp} · £ ${j.pounds} · 🧪 ${j.potion}% · 🌀 ${j.madness}%</div>
    <div style="font-size:10px;opacity:.6">⭐ ${pct}% до Ур.${j.level+1}</div>
   </div>
  </div>
  <div style="margin-top:10px;display:flex;flex-wrap:wrap"><span class="badge">💪 ${j.str}</span><span class="badge">🏃 ${j.agi}</span><span class="badge">🧠 ${j.int}</span><span class="badge">🔮 ${j.spi}</span><span class="badge">❤️ ${j.con}</span></div>`;
 let inv=j.inventory||[]; let h=""; if(inv.length===0) h="<span style='opacity:.5'>Пусто 0/50</span>"; else inv.slice(0,20).forEach(it=>{h+=`<div style="border:1px solid #2a2a2e;border-radius:8px;padding:6px;margin:4px 0">• ${it.name} <small>${it.rarity||''} ${it.slot||''}</small></div>`});
 document.getElementById('invList').innerHTML=h; document.getElementById('invCard').classList.remove('hidden');
 document.getElementById('help').innerHTML=`<span class="badge">£ ${j.pounds}</span><span class="badge">+${j.potion}% зелье</span><span class="badge">Безумие ${j.madness}%</span><span class="badge">Ур.${j.level} ${pct}%</span>`;
 setTimers(j);
}
load();
</script>
</body>
</html>
