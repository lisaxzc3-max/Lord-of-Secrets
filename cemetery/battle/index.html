<html lang="ru">
<head>

<title>Кладбище · Сражение</title>

<body>
<div id="app"></div>
<script>
/* Настройки локации. Весь остальной код боя общий: shared/battle/page.js */
window.BATTLE_CFG={
 title:"Кладбище",
 back:"← Кладбище",
 backDefeat:"← На кладбище",
 bg:"loc_cemetery.jpg",
 bgPos:"50% 100%",
 mist:"#b8b0d026",
 p2glow:"#ff4a7acc",
 shield:"#cfd8e8cc",
 explore:"explore_cemetery",
 enemyDefault:"Призрак",
 mobDefault:"ghost",
 intro:"Из тумана между могил выходит противник.",
 win:"Склеп затихает. Среди могил остаётся награда.",
 note:"Мёртвые не любят, когда их тревожат.",
 back_hint:"Вернись на кладбище",
 enter:n=>"Из тумана между могил выходит противник: "+n+".",
 boss:{msg:"Склеп дрожит. Некромант-самоучка поднимает руки, и земля отвечает ему.",icon:"💀",color:"#b86bff",banner:n=>"БОСС: НЕКРОМАНТ"},
 chips:{sleep:["hero","😵 Оцепенение"],weak:["hero","🔻 Слабость ×{n}"],poison:["hero","☠ Яд ×{n}"],shield:["foe","🛡 Щит"]},
 sleepIcon:"😵",
 mob:{"Призрак":"ghost","Гуль":"ghoul","Скелет-страж":"skeleton","Могильный червь":"worm","Плакальщица":"banshee","Некромант-самоучка":"necro"},
 p2:{necro:"necro2"},
 role:{"Призрак":"Неупокоенный","Гуль":"Падальщик","Скелет-страж":"Страж склепа","Могильный червь":"Хищник земли","Плакальщица":"Дух скорби","Некромант-самоучка":"Босс"},
 mobsnd:{"Призрак":"cmghost","Гуль":"cmgrowl","Скелет-страж":"cmrattle","Могильный червь":"cmrumble","Плакальщица":"cmwail","Некромант-самоучка":"cmnecro"},
 skipRx:/спит|усып|оглуш|пропуска|не может действ|скован|обездвиж|в ловушке/i,
 castRx:/Растворяется в тумане|Стон мертвеца|Вопль плакальщицы|Пожирает падаль|Костяной щит|Призыв скелета|Зарывается в землю|Ритуальный круг|Проклятие|Высасывание души|Регенерация/,
 castColor:txt=>/Ритуал|Взрыв/.test(txt)?"#ff4a7a":/Проклятие|Стон|Вопль/.test(txt)?"#b86bff":/Щит|Призыв/.test(txt)?"#cfd8e8":"#7be3a0",
 bossFx:function(text,X){const {st,B,banner,snd,$,P2}=X;
  if(!text)return{heavy:0};
  let heavy=0;
  const E=$("enemyFrame");
  if(/ЗАПРЕТНЫЙ РИТУАЛ/.test(text)){B.flash("#ff4a7a");banner("ЗАПРЕТНЫЙ РИТУАЛ","#ff4a7a");B.shake(2);snd("phase");X.phase2()}
  if(/Холодное касание/.test(text))B.aura("hero","#bfe6ff",700);
  E.classList.toggle("fadeOut",/Растворяется в тумане/.test(text));
  E.classList.toggle("burrow",/Зарывается в землю/.test(text));
  if(/Стон мертвеца|Вопль плакальщицы/.test(text)){banner(/Вопль/.test(text)?"ВОПЛЬ":"СТОН","#caa8ff");B.shake(1);B.aura("hero","#caa8ff",800)}
  if(/Вселение/.test(text)){B.flash("#caa8ff");heavy=1}
  if(/Трупный укус/.test(text))B.aura("hero","#a6f0a8",800);
  if(/Раздирание|Предсмертный плач|Удар ржавым мечом|Рубящий удар|Костяное копьё/.test(text))heavy=1;
  if(/Выпад из-под земли/.test(text))heavy=2;
  if(/Пожирает падаль|Регенерация|Высасывание души|💚\+/.test(text))B.aura("foe","#7be3a0",900);
  if(/Костяной щит|Призыв скелета/.test(text)){st.shield=1;B.aura("foe","#cfd8e8",900)}
  if(/Кислотная слизь/.test(text))B.aura("hero","#c8ff6a",800);
  if(/Тёмный болт/.test(text))B.aura("hero","#b86bff",700);
  if(/Проклятие/.test(text)){banner("ПРОКЛЯТИЕ","#b86bff");st.weak=2;st.poison=3}
  if(/Ритуальный круг/.test(text)){st.shield=1;B.aura("foe","#ff4a7a",1000);banner("РИТУАЛ","#ff4a7a")}
  if(/Взрыв тьмы/.test(text)){B.flash("#220033");B.shake(2);heavy=2}
  if(/оцепенел/.test(text)){st.sleep=1;banner("ОЦЕПЕНЕНИЕ","#7aa8ff")}
  if(/яд \d×\d|трупный яд|кислота|☠-\d/.test(text)){st.poison=3;B.aura("hero","#6dff7a",800)}
  if(/урон −25%|холод −25%/.test(text))st.weak=2;
  if(/увернулся/.test(text))B.floatNum("foe","Мимо","miss");
  if(!/Костяной щит|Призыв скелета|Ритуальный круг/.test(text)&&st.shield>0&&/Удар|Рубящий|Копьё|Бросок/.test(text))st.shield=0;
  return{heavy};
 }
};
</script>

</body>
</html>
