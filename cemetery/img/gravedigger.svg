<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1a2a30"/><stop offset="1" stop-color="#04070a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="64" cy="53" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="38" cy="30" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="17" cy="16" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="69" cy="70" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="108" cy="88" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="123" cy="68" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="105" cy="69" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="55" cy="57" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="130" cy="35" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="185" cy="40" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="110" cy="66" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="191" cy="20" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="72" cy="18" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="104" cy="85" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="33" cy="90" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="92" cy="36" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="150" cy="34" r="28" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="150" cy="34" r="14" fill="#e9efe0" opacity=".9"/><circle cx="145" cy="31" r="4.2" fill="#c2cab8" opacity=".5"/><ellipse cx="100" cy="174" rx="78" ry="10" fill="#000" opacity=".6"/><path d="M0 160 Q60 152 100 158 T200 156 V200 H0Z" fill="#0a0f0a"/><g transform="translate(40 162) scale(0.9)"><rect x="-2" y="-34" width="4" height="34" fill="#2a3a3a"/><rect x="-9" y="-26" width="18" height="4" fill="#2a3a3a"/></g><g transform="translate(168 162) scale(0.8)"><path d="M-9 0 V-22 Q-9 -32 0 -32 Q9 -32 9 -22 V0Z" fill="#2a3a3a"/><path d="M-1 -26 h2 M0 -27 v8" stroke="#0007" stroke-width="1.5"/></g>
<ellipse cx="100" cy="168" rx="44" ry="7" fill="#05080a"/><path d="M60 160 Q100 150 140 160 L136 168 Q100 176 64 168Z" fill="#2a1e14"/>
<g class="bob"><path d="M82 164 L86 110 Q84 92 98 88 Q116 90 114 112 L118 164Z" fill="#1a1d24"/>
<circle cx="102" cy="78" r="12" fill="#c8a98a"/><path d="M88 74 Q102 58 118 74 Q116 66 102 64 Q90 66 88 74Z" fill="#101218"/><path d="M86 78 Q86 62 102 60 Q118 62 118 78 L124 82 Q102 68 80 82Z" fill="#15171e"/>
<circle cx="97" cy="80" r="1.6" fill="#201a14"/><circle cx="108" cy="80" r="1.6" fill="#201a14"/><path d="M98 87 q4 2 8 0" stroke="#6a4a3a" stroke-width="1.8" fill="none"/></g>
<g class="dig" style="transform-origin:128px 162px"><rect x="124" y="94" width="4" height="70" fill="#5a4630"/><path d="M116 94 h20 l-4 -14 h-12z" fill="#a8b0b8"/></g>
<circle cx="64" cy="146" r="2" fill="#ffc86a" class="fl" filter="url(#glow)"/><rect x="62" y="146" width="4" height="14" fill="#3a3024"/>
<g fill="#4a3220"><circle cx="146" cy="150" r="2" class="rise"/><circle cx="152" cy="154" r="1.6" class="rise2"/></g>

</svg>
