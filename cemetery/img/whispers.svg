<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1c2c36"/><stop offset="1" stop-color="#04070b"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="33" cy="84" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="172" cy="73" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="75" cy="38" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="193" cy="15" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="121" cy="44" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="181" cy="56" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="36" cy="39" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="86" cy="51" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="98" cy="86" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="138" cy="25" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="147" cy="90" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="48" cy="7" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="23" cy="21" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="92" cy="9" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="76" cy="32" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="109" cy="80" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="161" cy="18" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="181" cy="20" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="156" cy="87" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="99" cy="29" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="40" cy="30" r="26" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="40" cy="30" r="12" fill="#e9efe0" opacity=".9"/><circle cx="35" cy="27" r="3.5999999999999996" fill="#c2cab8" opacity=".5"/><ellipse cx="100" cy="182" rx="78" ry="10" fill="#000" opacity=".6"/><path d="M0 168 Q60 160 100 166 T200 164 V200 H0Z" fill="#080b0c"/><g transform="translate(40 170) scale(1)"><path d="M-9 0 V-22 Q-9 -32 0 -32 Q9 -32 9 -22 V0Z" fill="#2a3a3a"/><path d="M-1 -26 h2 M0 -27 v8" stroke="#0007" stroke-width="1.5"/></g><g transform="translate(164 170) scale(1)"><path d="M-9 0 V-22 Q-9 -32 0 -32 Q9 -32 9 -22 V0Z" fill="#2a3a3a"/><path d="M-1 -26 h2 M0 -27 v8" stroke="#0007" stroke-width="1.5"/></g><g transform="translate(100 170) scale(1.1)"><rect x="-2" y="-34" width="4" height="34" fill="#2a3a3a"/><rect x="-9" y="-26" width="18" height="4" fill="#2a3a3a"/></g>
<g class="drift" opacity=".5"><ellipse cx="60" cy="140" rx="60" ry="14" fill="#9fb8c4" filter="url(#soft)"/></g>
<g class="drift" opacity=".45" style="animation-delay:-4s"><ellipse cx="150" cy="120" rx="56" ry="14" fill="#9fb8c4" filter="url(#soft)"/></g>
<g class="float" opacity=".85" filter="url(#glow)"><g transform="translate(56 96)"><ellipse rx="12" ry="16" fill="#dff4ff" opacity=".6"/><ellipse cx="-4" cy="-3" rx="2.4" ry="3.4" fill="#05080c"/><ellipse cx="4" cy="-3" rx="2.4" ry="3.4" fill="#05080c"/><ellipse cy="7" rx="3" ry="5" fill="#05080c"/></g></g>
<g class="float" opacity=".8" style="animation-delay:-2s" filter="url(#glow)"><g transform="translate(148 82)"><ellipse rx="10" ry="14" fill="#dff4ff" opacity=".55"/><ellipse cx="-3.5" cy="-3" rx="2" ry="3" fill="#05080c"/><ellipse cx="3.5" cy="-3" rx="2" ry="3" fill="#05080c"/><ellipse cy="6" rx="2.6" ry="4.4" fill="#05080c"/></g></g>
<g class="float" opacity=".7" style="animation-delay:-3.4s" filter="url(#glow)"><g transform="translate(102 118)"><ellipse rx="8" ry="11" fill="#dff4ff" opacity=".5"/><ellipse cx="-3" cy="-2" rx="1.8" ry="2.6" fill="#05080c"/><ellipse cx="3" cy="-2" rx="1.8" ry="2.6" fill="#05080c"/><ellipse cy="5" rx="2" ry="3.4" fill="#05080c"/></g></g>
<g fill="none" stroke="#bfefff" stroke-width="1.6" opacity=".7"><circle cx="56" cy="96" r="22" class="wave"/><circle cx="148" cy="82" r="20" class="wave2"/></g>
<g class="rise"><text x="30" y="150" font-size="9" fill="#bfefff" opacity=".7">…</text></g>

</svg>
