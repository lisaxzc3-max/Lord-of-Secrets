<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1c2a32"/><stop offset="1" stop-color="#04070a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="139" cy="59" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="99" cy="43" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="186" cy="75" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="77" cy="20" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="69" cy="55" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="113" cy="38" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="87" cy="87" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="191" cy="57" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="147" cy="13" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="56" cy="25" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="142" cy="77" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="59" cy="48" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="37" cy="87" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="85" cy="58" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="135" cy="66" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="159" cy="24" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="110" cy="70" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="10" cy="61" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="36" cy="30" r="27" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="36" cy="30" r="13" fill="#e9efe0" opacity=".9"/><circle cx="31" cy="27" r="3.9" fill="#c2cab8" opacity=".5"/><ellipse cx="100" cy="182" rx="78" ry="10" fill="#000" opacity=".6"/><path d="M0 168 Q60 160 100 166 T200 164 V200 H0Z" fill="#080b0a"/>
<rect x="62" y="150" width="76" height="22" rx="3" fill="#3a4040"/><rect x="72" y="138" width="56" height="14" rx="3" fill="#4a5252"/>
<g class="bob"><path d="M60 138 Q56 100 72 86 L68 60 Q60 40 78 24 Q100 12 122 24 Q140 40 132 60 L128 86 Q144 100 140 138Z" fill="#9aa4a4"/>
<path d="M66 100 Q30 80 26 38 Q50 56 62 78Z" fill="#aeb8b8"/><path d="M134 100 Q170 80 174 38 Q150 56 138 78Z" fill="#aeb8b8"/>
<path d="M30 50 Q44 62 56 76 M24 62 Q40 74 54 88" stroke="#6a7474" stroke-width="2" fill="none"/><path d="M170 50 Q156 62 144 76 M176 62 Q160 74 146 88" stroke="#6a7474" stroke-width="2" fill="none"/>
<ellipse cx="100" cy="52" rx="19" ry="22" fill="#b4bcbc"/><path d="M80 48 Q100 28 120 48 Q116 38 100 36 Q84 38 80 48Z" fill="#8a9494"/>
<path d="M88 52 q4 3 8 0 M104 52 q4 3 8 0" stroke="#3a4444" stroke-width="2" fill="none"/>
<path d="M92 56 q-1 18 1 30 M108 56 q1 18 -1 30" stroke="#05080c" stroke-width="3" fill="none" class="rise" opacity=".9"/>
<path d="M86 96 Q100 108 114 96 L112 118 Q100 124 88 118Z" fill="#8a9494"/>
<path d="M94 112 l6 -8 l6 8" fill="none" stroke="#6a7474" stroke-width="2"/>
<g class="pulse" filter="url(#glow)"><circle cx="100" cy="118" r="4" fill="#ffd25a"/></g>
</g>
<g fill="#05080c" class="rise"><circle cx="92" cy="96" r="2"/></g><g fill="#05080c" class="rise2"><circle cx="108" cy="96" r="2"/></g>

</svg>
