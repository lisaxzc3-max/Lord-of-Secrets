<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#222f1c"/><stop offset="1" stop-color="#05080a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="165" cy="38" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="97" cy="89" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="13" cy="65" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="172" cy="12" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="34" cy="53" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="69" cy="54" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="32" cy="79" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="9" cy="33" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="36" cy="34" r="26" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="36" cy="34" r="12" fill="#e9efe0" opacity=".9"/><circle cx="31" cy="31" r="3.5999999999999996" fill="#c2cab8" opacity=".5"/><g transform="translate(160 168) scale(1)"><path d="M-9 0 V-22 Q-9 -32 0 -32 Q9 -32 9 -22 V0Z" fill="#2a3a3a"/><path d="M-1 -26 h2 M0 -27 v8" stroke="#0007" stroke-width="1.5"/></g><ellipse cx="100" cy="184" rx="78" ry="10" fill="#000" opacity=".6"/><path d="M0 170 Q60 162 100 168 T200 166 V200 H0Z" fill="#0b100a"/><circle cx="40" cy="160" r="2" fill="#c8ff7a" class="rise" style="animation-delay:0s" filter="url(#glow)"/><circle cx="160" cy="150" r="2" fill="#c8ff7a" class="rise" style="animation-delay:1.5s" filter="url(#glow)"/><circle cx="70" cy="175" r="2" fill="#c8ff7a" class="rise" style="animation-delay:3s" filter="url(#glow)"/>
<g class="bob">
<path d="M52 176 L60 140 Q50 116 58 92 Q66 62 96 58 Q132 58 142 92 Q150 118 138 142 L146 176Z" fill="#46503c"/>
<path d="M60 96 Q40 120 34 160 L44 164 Q52 132 70 112Z" fill="#59654a"/><path d="M138 96 Q162 122 168 160 L158 164 Q148 134 130 112Z" fill="#59654a"/>
<path d="M34 160 l-8 10 M38 162 l-3 12 M44 164 l2 12" stroke="#d8d4b6" stroke-width="3.2" stroke-linecap="round"/><path d="M168 160 l8 10 M164 162 l3 12 M158 164 l-2 12" stroke="#d8d4b6" stroke-width="3.2" stroke-linecap="round"/>
<path d="M72 84 Q70 52 100 48 Q132 52 128 84 Q132 112 100 118 Q68 112 72 84Z" fill="#6c7a58"/>
<path d="M76 70 Q100 56 124 70" stroke="#2c3424" stroke-width="3" fill="none"/>
<g class="blink" filter="url(#glow)"><ellipse cx="88" cy="82" rx="6" ry="5" fill="#ffee55"/><ellipse cx="112" cy="82" rx="6" ry="5" fill="#ffee55"/></g>
<circle cx="88" cy="82" r="1.8" fill="#201a00"/><circle cx="112" cy="82" r="1.8" fill="#201a00"/>
<path d="M82 100 Q100 120 118 100 Q100 108 82 100Z" fill="#1a0f0f"/>
<path d="M84 101 l3 6 l3 -5 l3 7 l3 -6 l3 7 l3 -6 l3 7 l3 -5 l3 5 l3 -6" stroke="#f0ecd0" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
<path d="M96 118 q-2 14 0 20 M106 118 q2 12 -1 18" stroke="#8a2a2a" stroke-width="2.5" fill="none"/>
<path d="M70 140 l8 6 l-6 8 M130 134 l-8 8 l8 8" stroke="#2c3424" stroke-width="3" fill="none"/>
</g>

</svg>
