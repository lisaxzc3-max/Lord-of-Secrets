<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#26201a"/><stop offset="1" stop-color="#050405"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="121" cy="77" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="121" cy="71" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="54" cy="29" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="127" cy="86" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="53" cy="18" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="83" cy="24" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="143" cy="87" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="158" cy="56" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="173" cy="84" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="46" cy="85" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="158" cy="34" r="26" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="158" cy="34" r="12" fill="#e9efe0" opacity=".9"/><circle cx="153" cy="31" r="3.5999999999999996" fill="#c2cab8" opacity=".5"/><g transform="translate(36 170) scale(0.8)"><rect x="-2" y="-34" width="4" height="34" fill="#2a3a3a"/><rect x="-9" y="-26" width="18" height="4" fill="#2a3a3a"/></g><g transform="translate(168 168) scale(0.8)"><path d="M-9 0 V-22 Q-9 -32 0 -32 Q9 -32 9 -22 V0Z" fill="#2a3a3a"/><path d="M-1 -26 h2 M0 -27 v8" stroke="#0007" stroke-width="1.5"/></g>
<ellipse cx="100" cy="178" rx="74" ry="12" fill="#000" opacity=".5"/>
<path d="M18 182 Q40 150 70 158 Q100 146 130 158 Q162 150 184 182Z" fill="#231a12"/>
<path d="M30 180 Q50 160 74 164 Q100 156 126 164 Q152 160 170 180Z" fill="#33261a"/>
<g class="dig">
<path d="M82 170 Q74 128 84 96 Q80 66 100 50 Q124 66 118 96 Q128 128 118 170Z" fill="#8a5b4a"/>
<g stroke="#5e3a2e" stroke-width="3" fill="none"><path d="M80 150 Q100 158 120 150"/><path d="M78 130 Q100 138 122 130"/><path d="M80 110 Q100 118 120 110"/><path d="M84 92 Q100 98 116 92"/></g>
<path d="M92 160 Q86 140 90 120" stroke="#b07a66" stroke-width="3" fill="none" opacity=".6"/>
<ellipse cx="100" cy="56" rx="26" ry="22" fill="#a56c58"/>
<ellipse cx="100" cy="60" rx="18" ry="15" fill="#1a0808"/>
<g fill="#f2ead0"><path d="M84 54 l4 10 l3 -10z M92 49 l4 11 l3 -11z M101 48 l4 12 l3 -12z M110 52 l4 11 l2 -11z M86 66 l5 -8 l1 9z M98 70 l4 -9 l3 9z M108 68 l5 -8 l1 10z"/></g>
<path d="M96 66 q4 12 8 0" stroke="#7a1a1a" stroke-width="3" fill="none"/>
<circle cx="80" cy="46" r="3.4" fill="#ffd25a" filter="url(#glow)" class="pulse"/><circle cx="120" cy="46" r="3.4" fill="#ffd25a" filter="url(#glow)" class="pulse"/>
<path d="M82 38 q-8 -8 -4 -16 M118 38 q8 -8 4 -16" stroke="#6a4033" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>
<g fill="#3a2a1c"><circle cx="46" cy="150" r="3" class="rise"/><circle cx="150" cy="146" r="2.6" class="rise2"/><circle cx="64" cy="156" r="2.2" class="rise2"/><circle cx="136" cy="152" r="3" class="rise"/></g>

</svg>
