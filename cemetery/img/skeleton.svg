<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1c2836"/><stop offset="1" stop-color="#04070b"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="124" cy="84" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="74" cy="23" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="179" cy="6" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="134" cy="65" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="26" cy="48" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="163" cy="11" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="103" cy="27" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="121" cy="60" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="49" cy="36" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="34" cy="22" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="157" cy="14" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="104" cy="19" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="40" cy="38" r="27" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="40" cy="38" r="13" fill="#e9efe0" opacity=".9"/><circle cx="35" cy="35" r="3.9" fill="#c2cab8" opacity=".5"/><ellipse cx="100" cy="184" rx="78" ry="10" fill="#000" opacity=".6"/><path d="M0 170 Q60 162 100 168 T200 166 V200 H0Z" fill="#0a0d10"/><g transform="translate(170 166) scale(0.9)"><rect x="-2" y="-34" width="4" height="34" fill="#2a3a3a"/><rect x="-9" y="-26" width="18" height="4" fill="#2a3a3a"/></g>
<g class="bob">
<ellipse cx="100" cy="178" rx="48" ry="6" fill="#000" opacity=".5"/>
<rect x="84" y="146" width="12" height="30" rx="4" fill="#d8d2bc"/><rect x="104" y="146" width="12" height="30" rx="4" fill="#d8d2bc"/>
<path d="M70 96 Q100 84 130 96 L126 146 Q100 154 74 146Z" fill="#cfc9b2"/>
<g stroke="#1a1f26" stroke-width="3" fill="none"><path d="M78 106 Q100 114 122 106 M78 118 Q100 126 122 118 M80 130 Q100 138 120 130"/><path d="M100 98 V148"/></g>
<path d="M60 92 Q80 82 100 88 Q120 82 140 92 Q132 104 100 100 Q68 104 60 92Z" fill="#3a4350"/>
<g class="sway"><path d="M148 96 L172 54 L178 58 L156 102Z" fill="#8f9aa8"/><rect x="144" y="96" width="18" height="5" rx="2" fill="#5c4a2a" transform="rotate(-30 153 98)"/><path d="M174 56 L180 40 L184 58Z" fill="#b8c4d2"/></g>
<g><circle cx="58" cy="124" r="26" fill="#3b4a5e" stroke="#1d2530" stroke-width="3"/><circle cx="58" cy="124" r="18" fill="none" stroke="#6b7c92" stroke-width="2"/><path d="M58 106 V142 M40 124 H76" stroke="#6b7c92" stroke-width="2.4"/><circle cx="58" cy="124" r="5" fill="#8fa0b8"/></g>
<path d="M76 40 Q100 26 124 40 L126 66 Q100 78 74 66Z" fill="#dcd6c0"/>
<path d="M72 38 Q100 14 128 38 L130 52 Q100 42 70 52Z" fill="#4a5566"/><path d="M98 18 h4 v26 h-4z" fill="#2b3340"/>
<ellipse cx="88" cy="58" rx="8" ry="9" fill="#05080c"/><ellipse cx="112" cy="58" rx="8" ry="9" fill="#05080c"/>
<g class="pulse" filter="url(#glow)"><circle cx="88" cy="59" r="3.6" fill="#59c8ff"/><circle cx="112" cy="59" r="3.6" fill="#59c8ff"/></g>
<path d="M92 72 l3 -5 l3 5 l3 -5 l3 5 l3 -5" stroke="#05080c" stroke-width="2.4" fill="none"/>
</g>

</svg>
