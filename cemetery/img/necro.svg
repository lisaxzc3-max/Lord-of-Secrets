<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1a2230"/><stop offset="1" stop-color="#04060a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="66" cy="44" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="190" cy="56" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="45" cy="17" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="11" cy="57" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="80" cy="13" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="139" cy="74" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="76" cy="28" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="73" cy="33" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="170" cy="39" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="55" cy="27" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="80" cy="86" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="101" cy="17" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="92" cy="55" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="69" cy="28" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="44" cy="30" r="27" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="44" cy="30" r="13" fill="#e9efe0" opacity=".9"/><circle cx="39" cy="27" r="3.9" fill="#c2cab8" opacity=".5"/><g transform="translate(30 170) scale(1)"><rect x="-2" y="-34" width="4" height="34" fill="#2a3a3a"/><rect x="-9" y="-26" width="18" height="4" fill="#2a3a3a"/></g><g transform="translate(172 170) scale(1)"><path d="M-9 0 V-22 Q-9 -32 0 -32 Q9 -32 9 -22 V0Z" fill="#2a3a3a"/><path d="M-1 -26 h2 M0 -27 v8" stroke="#0007" stroke-width="1.5"/></g><ellipse cx="100" cy="184" rx="78" ry="10" fill="#000" opacity=".6"/><path d="M0 170 Q60 162 100 168 T200 166 V200 H0Z" fill="#08090a"/><circle cx="40" cy="160" r="2" fill="#7dff9a" class="rise" style="animation-delay:0s" filter="url(#glow)"/><circle cx="160" cy="150" r="2" fill="#7dff9a" class="rise" style="animation-delay:1.5s" filter="url(#glow)"/><circle cx="70" cy="175" r="2" fill="#7dff9a" class="rise" style="animation-delay:3s" filter="url(#glow)"/><circle cx="130" cy="170" r="2" fill="#7dff9a" class="rise" style="animation-delay:0.7s" filter="url(#glow)"/><circle cx="100" cy="160" r="2" fill="#7dff9a" class="rise" style="animation-delay:2.2s" filter="url(#glow)"/>
<g class="bob">
<path d="M46 186 Q40 130 62 96 Q70 62 100 58 Q130 62 138 96 Q160 130 154 186Z" fill="#1b1e2a"/>
<path d="M64 186 Q70 130 100 124 Q130 130 136 186Z" fill="#2c3550" opacity=".7"/>
<path d="M76 60 Q100 26 124 60 Q132 84 124 104 Q100 118 76 104 Q68 84 76 60Z" fill="#1b1e2a"/>
<ellipse cx="100" cy="82" rx="19" ry="23" fill="#0a0c10"/>
<ellipse cx="100" cy="82" rx="14" ry="17" fill="#d9d3bd"/>
<ellipse cx="93" cy="80" rx="4.4" ry="5.4" fill="#05070a"/><ellipse cx="107" cy="80" rx="4.4" ry="5.4" fill="#05070a"/>
<g class="pulse" filter="url(#glow)"><circle cx="93" cy="81" r="2.2" fill="#7dff9a"/><circle cx="107" cy="81" r="2.2" fill="#7dff9a"/></g>
<path d="M96 92 l2 -4 l2 4z M92 98 h16" stroke="#05070a" stroke-width="2.4" fill="none"/><path d="M93 98 v4 M97 98 v5 M101 98 v5 M105 98 v5 M108 98 v4" stroke="#05070a" stroke-width="1.6"/>
<g class="sway"><rect x="156" y="52" width="5" height="130" rx="2" fill="#4a3a2a"/><g class="spin"><circle cx="158" cy="46" r="11" fill="none" stroke="#7dff9a" stroke-width="2.2" opacity=".8"/></g><circle cx="158" cy="46" r="7" fill="#7dff9a" filter="url(#glow)" class="pulse"/><path d="M150 54 l-4 6 M166 54 l4 6" stroke="#4a3a2a" stroke-width="3"/></g>
<path d="M60 112 Q44 128 52 150 L64 140 Q58 128 70 120Z" fill="#2c3550"/>
<g class="float"><g transform="translate(34 118)"><rect x="-14" y="-10" width="28" height="22" rx="3" fill="#3a1f2a" stroke="#7dff9a" stroke-width="1.6"/><path d="M0 -10 V12" stroke="#7dff9a" stroke-width="1.4"/><circle cx="-7" cy="0" r="3" fill="none" stroke="#7dff9a" stroke-width="1.2"/><path d="M5 -3 l6 6 m0 -6 l-6 6" stroke="#7dff9a" stroke-width="1.2"/></g></g>
</g>

</svg>
