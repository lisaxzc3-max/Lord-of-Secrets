<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1b3040"/><stop offset="1" stop-color="#04080e"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="66" cy="81" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="39" cy="53" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="127" cy="86" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="22" cy="83" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="126" cy="39" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="65" cy="30" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="126" cy="75" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="127" cy="56" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="44" cy="35" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="44" cy="72" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="158" cy="34" r="27" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="158" cy="34" r="13" fill="#e9efe0" opacity=".9"/><circle cx="153" cy="31" r="3.9" fill="#c2cab8" opacity=".5"/><g transform="translate(34 168) scale(0.9)"><path d="M-9 0 V-22 Q-9 -32 0 -32 Q9 -32 9 -22 V0Z" fill="#2a3a3a"/><path d="M-1 -26 h2 M0 -27 v8" stroke="#0007" stroke-width="1.5"/></g><g transform="translate(168 170) scale(0.8)"><rect x="-2" y="-34" width="4" height="34" fill="#2a3a3a"/><rect x="-9" y="-26" width="18" height="4" fill="#2a3a3a"/></g><ellipse cx="100" cy="184" rx="78" ry="10" fill="#000" opacity=".6"/><path d="M0 170 Q60 162 100 168 T200 166 V200 H0Z" fill="#0a0f0c"/><circle cx="40" cy="160" r="2" fill="#9fe8ff" class="rise" style="animation-delay:0s" filter="url(#glow)"/><circle cx="160" cy="150" r="2" fill="#9fe8ff" class="rise" style="animation-delay:1.5s" filter="url(#glow)"/><circle cx="70" cy="175" r="2" fill="#9fe8ff" class="rise" style="animation-delay:3s" filter="url(#glow)"/><circle cx="130" cy="170" r="2" fill="#9fe8ff" class="rise" style="animation-delay:0.7s" filter="url(#glow)"/><circle cx="100" cy="160" r="2" fill="#9fe8ff" class="rise" style="animation-delay:2.2s" filter="url(#glow)"/>
<g class="float"><g class="drift">
<path d="M58 168 Q50 120 60 80 Q62 38 100 34 Q138 38 140 80 Q150 120 142 168 Q132 156 124 170 Q114 156 104 172 Q94 156 84 170 Q74 156 58 168Z" fill="#c9e8ef" opacity=".55"/>
<path d="M70 150 Q64 110 72 84 Q76 52 100 50 Q124 52 128 84 Q136 110 130 150Z" fill="#e8f8ff" opacity=".35"/>
<ellipse cx="100" cy="84" rx="26" ry="30" fill="#0a1218" opacity=".85"/>
<g class="blink" filter="url(#glow)"><ellipse cx="89" cy="80" rx="6" ry="8" fill="#baf6ff"/><ellipse cx="111" cy="80" rx="6" ry="8" fill="#baf6ff"/></g>
<ellipse cx="100" cy="102" rx="5" ry="9" fill="#05080c"/>
<path d="M58 104 Q36 100 28 118 Q40 112 52 122" fill="none" stroke="#c9e8ef" stroke-width="5" opacity=".5" stroke-linecap="round"/>
<path d="M142 104 Q164 100 172 118 Q160 112 148 122" fill="none" stroke="#c9e8ef" stroke-width="5" opacity=".5" stroke-linecap="round"/>
<path d="M60 126 Q52 140 56 154 M140 126 Q148 140 144 154" stroke="#6b7c80" stroke-width="3" fill="none"/><circle cx="56" cy="156" r="4" fill="none" stroke="#6b7c80" stroke-width="2.5"/><circle cx="144" cy="156" r="4" fill="none" stroke="#6b7c80" stroke-width="2.5"/>
</g></g>

</svg>
