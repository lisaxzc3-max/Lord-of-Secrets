<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1b2832"/><stop offset="1" stop-color="#04070a"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}.rise2{animation:rise 5.5s linear -2s infinite}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 20s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 9s ease-in-out infinite}
.wave{animation:wave 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.wave2{animation:wave 1.6s ease-out -.8s infinite;transform-box:fill-box;transform-origin:center}
.flick{animation:flick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flick2{animation:flick 1.7s ease-in-out -.6s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dig{animation:dig 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.3}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-10px)}50%{transform:translateX(12px)}}
@keyframes wave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
@keyframes dig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="200" height="200" fill="url(#bg)"/>
<circle cx="127" cy="40" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="141" cy="50" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="103" cy="7" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="129" cy="41" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="123" cy="82" r="0.6" fill="#fff" class="fl2" opacity=".7"/><circle cx="148" cy="6" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="165" cy="24" r="0.8" fill="#fff" class="fl2" opacity=".7"/><circle cx="100" cy="26" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="59" cy="13" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="57" cy="15" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="181" cy="49" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="109" cy="17" r="0.6" fill="#fff" class="fl" opacity=".7"/><circle cx="21" cy="90" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="63" cy="17" r="0.8" fill="#fff" class="fl" opacity=".7"/><circle cx="119" cy="20" r="1.1" fill="#fff" class="fl2" opacity=".7"/><circle cx="114" cy="23" r="1.1" fill="#fff" class="fl" opacity=".7"/><circle cx="158" cy="30" r="27" fill="#e9efe0" opacity=".08" filter="url(#soft)"/><circle cx="158" cy="30" r="13" fill="#e9efe0" opacity=".9"/><circle cx="153" cy="27" r="3.9" fill="#c2cab8" opacity=".5"/><ellipse cx="100" cy="180" rx="78" ry="10" fill="#000" opacity=".6"/><path d="M0 166 Q60 158 100 164 T200 162 V200 H0Z" fill="#080b0a"/><g transform="translate(30 166) scale(0.9)"><rect x="-2" y="-34" width="4" height="34" fill="#2a3a3a"/><rect x="-9" y="-26" width="18" height="4" fill="#2a3a3a"/></g>
<path d="M30 166 V100 L100 52 L170 100 V166Z" fill="#2a3030"/><path d="M30 100 L100 52 L170 100" fill="none" stroke="#3a4444" stroke-width="5"/>
<path d="M44 166 V104 L100 66 L156 104 V166Z" fill="#232929"/>
<g stroke="#161a1a" stroke-width="2"><path d="M44 120 H156 M44 140 H156 M72 90 V166 M128 90 V166"/></g>
<path d="M78 166 V112 Q78 96 100 96 Q122 96 122 112 V166Z" fill="#0a0d0f"/>
<path d="M82 166 V114 Q82 100 100 100 Q118 100 118 114 V166Z" fill="#11161a"/>
<path d="M100 100 V166" stroke="#06080a" stroke-width="2"/>
<g fill="none" stroke="#6a7886" stroke-width="3"><path d="M82 128 H118"/><path d="M82 146 H118"/></g>
<g filter="url(#glow)" class="pulse"><circle cx="100" cy="138" r="9" fill="none" stroke="#9a6bff" stroke-width="2.4"/><path d="M100 129 v18 M91 138 h18" stroke="#9a6bff" stroke-width="2"/></g>
<path d="M100 116 L96 132 L102 130 L98 148" stroke="#c8b8ff" stroke-width="1.6" fill="none" class="fl"/>
<g fill="#b8a8ff" class="rise" opacity=".7"><circle cx="100" cy="164" r="2"/><circle cx="92" cy="166" r="1.6" class="rise2"/><circle cx="108" cy="166" r="1.6"/></g>
<path d="M60 168 Q80 172 100 170" stroke="#0007" stroke-width="2" fill="none"/>

</svg>
