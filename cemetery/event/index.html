<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b12">
<title>Кладбище · Событие</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--panel:rgba(14,19,28,.95);--line:#3a4a63;--text:#dce4ee;--muted:#9aaac0;--gold:#d6b779;--moss:#8fb4e8}
*{box-sizing:border-box}
html{min-height:100%;background:#070b12}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font:14px Inter,system-ui,Arial,sans-serif;overflow-x:hidden;background:radial-gradient(ellipse at 50% -10%,#3a5a9a40,transparent 55%),linear-gradient(#0a0f1a,#05070c)}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}
.wrap{position:relative;z-index:2;max-width:520px;margin:auto;padding:12px 12px calc(32px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:10px;padding:6px 0 15px}
.back{flex-shrink:0;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#0c121ce8;font-size:12px}
.eyebrow{font-size:9px;letter-spacing:3px;color:var(--moss)}
h1{font-size:20px;margin:4px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:0 10px 30px #0005;overflow:hidden}
/* ===== визуальная новелла ===== */
body{background:#05060a;overflow:hidden}
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#26334d,#05070c 75%)}
.stage img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:50% 38%;animation:kb 22s ease-in-out infinite alternate,sceneIn 1.6s ease-out;transform-origin:50% 40%}
@keyframes sceneIn{from{opacity:0;filter:brightness(2.2) blur(8px)}}
#sceneCard{animation:boxIn .7s cubic-bezier(.2,.9,.3,1) .5s backwards}
@keyframes boxIn{from{opacity:0;transform:translateY(40px)}}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.stage .symbol{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;filter:drop-shadow(0 0 22px var(--glow,#8fb4e888));animation:bob 4s ease-in-out infinite}
.stage:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 40%,#000a 100%),linear-gradient(180deg,#000a 0,transparent 18%,transparent 45%,#000d 100%)}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.wrap{position:fixed;inset:0;z-index:4;max-width:560px;margin:auto;padding:0;display:flex;flex-direction:column;pointer-events:none}
.wrap>*{pointer-events:auto}
.head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.eyebrow{text-shadow:0 1px 6px #000}
h1{text-shadow:0 2px 10px #000;font-size:17px}
main{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:20px 10px calc(12px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto;pointer-events:none}
main>*{pointer-events:auto}
.card{position:relative;background:linear-gradient(180deg,#0b0f1acc,#05070ef0);border:1px solid #d6b77966;border-radius:16px;margin:0;box-shadow:0 0 0 3px #05070e,0 0 0 4px #d6b77933,0 10px 34px #000c;overflow:visible;backdrop-filter:blur(6px)}
.body{padding:20px 16px 14px}
.title{position:absolute;left:14px;top:-15px;margin:0;padding:5px 14px;font-size:14px;font-weight:700;letter-spacing:.04em;color:#1a1020;background:linear-gradient(135deg,#f0d79a,#b8924a);border-radius:10px;box-shadow:0 3px 12px #000a}
.text{font-size:15px;line-height:1.65;color:#e8e4da;white-space:pre-wrap;overflow-wrap:anywhere;min-height:3.3em;text-shadow:0 1px 2px #000}
.text.typing:after{content:"▼";font-size:10px;color:var(--gold);margin-left:6px;animation:blk .7s steps(2) infinite}
@keyframes blk{50%{opacity:0}}
.divider{display:none}
#resText{display:none}
.actions{display:grid;gap:7px;margin-top:12px;animation:chIn .45s ease-out}
@keyframes chIn{from{opacity:0;transform:translateY(10px)}}
.action{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:12px 13px;border:1px solid #d6b77966;border-radius:12px;color:#f3e9cf;background:linear-gradient(90deg,#1c1530e6,#0d0a18e6);cursor:pointer;transition:transform .12s,box-shadow .2s,border-color .2s}
.action:active:not(:disabled){transform:scale(.98);box-shadow:0 0 18px #d6b77966;border-color:#f0d79a}
.action:disabled{opacity:.5}
.arrow{margin-left:auto;color:var(--gold);font-size:21px}
.aName{font-size:13.5px;font-weight:700;line-height:1.4}
.back{flex-shrink:0;color:var(--text);text-decoration:none;border:1px solid #d6b77966;border-radius:10px;padding:9px 11px;background:#05070ecc;font-size:12px}
.btn{display:block;width:100%;border:1px solid #d6b77966;border-radius:11px;padding:13px 10px;background:#120e20e6;color:var(--text);font-weight:800;font-size:13px;cursor:pointer;margin-top:10px}
.btn.primary{color:#1a1020;background:linear-gradient(135deg,#f0d79a,#b8924a);border-color:#f0d79a}
.result{padding:16px;border-color:#d6b77988;background:linear-gradient(180deg,#0b0f1acc,#05070ef0)}
.result.bad{border-color:#c4505a;background:linear-gradient(180deg,#2a0d12d0,#0a0507f0)}
.badge{font-size:10px;letter-spacing:3px;color:var(--gold);margin-bottom:8px}
.rgrid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px}
.rchip{font-weight:850;font-size:14px;padding:7px 11px;border-radius:10px;border:1px solid #4a4147;background:#1b1e26;animation:pop .5s backwards}
.rchip.up{color:#8ff0aa;border-color:#3f7a52}.rchip.down{color:#ff8a92;border-color:#7a3b42}.rchip.mad{color:#c9a8ff;border-color:#62487f}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.hidden{display:none!important}
.err{padding:13px;border-color:#783b42;color:#f0a3a3;font-size:12px;line-height:1.6}
/* ---- эффекты событий ---- */
.fog{position:absolute;left:-40%;width:180%;height:90px;background:radial-gradient(ellipse at center,#cfe0ff2a,transparent 70%);animation:fog var(--t) linear var(--d) infinite;pointer-events:none}
@keyframes fog{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.spore{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:radial-gradient(#e4ecff,#8fb4ff88);box-shadow:0 0 10px 3px #8fb4ff66;animation:spore var(--t) linear var(--d) infinite}
@keyframes spore{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--x),-60vh);opacity:0}}
.mote{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:radial-gradient(#fff,#bcd4ff66);box-shadow:0 0 8px 2px #bcd4ff55;animation:mote var(--t) linear var(--d) infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--x),70vh);opacity:0}}
.glow{position:absolute;left:var(--gx);top:var(--gy);width:var(--gs,160px);height:var(--gs,160px);margin:calc(var(--gs,160px)/-2) 0 0 calc(var(--gs,160px)/-2);border-radius:50%;background:radial-gradient(circle,var(--gc),transparent 68%);mix-blend-mode:screen;animation:fk var(--t,1.6s) ease-in-out var(--d,0s) infinite alternate}
@keyframes fk{0%{opacity:.25;transform:scale(.9)}35%{opacity:.7}60%{opacity:.4;transform:scale(1.05)}100%{opacity:.85;transform:scale(1.15)}}
.tint{position:absolute;inset:0;background:var(--gc);mix-blend-mode:soft-light;animation:tp var(--t,5s) ease-in-out infinite alternate}
@keyframes tp{from{opacity:.05}to{opacity:.35}}
.beam{position:absolute;top:-10%;left:var(--gx);width:38%;height:120%;margin-left:-19%;background:linear-gradient(180deg,#dfe9ff55,transparent 80%);transform:skewX(-14deg);filter:blur(10px);mix-blend-mode:screen;animation:tp 6s ease-in-out infinite alternate}
/* реакция на выбор */
.fx-heal:after,.fx-hurt:after,.fx-mad:after,.fx-poison:after,.fx-rune:after,.fx-calm:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;animation:flash 1.1s ease-out forwards}
.fx-heal:after{background:radial-gradient(circle,#8fd4ffaa,transparent 70%)}
.fx-hurt:after{background:radial-gradient(circle,transparent 30%,#c4252fcc)}
.fx-mad:after{background:radial-gradient(circle,#9a5fffaa,transparent 70%)}
.fx-poison:after{background:radial-gradient(circle,#8fb4ff88,transparent 70%)}
.fx-rune:after{background:radial-gradient(circle,#ffd27acc,transparent 70%)}
.fx-calm:after{background:radial-gradient(circle,#ffffff22,transparent 70%)}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<script src="../../shared/fast.js?v=a2"></script>
<script src="../../shared/auth.js"></script>
<script src="../../shared/sound.js?v=a4"></script>
<script>sndMusic("cemetery")</script>
</head>
<body>
<div class="stage" id="stage"><div class="symbol" id="symbol">🪦</div><img id="evImg" class="hidden" alt=""><div class="layer" id="layer"></div></div>
<div class="wrap">
<header class="head">
 <a class="back" id="backCem" href="../index.html">← Кладбище</a>
 <div><div class="eyebrow">LORD OF THE MYSTERIES</div><h1 id="hTitle">Событие</h1></div>
</header>
<main>
 <section class="card" id="sceneCard">
  <div class="body">
   <h2 class="title" id="evTitle">Кладбище</h2>
   <div class="text" id="evText">Загрузка…</div>
   <div class="divider"></div>
   <div class="actions" id="actions"></div>
  </div>
 </section>
 <section class="card result hidden" id="resultCard">
  <div class="badge">◆ ПОСЛЕДСТВИЯ ◆</div>
  <div class="text" id="resText"></div>
  <div class="rgrid" id="rgrid"></div>
  <button class="btn primary" id="again" type="button">🔍 Исследовать дальше</button>
  <button class="btn" id="toCem" type="button">← На кладбище</button>
 </section>
 <section class="card err hidden" id="errCard" role="alert"><div id="errText"></div><button class="btn" id="errBack" type="button">← На кладбище</button></section>
</main>
</div>
<script>
"use strict";
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.setHeaderColor("#070b12")}catch(_){}
const qs=new URLSearchParams(location.search);
const uid=String(qs.get("u")||tg?.initDataUnsafe?.user?.id||"0");
const aEnc=qs.get("a_enc")||qs.get("a")||"";
/* вход только по личным ссылкам бота */
let ACTION_URL=aEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(aEnc):"";
const $=id=>document.getElementById(id);
let busy=false,done=false,ev=null,evKey="";
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const rnd=(a,b)=>a+Math.random()*(b-a);

/* Картинки событий лежат в cemetery/img. Чтобы заменить на фото, поменяй путь. */
const META={
gravedigger:{t:"⛏️ Могильщик",s:"⛏️",glow:"#ffb85a77"},
crypt:{t:"🚪 Незапертый склеп",s:"🚪",glow:"#9ab4ff77"},
whispers:{t:"👻 Шёпот могил",s:"👻",glow:"#b9a0ff88"},
hawk:{t:"🦅 Раненый ястреб",s:"🦅",glow:"#d6b77988"},
ritual:{t:"🕯️ Недописанный ритуал",s:"🕯️",glow:"#ff5a5a77"},
angel:{t:"🗿 Каменный ангел",s:"🗿",glow:"#cfe0ff88"},
procession:{t:"🔔 Похоронная процессия",s:"🔔",glow:"#aab4c488"}
};
const IMG={};["gravedigger","crypt","whispers","hawk","ritual","angel","procession"].forEach(k=>IMG[k]="../img/"+k+".webp");
const ICON={c_gravedigger_buy:"💷",c_gravedigger_talk:"🗣",c_gravedigger_leave:"↩",c_crypt_open:"🚪",c_crypt_listen:"👂",c_crypt_leave:"↩",c_whispers_listen:"👂",c_whispers_pray:"🙏",c_whispers_flee:"🏃",c_hawk_help:"🩹",c_hawk_ask:"❓",c_hawk_leave:"↩",c_ritual_finish:"✍",c_ritual_break:"💥",c_ritual_leave:"↩",c_angel_pray:"🙏",c_angel_touch:"✋",c_angel_leave:"↩",c_procession_join:"🕯️",c_procession_watch:"👁",c_procession_leave:"↩"};

function unwrap(v){for(let i=0;i<3;i++){if(v&&v.result&&typeof v.result==="object")v=v.result;else break}return v}
async function ensure(){
 if(ACTION_URL)return;
 const r=await needStart({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid}),cache:"no-store"});
 if(!r.ok)throw new Error("Не удалось подключиться к игре (HTTP "+r.status+").");
 const d=unwrap(await r.json());const a=d?.action_url||d?.ACTION_URL;
 if(typeof a!=="string"||!a)throw new Error("Сервер не вернул адрес действий.");
 ACTION_URL=new URL(a).href;
}
async function api(payload){
 await ensure();
 const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
 if(!r.ok)throw new Error("Ошибка игрового сервера (HTTP "+r.status+").");
 const d=unwrap(await r.json());
 if(!d||typeof d!=="object")throw new Error("Сервер вернул некорректный ответ.");
 return d;
}
function cemUrl(){const p=new URLSearchParams(location.search);p.delete("event_data");p.delete("enemy");const q=p.toString();return "../index.html"+(q?"?"+q:"")}
function goCem(){location.href=cemUrl()}
$("backCem").href=cemUrl();
function showErr(t){$("errText").textContent=t;$("errCard").classList.remove("hidden")}
function mk(cls,css,txt){const d=document.createElement("i");d.className=cls;if(css)for(const k in css)d.style.setProperty(k,css[k]);if(txt)d.textContent=txt;$("layer").appendChild(d);return d}

/* ---- сцены (у каждого события свои эффекты поверх арта) ---- */
function glow(x,y,c,sz,t,d){mk("glow",{"--gx":x+"%","--gy":y+"%","--gc":c,"--gs":sz+"px","--t":t+"s","--d":d+"s"})}
function sp(n,x0,x1,col,t0,t1,cls){for(let i=0;i<n;i++)mk(cls||"spore",{left:rnd(x0,x1)+"%","--x":rnd(-30,30)+"px","--t":rnd(t0,t1)+"s","--d":rnd(-t1,0)+"s",background:col?"radial-gradient(#fff,"+col+")":"",boxShadow:col?"0 0 10px 3px "+col:""})}
function buildScene(k){
 const L=$("layer");L.replaceChildren();
 $("stage").style.setProperty("--glow",META[k]?.glow||"#8fb4e888");
 if(reduce)return;
 for(let i=0;i<4;i++)mk("fog",{top:rnd(35,95)+"%","--t":rnd(10,18)+"s","--d":rnd(-14,0)+"s"});
 if(k==="gravedigger"){glow(36,66,"#ffa83a99",220,1.4,0);glow(36,66,"#ffd27a66",110,.9,-.4);sp(14,20,60,"#ffb85a",3,6)}
 else if(k==="crypt"){glow(50,52,"#7affc866",260,3,0);mk("tint",{"--gc":"#7affc8","--t":"4s"});sp(14,30,70,"#9affd8",3,6)}
 else if(k==="whispers"){mk("tint",{"--gc":"#8a5cff","--t":"3.5s"});sp(18,0,100,"#c8a8ff",4,8);glow(30,30,"#b9a0ff66",200,3,0);glow(70,40,"#b9a0ff55",160,4,-1)}
 else if(k==="hawk"){glow(30,72,"#ffa83a99",200,1.5,0);sp(10,15,55,"#ffb85a",3,6);sp(10,0,100,"",5,9,"mote")}
 else if(k==="ritual"){[[22,72],[38,80],[62,80],[80,70],[12,56],[88,52]].forEach((c,i)=>glow(c[0],c[1],"#ffb04acc",120+rnd(0,60),rnd(.7,1.5),-i*.3));mk("tint",{"--gc":"#b36bff","--t":"3s"});sp(14,25,75,"#d9a8ff",2.5,5)}
 else if(k==="angel"){mk("beam",{"--gx":"62%"});glow(66,14,"#dfe9ff88",240,4,0);sp(16,0,100,"",5,9,"mote");glow(12,80,"#ffb04a88",100,1.2,0);glow(90,86,"#ffb04a88",100,1.4,-.5)}
 else if(k==="procession"){for(let i=0;i<6;i++)glow(10+i*16,rnd(58,72),"#ffb04acc",110,rnd(.8,1.6),-i*.2);mk("tint",{"--gc":"#5a4a9a","--t":"6s"});sp(8,0,100,"#aab4c4",5,9)}
}
const EVSND={gravedigger:["cmshovel",6000,"event"],crypt:["cmcreak",9000,"event"],whispers:["whisper",5500,"whisper"],hawk:["cmwings",7000,"event"],ritual:["cmritual",7000,"cmritual"],angel:["qchime",7000,"divine"],procession:["cmtoll",7500,"cmtoll"]};
let ambT=0;
function startAmbient(k){
 clearInterval(ambT);const e=EVSND[k];if(!e)return;
 try{snd(e[2])}catch(_){}
 ambT=setInterval(()=>{if(document.hidden)return;try{snd(e[0])}catch(_){}},e[1]);
}
let twTimer=0,twDone=null,twNode=null,twFull="";
function typeText(node,txt,cb){
 clearInterval(twTimer);twNode=node;twFull=txt;twDone=cb;
 if(reduce){node.textContent=txt;cb&&cb();return}
 node.textContent="";node.classList.add("typing");let i=0;
 twTimer=setInterval(()=>{i+=2;if(i%6===0){try{snd("vntick")}catch(_){}}node.textContent=txt.slice(0,i);if(i>=txt.length)finishType()},22);
}
function finishType(){
 if(!twNode)return;clearInterval(twTimer);twNode.textContent=twFull;twNode.classList.remove("typing");
 const cb=twDone;twNode=null;twDone=null;cb&&cb();
}
$("sceneCard").addEventListener("click",()=>{if(twNode)finishType()});
function setImage(k){
 const src=IMG[k];const img=$("evImg");
 if(!src){img.classList.add("hidden");return}
 img.onload=()=>{img.classList.remove("hidden");$("symbol").classList.add("hidden")};
 img.onerror=()=>img.classList.add("hidden");
 img.src=src;
}
function renderEvent(d){
 ev=d;evKey=String(d.event||d.image||"");
 const m=META[evKey]||{t:"🪦 Событие на кладбище",s:"🪦"};
 $("evTitle").textContent=m.t;$("hTitle").textContent="Кладбище · Событие";
 $("symbol").textContent=m.s;
 buildScene(evKey);setImage(evKey);startAmbient(evKey);
 const box=$("actions");box.replaceChildren();
 const acts=Array.isArray(d.actions)?d.actions:[];
 box.classList.add("hidden");typeText($("evText"),d.text||"Туман шевелится между надгробиями.",()=>box.classList.remove("hidden"));
 if(!acts.length){const b=document.createElement("button");b.className="btn primary";b.textContent="← На кладбище";b.onclick=goCem;box.appendChild(b);return}
 acts.forEach(a=>{
  const b=document.createElement("button");b.type="button";b.className="action";
  const ic=document.createElement("span");ic.style.fontSize="20px";ic.textContent=ICON[a.id]||"•";
  const nm=document.createElement("span");nm.className="aName";nm.textContent=String(a.label||a.id).replace(/^\S+\s/,"")||a.label;
  const ar=document.createElement("span");ar.className="arrow";ar.textContent="›";
  b.append(ic,nm,ar);b.addEventListener("click",()=>choose(a.id));box.appendChild(b);
 });
}
async function choose(id){
 if(busy||done)return;busy=true;
 document.querySelectorAll("#actions button").forEach(b=>b.disabled=true);
 try{
  const r=await api({action:"event_choice",move:id});
  if(r.ok===false||r.error){
   const t=String(r.error||r.text||"Сервер не принял выбор.");
   showErr(t==="unknown_event_move"?"Это событие уже закончилось.":t);
   document.querySelectorAll("#actions button").forEach(b=>b.disabled=false);
   return;
  }
  done=true;showResult(r);
 }catch(e){showErr(e.message||"Ошибка связи.");document.querySelectorAll("#actions button").forEach(b=>b.disabled=false)}
 finally{busy=false}
}
function showResult(r){
 const fx=r.fx||"calm";clearInterval(ambT);
 snd(fx==="hurt"||fx==="poison"?"bad":fx==="heal"?"heal":fx==="mad"?"whisper":"good");
 const st=$("stage");st.classList.remove("fx-heal","fx-hurt","fx-mad","fx-poison","fx-rune","fx-calm");void st.offsetWidth;st.classList.add("fx-"+fx);
 if(fx==="hurt"||fx==="poison"){$("sceneCard").classList.add("shake");setTimeout(()=>$("sceneCard").classList.remove("shake"),520)}
 try{tg?.HapticFeedback?.notificationOccurred(fx==="hurt"||fx==="poison"?"error":"success")}catch(_){}
 $("actions").replaceChildren();
 const rc=$("resultCard");rc.classList.add("hidden");
 typeText($("evText"),r.text||"Твой выбор изменил ход событий.",()=>{rc.classList.remove("hidden");setTimeout(()=>rc.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}),80)});
 $("resText").textContent="";
 const g=$("rgrid");g.replaceChildren();
 const chip=(txt,cls,i)=>{const c=document.createElement("span");c.className="rchip "+cls;c.textContent=txt;c.style.animationDelay=(i*.12)+"s";g.appendChild(c)};
 let i=0;
 if(r.d_hp)chip((r.d_hp>0?"+":"")+r.d_hp+" ❤️",r.d_hp>0?"up":"down",i++);
 if(r.d_pounds)chip((r.d_pounds>0?"+":"")+r.d_pounds+" £",r.d_pounds>0?"up":"down",i++);
 if(r.d_mad)chip((r.d_mad>0?"+":"")+r.d_mad+" 🌀",r.d_mad>0?"mad":"up",i++);
 if(typeof r.tracks==="number"&&r.tracks>0&&/c_hawk_ask/.test(r.event||""))chip("🐾 "+r.tracks+"/3",r.tracks>=3?"up":"mad",i++);
 $("resultCard").classList.toggle("bad",fx==="hurt"||fx==="poison");
}
$("toCem").addEventListener("click",goCem);
$("errBack").addEventListener("click",goCem);
$("again").addEventListener("click",async()=>{
 if(busy)return;busy=true;
 try{
  const d=await api({action:"explore_cemetery"});
  if(d.error==="cooldown"){showErr("Подожди ещё "+(d.left||3)+" сек.");return}
  if(d.ok===false||d.error){showErr(String(d.text||d.error));return}
  const p=new URLSearchParams(location.search);
  if(d.type==="event"){p.set("event_data",JSON.stringify(d));location.href="./index.html?"+p.toString();return}
  p.delete("event_data");if(d.enemy)p.set("enemy",d.enemy);
  location.href="../battle/index.html?"+p.toString();
 }catch(e){showErr(e.message||"Ошибка связи.")}finally{busy=false}
});
(function init(){
 const raw=qs.get("event_data");
 if(!raw){$("evTitle").textContent="Событие не найдено";$("evText").textContent="Вернись на кладбище и нажми «Исследовать».";
  const b=document.createElement("button");b.className="btn primary";b.textContent="← На кладбище";b.onclick=goCem;$("actions").appendChild(b);return}
 try{const d=unwrap(JSON.parse(raw));if(!d||typeof d!=="object")throw 0;renderEvent(d)}
 catch(_){$("evTitle").textContent="Не удалось прочитать событие";$("evText").textContent="Данные повреждены. Вернись на кладбище и начни заново.";
  const b=document.createElement("button");b.className="btn primary";b.textContent="← На кладбище";b.onclick=goCem;$("actions").appendChild(b)}
})();
</script>
