<script>

{const bp=new URLSearchParams(location.search);bp.delete("tab");const q=bp.toString();$("back").href="../index.html"+(q?"?"+q:"")}

/* ---------- данные ---------- */

};

 top:{n:"Ратуша",e:"top",d:"center",m:"Зал славы · топ игроков",t:"Центр",ds:"Главное здание города. В зале славы собраны лучшие игроки и рейтинги.",url:"../top/index.html",p:{city:[440,345],center:[545,255]}},

 bazaar:{n:"Рынок Безликих",e:"bazaar",d:"center",m:"Торговля · Обмен",t:"Центр",ds:"Здесь продают всё на свете, но лиц не показывают. Торгуй и меняйся с игроками.",url:"../market/index.html",p:{city:[430,775],center:[880,535]}},

 clan:{n:"Церковь Ночи",e:"clan",d:"center",m:"Кланы · Братства",t:"Центр",ds:"Найди своих или создай клан. Под луной братства сильнее одиночек.",url:"../clan/index.html",p:{city:[765,320],center:[845,975]}},

 home:{n:"Твой дом",e:"home",d:"east",m:"Вольер · Сад · Лаборатория",t:"Восток",ds:"Твой уголок города: питомцы в вольере, сад и тихие вечера.",url:"../home/index.html",p:{city:[905,495],east:[480,590]}},
 lab:{n:"Лаборатория",e:"lab",d:"east",m:"Зелья · Ингредиенты",t:"Восток",ds:"Алхимическая лаборатория при доме. Здесь варят зелья и собирают рецепты.",url:"../lab/index.html",p:{east:[810,610]}},
 pier:{n:"Пристань",e:"pier",d:"east",m:"Рыбалка · Улов · Рекорды",t:"Восток",ds:"Причал у тёмной воды. Закинь удочку и попробуй побить рекорд рыбаков.",url:"../pier/index.html",p:{city:[880,945],east:[700,1105]}},
 clinic:{n:"Лечебница",e:"clinic",d:"east",m:"Лечение · Палата тишины",t:"Восток",ds:"Здесь лечат раны и тишиной. Палата тишины поможет прийти в себя.",url:"../clinic/index.html",p:{city:[975,650],east:[335,235]}},
 boulevard:{n:"Бульвар",e:"boulevard",d:"west",m:"Ярмарка · Игры · Загадка дня",t:"Запад",ds:"Ярмарка, игры и загадка дня под фонарями старого бульвара.",url:"../boulevard/index.html",p:{city:[150,865],west:[420,905]}},
 bank:{n:"Банк",e:"bank",d:"west",m:"Вклады · Хранилище",t:"Запад",ds:"Тяжёлые двери и ещё более тяжёлые замки. Вклады и хранилище.",url:"../bank/index.html",p:{city:[110,635],west:[370,255]}},
 soon1:{n:"Свободный участок",e:"top",d:"north",soon:true,m:"Скоро",t:"Север",ds:"Здесь скоро появится новое место. Следи за обновлениями.",p:{north:[800,800]}},
 soon2:{n:"Свободный участок",e:"top",d:"north",soon:true,m:"Скоро",t:"Север",ds:"Здесь скоро появится новое место. Следи за обновлениями.",p:{north:[860,1050]}}
};

let last=null;try{last=localStorage.getItem(LAST_KEY)}catch(_){}

/* ---------- состояние ---------- */
const vp=$("vp"),layer=$("layer"),world=$("world"),bg=$("bg");
const S={scene:"city",s:1,tx:0,ty:0,min:1,max:4,sel:null,busy:false};
const hr=new Date().getHours();
const CITYIMG=(hr>=22||hr<6)?"night":"overview";
function sceneImg(n){return IMG+(n==="city"?CITYIMG:DIST[n].img)+".webp"}
function vsz(){return{w:vp.clientWidth,h:vp.clientHeight}}
function limits(){const{w,h}=vsz();S.min=Math.max(Math.min(w/SW,h/SH),Math.max(w/SW,h/SH)*0.88);S.max=Math.max(S.min*2.4,Math.min(S.min*3.4,0.9))}
function clampT(slack){
 const{w,h}=vsz(),cw=SW*S.s,ch=SH*S.s,k=slack||0;
 S.tx=cw<=w?(w-cw)/2:Math.min(k,Math.max(w-cw-k,S.tx));
 S.ty=ch<=h?(h-ch)/2:Math.min(k,Math.max(h-ch-k,S.ty));
}
function apply(){
 world.style.transform="translate3d("+S.tx+"px,"+S.ty+"px,0) scale("+S.s+")";
 world.style.setProperty("--inv",(1/S.s).toFixed(4));
 const z=S.s/S.min;
 world.classList.toggle("zin",z>=1.45);world.classList.toggle("zin2",z>=1.7);
}
function focusOn(x,y,s){
 const{w,h}=vsz();S.s=Math.min(S.max,Math.max(S.min,s||S.min));
 S.tx=w/2-x*S.s;S.ty=h/2-y*S.s;clampT();apply();
}
let anim=0;
function animTo(s,tx,ty,ms){
 cancelAnimationFrame(anim);
 const s0=S.s,x0=S.tx,y0=S.ty,t0=performance.now();ms=reduce?1:(ms||280);
 (function f(now){
  const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);
  S.s=s0+(s-s0)*e;S.tx=x0+(tx-x0)*e;S.ty=y0+(ty-y0)*e;clampT();apply();
  if(k<1)anim=requestAnimationFrame(f);
 })(t0);
}
function zoomAt(cx,cy,ns,ms){
 ns=Math.min(S.max,Math.max(S.min,ns));
 const wx=(cx-S.tx)/S.s,wy=(cy-S.ty)/S.s;
 let tx=cx-wx*ns,ty=cy-wy*ns;
 const{w,h}=vsz(),cw=SW*ns,ch=SH*ns;
 tx=cw<=w?(w-cw)/2:Math.min(0,Math.max(w-cw,tx));ty=ch<=h?(h-ch)/2:Math.min(0,Math.max(h-ch,ty));
 animTo(ns,tx,ty,ms);
}
function flyTo(x,y,s,ms){
 const{w,h}=vsz();s=Math.min(S.max,Math.max(S.min,s));
 let tx=w/2-x*s,ty=h/2-y*s;const cw=SW*s,ch=SH*s;
 tx=cw<=w?(w-cw)/2:Math.min(0,Math.max(w-cw,tx));ty=ch<=h?(h-ch)/2:Math.min(0,Math.max(h-ch,ty));
 animTo(s,tx,ty,ms||420);
}

/* ---------- сцены ---------- */
function pinEl(k){
 const P=PL[k],b=document.createElement("button");
 b.type="button";b.className="pin"+(P.soon?" lock":"");b.dataset.k=k;
 b.innerHTML='<img class="pf" alt=""><img class="pe" alt=""><span class="pn"></span>';
 b.querySelector(".pn").textContent=P.n;
 b.querySelector(".pe").src=IMG+"e_"+P.e+".webp";
 setPinState(b,k);
 return b;
}
const EV={}; /* события по ключу: boss | ev | rw */
function pinFrame(k,sel){
 if(PL[k].soon)return "pin_lock";
 if(sel)return "pin_sel";
 const e=EV[k];return e==="boss"?"pin_boss":e==="ev"?"pin_ev":e==="rw"?"pin_rw":"pin";
}
function setPinState(b,k){
 b.querySelector(".pf").src=IMG+pinFrame(k,b.classList.contains("sel"))+".webp";
 b.classList.toggle("here",last===k&&!b.classList.contains("sel"));
}
function build(name){
 try{window.MAPNPC&&MAPNPC.stop()}catch(_){}
 world.className=name==="city"?"city":"";
 world.querySelectorAll(".pin,.dl,.fog").forEach(n=>n.remove());
 bg.src=sceneImg(name);
 const add=(el,x,y)=>{el.style.left=x+"px";el.style.top=y+"px";world.appendChild(el)};
 if(name==="city"){
  Object.keys(DIST).forEach(d=>{
   const l=document.createElement("button");l.type="button";l.className="dl";l.dataset.d=d;
   l.innerHTML="<b>"+DIST[d].n+"</b><small>"+DIST[d].s+"</small>";add(l,DIST[d].lab[0],DIST[d].lab[1]);
  });
 }
 Object.keys(PL).forEach(k=>{
  const P=PL[k],pos=P.p[name];if(!pos)return;
  add(pinEl(k),pos[0],pos[1]);
  if(P.soon){const f=document.createElement("div");f.className="fog";add(f,pos[0],pos[1]-18)}
 });
 world.classList.add(name==="city"?"city":"dist");
 if(name==="city")world.classList.add("city");
 $("ttS").textContent=name==="city"?"Тинген":"Тинген · район";
 $("ttB").textContent=name==="city"?"Карта города":DIST[name].n;
 $("crumb").classList.toggle("on",name!=="city");
 try{window.MAPNPC&&MAPNPC.start(name,world,()=>({s:S.s,tx:S.tx,ty:S.ty,w:vp.clientWidth,h:vp.clientHeight}),()=>name!=="city"||world.classList.contains("zin"))}catch(_){}
}
function preload(){
 const go=()=>["center","north","east","west"].forEach(d=>{const i=new Image();i.src=sceneImg(d)});
 window.requestIdleCallback?requestIdleCallback(go,{timeout:2500}):setTimeout(go,900);
}
function goScene(name,focus,keepSel){
 if(S.busy)return;S.busy=true;
 closeSheet();
 const doIt=()=>{
  S.scene=name;build(name);limits();
  if(focus){const f=PL[focus];const pos=f&&f.p[name];S.s=S.min;focusOn(pos?pos[0]:SW/2,pos?pos[1]:SH/2,name==="city"?S.min*1.0:S.min*2.0)}
  else{S.s=S.min;focusOn(name==="city"?SW/2:SW/2,name==="city"?SH/2:SH/2,S.min)}
  layer.classList.remove("out");
  if(!reduce){layer.classList.remove("in");void layer.offsetWidth;layer.classList.add("in")}
  S.busy=false;
  if(focus&&keepSel)select(focus,true);
 };
 if(reduce){doIt();return}
 layer.classList.add("out");
 const im=new Image();im.src=sceneImg(name);
 setTimeout(()=>{(im.complete?Promise.resolve():new Promise(r=>{im.onload=im.onerror=r})).then(doIt)},230);
}

/* ---------- карточка ---------- */
function closeSheet(){
 $("sheet").classList.remove("on");
 if(S.sel){const b=world.querySelector('.pin[data-k="'+S.sel+'"]');if(b){b.classList.remove("sel");setPinState(b,S.sel)}}
 S.sel=null;
}
function select(k,fly){
 const P=PL[k];if(!P)return;
 if(S.sel&&S.sel!==k)closeSheet();
 S.sel=k;
 const b=world.querySelector('.pin[data-k="'+k+'"]');
 if(b){b.classList.add("sel");setPinState(b,k)}
 $("sName").textContent=P.n;$("sMeta").textContent=P.m;$("sDesc").textContent=EV[k]==="boss"&&k==="arena"?P.ds+" На этой неделе открыт босс недели.":P.ds;
 $("sTag").textContent=P.t+(P.soon?" · скоро":"");
 const go=$("sGo");go.classList.toggle("off",!!P.soon);go.textContent=P.soon?"Скоро":"Войти";go.disabled=!!P.soon;
 $("sGo2").style.display=(k==="arena"&&EV.arena==="boss")?"":"none";
 $("sheet").classList.add("on");
 sfx("tap");buzz();
 if(fly){const pos=P.p[S.scene];if(pos){const{h}=vsz();const sc=Math.max(S.s,S.min*(S.scene==="city"?2.4:1.9));flyToOffset(pos[0],pos[1],sc)}}
}
function flyToOffset(x,y,s){ /* точка чуть выше центра, чтобы карточка её не закрывала */
 const{w,h}=vsz();s=Math.min(S.max,Math.max(S.min,s));
 let tx=w/2-x*s,ty=h*0.36-y*s;const cw=SW*s,ch=SH*s;
 tx=cw<=w?(w-cw)/2:Math.min(0,Math.max(w-cw,tx));ty=ch<=h?(h-ch)/2:Math.min(0,Math.max(h-ch,ty));
 animTo(s,tx,ty,420);
}
function enter(url){
 sfx("open");
 try{localStorage.setItem(LAST_KEY,S.sel||"")}catch(_){}
 const p=new URLSearchParams(location.search);p.set("_t",String(Date.now()));
 location.href=url+"?"+p.toString();
}
$("sGo").addEventListener("click",()=>{const P=PL[S.sel];if(P&&!P.soon)enter(P.url)});
$("sGo2").addEventListener("click",()=>{sfx("open");const p=new URLSearchParams(location.search);p.set("_t",String(Date.now()));location.href="../boss/index.html?"+p.toString()});
$("toCity").addEventListener("click",()=>{sfx("back");const d=S.scene;goScene("city");setTimeout(()=>{const c=DIST[d]&&DIST[d].lab;if(c)flyTo(c[0],c[1],S.min*1.0,1)},500)});

/* ---------- жесты ---------- */
const ptr=new Map();let g=null,vel={x:0,y:0,t:0},inertia=0,lastTap={t:0,x:0,y:0};
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function distAt(x,y){for(const d of["west","east","north","center"])if(inPoly(x,y,REG[d]))return d;return null}
function toWorld(cx,cy){const r=vp.getBoundingClientRect();return[(cx-r.left-S.tx)/S.s,(cy-r.top-S.ty)/S.s]}
vp.addEventListener("pointerdown",e=>{
 if(e.target.closest("#sheet,.ctl,.crumb"))return;
 cancelAnimationFrame(anim);cancelAnimationFrame(inertia);$("hint").classList.add("off");
 try{vp.setPointerCapture(e.pointerId)}catch(_){}
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===1)g={mode:"pan",x0:e.clientX,y0:e.clientY,t0:performance.now(),moved:0,sx:e.clientX,sy:e.clientY};
 else if(ptr.size===2){
  const[a,b]=[...ptr.values()];
  g={mode:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,s0:S.s,moved:99};
  const r=vp.getBoundingClientRect(),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;
  g.wx=(cx-S.tx)/S.s;g.wy=(cy-S.ty)/S.s;
 }
});
vp.addEventListener("pointermove",e=>{
 if(!ptr.has(e.pointerId))return;
 const p=ptr.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(!g)return;
 if(g.mode==="pan"&&ptr.size===1){
  g.moved+=Math.abs(dx)+Math.abs(dy);
  if(g.moved<6)return;
  S.tx+=dx;S.ty+=dy;clampT(30);apply();
  const now=performance.now(),dt=Math.max(1,now-vel.t);vel={x:dx/dt*16,y:dy/dt*16,t:now};
 }else if(g.mode==="pinch"&&ptr.size>=2){
  const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1;
  const r=vp.getBoundingClientRect(),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;
  let ns=g.s0*d/g.d0;ns=Math.min(S.max*1.05,Math.max(S.min*(S.scene==="city"?0.9:0.7),ns));
  S.s=ns;S.tx=cx-g.wx*ns;S.ty=cy-g.wy*ns;clampT(40);apply();
 }
});
function endPtr(e){
 if(!ptr.has(e.pointerId))return;
 ptr.delete(e.pointerId);
 if(!g)return;
 if(g.mode==="pinch"){
  if(ptr.size<2){
   g=null;
   if(S.scene!=="city"&&S.s<S.min*0.86){goScene("city");return}
   zoomAt(vsz().w/2,vsz().h/2,Math.max(S.s,S.min),160);
   ptr.clear();
  }
  return;
 }
 const g0=g;g=null;
 if(e.type==="pointercancel")return;
 const dt=performance.now()-g0.t0;
 if(g0.moved<8&&dt<420){tap(e.clientX,e.clientY);return}
 if(performance.now()-vel.t<80&&!reduce){ /* инерция */
  let vx=vel.x,vy=vel.y;
  (function f(){vx*=0.93;vy*=0.93;if(Math.abs(vx)+Math.abs(vy)<.4)return;S.tx+=vx;S.ty+=vy;clampT(0);apply();inertia=requestAnimationFrame(f)})();
 }else{zoomAt(vsz().w/2,vsz().h/2,S.s,1);clampT(0);apply()}
 clampT(0);apply();
}
vp.addEventListener("pointerup",endPtr);vp.addEventListener("pointercancel",endPtr);
vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,S.s*(e.deltaY<0?1.25:0.8),180)},{passive:false});
function tap(cx,cy){
 const el=document.elementFromPoint(cx,cy);
 const pin=el&&el.closest&&el.closest(".pin"),dl=el&&el.closest&&el.closest(".dl");
 const now=performance.now(),dbl=now-lastTap.t<320&&Math.hypot(cx-lastTap.x,cy-lastTap.y)<30;lastTap={t:now,x:cx,y:cy};
 if(pin){
  const k=pin.dataset.k;
  if(S.sel===k&&!PL[k].soon){return}
  select(k,false);return;
 }
 if(dl){sfx("open");const d=dl.dataset.d;goScene(d);return}
 if(el&&el.closest&&el.closest(".npc")&&window.MAPNPC&&MAPNPC.tap(el)){sfx("tap");buzz();return}
 if(dbl){
  const r=vp.getBoundingClientRect();
  if(S.s>S.min*1.6)zoomAt(cx-r.left,cy-r.top,S.min,260);else zoomAt(cx-r.left,cy-r.top,S.s*2.2,260);
  return;
 }
 if(S.sel){closeSheet();return}
 if(S.scene==="city"){
  const[x,y]=toWorld(cx,cy),d=distAt(x,y);
  if(d){sfx("open");goScene(d)}
 }
}
/* ---------- кнопки ---------- */
const mid=()=>({x:vsz().w/2,y:vsz().h/2});
$("zin").addEventListener("click",()=>{const m=mid();zoomAt(m.x,m.y,S.s*1.6,240);sfx("tap")});
$("zout").addEventListener("click",()=>{const m=mid();if(S.scene!=="city"&&S.s<=S.min*1.05){goScene("city");return}zoomAt(m.x,m.y,S.s/1.6,240);sfx("tap")});
$("compass").addEventListener("click",()=>{closeSheet();const c=S.scene==="city"?[SW/2,SH/2]:[SW/2,SH/2];flyTo(c[0],c[1],S.min,380);sfx("tap")});
$("locate").addEventListener("click",()=>{
 const k=(last&&PL[last])?last:"top";sfx("tap");buzz();
 const P=PL[k];
 if(P.p[S.scene]){select(k,true);return}
 goScene(P.d,k,true);
});
/* ---------- список и поиск ---------- */
function renderList(){
 const q=$("q").value.trim().toLowerCase(),box=$("rows");box.replaceChildren();
 let n=0;
 Object.keys(PL).forEach(k=>{
  const P=PL[k];if(P.soon)return;
  if(q&&(P.n+" "+P.m+" "+P.t+" "+P.ds).toLowerCase().indexOf(q)<0)return;
  n++;
  const r=document.createElement("button");r.type="button";r.className="row";
  r.innerHTML='<img alt="" src="'+IMG+'e_'+P.e+'.webp"><span class="t"><b></b><small></small><i></i></span>';
  r.querySelector("b").textContent=P.n;r.querySelector("small").textContent=P.m;r.querySelector("i").textContent=P.t;
  r.addEventListener("click",()=>{closeList();sfx("open");if(P.p[S.scene]&&S.scene!=="city"&&S.scene===P.d){select(k,true)}else goScene(P.d,k,true)});
  box.appendChild(r);
 });
 if(!n){const d=document.createElement("div");d.className="empty";d.textContent="Ничего не нашлось";box.appendChild(d)}
}
function openList(focus){$("list").classList.add("on");$("q").value="";renderList();if(focus)setTimeout(()=>$("q").focus(),60);sfx("open")}
function closeList(){$("list").classList.remove("on");$("q").blur()}
$("bSearch").addEventListener("click",()=>openList(true));
$("bList").addEventListener("click",()=>openList(false));
$("lx").addEventListener("click",()=>{closeList();sfx("back")});
$("q").addEventListener("input",renderList);

/* ---------- события: босс недели ---------- */
async function loadEvents(){
 if(!ACTION_URL)return;
 try{
  const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"boss_state"}),cache:"no-store"});
  if(!r.ok)return;
  let d=await r.json();for(let i=0;i<3;i++){if(d&&d.result&&typeof d.result==="object")d=d.result;else break}
  if(d&&d.ok===true&&(d.ph==="reg"||d.ph==="battle")){
   EV.arena="boss";
   const b=world.querySelector('.pin[data-k="arena"]');if(b)setPinState(b,"arena");
   if(S.sel==="arena")select("arena",false);
  }
 }catch(_){}
}

/* ---------- старт ---------- */
function start(){
 limits();S.scene="city";build("city");
 S.s=S.min;focusOn(SW/2,SH*0.46,S.min);
 layer.classList.add("in");
 preload();loadEvents();
 setTimeout(()=>$("hint").classList.add("off"),4200);
 const deep=qs.get("go");if(deep&&PL[deep])setTimeout(()=>goScene(PL[deep].d,deep,true),400);
}
addEventListener("resize",()=>{const z=S.s/S.min;limits();S.s=Math.max(S.min,Math.min(S.max,z*S.min));clampT();apply()});
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>e.preventDefault());
bg.addEventListener("load",()=>{if(!bg.dataset.ok){bg.dataset.ok=1}});
if(document.readyState==="loading")addEventListener("DOMContentLoaded",start);else start();
</script>
