<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07050d">
<title>Загрузка — Повелитель Тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#d6b779;--gold2:#b28c4d;--violet:#8b6bff;--text:#cfc9bd}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07050d;overflow:hidden}
body{color:var(--text)}
.loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));background:linear-gradient(rgba(8,6,14,.62),rgba(8,6,14,.95)),url('../i-72.jpeg') center/cover no-repeat,#07050d;animation:enter .9s ease backwards;transition:opacity .45s ease,transform .45s ease,filter .45s ease}
.loader.out{opacity:0;transform:scale(1.06);filter:brightness(2.2) blur(2px)}
.fog{position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(40% 30% at 22% 30%,#5b3fa05a,transparent 70%),radial-gradient(36% 28% at 80% 72%,#a03a5a44,transparent 70%),radial-gradient(30% 22% at 55% 90%,#2a5a8a33,transparent 70%);animation:fog 18s ease-in-out infinite alternate}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#030208ee 100%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px}

/* печать с кольцами вокруг фото */
.seal{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center;animation:rise 1s ease .15s backwards}
.ring{position:absolute;border-radius:50%}
.r1{inset:0;border:1px dashed #d6b77988;animation:spin 22s linear infinite}
.r2{inset:14px;border:1px solid #8b6bff77;animation:spin 14s linear infinite reverse}
.r3{inset:28px;border:2px solid transparent;border-top-color:var(--gold);border-bottom-color:var(--violet);filter:drop-shadow(0 0 8px #d6b779aa);animation:spin 3.2s linear infinite}
.tick{position:absolute;left:50%;top:50%;width:0;height:0}
.tick i{position:absolute;left:-1px;top:-105px;width:2px;height:7px;background:var(--gold);border-radius:2px;opacity:.7;box-shadow:0 0 6px var(--gold)}
.glow{position:absolute;inset:36px;border-radius:50%;background:radial-gradient(circle,#d6b77955,transparent 70%);animation:breath 3.2s ease-in-out infinite}
.photoWrap{position:relative;width:132px;height:132px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,var(--gold),#3a2f52,var(--violet),#3a2f52,var(--gold));animation:spin 8s linear infinite}
.photoWrap>div{width:100%;height:100%;border-radius:50%;background:#120d1c;display:flex;align-items:center;justify-content:center;animation:spinBack 8s linear infinite;overflow:hidden}
.photo{width:100%;height:100%;object-fit:cover;border-radius:50%}
.eye{position:absolute;font-size:46px;color:var(--gold);text-shadow:0 0 18px var(--gold);animation:floaty 4s ease-in-out infinite}

/* заголовок */
.title{margin-top:20px;font-size:19px;font-weight:900;letter-spacing:6px;color:var(--gold);text-shadow:0 0 18px #d6b77988;display:flex;flex-wrap:wrap;justify-content:center;gap:0 3px}
.title span{display:inline-block;animation:letter .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.title .sp{width:10px}
.sub{margin-top:7px;font-size:10px;letter-spacing:5px;color:#8d869a;animation:rise 1s ease .9s backwards}
.line{width:170px;height:1px;margin:15px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:lineIn 1.2s ease 1s backwards}

/* прогресс */
.progress{width:100%;margin-top:22px;animation:rise 1s ease 1.1s backwards}
.bar{position:relative;height:10px;border-radius:10px;background:#16111f;border:1px solid #3d3550;overflow:hidden;box-shadow:0 0 16px #0008 inset}
.fill{position:relative;height:100%;width:0%;border-radius:10px;background:linear-gradient(90deg,#6b5530,var(--gold),#fff3c4)}
.fill:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,#ffffffaa,transparent);animation:shineBar 1.4s ease-in-out infinite}
.fill:before{content:"";position:absolute;right:-3px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px var(--gold);z-index:2}
.pInfo{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;color:#9d95ad}
.stage{min-height:14px;transition:opacity .35s}
.pct{font-variant-numeric:tabular-nums;color:var(--gold)}
.tip{margin-top:16px;min-height:44px;padding:10px 14px;border:1px solid #3d3550;border-left:3px solid var(--gold);border-radius:12px;background:rgba(24,18,38,.7);backdrop-filter:blur(6px);font-size:11px;line-height:1.55;color:#d8cfe8;font-style:italic;transition:opacity .45s,transform .45s;animation:rise 1s ease 1.3s backwards}
.tip.fade{opacity:0;transform:translateY(6px)}
.count{margin-top:14px;font-size:11px;color:#9d95ad;animation:rise 1s ease 1.4s backwards}
.count b{color:var(--gold);font-size:13px}

@keyframes enter{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinBack{to{transform:rotate(-360deg)}}
@keyframes fog{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,2%) scale(1.18)}}
@keyframes breath{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes letter{from{opacity:0;transform:translateY(22px) scale(1.5);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes lineIn{from{width:0;opacity:0}to{width:170px;opacity:1}}
@keyframes shineBar{0%{left:-40%}100%{left:130%}}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
@media(max-height:620px){.seal{width:160px;height:160px;transform:none}.photoWrap{width:100px;height:100px}.tick i{top:-80px}.tip{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script src="../shared/fast.js?v=a5"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/sound.js?v=a4"></script>
<script>sndMusic("city")</script>
</head>
<body>
<div class="loader" id="loader">
<div class="fog"></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<div class="content">
<div class="seal">
<div class="ring r1"></div>
<div class="ring r2"></div>
<div class="ring r3"></div>
<div class="tick" id="ticks"></div>
<div class="glow"></div>
<div class="photoWrap"><div><img class="photo" src="../i-72.jpeg" alt="" onerror="this.style.display='none';document.getElementById('eye').style.display='block'"></div></div>
<div class="eye" id="eye" style="display:none">𓂀</div>
</div>

<div class="title" id="title"></div>
<div class="sub">LORD OF THE MYSTERIES</div>
<div class="line"></div>

<div class="progress">
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="pInfo"><span class="stage" id="stage">Пробуждение тумана…</span><span class="pct" id="pct">0%</span></div>
</div>

<div class="tip" id="tip"></div>

<div class="count" id="countLine">Загружаем игру…</div>
</div>
</div>

<script>
let tg=null;
try{tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor("#07050d")}}catch(_){}

/* ===== логика входа (как раньше) ===== */
let leaving=false,ready=false;
const tStart=performance.now(),MIN_MS=2600,MAX_MS=7000;
const countLine=document.getElementById("countLine");
const timer=setInterval(()=>{
const el=performance.now()-tStart;
if(el>=MAX_MS){goMain();return}
if(ready){countLine.textContent="Всё готово — входим…";if(el>=MIN_MS)goMain()}
},150);

/* ===== загрузка игры во время заставки ===== */
const qsL=new URLSearchParams(location.search);
const uidL=String(qsL.get("u")||tg?.initDataUnsafe?.user?.id||"0");

const mkUrl=e=>e?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(e):"";
const unwrapL=v=>(v&&v.result&&typeof v.result==="object")?v.result:v;
async function post(url,body,ms){
const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
try{
const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),cache:"no-store",signal:ac.signal});
if(!r.ok)throw new Error("HTTP "+r.status);
return unwrapL(await r.json());
}finally{clearTimeout(tm)}
}
(async function boot(){
try{
let pu=mkUrl(qsL.get("p_enc")||qsL.get("p")||""),au=mkUrl(qsL.get("a_enc")||qsL.get("a")||"");
if(!pu||!au){
const d=await needStart();
pu=pu||new URL(d.profile_url||d.PROFILE_URL).href;
au=au||new URL(d.action_url||d.ACTION_URL).href;
}
let prof=null;
try{
const d=await post(pu,{},9000);
if(d&&typeof d==="object"&&!(d.error&&d.ok!==true)&&Number.isFinite(Number(d.hp))&&Number.isFinite(Number(d.max_hp)))prof=d;
}catch(_){}
try{sessionStorage.setItem("lotm_boot",JSON.stringify({t:Date.now(),uid:uidL,pu,au,prof}))}catch(_){}
}catch(_){}
ready=true;
})();

function goMain(){
if(leaving)return;
leaving=true;
clearInterval(timer);
let q=location.search;
const sep=q.includes("?")?"&":"?";
if(!q)q="?v=116";
else if(!q.includes("v="))q+=sep+"v=116";
// пробиваем кэш index.html при каждом входе
const url="../index.html"+q+"&_t="+Date.now();
document.getElementById("loader").classList.add("out");
setTimeout(()=>{location.href=url},420);
}

/* ===== оформление ===== */
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

// заголовок по буквам
(function(){
const t=document.getElementById("title"),word="ПОВЕЛИТЕЛЬ ТАЙН";
let i=0;
for(const ch of word){
const s=document.createElement("span");
if(ch===" "){s.className="sp";s.innerHTML="&nbsp;"}else s.textContent=ch;
s.style.animationDelay=(0.5+i*0.07).toFixed(2)+"s";
t.appendChild(s);i++;
}
})();

// деления на внешнем кольце
(function(){
const box=document.getElementById("ticks");
for(let i=0;i<36;i++){
const d=document.createElement("div");
d.style.cssText="position:absolute;left:0;top:0;transform:rotate("+(i*10)+"deg)";
const m=document.createElement("i");
if(i%3===0){m.style.height="11px";m.style.opacity="1"}
d.appendChild(m);box.appendChild(d);
}
})();

// прогресс и подписи
const stages=[
[0,"Пробуждение тумана…"],
[22,"Нити судьбы сплетаются…"],
[48,"Открываются врата Тингена…"],
[74,"Карты ложатся на стол…"],
[92,"Добро пожаловать, путник…"]
];
const fill=document.getElementById("fill"),pct=document.getElementById("pct"),stageEl=document.getElementById("stage");
let curStage=-1;
const t0=performance.now(),DURATION=3200;
let shown=0;
function tick(now){
const target=ready?1:Math.min(.9,(now-t0)/DURATION*.9);
shown+=(target-shown)*.1;
if(ready&&shown>.995)shown=1;
const p=shown>=1?1:shown;
const eased=p;
const v=Math.round(eased*100);
fill.style.width=(eased*100)+"%";
pct.textContent=v+"%";
let idx=0;
for(let i=0;i<stages.length;i++)if(v>=stages[i][0])idx=i;
if(idx!==curStage){
curStage=idx;
stageEl.style.opacity=0;
setTimeout(()=>{stageEl.textContent=stages[idx][1];stageEl.style.opacity=1},180);
}
if(p<1&&!leaving)requestAnimationFrame(tick);
else if(p>=1){fill.style.width="100%";pct.textContent="100%"}
}
requestAnimationFrame(tick);

// подсказки
const tips=[
"Гадательный клуб ждёт в районе Север. Мадам Нира раскроет прошлое, настоящее и будущее.",
"На озёрах бывает опаснее, чем кажется: в топях иногда поднимается Змей.",
"Отступить из боя можно всегда. Живой путник ещё пригодится.",
"Жаба с короной на кочке и сундук в омуте — не каждая находка безопасна.",
"Следи за здоровьем: оно восстанавливается со временем, а не только после отдыха.",
"Три пути — три стиля боя: Шут, Тиран и Жрец. Выбирай по характеру."
];
const tipEl=document.getElementById("tip");
let ti=Math.floor(Math.random()*tips.length);
tipEl.textContent=tips[ti];
setInterval(()=>{
if(leaving)return;
tipEl.classList.add("fade");
setTimeout(()=>{ti=(ti+1)%tips.length;tipEl.textContent=tips[ti];tipEl.classList.remove("fade")},450);
},2400);

// частицы: золотые искры и фиолетовые огоньки поднимаются
(function(){
const cv=document.getElementById("fx"),ctx=cv.getContext("2d");
function sprite(rgb){const c=document.createElement("canvas");c.width=c.height=32;const g=c.getContext("2d"),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,"rgba("+rgb+",1)");r.addColorStop(.25,"rgba("+rgb+",.55)");r.addColorStop(1,"rgba("+rgb+",0)");g.fillStyle=r;g.fillRect(0,0,32,32);return c}
const SP={"139,107,255":sprite("139,107,255"),"214,183,121":sprite("214,183,121")};
let w=0,h=0,dots=[];
function resize(){
w=cv.width=innerWidth;h=cv.height=innerHeight;
dots=[];
for(let i=0;i<46;i++)dots.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.4,s:Math.random()*.7+.15,p:Math.random()*6,c:Math.random()<.28?"139,107,255":"214,183,121"});
}
resize();addEventListener("resize",resize);
function frame(t){
ctx.clearRect(0,0,w,h);
for(const d of dots){
d.y-=d.s;if(d.y<-8){d.y=h+8;d.x=Math.random()*w}
const a=.2+.55*Math.abs(Math.sin(t/900+d.p));
ctx.globalAlpha=a;const sz=d.r*7;
ctx.drawImage(SP[d.c],d.x+Math.sin(t/1400+d.p)*14-sz/2,d.y-sz/2,sz,sz);
}
ctx.globalAlpha=1;
if(!reduce&&!leaving)requestAnimationFrame(frame);
}
if(!reduce)requestAnimationFrame(frame);
})();
</script>
<script src="../shared/icons.js?v=i1"></script>
</body>
</html>
