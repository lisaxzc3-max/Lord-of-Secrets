<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07050d">
<title>Основной квест — Повелитель тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#e8e0cf;--muted:#9d92b2;--gold:#cdb27a;--gold2:#8f7a4c;--line:#3d3352;--pc:#cdb27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07050d;color:var(--text);font:14px/1.5 Inter,system-ui,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#stage{position:fixed;inset:0;z-index:0;background:#07050d;overflow:hidden}
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.dots{display:flex;gap:7px;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:#251d38;border:1px solid #54456f;transition:.6s}
.dot.on{background:#e9d9a8;border-color:var(--gold);transform:scale(1.25)}
.dot.done{background:#6e5d38;border-color:#8f7a4c}
.mind{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.mind i{width:9px;height:9px;background:#b9a6e0;transform:rotate(45deg);transition:background 1s,opacity 1s}
.mind i.off{background:#2a2238;opacity:.6}
#skip{background:none;border:1px solid #3d3352;color:var(--muted);border-radius:10px;padding:5px 9px;font-size:11px}
#skip.sure{border-color:#b2505a;color:#e9b0b6}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 14px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#07050dfa 55%,#07050d00);min-height:36%;display:flex;flex-direction:column;justify-content:flex-end}
.who{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:26px}
.who .ic{width:26px;height:26px;border-radius:50%;border:1px solid var(--pc);transition:border-color .4s;background:#17102a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.who .ic svg{width:20px;height:20px}
.who b{font:700 11px Philosopher,Georgia,serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--pc);transition:color .4s}
#tx{font:16px/1.55 Philosopher,Georgia,serif;color:#ece4d2;min-height:76px;max-width:520px;margin:0 auto;width:100%}
#tx.n{color:#c9c0d8;font-style:italic}
#tx:after{content:"";}
#tx.typing:after{content:"▍";color:var(--gold);animation:bl .9s steps(2) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}
#hint{text-align:center;color:var(--gold2);font-size:12px;height:16px;opacity:0;transition:opacity .4s}
#hint.on{opacity:.85;animation:hp 1.9s ease-in-out infinite}
@keyframes hp{50%{opacity:.3}}
#choices{display:grid;gap:9px;max-width:520px;margin:6px auto 0;width:100%}
.ch{padding:13px 14px;border-radius:14px;border:1px solid #5a4a80;background:linear-gradient(160deg,#241a38ee,#130d20ee);text-align:left;font:15px Philosopher,Georgia,serif;color:#efe5cc;opacity:0;transform:translateY(12px);animation:chIn .5s forwards;position:relative;overflow:hidden;transition:border-color .25s,box-shadow .25s}
.ch:active{transform:scale(.98)}
.ch:hover{border-color:var(--gold)}
@keyframes chIn{to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:#05030acc;opacity:0;transition:opacity .6s}
.ov.on{display:flex}.ov.show{opacity:1}
.letter{position:relative;width:100%;max-width:380px;padding:26px 22px 20px;border-radius:6px;background:linear-gradient(160deg,#1b1528,#0f0b18);border:1px solid #6a5a3a;box-shadow:inset 0 0 30px #000a;text-align:center}
.letter:before{content:"";position:absolute;inset:6px;border:1px solid #6a5a3a55;pointer-events:none}
.seal{width:62px;height:62px;margin:-52px auto 12px;transition:transform 1s,opacity 1s}
.seal.crack{animation:crack 1.2s forwards}
@keyframes crack{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(4deg)}100%{transform:translateY(40px) scale(.7) rotate(-14deg);opacity:0}}
.ln{font:15px/1.6 Philosopher,Georgia,serif;color:#e6dcc4;margin:0 0 8px;opacity:0;transition:opacity 1.2s}
.ln.on{opacity:1}
.sig{font:italic 15px Philosopher,Georgia,serif;color:#cdb27a;margin-top:12px;opacity:0;transition:opacity 1.4s}
.sig.on{opacity:1}
.sig.hand{font:italic 20px "Bradley Hand","Segoe Script","Comic Sans MS",cursive;color:#e4cf9a}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:14px;font-weight:800;font-size:14px;letter-spacing:.5px;border:1px solid var(--gold2);background:linear-gradient(145deg,#6a5420,#2e220e);color:#fff0c4;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.rd{width:100%;max-width:380px;padding:20px 18px;border-radius:16px;background:linear-gradient(160deg,#211832f2,#110b1cf2);border:1px solid #6a58a0;}
.rd h3{margin:0 0 10px;font:700 11px Philosopher,Georgia,serif;letter-spacing:3px;color:var(--gold);text-align:center;text-transform:uppercase}
.rd .rq{font:16px/1.6 Philosopher,Georgia,serif;text-align:center;color:#ece2cb;margin-bottom:12px}
.rd .rq p{margin:0 0 6px;opacity:0;transition:opacity 1.1s}
.rd .rq p.on{opacity:1}
.rd input{width:100%;padding:13px;border-radius:12px;border:1px solid #5a4a80;background:#0f0919;color:#fff;font:700 17px Philosopher,Georgia,serif;text-align:center;outline:none}
.rd input.bad{border-color:#b2505a}
.rd input.ok{border-color:#7bbf93}
.rd .hn{min-height:36px;margin-top:8px;text-align:center;font-size:12px;color:#b8a9d6;font-style:italic}
.rd .at{display:flex;justify-content:center;gap:6px;margin-top:6px}
.rd .at i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);transition:.5s}
.rd .at i.off{background:#2a2238}
.rw{width:100%;max-width:380px;padding:22px 18px;border-radius:18px;background:linear-gradient(160deg,#241a38f5,#120b1ff5);border:1px solid var(--gold2);text-align:center}
.rw h2{margin:0 0 4px;font:900 20px Philosopher,Georgia,serif;color:#f3e6bd;letter-spacing:1px}
.rw .sb{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.rwi{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;margin:8px 0;border-radius:12px;border:1px solid #4a3d64;background:#ffffff08;opacity:0;transform:translateY(10px);animation:chIn .6s forwards}
.rwi .e{width:34px;height:34px;flex:0 0 34px;color:var(--gold)}
.rwi b{display:block;font:700 13px Philosopher,Georgia,serif;color:#f0e4c2}
.rwi small{color:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);max-width:88%;z-index:60;background:#3a1620f2;border:1px solid #d9443c;color:#ffd0cc;padding:10px 14px;border-radius:13px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.mqx{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:#05030af0;overflow:auto}
.mqx.on{display:flex}
.card{width:100%;max-width:380px;padding:22px 18px;border-radius:18px;background:linear-gradient(160deg,#241a38f5,#120b1ff5);border:1px solid var(--gold2);text-align:center}
.card h2{margin:0 0 6px;font:900 20px Philosopher,Georgia,serif;color:#f3e6bd}
.card p{margin:0 0 10px;color:#c9c0d8;font:14px/1.55 Philosopher,Georgia,serif}
.card .sb{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.card .btn+.btn{margin-top:8px;background:none;border-color:#4a3d64;color:#c9c0d8}
.card .btn+.btn:after{display:none}
.ch.lock{opacity:.5;border-style:dashed;cursor:default}
.ch.lock small{display:block;font:11px Inter,system-ui,sans-serif;color:#9d92b2;margin-top:3px}
.ch.lock:hover{border-color:#5a4a80}
</style>
<script src="../shared/fast.js?v=a7"></script>
<script src="../shared/auth.js"></script>
<script>document.documentElement.setAttribute("data-nochat","1")</script>
<script src="../shared/sound.js?v=a4"></script>
<script src="../shared/qfx.js"></script>

<body>
<div id="stage"></div>
<header class="top"><div class="dots" id="dots"></div><div class="mind" id="mind"></div><button id="skip" type="button">Выйти</button></header>

<div class="mqx" id="ovGate"><div class="card" id="gate"></div></div>
<div class="mqx" id="ovReward"><div class="card" id="rw"></div></div>

<main class="dlg" id="dlg">
  <div class="who"><span class="ic" id="whoIc"></span><b id="who"></b></div>
  <div id="tx"></div>
  <div id="choices"></div>
  <div id="hint">▼ коснись, чтобы продолжить</div>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.setHeaderColor("#07050d")}catch(_){}
const qs=new URLSearchParams(location.search);
const aEnc=qs.get("a_enc")||qs.get("a")||"";
const ACTION_URL=aEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(aEnc):"";
const pEnc=qs.get("p_enc")||qs.get("p")||"";
const PROFILE_URL=pEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(pEnc):"";
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const Q=window.QFX||new Proxy({},{get:()=>()=>{}});
const sfx=(n,d)=>{try{window.snd&&window.snd(n,d)}catch(_){}try{Q.vis(n)}catch(_){}};
const mus=n=>{try{window.sndMusic&&window.sndMusic(n)}catch(_){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const BACK="../quests/index.html"+location.search+(location.search?"&":"?")+"tab=main";
function unwrap(v){for(let i=0;i<3;i++){if(v&&v.result&&typeof v.result==="object")v=v.result;else break}return v}
async function api(p){
  if(!ACTION_URL)return needStart();
  const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p),cache:"no-store"});
  if(!r.ok)throw new Error("Ошибка сервера (HTTP "+r.status+")");
  const d=unwrap(await r.json());if(!d||typeof d!=="object")throw new Error("Некорректный ответ сервера");return d;
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2800)}
function flash(c){try{Q.flash(c)}catch(_){}}

/* ---------- состояние ---------- */
const S={nick:"Путник",f:0,mark:"silence",replay:false,fl:{mind:5,tr:0,truth:0,mercy:0,pact:0,clue:0,fast:0,bit:0}};
const F=S.fl;
const gv=(m,f)=>S.f?f:m;
const nick=()=>S.nick;

/* ---------- арты сцен: ./img/<имя>.jpg + эффекты QFX ---------- */
let curBg="";
function setBg(n){if(curBg===n)return;curBg=n;Q.scene(n)}
const PORT={
 n:'<svg viewBox="0 0 24 24" fill="none" stroke="#cdb27a" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 12C6 6.5 18 6.5 21.5 12 18 17.5 6 17.5 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 d:'<svg viewBox="0 0 24 24"><path d="M5 9c0-4 3-6 7-6s7 2 7 6v6c0 4-3 6-7 6s-7-2-7-6z" fill="#3a2f52" stroke="#cdb27a" stroke-width="1.2"/><circle cx="9" cy="10" r="2.6" fill="#f5e6b0"/><circle cx="15" cy="10" r="2.6" fill="#f5e6b0"/><circle cx="9" cy="10" r="1" fill="#120c1e"/><circle cx="15" cy="10" r="1" fill="#120c1e"/><path d="M11 12.5h2l-1 2z" fill="#cdb27a"/></svg>',
 o:'<svg viewBox="0 0 24 24"><path d="M12 2c-4 0-6 3-6 8v4l-2 8h16l-2-8v-4c0-5-2-8-6-8z" fill="#2a2238" stroke="#cdb27a" stroke-width="1"/><circle cx="12" cy="10" r="3.6" fill="#d8c9a4"/><path d="M9 9.5h2M13 9.5h2" stroke="#120c1e" stroke-width="1.2"/><path d="M9 12q3 2 6 0" stroke="#7a6a50" fill="none"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M12 2c-4 0-7 4-7 10l-1 10h16l-1-10c0-6-3-10-7-10z" fill="#070510" stroke="#7d8fd6" stroke-width="1"/><ellipse cx="12" cy="10" rx="3.4" ry="4.6" fill="#c9d4ff" opacity=".75"/></svg>',
 m:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="10.5" fill="#0f1738" stroke="#8f7a4c" stroke-width="1.4"/><ellipse cx="12" cy="9" rx="3" ry="4" fill="#c9d4ff" opacity=".6"/></svg>'
};
const WHO={n:"",d:"Далия",o:"Орин, Хранитель",x:"Двойник",m:"Зеркало"};
const PCOL={n:"#cdb27a",d:"#e6b98a",o:"#d8c48e",x:"#9fb4f0",m:"#b9c6ff"};

/* ---------- сюжет ---------- */
const MK={name:"Метка Имени",mask:"Метка Маски",silence:"Метка Тишины"};
const hasMk=m=>S.mark===m;
const SC={
 mirror:{bg:"mirror",mu:"calm",step:1,beats:[
  {w:"n",t:()=>"Прошли сутки после моста. Ты не "+gv("спал","спала")+", просто лежал"+gv("","а")+" и слушал"+gv("","а")+", как дом дышит.",fx:()=>sfx("bell")},
  {w:"n",if:()=>hasMk("name"),t:()=>"Зеркало над комодом шепчет твоё имя. Но вторая буква в нём не твоя.",fx:()=>sfx("whisper")},
  {w:"n",if:()=>hasMk("mask"),t:"В зеркале на тебе чужое лицо. Через секунду оно сползает на твоё, как плохо подогнанная маска.",fx:()=>sfx("masks")},
  {w:"n",if:()=>hasMk("silence"),t:"Зеркало молчит. Это хуже, чем шёпот: впервые оно не повторяет за тобой даже звука."},
  {w:"n",t:"Отражение отстаёт на полшага. Потом поднимает руку первым. На столе лежит новый лист. На нём одно слово: «Вниз».",fx:()=>sfx("qglass")},
  {w:"d",t:"Я сижу тут десять минут. Оно мне махало. Я не помахала в ответ. Мы не знакомы.",fx:()=>sfx("raven")}],
  ch:[{t:"Коснуться стекла",nx:"stairs",pre:[{w:"n",t:"Стекло холодное, как вода в колодце. Пальцы проходят насквозь, и комната медленно уходит вверх.",fx:()=>sfx("dive")}]},
      {t:"Спросить: «Кто ты?»",nx:"stairs",set:{truth:1,mind:-1},pre:[{w:"m",t:"Тот, кто напишет письмо. Если ты согласишься.",fx:()=>sfx("whisper")},{w:"n",t:"Голос твой. Но интонации ты не узнаёшь. Так говорят, когда уже всё решили."}]},
      {t:"Накрыть зеркало плащом и уйти",nx:"stairs",pre:[{w:"n",t:"Дверь открывается в коридор. В коридоре стоит твоя комната, а в ней зеркало, накрытое плащом. Выход один."}]}]},
 stairs:{bg:"stairs",mu:"ruins",step:2,beats:[
  {w:"n",t:"Лестница вьётся вниз винтом. Каждая ступень чуть мягче, чем должна быть. Свечи плывут по воздуху сами по себе.",fx:()=>sfx("scroll")},
  {w:"d",t:"Не люблю лестницы, у которых нет верха. Лестницы без дна ещё хуже."}],
  ch:[{t:"Считать ступени",nx:"hall",set:{clue:1},pre:[{w:"n",t:"Двенадцать, тринадцать. На тринадцатой ступени в камне процарапана буква «К». Дальше счёт сбивается.",fx:()=>sfx("tap")}]},
      {t:"Держаться за перила",nx:"hall",set:{truth:1,mind:-1},pre:[{w:"n",t:"Перила тёплые. И в них стучит пульс. Лестница — это не здание. Это горло.",fx:()=>sfx("bad")}]},
      {t:"Бежать вниз, не останавливаясь",nx:"hall",set:{fast:1},pre:[{w:"n",t:"Ты бежишь, пока лестница не кончается сама. Далия падает на плечо, ругаясь на трёх языках.",fx:()=>sfx("flee")}]}]},
 hall:{bg:"archive",mu:"cemetery",step:3,beats:[
  {w:"n",t:"Зал уходит во тьму. Стеллажи упираются в потолок, которого не видно. На корешках нет названий, только лица, имена и тишины.",fx:()=>sfx("bell")},
  {w:"o",t:"Новый читатель. Давно у нас не было читателей. Обычно приходят вернуть, а не взять.",fx:()=>sfx("qpage")},
  {w:"n",t:"Старик в чернильном фартуке стоит у конторки. Свеча освещает его снизу, и тени от неё нет. Совсем."},
  {w:"o",t:()=>"Я Орин, Хранитель Архива Несказанных Имён. Ты "+gv("пришёл","пришла")+" за тем, что у тебя забрали. Это видно. Такие всегда ищут правую полку."},
  {w:"o",if:()=>F.fast,t:"Торопишься? Люди, которые спешат сюда, обычно уже опоздали."}],
  ch:[{t:"«Помогите мне. Я вам верю»",nx:"shelves",set:{tr:1},pre:[{w:"o",t:"Верить в Архиве — роскошь. Но спасибо. Возьми ключ от читального зала. Он откроет то, что закрыто для остальных.",fx:()=>sfx("open")}]},
      {t:"«Почему у вас нет тени?»",nx:"shelves",set:{truth:1},pre:[{w:"o",t:"Отдал за допуск. Не жалуюсь. Почти.",fx:()=>sfx("whisper")},{w:"d",t:"Он сказал «почти» слишком быстро."}]},
      {t:"«Верни моё имя. Сейчас»",nx:"shelves",set:{tr:-1,mercy:-1},pre:[{w:"o",t:"Требовательные живут долго. Но не дольше Архива. Ищи сам, раз такой смелый."}]}]},
 shelves:{bg:"archive",mu:"cemetery",step:3,beats:[
  {w:"n",t:"Три ряда уходят в темноту: Имена, Лица и Тишины. Каждый шепчет по-своему."},
  {w:"d",t:"Смотри, который из них тянет тебя за рукав. Знаки на мосту не забываются."}],
  ch:[{t:"Пойти вдоль Имён",nx:"ledger",pre:()=>rowPre("name")},
      {t:"Пойти вдоль Лиц",nx:"ledger",pre:()=>rowPre("mask")},
      {t:"Пойти вдоль Тишин",nx:"ledger",pre:()=>rowPre("silence")}]},
 ledger:{bg:"archive",mu:"cemetery",step:4,beats:[
  {w:"n",t:"В нижнем ящике лежит книга учёта. Последняя запись сделана свежими чернилами. Они ещё пахнут."},
  {w:"n",t:()=>"«Изъято: имя "+nick()+". Изъял: автор письма. Срок возврата: тринадцатый час этой ночи. Должник: он же».",fx:()=>sfx("paper")},
  {w:"d",t:"Должник — он же. Кто-то взял у тебя имя и сам себе его одолжил. Умно. И мерзко."},
  {w:"n",t:"За спиной раздаётся шорох. Из читального зала выходит человек, и ты узнаёшь у него свою походку.",fx:()=>sfx("hurt")}]
  ,nx:"reading"},
 reading:{bg:"reading",mu:"lake",step:4,beats:[
  {w:"x",t:()=>"Здравствуй, "+nick()+". Я тебя ждал. Если честно, это я тебя позвал."},
  {w:"n",t:()=>"Он выглядит как ты в зеркале в самую плохую ночь: бледнее, старше, с чёрными кругами у глаз и совершенно спокойным лицом."},
  {w:"x",t:"Я прошёл всё это раньше. В тот раз я проиграл. Архиву нужно, чтобы один из нас остался. Мне нужно твоё «да». Тогда останусь я, или ты, или никто. Выбор — за тобой."},
  {w:"d",t:"Он не врёт. И это самое страшное."}],

function rowPre(r){
  if(S.mark===r){F.clue=Math.min(9,F.clue+1);return[{w:"n",t:"Знак на тебе тянет руку вперёд. Ящик открывается сам, словно ждал только тебя.",fx:()=>sfx("open")}]}
  loseMind(1);return[{w:"n",t:"Чужой ряд шепчет сотнями голосов. Голоса знают твоё имя и спорят, как его произносить.",fx:()=>sfx("whisper")}];
}
const ENDS={
 name:["Возвращённое имя","Ты забрал своё имя и вышел на свет."],
 keeper:["Хранитель","Ты занял место Орина и получил ключ от Архива."],
 pact:["Договор двоих","Тайная концовка: вы поделили Книгу."],
 double:["Чужой в зеркале","Двойник занял твоё место."],

};

/* ---------- движок ---------- */
let typing=false,skipTyping=false,waitTap=null,curScene="",lastSave=0;
const TX=$("tx");
function setWho(w){document.documentElement.style.setProperty("--pc",PCOL[w]||"#cdb27a");$("who").textContent=WHO[w]||"";$("whoIc").innerHTML=PORT[w]||PORT.n;$("whoIc").style.visibility=w==="n"?"hidden":"visible";TX.className=w==="n"?"n":""}
async function typeText(text){
  typing=true;skipTyping=false;TX.classList.add("typing");TX.textContent="";
  if(reduce)skipTyping=true;
  for(let i=1;i<=text.length;i++){if(skipTyping)break;TX.textContent=text.slice(0,i);if(i%3===0)try{window.snd&&window.snd("qtick")}catch(_){}await sleep(text[i-1]==="."||text[i-1]==="?"?150:text[i-1]===","?80:22)}
  TX.textContent=text;TX.classList.remove("typing");typing=false;
}
function waitForTap(){return new Promise(res=>{$("hint").classList.add("on");waitTap=()=>{$("hint").classList.remove("on");waitTap=null;res()}})}
document.addEventListener("pointerdown",e=>{if(e.target.closest(".ch,.mqx,button"))return;if(typing){skipTyping=true;return}if(waitTap)waitTap()});
async function say(b){
  if(b.if&&!b.if())return;
  setWho(b.w);if(b.fx)try{b.fx()}catch(_){}
  const t=typeof b.t==="function"?b.t():b.t;
  await typeText(t);await waitForTap();
}
function renderMind(){const m=$("mind");m.innerHTML="<span>Рассудок</span>"+[0,1,2,3,4].map(i=>'<i class="'+(i<F.mind?"":"off")+'"></i>').join("");Q.mind(F.mind)}
function loseMind(n){F.mind=Math.max(0,F.mind-n);sfx("bad");Q.hurt();renderMind()}
function dots(n){const d=$("dots");d.replaceChildren();for(let i=1;i<=6;i++){const e=document.createElement("i");e.className="dot"+(i===n?" on":i<n?" done":"");d.appendChild(e)}}
function choose(list){
  return new Promise(res=>{
    const box=$("choices");box.replaceChildren();$("who").textContent="";$("whoIc").style.visibility="hidden";TX.textContent="";
    list.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.className="ch";b.style.animationDelay=(i*.12)+"s";
      const ok=!c.need||c.need();
      if(!ok){b.classList.add("lock");b.textContent="🔒 "+c.t;const s=document.createElement("small");s.textContent=c.lock||"Недоступно";b.appendChild(s);b.addEventListener("click",()=>sfx("deny"))}
      else{b.textContent=c.t;b.addEventListener("click",()=>{sfx("tap");box.replaceChildren();res(c)})}
      box.appendChild(b)});
  });
}
function save(id){
  if(S.replay)return;const now=Date.now();
  api({action:"mq_save",node:id,flags:F}).catch(()=>{});lastSave=now;
}
async function runScene(id){
  const sc=SC[id];curScene=id;setBg(sc.bg);if(sc.mu)mus(sc.mu);dots(sc.step);
  if(!sc.end)save(id);
  await sleep(450);
  for(const b of sc.beats){
    if(b.reward){await showReward(sc.end);return}
    await say(b);
  }
  if(sc.ch){
    const list=sc.ch.filter(c=>!c.if||c.if());
    const c=await choose(list);
    if(c.set)for(const k in c.set){if(k==="mind")loseMind(-c.set[k]);else if(k==="bit")F.bit=c.set[k];else F[k]=Math.max(-9,Math.min(9,(F[k]||0)+c.set[k]))}
    const pre=typeof c.pre==="function"?c.pre():c.pre;
    if(pre)for(const b of pre)await say(b);
    let nx=typeof c.nx==="function"?c.nx():c.nx;
    if(F.mind<=0&&!SC[nx].end&&nx!=="collapse")nx="collapse";
    return runScene(nx);
  }
  if(sc.nx)return runScene(sc.nx);
}

/* награда */
const GL={
 gold:'<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9 9.5h4.5a1.8 1.8 0 0 1 0 3.5H9"/></svg>',
 art:'<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z"/><path d="M12 8v6M9 11h6"/></svg>',
 thr:'<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 18c0-6 6-3 6-8S6 6 9 4M12 14c5 0 8 2 8 5M12 14c0-2 3-3 5-1"/></svg>',
 pt:'<svg class="e" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>'
};
async function showReward(end){
  $("who").textContent="";$("whoIc").style.visibility="hidden";TX.textContent="";
  const box=$("rw");
  box.innerHTML='<div class="sb">Этап II завершён</div><h2></h2><p></p><div id="rl"></div><button class="btn" id="rg" type="button">В журнал заданий</button>';
  const ov=$("ovReward");ov.classList.add("on");
  const go=$("rg");
  let e=ENDS[end];
  const paint=()=>{box.querySelector("h2").textContent=e[0];box.querySelector("p").textContent=e[1]};paint();
  async function claim(){
    go.disabled=true;go.textContent="Получаем награду…";
    let d=null,err="";
    if(!S.replay){
      try{await api({action:"mq_save",node:"end",flags:F});d=await api({action:"mq_done",ending:end})}catch(x){err=x.message==="need_start"?"Открой игру через бота командой /start":(x.message||"Нет связи")}
    }
    const real=d&&d.ending?d.ending:end;e=ENDS[real]||ENDS[end];paint();
    const list=$("rl");list.replaceChildren();let i=0;
    const add=(g,t,s2)=>{const r=document.createElement("div");r.className="rwi";r.style.animationDelay=(.4+i++*.35)+"s";r.innerHTML=GL[g]+"<div><b></b><small></small></div>";r.querySelector("b").textContent=t;r.querySelector("small").textContent=s2;list.appendChild(r)};
    go.disabled=false;
    if(S.replay)add("art","Повторный просмотр","Награда за этот этап уже получена");
    else if(!d||!d.ok){
      add("art","Награда ещё не получена",err||"Нет связи с сервером");
      go.textContent="Повторить";go.onclick=()=>{sfx("tap");claim()};return;
    }
    else if(d.already)add("art","Награда получена ранее",ENDS[d.ending]?ENDS[d.ending][0]:"");
    else{
      add("gold","+"+d.gold+" фунтов","Лежат в кошельке");
      if(d.pts)add("pt","+"+d.pts+" очк.","Очки характеристик");
      if(d.art)add("art",d.art.name,"Реликвия Серого Тумана · "+d.art.bonus);
      if(d.thread)add("thr","Нить судьбы","Редкий ингредиент");
    }
    if(real!==end&&!S.replay)toast("Тайная концовка не открылась: нужен договор, правда и милосердие");
    sfx("win");sfx("qchime",.4);
    go.textContent="В журнал заданий";go.onclick=()=>{sfx("open");location.replace(BACK)};
  }
  await claim();
}

/* ворота: заблокировано / продолжить */
function gate(html,btns){
  const g=$("gate");g.innerHTML=html;
  btns.forEach(([t,fn])=>{const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=t;b.onclick=()=>{sfx("tap");fn()};g.appendChild(b)});
  $("ovGate").classList.add("on");
}
$("skip").addEventListener("click",()=>{location.href=BACK});

function resetFl(){Object.assign(F,{mind:5,tr:0,truth:0,mercy:0,pact:0,clue:0,fast:0,bit:0})}
(async function boot(){
  Q.init($("stage"),{base:"./img/",ver:2});
  renderMind();dots(1);setBg("mirror");Q.preload(["stairs","archive","reading","heart","dawn","ash"]);
  let st=null;
  try{
    if(PROFILE_URL){
      const r=await fetch(PROFILE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}",cache:"no-store"});
      const p=unwrap(await r.json());
      if(p&&p.nickname&&p.nickname!=="Без имени")S.nick=p.nickname;
      if(p&&p.gender==="female")S.f=1;
    }
  }catch(_){}
  try{st=await api({action:"mq_state"})}catch(e){if(e&&e.message==="need_start")return;st=null}
  if(!st){gate('<h2>Нет связи</h2><p>Не удалось загрузить состояние квеста.</p>',[["Повторить",()=>location.reload()],["Назад",()=>location.href=BACK]]);return}
  if(st.mark&&MK[st.mark])S.mark=st.mark;
  if(!st.open&&!st.done){
    const lines=[];
    if(!st.s1)lines.push("• Пройди этап I: «Приглашение» (в настройках: «Пройти вступление ещё раз»).");
    if(st.lvl<st.need)lines.push("• Достигни уровня "+st.need+" (сейчас "+st.lvl+").");
    gate('<div class="sb">Этап II закрыт</div><h2>Архив Несказанных Имён</h2><p>'+lines.join("<br>")+'</p>',[["К заданиям",()=>location.href=BACK]]);return;
  }
  if(st.done){S.replay=true;toast("Повторный просмотр: награда уже получена")}
  else if(st.node&&st.node!=="end"&&SC[st.node]&&st.flags&&Object.keys(st.flags).length){
    Object.assign(F,st.flags);renderMind();
    gate('<div class="sb">Этап II</div><h2>Архив Несказанных Имён</h2><p>У тебя есть сохранённый прогресс.</p>',[["Продолжить",()=>{$("ovGate").classList.remove("on");runScene(st.node)}],["Начать сначала",()=>{resetFl();renderMind();$("ovGate").classList.remove("on");runScene("mirror")}]]);return;
  }
  mus("calm");runScene("mirror");
})();
