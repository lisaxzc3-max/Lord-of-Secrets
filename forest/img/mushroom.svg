<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#2d5a2a"/><stop offset="1" stop-color="#06100b"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}
.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.35}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<rect width="200" height="200" fill="url(#bg)"/>
<ellipse cx="100" cy="186" rx="70" ry="9" fill="#000" opacity=".55"/><circle class="rise" cx="33" cy="170" r="1.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:0.0s"/><circle class="rise" cx="70" cy="159" r="2.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:3.1s"/><circle class="rise" cx="107" cy="148" r="3.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:2.2s"/><circle class="rise" cx="144" cy="137" r="1.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:1.3s"/><circle class="rise" cx="21" cy="166" r="2.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:0.4s"/><circle class="rise" cx="58" cy="155" r="3.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:3.5s"/><circle class="rise" cx="95" cy="144" r="1.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:2.6s"/><circle class="rise" cx="132" cy="133" r="2.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:1.7s"/><circle class="rise" cx="169" cy="162" r="3.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:0.8s"/><circle class="rise" cx="46" cy="151" r="1.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:3.9s"/><circle class="rise" cx="83" cy="140" r="2.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:3.0s"/><circle class="rise" cx="120" cy="169" r="3.5" fill="#b6ff9a" filter="url(#glow)" style="animation-delay:2.1s"/>
<g class="bob">
<path d="M78 120 Q74 170 66 184 L134 184 Q126 170 122 120Z" fill="#d9cfa8"/>
<path d="M78 120 Q100 130 122 120 L122 128 Q100 138 78 128Z" fill="#9a8f6a"/>
<path d="M22 112 Q26 40 100 36 Q174 40 178 112 Q100 134 22 112Z" fill="#8c2a2e"/>
<path d="M22 112 Q100 134 178 112 Q176 120 100 142 Q24 120 22 112Z" fill="#e8dcc0"/>
<g fill="#f2e6c8" opacity=".92"><circle cx="58" cy="76" r="9"/><circle cx="100" cy="58" r="11"/><circle cx="142" cy="80" r="8"/><circle cx="82" cy="96" r="6"/><circle cx="124" cy="100" r="7"/><circle cx="40" cy="100" r="5"/></g>
<g class="blink" filter="url(#glow)"><path d="M86 150 l14 6 -14 2z" fill="#9aff7a"/><path d="M114 150 l-14 6 14 2z" fill="#9aff7a"/></g>
<path d="M90 168 Q100 162 110 168" stroke="#4a3a28" stroke-width="3" fill="none"/>
</g>
<rect width="200" height="200" fill="none" stroke="#000" stroke-opacity=".0"/>
</svg>