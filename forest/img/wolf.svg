 L130 56 L142 90 Z" fill="url(#ht)" opacity="1" /><ellipse cx="98" cy="112" rx="13" ry="10" fill="#050306"/><g class="eye" filter="url(#gl)"><circle cx="98" cy="113" r="4" fill="#d4343f"/><circle cx="98" cy="113" r="1.5" fill="#fff" opacity=".85"/></g><path d="M160 142 l4 12 l5 -12 M138 152 l3 11 l5 -11 M172 138 l3 11" fill="#0a070b" stroke="#0a070b" stroke-width="2.4" stroke-linejoin="round" /><path d="M70 164 Q80 190 100 196 M90 168 Q96 190 112 196 M110 166 Q114 188 128 194" stroke="#cdbf9f" stroke-opacity=".55" stroke-width="2" fill="none"/></g><g class="dr"><ellipse cx="90" cy="182" rx="130" ry="19.0" fill="#9a92a6" opacity="0.315" filter="url(#bl)"/><ellipse cx="150" cy="189.6" rx="90" ry="15.833333333333334" fill="#b0a8bb" opacity="0.27" filter="url(#bl)"/></g><rect width="200" height="200" fill="url(#vg)"/><rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#8a7a58" stroke-opacity=".45" stroke-width="1"/></svg>
