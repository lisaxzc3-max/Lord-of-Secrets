 Q184 96 188 124 Q184 142 160 144 Q146 130 150 100 Z" fill="#0a070b" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><path d="M150 100 Q184 96 188 124 Q184 142 160 144 Q146 130 150 100 Z" fill="url(#hd)" opacity="1" /><path d="M170 138 Q186 140 190 118 Q178 126 170 138 Z" fill="#cdbf9f" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><path d="M170 138 Q186 140 190 118 Q178 126 170 138 Z" fill="url(#ht)" opacity="1" /><path d="M160 142 Q172 152 182 146 Q172 142 164 134 Z" fill="#cdbf9f" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><path d="M160 142 Q172 152 182 146 Q172 142 164 134 Z" fill="url(#ht)" opacity="1" /><path d="M146 98 L158 78 L162 100 Z" fill="#0a070b" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><ellipse cx="166" cy="112" rx="4" ry="3.5" fill="#050306"/><g class="eye" filter="url(#gl)"><circle cx="166" cy="112" r="3" fill="#d4343f"/><circle cx="166" cy="112" r="1.1" fill="#fff" opacity=".85"/></g></g><g class="dr"><ellipse cx="90" cy="182" rx="130" ry="19.0" fill="#9a92a6" opacity="0.315" filter="url(#bl)"/><ellipse cx="150" cy="189.6" rx="90" ry="15.833333333333334" fill="#b0a8bb" opacity="0.27" filter="url(#bl)"/></g><rect width="200" height="200" fill="url(#vg)"/><rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#8a7a58" stroke-opacity=".45" stroke-width="1"/></svg>
