<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#2a3a22"/><stop offset="1" stop-color="#050a06"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:fl 3s ease-in-out infinite}
.fl2{animation:fl 4.4s ease-in-out -1.5s infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise 4s linear infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{50%{opacity:.35}}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<rect width="200" height="200" fill="url(#bg)"/>
<ellipse cx="100" cy="186" rx="70" ry="9" fill="#000" opacity=".55"/>
<g class="sway">
<path d="M64 186 Q70 140 76 100 Q70 60 82 30 L120 30 Q132 60 124 100 Q130 140 138 186Z" fill="#2b1e14"/>
<path d="M88 40 Q86 100 92 186 M108 40 Q112 100 106 186" stroke="#1a110b" stroke-width="3" fill="none"/>
<path d="M82 60 Q40 50 22 20 M80 80 Q36 84 14 62 M120 56 Q160 46 182 18 M124 78 Q168 80 188 58 M100 30 Q96 10 110 2" stroke="#2b1e14" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M22 20 l-8 -6 M14 62 l-8 4 M182 18 l8 -6 M188 58 l8 4" stroke="#2b1e14" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="90" cy="92" rx="9" ry="12" fill="#07040a"/><ellipse cx="114" cy="92" rx="9" ry="12" fill="#07040a"/>
<g class="pulse" filter="url(#glow)"><ellipse cx="90" cy="94" rx="4" ry="6" fill="#ff9a3a"/><ellipse cx="114" cy="94" rx="4" ry="6" fill="#ff9a3a"/></g>
<path d="M88 124 Q102 140 118 124 Q102 132 88 124Z" fill="#07040a"/>
<path d="M60 186 Q40 176 24 184 M142 186 Q164 176 180 184" stroke="#2b1e14" stroke-width="6" fill="none" stroke-linecap="round"/>
</g><circle class="rise" cx="59" cy="170" r="1.5" fill="#8fff9a" filter="url(#glow)" style="animation-delay:0.0s"/><circle class="rise" cx="96" cy="159" r="2.5" fill="#8fff9a" filter="url(#glow)" style="animation-delay:3.1s"/><circle class="rise" cx="133" cy="148" r="3.5" fill="#8fff9a" filter="url(#glow)" style="animation-delay:2.2s"/><circle class="rise" cx="170" cy="137" r="1.5" fill="#8fff9a" filter="url(#glow)" style="animation-delay:1.3s"/><circle class="rise" cx="47" cy="166" r="2.5" fill="#8fff9a" filter="url(#glow)" style="animation-delay:0.4s"/><circle class="rise" cx="84" cy="155" r="3.5" fill="#8fff9a" filter="url(#glow)" style="animation-delay:3.5s"/>
<rect width="200" height="200" fill="none" stroke="#000" stroke-opacity=".0"/>
</svg>