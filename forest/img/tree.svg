d"/><path d="M80 110 Q60 100 40 108 M126 100 Q150 92 166 104 M96 70 Q80 50 78 24 M110 66 Q124 44 130 20" stroke="#8a7a58" stroke-width="1.2" fill="none"/><path d="M88 100 Q88 84 102 84 Q116 84 116 100 Q116 128 102 134 Q88 128 88 100 Z" fill="#050306" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><g class="eye" filter="url(#gl)"><circle cx="97" cy="102" r="3" fill="#e07a2a"/><circle cx="97" cy="102" r="1.1" fill="#fff" opacity=".85"/></g><g class="eye2" filter="url(#gl)"><circle cx="108" cy="102" r="3" fill="#e07a2a"/><circle cx="108" cy="102" r="1.1" fill="#fff" opacity=".85"/></g><path d="M94 118 q8 5 16 0" stroke="#e07a2a" stroke-opacity=".6" fill="none" stroke-width="1.6"/></g><g class="dr"><ellipse cx="90" cy="182" rx="130" ry="19.0" fill="#9a92a6" opacity="0.315" filter="url(#bl)"/><ellipse cx="150" cy="189.6" rx="90" ry="15.833333333333334" fill="#b0a8bb" opacity="0.27" filter="url(#bl)"/></g><rect width="200" height="200" fill="url(#vg)"/><rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#8a7a58" stroke-opacity=".45" stroke-width="1"/></svg>
