<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#03101a">
<title>Лес · Сражение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../../shared/battle/page.css?v=p1">
<script src="../../shared/fast.js?v=a2"></script>
<script src="../../shared/skills.js"></script>
<script src="../../shared/auth.js"></script>
<script src="../../shared/sound.js?v=a3"></script>
<script src="../../shared/battle/bscene.js?v=b3"></script>
</head>
<body>
<div id="app"></div>
<script>
/* Настройки локации. Весь остальной код боя общий: shared/battle/page.js */
window.BATTLE_CFG={
 title:"Лес",
 back:"← Лес",
 backDefeat:"← В лес",
 bg:"loc_forest.jpg",
 bgPos:"50% 100%",
 mist:"#b6e0a826",
 p2glow:"#c48cffcc",
 shield:"#8fe0a0cc",
 explore:"explore_forest",
 enemyDefault:"Гриб-спорник",
 mobDefault:"mushroom",
 intro:"Из чащи выходит противник.",
 win:"Чаща затихает. На земле остаётся награда.",
 note:"Лес не прощает тех, кто торопится.",
 back_hint:"Вернись в лес",
 enter:n=>"Из чащи выходит противник: "+n+".",
 boss:{msg:"Меж стволов мелькает рыжий хвост. Кицунэ не нападает сразу: она играет с добычей.",icon:"🦊",color:"#ff8a3c",banner:n=>"БОСС: ЛИСА"},
 chips:{sleep:["hero","💤 Сон"],web:["hero","🕸 Паутина ×{n}"],weak:["hero","🔻 Слабость ×{n}"],poison:["hero","☠ Яд ×{n}"],stack:["hero","🕷 Яд паука ×{n}"],shield:["foe","🛡 Щит"]},
 sleepIcon:"💤",
 mob:{"Гриб-спорник":"mushroom","Паук-ткач":"spider","Проклятое дерево":"tree","Шипастый кабан":"boar","Костяной волк":"wolf","Лиса-оборотень":"kitsune"},
 p2:{kitsune:"kitsune2"},
 shown:{"Лиса-оборотень":"Кицунэ"},
 role:{"Гриб-спорник":"Споровик","Паук-ткач":"Ткач","Проклятое дерево":"Древний страж","Шипастый кабан":"Дикий зверь","Костяной волк":"Нежить","Лиса-оборотень":"Босс"},
 mobsnd:{"Гриб-спорник":"frpuff","Паук-ткач":"frskitter","Проклятое дерево":"frgroan","Шипастый кабан":"frsnort","Костяной волк":"frwolf","Лиса-оборотень":"frfox"},
 skipRx:/спит|усып|оглуш|пропуска|не может действ|оцепен|скован|обездвиж|в ловушке/i,
 castRx:/Усыпляющие споры|Связывание паутиной|Щит из веток|Передышка|Вой|Иллюзии|Обман:|Кабан роет|Бегает по кругу|Регенерация|Костяная броня|Соблазнение|Кицунэ|🕷 Яд|Дерево тяжело/,
 castColor:txt=>/Усып|Ядов/.test(txt)?"#a6f0a8":/Кицунэ|Соблаз|Иллюзи|Обман/.test(txt)?"#c48cff":/Щит|Регенер|Передыш/.test(txt)?"#8fe0a0":/Вой/.test(txt)?"#9fb8ff":"#e2c27a",
 bossFx:function(text,X){const {st,B,banner,snd,$,P2}=X;
  if(!text)return{heavy:0};
  let heavy=0;
  const E=$("enemyFrame");
  if(/КИЦУНЭ/.test(text)){B.flash("#c48cff");banner("КИЦУНЭ","#c48cff");B.shake(2);X.phase2()}
  if(/Усыпляющие споры|Ядовитые споры/.test(text))B.aura("foe","#a6f0a8",900);
  if(/Ты уснул/.test(text)){st.sleep=1;banner("СОН","#7aa8ff")}
  if(/зачарован/.test(text)){st.sleep=1;banner("СОБЛАЗНЕНИЕ","#ff7ad0")}
  if(/Связывание паутиной/.test(text)){st.web=2;banner("ПАУТИНА","#cfd8c8")}
  if(/🕷 Яд/.test(text)){const m=text.match(/×(\d+)/);if(m)st.stack=Number(m[1])}
  else{const m2=text.match(/☠×(\d+)/);if(m2)st.stack=Number(m2[1])}
  if(/яд \d×\d|☠-\d/.test(text)){st.poison=3;B.aura("hero","#6dff7a",800)}
  if(/кровотечение/.test(text)){st.poison=2;B.aura("hero","#ff3a3a",800)}
  if(/Щит из веток/.test(text)){st.shield=1;B.aura("foe","#8fe0a0",900)}
  if(/Вой/.test(text)){banner("ВОЙ","#9fb8ff");B.shake(1);st.weak=2}
  if(/урон −25%/.test(text))st.weak=2;
  E.classList.toggle("ghosting",/Иллюзии|копии лисы/.test(text));
  E.classList.toggle("feign",/Обман: лиса падает/.test(text));
  if(/Обман: лиса падает/.test(text))banner("ОБМАН","#ff8a3c");
  if(/обман! ответный/.test(text)){B.flash("#ff5d5d");B.shake(2);banner("ЛОВУШКА!","#ff5d5d")}
  if(/Таран/.test(text)){heavy=2}
  if(/Бегает по кругу/.test(text))E.classList.add("dizzy");else E.classList.remove("dizzy");
  if(/увернулся/.test(text))B.floatNum("foe","Мимо","miss");
  if(/иллюзию/.test(text))B.floatNum("foe","Иллюзия","miss");
  if(/Регенерация/.test(text)||/💚\+/.test(text))B.aura("foe","#7be3a0",900);
  if(/усиления сбиты/.test(text))banner("УСИЛЕНИЯ СБИТЫ","#9fb8ff");
  if(!/Щит из веток/.test(text)&&st.shield>0&&/Проклятое дерево/.test(X.enemy())&&/Удар/.test(text))st.shield=0;
  return{heavy};
 }
};
</script>
<script src="../../shared/tutfight.js?v=3"></script>
<script src="../../shared/battle/page.js?v=p4"></script>
<script src="../../shared/enemyinfo.js"></script>
<script src="../../shared/icons.js?v=i1"></script>
</body>
</html>
