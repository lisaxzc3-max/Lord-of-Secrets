<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06100b">
<title>Лес · Событие</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--line:#34503f;--text:#e4ecdf;--muted:#a9bca7;--gold:#d8c08a;--moss:#8fc99a}
*{box-sizing:border-box}
html{min-height:100%;background:#070b08}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font:15px Inter,system-ui,Arial,sans-serif;overflow-x:hidden;background:#070b08}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}
.vn{position:relative;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#0a0f0b}
.art{position:absolute;left:0;right:0;top:0;height:74vh;height:74dvh;max-height:920px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1c3326,#080d09 75%)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art .symbol{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;opacity:.8}
.art:before{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;z-index:3;background:linear-gradient(transparent,#0a0f0b);pointer-events:none}
.art.fx:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;animation:flash 1.1s ease-out forwards}
.art.fx-heal:after{background:radial-gradient(circle,#7be3a066,transparent 70%)}
.art.fx-hurt:after{background:radial-gradient(circle,transparent 35%,#b2262f99)}
.art.fx-mad:after{background:radial-gradient(circle,#9a5fff66,transparent 70%)}
.art.fx-poison:after{background:radial-gradient(circle,#6dff7a55,transparent 70%)}
.art.fx-rune:after{background:radial-gradient(circle,#d8c08a77,transparent 70%)}
.art.fx-calm:after{background:radial-gradient(circle,#ffffff14,transparent 70%)}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.back{position:absolute;z-index:6;top:calc(10px + env(safe-area-inset-top));left:10px;color:var(--text);text-decoration:none;border:1px solid #ffffff22;border-radius:10px;padding:8px 11px;background:#0a0f0bb0;font-size:12px}
.panel{position:relative;z-index:4;padding:90px 14px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0a0f0bd9 34%,#0a0f0bf2)}
.tag{display:inline-block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);border:1px solid #d8c08a55;background:#0d140fe0;border-radius:8px;padding:5px 10px;margin:0 0 -1px 4px;position:relative;z-index:2}
.box{position:relative;border:1px solid #3a5545;border-radius:14px;background:#0c130ee8;padding:15px 15px 18px;min-height:108px;cursor:pointer;box-shadow:0 10px 28px #0007}
.text{font-size:15px;line-height:1.72;color:#e2ebdd;white-space:pre-wrap;overflow-wrap:anywhere}
.text .ghost{opacity:0}
.tap{position:absolute;right:13px;bottom:8px;color:var(--gold);font-size:14px;animation:tap 1.2s ease-in-out infinite}
@keyframes tap{50%{transform:translateY(3px);opacity:.5}}
.actions{display:grid;gap:8px;margin-top:12px}
.action{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:13px 13px;border:1px solid #46614f;border-left:3px solid var(--gold);border-radius:11px;color:var(--text);background:#101a13ee;cursor:pointer;transition:transform .12s,background .2s;animation:rise .45s backwards}
.action:active:not(:disabled){transform:scale(.985);background:#17261c}
.action:disabled{opacity:.5}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.arrow{margin-left:auto;margin-right:30px;color:var(--gold);font-size:21px}
.aName{font-size:13.5px;font-weight:700;line-height:1.4}
.rgrid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.rchip{font-weight:850;font-size:14px;padding:7px 11px;border-radius:10px;border:1px solid #4a4147;background:#161b17e8;animation:pop .5s backwards}
.rchip.up{color:#8ff0aa;border-color:#3f7a52}.rchip.down{color:#ff8a92;border-color:#7a3b42}.rchip.mad{color:#c9a8ff;border-color:#62487f}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.btn{display:block;width:100%;border:1px solid #46614f;border-radius:11px;padding:13px 10px;background:#121d16ee;color:var(--text);font-weight:800;font-size:13px;cursor:pointer;margin-top:9px;animation:rise .45s backwards}
.btn.primary{color:#0d1a11;background:linear-gradient(135deg,#b4e3bb,#6bb07b);border-color:#8fd29a}
.hidden{display:none!important}
.err{margin:0 0 10px;padding:13px;border:1px solid #783b42;border-radius:12px;background:#2a1215ee;color:#f0b3b3;font-size:12.5px;line-height:1.6}
.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}}
@media(prefers-reduced-motion:reduce){.art.fx:after{display:none}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<script src="../../shared/fast.js?v=a2"></script>
<script src="../../shared/auth.js"></script>
<script src="../../shared/sound.js?v=a3"></script>
<script>sndMusic("forest")</script>
</head>
<body>
<div class="vn" id="vn">
 <div class="art" id="art"><div class="symbol" id="symbol">🌲</div><img id="evImg" class="hidden" alt=""></div>
 <a class="back" id="backForest" href="../index.html">← Лес</a>
 <div class="panel">
  <div class="err hidden" id="errCard" role="alert"><div id="errText"></div><button class="btn" id="errBack" type="button">← В лес</button></div>
  <div class="tag" id="evTitle">Лес</div>
  <div class="box" id="box"><div class="text" id="evText">Загрузка…</div><span class="tap hidden" id="tap">▾</span></div>
  <div class="rgrid" id="rgrid"></div>
  <div class="actions" id="actions"></div>
  <div class="hidden" id="endBtns">
   <button class="btn primary" id="again" type="button">🔍 Исследовать дальше</button>
   <button class="btn" id="toForest" type="button">← В лес</button>
  </div>
 </div>
</div>
<script src="../../shared/forestart.js?v=2"></script>
<script>
"use strict";
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.setHeaderColor("#0a0f0b")}catch(_){}
const qs=new URLSearchParams(location.search);
const uid=String(qs.get("u")||tg?.initDataUnsafe?.user?.id||"0");
const aEnc=qs.get("a_enc")||qs.get("a")||"";
/* вход только по личным ссылкам бота */
let ACTION_URL=aEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(aEnc):"";
const $=id=>document.getElementById(id);
let busy=false,done=false,ev=null,evKey="";
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* Картинки событий лежат в forest/img. Чтобы заменить, поменяй путь. */
const META={
whisper:{t:"Шёпот между деревьями",s:"👁️"},
ring:{t:"Ведьмино кольцо",s:"🍄"},
hut:{t:"Хижина лесной ведьмы",s:"🛖"},
tracks:{t:"Рыжий след",s:"🐾"},
altar:{t:"Алтарь без имени",s:"🗿"},
loop:{t:"Тропа без возврата",s:"🧭"},
hunter:{t:"Мёртвый охотник",s:"💀"}
};
const IMG={};["whisper","ring","hut","tracks","altar","loop","hunter"].forEach(k=>IMG[k]="../img/"+k+".jpg?v=1");
const ICON={f_whisper_listen:"👂",f_whisper_plug:"🙉",f_whisper_answer:"🗣",f_ring_enter:"🍄",f_ring_skip:"↩",f_hut_potion:"🧪",f_hut_fortune:"🔮",f_hut_leave:"↩",f_tracks_study:"🔍",f_tracks_erase:"🧹",f_altar_money:"💷",f_altar_blood:"🩸",f_altar_leave:"↩",f_loop_exit:"🧭",f_loop_straight:"➡",f_loop_mark:"🪓",f_hunter_diary:"📖",f_hunter_bag:"🎒",f_hunter_pray:"🙏"};

function unwrap(v){for(let i=0;i<3;i++){if(v&&v.result&&typeof v.result==="object")v=v.result;else break}return v}
async function ensure(){
 if(ACTION_URL)return;
 const r=await needStart({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid}),cache:"no-store"});
 if(!r.ok)throw new Error("Не удалось подключиться к игре (HTTP "+r.status+").");
 const d=unwrap(await r.json());const a=d?.action_url||d?.ACTION_URL;
 if(typeof a!=="string"||!a)throw new Error("Сервер не вернул адрес действий.");
 ACTION_URL=new URL(a).href;
}
async function api(payload){
 await ensure();
 const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
 if(!r.ok)throw new Error("Ошибка игрового сервера (HTTP "+r.status+").");
 const d=unwrap(await r.json());
 if(!d||typeof d!=="object")throw new Error("Сервер вернул некорректный ответ.");
 return d;
}
function forestUrl(){const p=new URLSearchParams(location.search);p.delete("event_data");p.delete("enemy");const q=p.toString();return "../index.html"+(q?"?"+q:"")}
function goForest(){location.href=forestUrl()}
$("backForest").href=forestUrl();
function showErr(t){$("errText").textContent=t;$("errCard").classList.remove("hidden")}


/* ---- визуальная новелла: текст печатается поверх арта ---- */
let typer=null,typeDone=null;
function typeText(txt,after){
 const el=$("evText");clearInterval(typer);typeDone=null;
 $("tap").classList.add("hidden");
 txt=String(txt||"");
 const fin=()=>{clearInterval(typer);typer=null;el.textContent=txt;$("tap").classList.add("hidden");typeDone=null;if(after)after()};
 if(reduce||!txt){fin();return}
 /* невидимый хвост держит высоту блока, текст не прыгает */
 const a=document.createElement("span"),b=document.createElement("span");b.className="ghost";
 el.replaceChildren(a,b);let i=0;const step=Math.max(1,Math.ceil(txt.length/110));
 a.textContent="";b.textContent=txt;
 typer=setInterval(()=>{i=Math.min(txt.length,i+step);a.textContent=txt.slice(0,i);b.textContent=txt.slice(i);if(i>=txt.length)fin()},26);
 typeDone=fin;$("tap").classList.remove("hidden");
}
$("box").addEventListener("click",()=>{if(typeDone)typeDone()});
function showActions(on){const b=$("actions");b.classList.toggle("hidden",!on)}
function setImage(k){
 const src=IMG[k];const img=$("evImg");
 if(!src){img.classList.add("hidden");return}
 img.onload=()=>{img.classList.remove("hidden");$("symbol").classList.add("hidden");try{ForestArt.attach(img)}catch(_){}};
 img.onerror=()=>img.classList.add("hidden");
 img.src=src;
}
const EVSND={whisper:["whisper",5500,"whisper"],ring:["frshimmer",7000,"frshimmer"],hut:["frcauldron",6500,"frcauldron"],tracks:["frsnap",6000,"frsnap"],altar:["fraltar",9000,"fraltar"],loop:["frloop",7000,"frloop"],hunter:["frcaw",7500,"frcaw"]};
let ambT=0;
function startAmbient(k){
 clearInterval(ambT);const e=EVSND[k];if(!e)return;
 try{snd(e[2])}catch(_){}
 ambT=setInterval(()=>{if(document.hidden)return;try{snd(e[0])}catch(_){}},e[1]);
}
function renderEvent(d){
 ev=d;evKey=String(d.event||d.image||"");
 const m=META[evKey]||{t:"Событие в лесу",s:"🌲"};
 $("evTitle").textContent=m.t;
 $("symbol").textContent=m.s;
 setImage(evKey);startAmbient(evKey);
 const box=$("actions");box.replaceChildren();
 const acts=Array.isArray(d.actions)?d.actions:[];
 const build=()=>{
  if(!acts.length){const b=document.createElement("button");b.className="btn primary";b.textContent="← В лес";b.onclick=goForest;box.appendChild(b);return}
  acts.forEach((a,i)=>{
   const b=document.createElement("button");b.type="button";b.className="action";b.style.animationDelay=(i*.08)+"s";
   const ic=document.createElement("span");ic.style.fontSize="20px";ic.textContent=ICON[a.id]||"•";
   const nm=document.createElement("span");nm.className="aName";nm.textContent=String(a.label||a.id).replace(/^\S+\s/,"")||a.label;
   const ar=document.createElement("span");ar.className="arrow";ar.textContent="›";
   b.append(ic,nm,ar);b.addEventListener("click",()=>choose(a.id));box.appendChild(b);
  });
  setTimeout(()=>box.lastElementChild?.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}),60);
 };
 typeText(d.text||"Ты замечаешь движение между деревьями.",build);
}
function setBtns(dis){document.querySelectorAll("#actions button").forEach(b=>b.disabled=dis)}
async function choose(id){
 if(busy||done)return;busy=true;setBtns(true);
 try{
  const r=await api({action:"event_choice",move:id});
  if(r.ok===false||r.error){
   const t=String(r.error||r.text||"Сервер не принял выбор.");
   showErr(t==="unknown_event_move"?"Это событие уже закончилось.":t);setBtns(false);return;
  }
  done=true;showResult(r);
 }catch(e){showErr(e.message||"Ошибка связи.");setBtns(false)}
 finally{busy=false}
}
function showResult(r){
 clearInterval(ambT);
 const fx=r.fx||"calm";
 snd(fx==="hurt"||fx==="poison"?"bad":fx==="heal"?"heal":fx==="mad"?"whisper":"good");
 const st=$("art");st.classList.remove("fx","fx-heal","fx-hurt","fx-mad","fx-poison","fx-rune","fx-calm");void st.offsetWidth;st.classList.add("fx","fx-"+fx);
 if(fx==="hurt"||fx==="poison"){$("vn").classList.add("shake");setTimeout(()=>$("vn").classList.remove("shake"),520)}
 try{tg?.HapticFeedback?.notificationOccurred(fx==="hurt"||fx==="poison"?"error":"success")}catch(_){}
 $("actions").replaceChildren();$("errCard").classList.add("hidden");
 $("evTitle").textContent="Последствия";
 const g=$("rgrid");g.replaceChildren();
 const chip=(txt,cls,i)=>{const c=document.createElement("span");c.className="rchip "+cls;c.textContent=txt;c.style.animationDelay=(i*.12)+"s";g.appendChild(c)};
 const finish=()=>{
  let i=0;
  if(r.d_hp)chip((r.d_hp>0?"+":"")+r.d_hp+" ❤️",r.d_hp>0?"up":"down",i++);
  if(r.d_pounds)chip((r.d_pounds>0?"+":"")+r.d_pounds+" £",r.d_pounds>0?"up":"down",i++);
  if(r.d_mad)chip((r.d_mad>0?"+":"")+r.d_mad+" 🌀",r.d_mad>0?"mad":"up",i++);
  if(typeof r.tracks==="number"&&r.tracks>0&&/f_tracks_study|f_hunter_diary/.test(r.event||""))chip("🐾 "+r.tracks+"/3",r.tracks>=3?"up":"mad",i++);
  $("endBtns").classList.remove("hidden");
  setTimeout(()=>$("endBtns").scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}),80);
 };
 typeText(r.text||"Твой выбор изменил ход событий.",finish);
}
$("toForest").addEventListener("click",goForest);
$("errBack").addEventListener("click",goForest);
$("again").addEventListener("click",async()=>{
 if(busy)return;busy=true;
 try{
  const d=await api({action:"explore_forest"});
  if(d.error==="cooldown"){showErr("Подожди ещё "+(d.left||3)+" сек.");return}
  if(d.ok===false||d.error){showErr(String(d.text||d.error));return}
  const p=new URLSearchParams(location.search);
  if(d.type==="event"){p.set("event_data",JSON.stringify(d));location.href="./index.html?"+p.toString();return}
  p.delete("event_data");if(d.enemy)p.set("enemy",d.enemy);
  location.href="../battle/index.html?"+p.toString();
 }catch(e){showErr(e.message||"Ошибка связи.")}finally{busy=false}
});
(function init(){
 const raw=qs.get("event_data");
 const toForestBtn=()=>{const b=document.createElement("button");b.className="btn primary";b.textContent="← В лес";b.onclick=goForest;$("actions").appendChild(b)};
 if(!raw){$("evTitle").textContent="Событие не найдено";$("evText").textContent="Вернись в лес и нажми «Исследовать лес».";toForestBtn();return}
 try{const d=unwrap(JSON.parse(raw));if(!d||typeof d!=="object")throw 0;renderEvent(d)}
 catch(_){$("evTitle").textContent="Не удалось прочитать событие";$("evText").textContent="Данные повреждены. Вернись в лес и начни заново.";toForestBtn()}
})();
</script>
<script src="../../shared/icons.js?v=i1"></script>
</body>
</html>
