<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Туман над Тингеном</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--sat:0px;--sar:0px;--sab:0px;--sal:0px;--gold:#e8b25a;--ink:#0b0809}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#f1e3c8}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#loc{position:fixed;left:calc(12px + var(--sal));top:calc(10px + var(--sat));padding:7px 14px;background:rgba(10,7,8,.72);border:1px solid rgba(232,178,90,.45);border-radius:8px;font-size:13px;letter-spacing:.08em;pointer-events:none;transition:opacity 1s}
#menuBtn{position:fixed;left:calc(12px + var(--sal));top:calc(52px + var(--sat));width:42px;height:42px;border-radius:50%;background:rgba(10,7,8,.72);border:1px solid rgba(232,178,90,.45);color:var(--gold);font-size:20px;display:flex;align-items:center;justify-content:center}
#menu{position:fixed;left:calc(12px + var(--sal));top:calc(100px + var(--sat));display:none;flex-direction:column;gap:6px;background:rgba(10,7,8,.9);border:1px solid rgba(232,178,90,.45);border-radius:10px;padding:8px}
#menu.on{display:flex}
#menu button{background:#1b1311;color:#f1e3c8;border:1px solid rgba(232,178,90,.35);border-radius:8px;padding:10px 14px;font:14px Georgia,serif;text-align:left}
#act{position:fixed;right:calc(22px + var(--sar));bottom:calc(26px + var(--sab));min-width:96px;height:56px;padding:0 18px;border-radius:28px;background:rgba(232,178,90,.92);color:#1a0f08;border:2px solid #fff3d2;font:bold 15px Georgia,serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(232,178,90,.55)}
#act.on{display:flex}
#dlg{position:fixed;left:calc(10px + var(--sal));right:calc(10px + var(--sar));bottom:calc(10px + var(--sab));display:none;gap:12px;padding:12px;background:rgba(10,7,8,.92);border:1px solid rgba(232,178,90,.55);border-radius:12px;align-items:flex-start;max-width:760px;margin:0 auto}
#dlg.on{display:flex}
#dlg img{width:78px;height:92px;object-fit:cover;border-radius:8px;border:1px solid rgba(232,178,90,.5);flex:none}
#dlg .n{font-size:12px;color:var(--gold);letter-spacing:.12em;margin-bottom:4px;text-transform:uppercase}
#dlg .t{font-size:15px;line-height:1.45;min-height:66px}
#dlg .h{font-size:11px;opacity:.55;text-align:right;margin-top:4px}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(232,178,90,.5);background:rgba(10,7,8,.35);display:none;pointer-events:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(232,178,90,.75)}
#rot{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);padding:8px 14px;background:rgba(10,7,8,.85);border:1px solid rgba(232,178,90,.5);border-radius:20px;font-size:13px;display:none;pointer-events:none}
#start{position:fixed;inset:0;background:#000 url(img/town.webp) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9}
#start::before{content:"";position:absolute;inset:0;background:rgba(5,3,4,.72)}
#start>*{position:relative}
#start h1{margin:0;font-weight:normal;font-size:28px;letter-spacing:.1em;color:var(--gold);text-align:center;padding:0 20px}
#start p{margin:0;opacity:.8;font-size:14px}
#start button{margin-top:8px;padding:14px 40px;border-radius:30px;border:2px solid var(--gold);background:rgba(10,7,8,.8);color:var(--gold);font:18px Georgia,serif;letter-spacing:.1em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loc">ПЛОЩАДЬ ТИНГЕНА</div>
<div id="menuBtn">☰</div>
<div id="menu"><button id="mFs">⛶ На весь экран</button><button id="mRst">↺ Начать заново</button></div>
<div id="stick"><div id="knob"></div></div>
<div id="act">Осмотреть</div>
<div id="dlg"><img id="face" src="img/face.png" alt=""><div style="flex:1"><div class="n" id="dn">Герой</div><div class="t" id="dt"></div><div class="h">нажми, чтобы продолжить</div></div></div>
<div id="rot">Поверни телефон — так удобнее</div>
<div id="start"><h1>Туман над Тингеном</h1><p>Ночной город ждёт тебя</p><button id="go">Войти</button></div>

<script>
(function(){
"use strict";
var TG=window.Telegram&&Telegram.WebApp;
var MAPW=1448,MAPH=1086;
var qs=new URLSearchParams(location.search),DEBUG=qs.get("debug")==="1";

/* ---------- ходимая зона (координаты ног героя на арте) ---------- */
var WALK=[
 [410,470,1280,700],      // площадь
 [940,352,992,472],       // ступени собора
 [335,215,412,500],       // северная лестница
 [450,495,560,700],       // левая лестница
 [415,695,520,1070]       // путь и лестница вниз
];
var BLOCK=[
 [740,520,1035,695],      // статуя и клумба
 [845,430,935,545],       // фигура ангела
 [560,545,690,700],       // дерево слева
 [1115,545,1245,700],     // дерево справа
 [630,430,745,482],       // скамья
 [1090,430,1185,482],     // скамья
 [410,290,510,486],       // дерево у лестницы
 [500,700,650,748],       // живая изгородь
 [570,505,586,525],[696,665,712,682],[1060,505,1076,525],[1060,665,1076,682],[1275,578,1291,596], // фонари
 [440,860,452,880]
];
function inR(r,x,y){return x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3]}
function canWalk(x,y){
 var ok=false,i;
 for(i=0;i<WALK.length;i++)if(inR(WALK[i],x,y)){ok=true;break}
 if(!ok)return false;
 for(i=0;i<BLOCK.length;i++)if(inR(BLOCK[i],x,y))return false;
 return true;
}
/* ---------- объекты ---------- */
var OBJ=[
 {x:940,y:362,r:62,mx:915,my:300,label:"Осмотреть дверь",
  t:["Тяжёлые двери собора заперты. Сквозь щель пробивается тёплый свет и едва слышно тянется чьё-то пение.","Пока я не знаю, кто поёт в соборе ночью. Но знаю, что вернусь."]},
 {x:890,y:500,r:105,mx:890,my:420,label:"Осмотреть статую",
  t:["Каменный ангел сложил руки у груди. У подножия кто-то оставил свежие цветы.","Дождь не смыл воск со ступеней: здесь недавно горели свечи."]},
 {x:1262,y:520,r:75,mx:1330,my:455,label:"Поговорить",who:"Торговец",
  t:["Эй, господин! Яблоки, хлеб, горячие каштаны. Ночью в Тингене лучше не ходить голодным.","Если слышишь колокол после полуночи — не оборачивайся. Совет бесплатный."]},
 {x:372,y:245,r:65,mx:372,my:190,label:"Подняться",
  t:["Узкая лестница ведёт в верхний квартал. Ворота наверху закрыты на цепь.","Туда придётся пробираться другим путём."]},
 {x:468,y:1040,r:70,mx:468,my:985,label:"Спуститься",
  t:["Ступени уходят к воде и пристаням. Внизу слышен плеск и тихий скрип лодок.","Ночью без фонаря туда лучше не спускаться."]}
];
/* ---------- что закрывает героя спереди ---------- */
var OCC=[
 [850,395,90,180,545],[535,528,165,185,700],[1108,522,145,190,700],
 [688,556,32,130,678],[1056,556,32,130,678],[566,405,32,125,520],[1056,405,32,125,520],[1270,465,28,135,592]
];
var LAMPS=[[828,300],[1005,300],[578,432],[1068,432],[703,585],[1068,590],[1283,495],[318,355],[370,735],[190,880],[345,150],[1228,885],[80,410],[240,235]];

/* ---------- ресурсы ---------- */
var town=new Image(),hero=new Image(),loaded=0;
function ld(){loaded++}
town.onload=ld;hero.onload=ld;town.src="img/town.webp";hero.src="img/hero.png";
var CW=110,CH=162,K=0.5;

/* ---------- состояние ---------- */
var S={x:975,y:500,dir:0,fr:0,t:0,moving:false};
var cv=document.getElementById("c"),g=cv.getContext("2d");
var VW=0,VH=0,DPR=1,Z=1,camx=0,camy=0;
var keys={},joy={on:false,id:null,ox:0,oy:0,dx:0,dy:0};
var dlgOpen=false,dlgLines=[],dlgI=0,typed=0,typeT=0,near=null,started=false,time=0;
var rain=[];for(var i=0;i<140;i++)rain.push({x:Math.random(),y:Math.random(),s:.6+Math.random()*.8});

function save(){
 var d=JSON.stringify({x:Math.round(S.x),y:Math.round(S.y),dir:S.dir,ts:Date.now()});
 try{localStorage.setItem("tg2_save",d)}catch(e){}
 try{TG&&TG.CloudStorage&&TG.CloudStorage.setItem("tg2_save",d,function(){})}catch(e){}
}
function applySave(d){
 try{d=JSON.parse(d)}catch(e){return false}
 if(d&&canWalk(d.x,d.y)){S.x=d.x;S.y=d.y;S.dir=d.dir|0;return true}return false;
}
(function(){var d=null;try{d=localStorage.getItem("tg2_save")}catch(e){}if(d)applySave(d)})();

/* ---------- размеры и безопасные поля ---------- */
function insets(){
 var r=document.documentElement.style,sa={top:0,bottom:0,left:0,right:0},ca={top:0,bottom:0,left:0,right:0};
 try{if(TG){sa=TG.safeAreaInset||sa;ca=TG.contentSafeAreaInset||ca}}catch(e){}
 r.setProperty("--sat",((sa.top||0)+(ca.top||0))+"px");
 r.setProperty("--sab",((sa.bottom||0)+(ca.bottom||0))+"px");
 r.setProperty("--sal",((sa.left||0)+(ca.left||0))+"px");
 r.setProperty("--sar",((sa.right||0)+(ca.right||0))+"px");
}
function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2.5);
 VW=window.innerWidth;VH=window.innerHeight;
 cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
 Z=Math.min(VW/470,VH/270);
 Z=Math.max(Z,VW/MAPW,VH/MAPH);
 insets();
 document.getElementById("rot").style.display=(VH>VW&&started)?"block":"none";
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){setTimeout(resize,200)});
if(TG){try{TG.onEvent("safeAreaChanged",insets);TG.onEvent("contentSafeAreaChanged",insets);TG.onEvent("viewportChanged",resize)}catch(e){}}

/* ---------- звук ---------- */
var AC=null,tickT=0;
function audio(){
 if(AC)return;
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  var n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0),l=0;
  for(var i=0;i<n;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
  var s=AC.createBufferSource();s.buffer=b;s.loop=true;
  var f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=900;
  var gn=AC.createGain();gn.gain.value=.5;s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start();
 }catch(e){AC=null}
}
function blip(fr,du,vol){
 if(!AC)return;
 try{var o=AC.createOscillator(),gn=AC.createGain();o.type="triangle";o.frequency.value=fr;
 gn.gain.setValueAtTime(vol,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+du);
 o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+du)}catch(e){}
}
var stepT=0;
function step(){ if(!AC)return; try{var b=AC.createBufferSource(),n=Math.floor(AC.sampleRate*.05),bf=AC.createBuffer(1,n,AC.sampleRate),d=bf.getChannelData(0);
 for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);b.buffer=bf;var f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=500;
 var gn=AC.createGain();gn.gain.value=.12;b.connect(f);f.connect(gn);gn.connect(AC.destination);b.start()}catch(e){}}

/* ---------- ввод ---------- */
window.addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;
 if((e.key==="e"||e.key==="Enter"||e.key===" ")&&started){if(dlgOpen)advance();else if(near)openObj(near)}});
window.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});
var stickEl=document.getElementById("stick"),knob=document.getElementById("knob");
cv.addEventListener("pointerdown",function(e){
 if(!started||dlgOpen||joy.on)return;
 joy.on=true;joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.dx=joy.dy=0;
 stickEl.style.display="block";stickEl.style.left=(e.clientX-60)+"px";stickEl.style.top=(e.clientY-60)+"px";knob.style.left="36px";knob.style.top="36px";
});
window.addEventListener("pointermove",function(e){
 if(!joy.on||e.pointerId!==joy.id)return;
 var dx=e.clientX-joy.ox,dy=e.clientY-joy.oy,l=Math.hypot(dx,dy),m=48;
 if(l>m){dx=dx/l*m;dy=dy/l*m;l=m}
 joy.dx=dx/m;joy.dy=dy/m;if(l<8){joy.dx=joy.dy=0}
 knob.style.left=(36+dx)+"px";knob.style.top=(36+dy)+"px";
});
function endJoy(e){if(joy.on&&e.pointerId===joy.id){joy.on=false;joy.dx=joy.dy=0;stickEl.style.display="none"}}
window.addEventListener("pointerup",endJoy);window.addEventListener("pointercancel",endJoy);
document.getElementById("dlg").addEventListener("pointerdown",function(e){e.stopPropagation();advance()});
document.getElementById("act").addEventListener("pointerdown",function(e){e.stopPropagation();if(near)openObj(near)});

/* ---------- диалоги ---------- */
function openObj(o){
 dlgOpen=true;dlgLines=o.t;dlgI=0;typed=0;
 document.getElementById("dn").textContent=o.who||"Герой";
 document.getElementById("dlg").classList.add("on");
 document.getElementById("act").classList.remove("on");
 blip(520,.12,.08);
}
function advance(){
 var full=dlgLines[dlgI];
 if(typed<full.length){typed=full.length;return}
 dlgI++;
 if(dlgI>=dlgLines.length){dlgOpen=false;document.getElementById("dlg").classList.remove("on");return}
 typed=0;blip(440,.08,.06);
}

/* ---------- меню ---------- */
var menu=document.getElementById("menu");
document.getElementById("menuBtn").addEventListener("pointerdown",function(e){e.stopPropagation();menu.classList.toggle("on")});
function fs(){
 try{if(TG){TG.expand();if(TG.requestFullscreen&&!TG.isFullscreen)TG.requestFullscreen()}}catch(e){}
 try{var el=document.documentElement;if(!TG&&el.requestFullscreen)el.requestFullscreen().catch(function(){})}catch(e){}
 try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(function(){})}catch(e){}
 try{if(TG&&TG.lockOrientation)TG.lockOrientation()}catch(e){}
}
document.getElementById("mFs").addEventListener("pointerdown",function(e){e.stopPropagation();fs();menu.classList.remove("on")});
document.getElementById("mRst").addEventListener("pointerdown",function(e){e.stopPropagation();S.x=975;S.y=500;S.dir=0;save();menu.classList.remove("on")});

/* ---------- старт ---------- */
document.getElementById("go").addEventListener("click",function(){
 started=true;document.getElementById("start").style.display="none";
 audio();fs();resize();
 setTimeout(function(){document.getElementById("loc").style.opacity=".75"},4000);
});
if(TG){try{TG.ready();TG.expand();TG.disableVerticalSwipes&&TG.disableVerticalSwipes();
 TG.CloudStorage&&TG.CloudStorage.getItem("tg2_save",function(err,v){if(!err&&v){try{var d=JSON.parse(v),l=JSON.parse(localStorage.getItem("tg2_save")||"null");if(!l||(d.ts||0)>(l.ts||0))applySave(v)}catch(e){}}});
}catch(e){}}
setInterval(function(){if(started)save()},6000);
document.addEventListener("visibilitychange",function(){if(document.hidden)save()});
window.addEventListener("pagehide",save);

/* ---------- обновление ---------- */
function update(dt){
 time+=dt;
 var ix=0,iy=0;
 if(!dlgOpen){
  if(keys.arrowleft||keys.a)ix-=1;if(keys.arrowright||keys.d)ix+=1;
  if(keys.arrowup||keys.w)iy-=1;if(keys.arrowdown||keys.s)iy+=1;
  if(joy.on){ix+=joy.dx;iy+=joy.dy}
 }
 var l=Math.hypot(ix,iy);
 if(l>1){ix/=l;iy/=l;l=1}
 S.moving=l>.12;
 if(S.moving){
  var sp=118*l*dt,nx=S.x+ix*sp,ny=S.y+iy*sp;
  if(canWalk(nx,S.y))S.x=nx;
  if(canWalk(S.x,ny))S.y=ny;
  if(Math.abs(ix)>Math.abs(iy)*.8)S.dir=ix<0?2:3;else S.dir=iy<0?1:0;
  S.t+=dt;S.fr=Math.floor(S.t*9)%5;
  stepT+=dt;if(stepT>.3){stepT=0;step()}
 }else{S.fr=1;S.t=0}
 near=null;
 if(!dlgOpen)for(var i=0;i<OBJ.length;i++){var o=OBJ[i];if(Math.hypot(S.x-o.x,S.y-o.y)<o.r){near=o;break}}
 var a=document.getElementById("act");
 if(near&&!dlgOpen){a.textContent=near.label;a.classList.add("on")}else a.classList.remove("on");
 if(dlgOpen){
  var full=dlgLines[dlgI];
  typeT+=dt;
  while(typeT>.022&&typed<full.length){typeT-=.022;typed++;if(typed%3===0)blip(700+Math.random()*80,.03,.025)}
  document.getElementById("dt").textContent=full.slice(0,typed);
 }
 // камера
 var tx=S.x-VW/Z/2,ty=S.y-60-VH/Z/2;
 var mx=Math.max(0,MAPW-VW/Z),my=Math.max(0,MAPH-VH/Z);
 tx=Math.max(0,Math.min(mx,tx));ty=Math.max(0,Math.min(my,ty));
 camx+=(tx-camx)*Math.min(1,dt*6);camy+=(ty-camy)*Math.min(1,dt*6);
}

/* ---------- отрисовка ---------- */
function drawHero(){
 var sx=S.fr*CW,row=S.dir;
 var w=CW*K,h=CH*K,dx=S.x-w/2,dy=S.y-h+4*K;
 // тень
 g.fillStyle="rgba(0,0,0,.45)";g.beginPath();g.ellipse(S.x,S.y,17,5.5,0,0,6.2832);g.fill();
 g.drawImage(hero,sx,row*CH,CW,CH,dx,dy,w,h);
}
function frame(now){
 var dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;
 if(started)update(dt);else time+=dt;
 g.setTransform(DPR,0,0,DPR,0,0);
 g.fillStyle="#050304";g.fillRect(0,0,VW,VH);
 if(loaded>=2){
  g.save();g.scale(Z,Z);g.translate(-camx,-camy);
  g.imageSmoothingEnabled=true;
  g.drawImage(town,0,0,MAPW,MAPH);
  // огни фонарей
  g.globalCompositeOperation="lighter";
  for(var i=0;i<LAMPS.length;i++){
   var L=LAMPS[i],f=.85+.15*Math.sin(time*7+i*2.3)+.05*Math.sin(time*17+i);
   var gr=g.createRadialGradient(L[0],L[1],2,L[0],L[1],95);
   gr.addColorStop(0,"rgba(255,170,70,"+(.30*f)+")");gr.addColorStop(1,"rgba(255,120,30,0)");
   g.fillStyle=gr;g.fillRect(L[0]-95,L[1]-95,190,190);
  }
  g.globalCompositeOperation="source-over";
  // метки объектов
  for(var j=0;j<OBJ.length;j++){var o=OBJ[j],p=Math.sin(time*3+j)*3;
   g.fillStyle="rgba(10,6,4,.7)";g.beginPath();g.arc(o.mx,o.my+p,9,0,6.2832);g.fill();
   g.strokeStyle="rgba(232,178,90,.9)";g.lineWidth=1.5;g.stroke();
   g.fillStyle="#e8b25a";g.font="bold 12px Georgia";g.textAlign="center";g.fillText("!",o.mx,o.my+4+p)}
  drawHero();
  // перекрытия спереди
  for(var k=0;k<OCC.length;k++){var c=OCC[k];
   if(S.y<c[4]&&S.x>c[0]-30&&S.x<c[0]+c[2]+30&&S.y>c[1]-10)
    g.drawImage(town,c[0],c[1],c[2],c[3],c[0],c[1],c[2],c[3]);
  }
  // тёплый свет вокруг героя
  g.globalCompositeOperation="lighter";
  var hg=g.createRadialGradient(S.x,S.y-30,4,S.x,S.y-30,70);hg.addColorStop(0,"rgba(255,190,110,.13)");hg.addColorStop(1,"rgba(255,150,60,0)");
  g.fillStyle=hg;g.fillRect(S.x-70,S.y-100,140,140);
  g.globalCompositeOperation="source-over";
  if(DEBUG){
   g.fillStyle="rgba(0,255,0,.28)";for(var a=0;a<WALK.length;a++){var r=WALK[a];g.fillRect(r[0],r[1],r[2]-r[0],r[3]-r[1])}
   g.fillStyle="rgba(255,0,0,.45)";for(var b=0;b<BLOCK.length;b++){var q=BLOCK[b];g.fillRect(q[0],q[1],q[2]-q[0],q[3]-q[1])}
   g.strokeStyle="#0ff";for(var d=0;d<OBJ.length;d++){g.beginPath();g.arc(OBJ[d].x,OBJ[d].y,OBJ[d].r,0,6.2832);g.stroke()}
  }
  g.restore();
 }
 // дождь поверх
 g.strokeStyle="rgba(200,210,230,.16)";g.lineWidth=1;g.beginPath();
 for(var n=0;n<rain.length;n++){var q2=rain[n];q2.y+=dt*.9*q2.s;q2.x-=dt*.12*q2.s;if(q2.y>1){q2.y=-.05;q2.x=Math.random()*1.2}if(q2.x<-.05)q2.x=1.05;
  var px=q2.x*VW,py=q2.y*VH;g.moveTo(px,py);g.lineTo(px-3,py+11)}
 g.stroke();
 // виньетка
 var vg=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.max(VW,VH)*.75);
 vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.55)");
 g.fillStyle=vg;g.fillRect(0,0,VW,VH);
 requestAnimationFrame(frame);
}
