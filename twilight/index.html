<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0912">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Туман над Тингеном</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Тёмная пиксельная JRPG: ночная деревня, тёплый свет окон и фонарей на фоне холодной синевы. Один экран, управление пальцем. */
:root{
  --bg:#0b0912;
  --panel:#17121f;
  --panel2:#241b30;
  --line:#4a3a5c;
  --fg:#e9e0d2;
  --dim:#9a8fa8;
  --ember:#e0a24a;
  --blood:#b23a48;
  --moss:#6fa06a;
  --disp:"Alegreya SC",Georgia,serif;
  --body:"Alegreya Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
button{font-family:var(--body);color:var(--fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* управление */
#pad{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:150px;height:150px;display:none}
#pad button{position:absolute;width:50px;height:50px;border-radius:10px;border:1px solid var(--line);background:rgba(23,18,31,.72);font-size:20px;padding:0;touch-action:none}
#pad button:active,#pad button.on{background:var(--panel2);border-color:var(--ember)}
#pad .u{left:50px;top:0}#pad .d{left:50px;top:100px}#pad .l{left:0;top:50px}#pad .r{left:100px;top:50px}
#btnA{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:max(40px,calc(env(safe-area-inset-bottom,0px) + 22px));width:78px;height:78px;border-radius:50%;border:2px solid var(--ember);background:rgba(23,18,31,.78);font-family:var(--disp);font-size:26px;display:none;touch-action:none}
#btnA:active{background:var(--panel2)}
#btnM{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:rgba(23,18,31,.72);font-size:20px;display:none}
#loc{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));padding:6px 12px;border-radius:8px;background:rgba(23,18,31,.72);border:1px solid var(--line);font-family:var(--disp);font-size:17px;letter-spacing:.04em;display:none}

/* диалог */
.win{position:relative;border:2px solid #c9a24f;border-radius:12px;background:linear-gradient(180deg,rgba(38,28,58,.96),rgba(16,11,28,.97));box-shadow:inset 0 0 0 2px #1a1226,inset 0 0 0 3px #6b5430,inset 0 0 18px rgba(120,80,200,.25),0 4px 14px rgba(0,0,0,.6)}
.win::before,.win::after{content:"◆";position:absolute;color:#e0a24a;font-size:11px;line-height:1;text-shadow:0 0 6px rgba(224,162,74,.7);pointer-events:none}
.win::before{left:-5px;top:-6px}.win::after{right:-5px;bottom:-6px}
#dlg{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));min-height:118px;padding:14px 16px 12px 16px;display:none;z-index:5}
#dlg.pt{padding-left:104px;min-height:122px}
#dlg .face{position:absolute;left:10px;bottom:10px;width:84px;height:104px;border:2px solid #c9a24f;border-radius:8px;background:radial-gradient(circle at 50% 35%,#4a3a68,#1a1226);box-shadow:inset 0 0 0 2px #1a1226,0 0 10px rgba(0,0,0,.6);overflow:hidden;display:none}
#dlg.pt .face{display:block}
#dlg .face canvas{position:absolute;left:50%;bottom:0;width:128px;height:128px;transform:translateX(-50%);image-rendering:pixelated}
#dlg .nm{position:absolute;top:-17px;left:14px;padding:3px 16px;border-radius:4px 14px 4px 14px;background:linear-gradient(180deg,#5a4120,#2a1c0e);border:2px solid #e0a24a;color:#ffe3a8;font-family:var(--disp);font-size:16px;letter-spacing:.06em;box-shadow:0 2px 6px rgba(0,0,0,.6)}
#dlg.pt .nm{left:104px}
#dlg .tx{line-height:1.38;font-size:18px;min-height:3em;white-space:pre-wrap}
#dlg .nx{position:absolute;right:14px;bottom:8px;color:var(--ember);animation:bl 1s steps(2) infinite}
#dlg .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#dlg .opts button,.mbtn{padding:9px 16px;border-radius:8px;border:1px solid var(--ember);background:var(--panel2);font-size:17px;min-height:44px}
@keyframes bl{50%{opacity:0}}

/* бой */
#bt{position:absolute;left:0;right:0;bottom:0;display:none;padding:0 max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(8,6,14,.9) 30%);z-index:5}
#bt .lg{min-height:44px;margin:0 0 8px;padding:9px 12px;line-height:1.3;font-size:16px}
#bt .row{display:flex;flex-direction:column-reverse;gap:8px}
#bt .st{min-width:0;padding:8px 10px 8px 8px;display:flex;gap:8px;align-items:center}
#bt .st .hf{flex:0 0 52px;height:60px;border:2px solid #c9a24f;border-radius:6px;background:radial-gradient(circle at 50% 35%,#4a3a68,#1a1226);overflow:hidden;position:relative}
#bt .st .hf canvas{position:absolute;left:50%;bottom:0;width:78px;height:78px;transform:translateX(-50%);image-rendering:pixelated}
#bt .st .in{flex:1;min-width:0}
#bt .st b{font-family:var(--disp);font-size:17px;letter-spacing:.04em;color:#ffe3a8}
.stl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.stl em{font-style:normal;color:#e0a24a;font-weight:700;width:18px;flex:none}
.stl .bar{flex:1;margin:3px 0}
.stl span{flex:none;min-width:48px;text-align:right;color:var(--fg)}
#bt .cmd{padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
#bt .cmd button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 8px;border-radius:6px;border:1px solid transparent;background:transparent;font-size:17px;min-height:40px}
#bt .cmd button .ic{flex:none;width:22px;text-align:center;font-size:17px}
#bt .cmd button .mp{margin-left:auto;color:#7fa8ff;font-size:14px}
#bt .cmd button:not(:disabled):active,#bt .cmd button:not(:disabled):hover{background:rgba(224,162,74,.18);border-color:#c9a24f}
#bt .cmd button:not(:disabled):active::before{content:"▶";color:#e0a24a;margin-right:-4px}
#bt .cmd button:disabled{opacity:.4}
#bt .cmd small{display:block;color:var(--dim);font-size:12px}
#bt .cmd button div{line-height:1.1}
#bt.sk .cmd{grid-template-columns:1fr}
.bar{height:10px;border-radius:5px;background:#0a0710;border:1px solid var(--line);margin:5px 0;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.bar.hp i{background:linear-gradient(90deg,#8f2a39,#d4505f)}
.bar.mp i{background:linear-gradient(90deg,#2d4f9a,#5b8be0)}

/* экраны */
.scr{position:absolute;inset:0;display:none;z-index:8;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 50% 38%,rgba(11,9,18,.55),rgba(11,9,18,.9))}
.scr.show{display:flex}
.scr h1{font-family:var(--disp);font-size:clamp(38px,11vw,72px);line-height:1;margin:0;letter-spacing:.03em;color:var(--ember);text-shadow:0 0 30px rgba(224,162,74,.35);text-wrap:balance}
.scr p{margin:0;color:var(--dim);max-width:32ch;line-height:1.4;text-wrap:balance}
.scr .btns{display:flex;flex-direction:column;gap:10px;width:min(260px,100%)}
.scr .mbtn{font-size:19px}
.scr .mbtn.pri{background:var(--ember);color:#1a1208;font-weight:700}
#menu{align-items:stretch;text-align:left;justify-content:center}
#menu .box,#soc .box{box-sizing:border-box}
#menu .box{max-width:420px;width:100%;margin:0 auto;padding:18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#menu h2{font-family:var(--disp);margin:0;font-size:24px;color:var(--ember)}
#menu dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
#menu dt{color:var(--dim)}#menu dd{margin:0}
#menu .q{padding:10px 12px;border-radius:8px;background:var(--panel2);line-height:1.35}
#menu .rw{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:absolute;left:50%;top:max(64px,calc(env(safe-area-inset-top,0px) + 56px));transform:translateX(-50%);padding:8px 16px;border-radius:8px;background:rgba(18,13,26,.95);border:1px solid var(--ember);display:none;z-index:9;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}

/* события */
#ev{position:absolute;inset:0;display:none;z-index:7;background:#0b0912}
#evbg{position:absolute;left:0;right:0;top:0;height:62%;background-size:cover;background-position:center top;animation:evz 14s ease-in-out infinite alternate}
@keyframes evz{from{transform:scale(1)}to{transform:scale(1.06)}}
#ev .fade{position:absolute;left:0;right:0;top:38%;height:30%;background:linear-gradient(transparent,#0b0912)}
#evwin{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));max-height:62%;overflow:auto;padding:16px 14px 12px;touch-action:pan-y}
#evloc{color:#e0a24a;font-family:var(--disp);font-size:15px;letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase}
#evtx{line-height:1.4;font-size:17px;white-space:pre-wrap;margin-bottom:10px}
#evbtn{display:flex;flex-direction:column;gap:6px}
#evbtn button{padding:10px 12px;border-radius:8px;border:1px solid #6b5430;background:rgba(224,162,74,.08);font-size:17px;min-height:46px;text-align:left}
#evbtn button:active{background:rgba(224,162,74,.25);border-color:#e0a24a}
#hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 42px);padding:3px 10px;border-radius:8px;background:rgba(23,18,31,.72);border:1px solid var(--line);font-size:15px;display:none;z-index:3}
/* профиль / чат */
#soc{align-items:stretch;justify-content:flex-start;gap:8px;text-align:left;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
#soc .box{max-width:460px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:12px}
#soctabs{display:flex;gap:6px}
#soctabs button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:16px}
#soctabs button.on{border-color:var(--ember);color:#ffe3a8}
#socbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#soc .dim{color:var(--dim);font-size:14px}
#soc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}#soc dt{color:var(--dim)}#soc dd{margin:0}
#soc .prof{display:flex;gap:12px;align-items:center}
#soc .prof b{font-family:var(--disp);font-size:22px;color:#ffe3a8}
#soc .hf{width:64px;height:72px;border:2px solid #c9a24f;border-radius:8px;background:radial-gradient(circle at 50% 35%,#4a3a68,#1a1226);overflow:hidden;position:relative;flex:none}
#soc .hf canvas{position:absolute;left:50%;bottom:0;width:96px;height:96px;transform:translateX(-50%);image-rendering:pixelated}
#chlist{flex:1;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.cm{padding:6px 10px;border-radius:8px;background:var(--panel2);line-height:1.3;word-break:break-word}
.cm.me{background:rgba(224,162,74,.14)}
.cm b{color:#ffe3a8;font-family:var(--disp)}
#chform{display:flex;gap:6px}
#chin{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0e0a18;color:var(--fg);font-size:16px;-webkit-user-select:text;user-select:text;touch-action:auto}
#chform .mbtn{padding:0 16px}
.top{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.top li{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:8px;background:var(--panel2)}
.top li.me{background:rgba(224,162,74,.14)}.top li b{flex:1;font-family:var(--disp);color:#ffe3a8}
@media (prefers-reduced-motion:reduce){#dlg .nx{animation:none}#evbg{animation:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="c"></canvas>
  <div id="loc"></div>
  <button id="btnM" aria-label="Меню">☰</button>
  <div id="pad">
    <button class="u" data-d="3" aria-label="Вверх">▲</button>
    <button class="l" data-d="1" aria-label="Влево">◀</button>
    <button class="r" data-d="2" aria-label="Вправо">▶</button>
    <button class="d" data-d="0" aria-label="Вниз">▼</button>
  </div>
  <button id="btnA" aria-label="Действие">A</button>
  <div id="dlg" class="win"><div class="face"><canvas id="dface" width="16" height="16"></canvas></div><div class="nm"></div><div class="tx"></div><div class="opts"></div><div class="nx">▼</div></div>
  <div id="bt">
    <div class="lg win" id="blog"></div>
    <div class="row">
      <div class="cmd win" id="bcmd"></div>
      <div class="st win"><div class="hf"><canvas id="bface" width="16" height="16"></canvas></div><div class="in"><b id="bname">Потусторонний</b> <span id="blv" style="color:var(--dim);font-size:13px"></span>
        <div class="stl"><em>HP</em><div class="bar hp"><i id="bhp"></i></div><span id="bhpt"></span></div>
        <div class="stl"><em>MP</em><div class="bar mp"><i id="bmp"></i></div><span id="bmpt"></span></div></div></div>
    </div>
  </div>
  <div id="hud"></div>
  <div id="ev"><div id="evbg"></div><div class="fade"></div><div id="evwin" class="win"><div id="evloc"></div><div id="evtx"></div><div id="evbtn"></div></div></div>
  <div class="scr" id="soc"><div class="box win"><div id="soctabs"><button data-t="p">Профиль</button><button data-t="c">Чат</button><button data-t="t">Топ</button></div><div id="socbody"></div><button class="mbtn pri" id="socX">Закрыть</button></div></div>
  <div id="toast"></div>
  <div class="scr show" id="title">
    <h1>Туман над Тингеном</h1>
    <p>Викторианский город, туман и Потусторонние. Прототип: улицы, трактир, роща, склеп и один безумец.</p>
    <div class="btns">
      <button class="mbtn pri" id="tCont">Продолжить</button>
      <button class="mbtn" id="tNew">Новая игра</button>
    </div>
  </div>
  <div class="scr" id="menu"><div class="box" id="mbox"></div></div>
  <div class="scr" id="end">
    <h1>Артефакт запечатан</h1>
    <p id="endTx"></p>
    <div class="btns"><button class="mbtn pri" id="eBack">Вернуться в Тинген</button></div>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$("#c"),ctx=cv.getContext("2d");
const TS=16;

/* ============ рисование пикселей ============ */
function mk(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");fn(x);return c}
function R(x,c,a,b,w,h){x.fillStyle=c;x.fillRect(a,b,w,h)}
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function speck(x,r,cols,n){for(let i=0;i<n;i++){R(x,cols[(r()*cols.length)|0],(r()*16)|0,(r()*16)|0,1,1)}}

const G={};   // тайлы земли
const O={};   // тайлы объектов (прозрачный фон)
function ground(ch,seed,base,sp,n){G[ch]=mk(16,16,x=>{R(x,base,0,0,16,16);speck(x,rng(seed),sp,n)})}
ground(".",1,"#2d4528",["#386034","#223a20","#2a4a2c"],34);
ground("g",2,"#223a25",["#2d4a30","#18281b","#294430"],34);
ground("=",3,"#5a4630",["#6d5639","#4a3826","#654f35"],30);
ground("_",4,"#6b4a2b",[],0);
G["_"]=mk(16,16,x=>{R(x,"#6b4a2b",0,0,16,16);for(let i=0;i<16;i+=4)R(x,"#563a20",0,i+3,16,1);for(let i=0;i<16;i+=8)R(x,"#563a20",(i*3)%16,0,1,16);speck(x,rng(9),["#7b5833"],14)});
G["c"]=mk(16,16,x=>{R(x,"#4b4c58",0,0,16,16);R(x,"#35363f",0,7,16,1);R(x,"#35363f",0,15,16,1);R(x,"#35363f",5,0,1,8);R(x,"#35363f",11,8,1,8);speck(x,rng(5),["#5a5b68","#414250"],18)});
G[","]=mk(16,16,x=>{x.drawImage(G["."],0,0);R(x,"#c9b6d8",4,5,1,1);R(x,"#e0a24a",11,10,1,1);R(x,"#c9b6d8",9,3,1,1);R(x,"#b23a48",3,12,1,1)});
const WAT=[0,1].map(f=>mk(16,16,x=>{R(x,"#1c3552",0,0,16,16);const r=rng(11+f);for(let i=0;i<5;i++){R(x,"#2f5a82",((r()*12)|0)+(f?2:0),(r()*15)|0,3,1)}R(x,"#0f2238",0,15,16,1)}));
G["~"]=WAT[0];

function tr(ch,fn){O[ch]=mk(16,16,fn)}

/* дорога с краями: смотрим на соседей и рисуем кромку или траву */
const ROAD={};
function roadTile(ch,mask,base){
  const k=ch+mask+base;if(ROAD[k])return ROAD[k];
  return ROAD[k]=mk(16,16,x=>{
    x.drawImage(G[ch],0,0);
    const gr=base==="g"?["#223a25","#2d4a30","#18281b"]:["#2d4528","#386034","#223a20"];
    const r=rng(mask*7+ch.charCodeAt(0)+base.charCodeAt(0));
    const sides=[[1,(i,d)=>[i,d]],[2,(i,d)=>[d,i]],[4,(i,d)=>[15-d,i]],[8,(i,d)=>[i,15-d]]];
    for(const [bit,f] of sides){
      if(mask&bit)continue;
      for(let i=0;i<16;i++){
        if(ch==="c"){let p=f(i,0);R(x,"#2a2b33",p[0],p[1],1,1);p=f(i,1);R(x,"#6a6b78",p[0],p[1],1,1)}
        else{const dp=1+((r()*2)|0);for(let d=0;d<dp;d++){const p=f(i,d);R(x,gr[(r()*gr.length)|0],p[0],p[1],1,1)}const p=f(i,dp);R(x,"#3e2f1f",p[0],p[1],1,1)}
      }
    }
  });
}
function isRoad(m,x,y){if(x<0||y<0||x>=m.w||y>=m.h)return true;const g=m.g[y][x];return g==="="||g==="c"}
tr("T",x=>{R(x,"#3a281b",7,9,2,7);const cx=8,cy=6;for(let y=0;y<14;y++)for(let a=0;a<16;a++){const d=Math.hypot(a-cx,(y-cy)*1.1);if(d<6.4)R(x,d<3.6&&a<9&&y<7?"#2c5532":d>5.2?"#10241a":"#1e3d24",a,y,1,1)}});

function act(kind){
  if(!B||B.busy)return;B.busy=true;B.menu="main";renderBattle();
  const e=B.e;
  if(kind==="atk"||kind==="dark"){
    if(kind==="dark"){P.mp-=4;snd("dark")}

      B.hp=Math.max(0,B.hp-d);B.flash=.35;snd(crit?"crit":"hit");B.anim.push({k:kind==="dark"?"orb":"slash",t:0,crit});
      floatTxt((crit?"Крит ":"")+"-"+d,0,0,crit?"#ffd37a":"#fff");
      blog((kind==="dark"?"Пуля духа":"Ты бьёшь")+": "+d+" урона"+(crit?" (крит!)":"")+"."+ab);

function enemyTurn(){
  if(!B)return;const e=B.e;let d=e.atk+((Math.random()*3)|0)-1,msg="";

  else if(B.boss&&!e.bp){
    if(B.charge){d=Math.round(e.atk*2.2);B.charge=0;msg=e.n+" обрушивает копившуюся силу: "+d+" урона!"}

  }else if(e.x2&&B.turn%e.x2===0){d=Math.round(d*(e.xm||2));msg=e.n+" бьёт со всей силы: "+d+" урона!"}

  blog(msg);B.turn++;renderBattle();

function tryMove(d){

  S.dir=d;const m=cur();const nx=S.x+DX[d],ny=S.y+DY[d];
  if(solid(m,nx,ny)||npcAt(m,nx,ny))return;

function stepDone(){
  const m=cur();S.x=mv.tx;S.y=mv.ty;mv=null;S.steps++;
  const w=m.warps.find(w=>w.x===S.x&&w.y===S.y);
  if(w){

    warp(w);return;
  }
  if(m.enc&&S.steps>S.safe&&"g=.".includes(m.g[S.y][S.x])&&Math.random()<.085){
    S.safe=S.steps+5;const pool=m.pool||["wolf","wolf"];let k=pool[(Math.random()*pool.length)|0];
    for(const [rk,p] of (m.rare||[]))if(Math.random()<p){k=rk;break}
    startBattle(k);return;
  }
  if(m.kind!=="in"&&S.steps%2===0)snd("step");
}

let scale=2,vw=0,vh=0,camX=0,camY=0;
function resize(){
  const W=innerWidth,H=innerHeight;cv.width=W;cv.height=H;
  scale=Math.max(2,Math.min(5,Math.floor(Math.min(W,H)/130)));
  vw=W;vh=H;ctx.imageSmoothingEnabled=false;
}
addEventListener("resize",resize);
const dark=mk(2,2,()=>{});
let dk=document.createElement("canvas"),dkx=dk.getContext("2d");
function shadowAt(px,py){ctx.fillStyle="rgba(0,0,0,.32)";ctx.beginPath();ctx.ellipse(px+8,py+14.5,5.5,2.2,0,0,7);ctx.fill()}
function pos(){
  let x=S.x*TS,y=S.y*TS;
  if(mv){const t=mv.t;x=(mv.fx+(mv.tx-mv.fx)*t)*TS;y=(mv.fy+(mv.ty-mv.fy)*t)*TS}
  return [x,y];
}
function draw(now){
  const m=cur();ctx.fillStyle="#0b0912";ctx.fillRect(0,0,vw,vh);
  if(S.st==="battle"&&B){drawBattle(now);return}
  const [px,py]=pos();
  const mapW=m.w*TS,mapH=m.h*TS,viewW=vw/scale,viewH=vh/scale;
  let cx=px+8-viewW/2,cy=py+8-viewH/2;
  cx=mapW<=viewW?-(viewW-mapW)/2:Math.max(0,Math.min(mapW-viewW,cx));
  cy=mapH<=viewH?-(viewH-mapH)/2:Math.max(0,Math.min(mapH-viewH,cy));
  // на экране «титул» — медленно плывём камерой по деревне
  camX=cx;camY=cy;
  ctx.save();ctx.scale(scale,scale);ctx.translate(-Math.round(cx),-Math.round(cy));
  const x0=Math.max(0,Math.floor(cx/TS)),x1=Math.min(m.w-1,Math.ceil((cx+viewW)/TS)),y0=Math.max(0,Math.floor(cy/TS)),y1=Math.min(m.h-1,Math.ceil((cy+viewH)/TS));
  const wf=Math.floor(now/600)%2;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const g=m.g[y][x];let t;
    if(g==="~")t=WAT[wf];
    else if(g==="="||g==="c"){const mk2=(isRoad(m,x,y-1)?1:0)|(isRoad(m,x-1,y)?2:0)|(isRoad(m,x+1,y)?4:0)|(isRoad(m,x,y+1)?8:0);t=mk2===15?G[g]:roadTile(g,mk2,m.base||".")}
    else t=G[g];
    ctx.drawImage(t,x*TS,y*TS);
  }
  // объекты и спрайты, отсортированные по y
  const items=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const o=m.o[y][x];if(o)items.push({y:y*TS,k:"o",o,x:x*TS,yy:y*TS})}
  for(const n of m.npcs){if(n.ev&&F.used[n.ev])continue;items.push({y:n.y*TS,k:"n",n})}
  if(S.st!=="title")items.push({y:py,k:"p",px,py});
  items.sort((a,b)=>a.y-b.y||(a.k==="o"?-1:1));
  const tops=[];
  for(const it of items){
    if(it.k==="o"){
      const isTall=(it.o==="T");
      ctx.drawImage(O[it.o]||O.W,it.x,it.yy-(isTall?4:0));
    }else if(it.k==="n"){
      const n=it.n;
      if(n.prop){ctx.drawImage(O[n.prop],n.x*TS,n.y*TS-(n.prop==="E"||n.prop==="x"?4:0))}
      else{shadowAt(n.x*TS,n.y*TS);ctx.drawImage(SP[n.sp][n.dir][0],n.x*TS,n.y*TS-12-(Math.floor(now/550+n.x*3+n.y)%2?1:0))}
      if(n.ev){const sy=n.y*TS-(n.prop?3:15)+Math.sin(now/260+n.x)*1.5,sx=n.x*TS+8;ctx.fillStyle="rgba(255,214,120,.95)";ctx.beginPath();ctx.moveTo(sx,sy-3);ctx.lineTo(sx+2,sy);ctx.lineTo(sx,sy+3);ctx.lineTo(sx-2,sy);ctx.fill()}
    }
    else{shadowAt(Math.round(it.px),Math.round(it.py));ctx.drawImage(SP.hero[S.dir][mv?(fr%2?1:2):0],Math.round(it.px),Math.round(it.py)-12)}
  }
  if(mark&&S.st==="map"){const t=(now%900)/900,a=1-t,r=3+t*5;ctx.strokeStyle="rgba(224,162,74,"+a.toFixed(2)+")";ctx.lineWidth=1;ctx.strokeRect(mark.x*TS+8-r,mark.y*TS+8-r,r*2,r*2);ctx.fillStyle="rgba(224,162,74,.8)";ctx.fillRect(mark.x*TS+7,mark.y*TS+7,2,2)}
  ctx.restore();
  // освещение
  const L=m.light;
  if(dk.width!==vw||dk.height!==vh){dk.width=vw;dk.height=vh}else{dkx.globalCompositeOperation="source-over";dkx.clearRect(0,0,vw,vh)}

 c_gravedigger:{art:"c_gravedigger",t:"⚰ У свежей могилы работает сутулый могильщик. Лопата ходит ровно, как маятник. Он не оборачивается, но говорит:\n\n«Хорошая ночь. Земля мягкая. Если что-то нужно — спрашивай, только недолго. Они не любят, когда стоят над душой.»",ch:[
  ["🧪 Купить «тоник» (6 £)",()=>P.pn>=6?dd("🧪 Могильщик достаёт из-за пояса флягу. «Земляной тоник. Пахнет так себе, но мёртвых он ставит на ноги. Тебя, думаю, тоже.»",{pn:-6,hp:15}):dd("🧪 «Нет монет — нет тоника», — бурчит могильщик и снова берётся за лопату. Нужно 6 £.")],
  ["💬 Расспросить",()=>dd("💬 Могильщик опирается на лопату. "+pick(["«Призраки не любят, когда в них бьют напрямую. Они уходят в туман — бей снова и снова.»","«Гуль жрёт падаль, чтобы лечиться. Не давай ему время на обед.»","«Червь зарывается, и тогда по нему не попасть. Бей, пока он наверху.»","«Плакальщица кричит втрое громче, чем бьёт. Береги здоровье перед третьим криком.»"]),{md:2})],
  ["↩ Уйти",()=>dd("↩ Ты кивнул и пошёл дальше. За спиной снова зашуршала лопата — ровно, как маятник.")]]},
 c_crypt:{art:"c_crypt",t:"🏛 В склоне холма — семейный склеп. Дверь запечатана свинцом и знаком Богини Вечной Ночи. Печать надтреснута. Изнутри тянет холодом и чем-то сладким.\n\nКто-то уже пытался войти… и, кажется, не вышел.",ch:[
  ["🗝 Сломать печать",()=>roll()<50?dd("🗝 Ты срываешь печать. Дверь стонет. Внутри — пыльные саркофаги и нетронутая шкатулка с монетами. Тени по углам смотрят, но не двигаются.",{pn:12,md:3}):dd("🗝 Едва дверь открылась, холод ударил в грудь. Из темноты вылетело что-то бледное и прошло сквозь тебя, оставив ледяной ожог.",{hp:-10,md:3})],
  ["👂 Прислушаться",()=>{const s=mk3("cem","Знаков некроманта");return Object.assign(dd("👂 Ты прикладываешь ухо к двери. Изнутри — скрип пера и монотонное бормотание на мёртвом языке. Кто-то пишет там, под землёй.\n\n"+s.trim(),{md:2}),bossIf("cem","necro"))}],
  ["↩ Уйти",()=>dd("↩ Ты отступаешь от склепа. Печать тихо поскрипывает, как будто вздыхая с облегчением.")]]},
 c_whispers:{art:"c_whispers",t:"🌫 Туман между надгробиями шепчет. Не одним голосом — десятками, на разных языках, и среди них один — детский. Имена на плитах медленно меняются, подстраиваясь под твоё.\n\n«Останься… мы так давно одни…»",ch:[
  ["👂 Выслушать мёртвых",()=>dd("👂 Ты слушаешь. Мёртвые рассказывают, где закопаны их сбережения, и просят только одного: не уходить. Ты берёшь монеты у ближайшей плиты и всё-таки уходишь.",{pn:5,md:7})],
  ["🙏 Помолиться за них",()=>dd("🙏 Ты молишься за каждого, чьё имя успел прочесть. Шёпот стихает, туман расходится, на камнях проступает слабый свет.",{hp:8,md:-4})],
  ["🏃 Бежать",()=>roll()<60?dd("🏃 Ты бежишь, не оглядываясь. Шёпот остаётся позади, превращаясь в шелест листьев."):dd("🏃 Ты спотыкаешься о корень, падаешь, и мёртвые руки — или показалось? — на миг хватают за лодыжку.",{hp:-4,md:3})]]},
 c_hawk:{art:"c_hawk",t:"🛡 У ограды сидит человек в чёрном плаще. На плаще — серебряный знак Ночных Ястребов. Он зажимает бок, из-под пальцев течёт тёмное.\n\n«Не подходи близко… тут кто-то из своих сыграл не по правилам.»",ch:[
  ["🩹 Помочь",()=>dd("🩹 Ты перевязываешь рану, как умеешь. Ястреб хрипло смеётся: «Должен тебе.» Он суёт тебе тугой кошелёк и серебряную монету с гербом.",{hp:-3,pn:10})],
  ["🗣 Расспросить",()=>{const s=mk3("cem","Знаков некроманта");return Object.assign(dd("🗣 «Один самоучка в чёрном… Нашёл книгу, которая не для людей. Роет под старой часовней. Если встретишь — не жди, пока он закончит читать.»\n\n"+s.trim(),{md:1}),bossIf("cem","necro"))}],
  ["↩ Уйти",()=>dd("↩ Ты отступаешь. Ястреб провожает тебя долгим взглядом: «Правильно. Не твоё дело.»")]]},
 c_ritual:{art:"c_ritual",t:"🕯 На маленькой поляне горят свечи. Мелом нарисован круг, в центре — миска с чем-то тёмным и пергамент с наполовину дописанным заклинанием.\n\nЧей-то ритуал оборвали на полуслове. Свечи ещё тёплые.",ch:[
  ["📜 Дописать заклинание",()=>{const s=mk3("cem","Знаков некроманта"),b=bossIf("cem","necro");return Object.assign(roll()<50?dd("📜 Ты дописываешь строку, не понимая слов. Свечи вспыхивают чёрным, миска опустошается, и на мел падают монеты, которых там не было.\n"+s.trim(),{pn:15,md:6}):dd("📜 Ты дописываешь строку. Пламя взвивается, круг выпускает волну холода и бьёт тебя в грудь.\n"+s.trim(),{hp:-9,md:6}),b)}],
  ["💥 Разрушить круг",()=>{const s=mk3("cem","Знаков некроманта");return Object.assign(dd("💥 Ты пинаешь миску и стираешь круг ногой. Свечи гаснут разом. Где-то под землёй раздаётся недовольный вой — кто-то понял, что ритуал сорван.\n"+s.trim(),{md:-2}),bossIf("cem","necro"))}],
  ["↩ Не трогать",()=>dd("↩ Ты не трогаешь круг. Но чувствуешь взгляд в спину, пока не выйдешь из света свечей.",{md:2})]]},
 c_angel:{art:"c_angel",t:"🗿 Плачущий ангел из серого камня склонил голову над безымянной могилой. По щекам течёт чёрная влага. Руки сложены — и между пальцев что-то блестит.\n\nКажется, статуя следит за тобой.",ch:[
  ["🙏 Помолиться",()=>dd("🙏 Ты склоняешь голову. Чёрные слёзы на щеках ангела на миг становятся прозрачными. Тёплый свет ложится на плечи.",{hp:10})],
  ["✋ Взять блестящее",()=>roll()<45?dd("✋ Между пальцев — старая золотая брошь. Статуя не двигается. Ты почти уверен, что она улыбнулась.",{pn:14}):dd("✋ Едва пальцы коснулись камня, ангел поднимает голову. Глаза — пустые ямы. Он шепчет одно слово, и боль пронзает тебя.",{hp:-7,md:4})],
  ["↩ Отвернуться",()=>dd("↩ Ты отворачиваешься. Статуя будто провожает тебя взглядом. Когда ты оглядываешься, её голова склонена по-прежнему.")]]},
 c_procession:{art:"c_procession",t:"🕯 Из тумана выходит процессия: люди в траурных одеждах несут пустой гроб. Лиц не видно, шагов не слышно. Один из них останавливается и протягивает тебе свечу.\n\n«Пойдёшь с нами? Нам не хватает одного.»",ch:[
  ["🕯 Взять свечу и идти",()=>roll()<50?dd("🕯 Ты берёшь свечу и идёшь с ними. Шагов нет, дыхания нет. У последней могилы тебе протягивают маленький кошелёк: «Спасибо, что проводил.»",{md:-5,pn:8}):dd("🕯 Ты идёшь слишком долго. Лица под капюшонами поворачиваются к тебе. Пустые. Свеча в руке тухнет, и холод пробирает до костей.",{hp:-6,md:8})],
  ["👀 Смотреть со стороны",()=>dd("👀 Ты стоишь в стороне, пока они проходят. Один из несущих гроб поворачивает голову, смотрит на тебя и медленно кивает.",{md:2})],
  ["↩ Отказаться",()=>dd("↩ Ты качаешь головой. Процессия растворяется в тумане, будто её и не было.")]]},
 /* --- роща --- */
 f_whisper:{art:"f_whisper",t:"🌲 Лес вдруг стихает. Между стволами кто-то зовёт тебя по имени — тихо, на разные голоса. Один похож на голос матери, другой — на твой собственный.\n\n«Подойди… мы расскажем, что с тобой будет…»",ch:[
  ["👂 Слушать",()=>dd("👂 Ты слушаешь. Голоса рассказывают о твоих страхах, о людях, которых ты ещё не встретил, и о месте, где всё кончится. Половину ты тут же забываешь — но в кармане оказываются две монеты, которых там не было.",{pn:2,md:5})],
  ["🙉 Заткнуть уши",()=>dd("🙉 Ты плотно зажимаешь уши и идёшь вперёд, считая шаги. Шёпот стихает, превращаясь в шелест листвы. Лес разочарованно вздыхает за спиной.")],
  ["🗣 Ответить",()=>roll()<50?dd("🗣 «Кто вы?» — спрашиваешь ты. Тишина. Потом десятки голосов отвечают разом твоим голосом. На земле у ног блестит горсть монет — плата за разговор.",{pn:6,md:8}):dd("🗣 Ты отвечаешь — и голоса вцепляются в тебя, как острые ветки. Из-под кожи будто вытягивают тепло.",{hp:-5,md:5})]]},
 f_ring:{art:"f_ring",t:"🍄 На поляне — идеальный круг из бледных грибов. В воздухе плывут светящиеся споры, и тишина такая, что слышно собственное сердце.\n\nГоворят, внутри круга время течёт иначе…",ch:[
  ["🍄 Войти в круг",()=>roll()<60?dd("🍄 Ты ступаешь в круг. Споры оседают на коже тёплым светом, раны затягиваются сами собой. У корней одного из грибов лежит кошель.",{hp:12,pn:4}):dd("🍄 Едва ты входишь в круг, споры вспыхивают и бьют в лицо. В глазах плывёт, во рту горечь. Круг выпускает тебя нехотя.",{hp:-8})],
  ["↩ Обойти",()=>dd("↩ Ты обходишь грибной круг стороной. Споры тянутся за тобой тонкими нитями, но отстают. Умнее иногда — ничего не трогать.")]]},
 f_hut:{art:"f_hut",t:"🛖 Из чащи тянется дымок. Кривая хижина на куриных ногах, на пороге — старуха с глазами, как мокрые угли.\n\n«Садись, путник. Чую в тебе усталость… и тайну.»",ch:[
  ["🧪 Зелье (5 £)",()=>P.pn>=5?dd("🧪 Старуха разливает по плошке тёмный отвар. Горький, как сама правда, но от него по телу бежит тепло.\n\nЗдоровье восстановлено.",{pn:-5,full:1}):dd("🧪 «Нет монет — нет зелья», — каркает старуха и закрывает дверь. Нужно 5 £.")],
  ["🔮 Погадай мне",()=>dd("🔮 Старуха бросает на стол кости и щурится. "+pick(["«Рыжая тень идёт за тобой по пятам. Не оглядывайся.»","«Дерево не бьёт, пока не накопит силу. Бей, когда оно отдыхает.»","«Кабан не умеет в ловкость, умеет в упрямство.»","«Паутина — это ожидание. Яд — это терпение. Не затягивай бой.»"]),{md:2})],
  ["↩ Уйти",()=>dd("↩ Ты вежливо кланяешься. «Дверь не запирается», — шепчет старуха, провожая тебя взглядом. Хижина уходит в чащу на своих птичьих ногах.")]]},
 f_tracks:{art:"f_tracks",t:"🦊 На коре старой сосны — следы когтей, клочок рыжей шерсти и капля чего-то тёмного. След свежий и ведёт вглубь леса.\n\nКто-то большой, хитрый и очень умный наблюдает за тобой.",ch:[
  ["🔍 Изучить след",()=>{const s=mk3("for","Следов собрано");return Object.assign(dd("🔍 Ты присаживаешься и изучаешь след: пять когтей, мягкая подушечка… и странный отпечаток, похожий на женскую ладонь. Теперь ты чувствуешь, где лиса.\n\n"+s.trim()),bossIf("for","fox"))}],
  ["🧹 Стереть",()=>dd("🧹 Ты стираешь след рукавом. Лес будто выдыхает с облегчением. Где-то далеко раздаётся тихий смех.")]]},
 f_altar:{art:"f_altar",t:"🗿 В круге мёртвых деревьев — каменный алтарь без имени. На нём выжжены руны, которых нет ни в одной книге. Камень тёплый, как живой.\n\nЧто-то требует жертвы.",ch:[
  ["💷 Принести фунты (5 £)",()=>P.pn>=5?dd("💷 Ты кладёшь на камень монеты. Руны вспыхивают золотом, монеты рассыпаются в пыль. Тепло наполняет тело.\n\nЗдоровье полностью восстановлено.",{pn:-5,full:1}):dd("💷 В карманах не хватает монет. Алтарь остаётся холодным. Нужно 5 £.")],
  ["🩸 Отдать кровь (−5 HP)",()=>dd("🩸 Ты прикладываешь ладонь к руне. Камень пьёт кровь жадно. Через мгновение на алтаре лежат монеты — старые, чужие.",{hp:-5,pn:8})],
  ["↩ Не трогать",()=>dd("↩ Ты отходишь от алтаря. Камень гаснет. Странно, но на душе легче.",{md:-3})]]},
 f_loop:{art:"f_loop",t:"🌀 Ты проходишь мимо дерева с зарубкой… и через час снова видишь его. Тот же сучок, те же вороны. Лес зациклился.\n\nКомпас вращается, как безумный.",ch:[
  ["🧭 Искать выход",()=>roll()<50?dd("🧭 Ты вспоминаешь: компасу верить нельзя, а мху — можно. Выходишь на тропу и по дороге находишь чей-то кошель.",{pn:3}):dd("🧭 Ты блуждаешь кругами, пока ноги не подкашиваются. Ветки царапают лицо и руки.",{hp:-4})],
  ["➡ Идти прямо",()=>dd("➡ Ты идёшь прямо, не сворачивая. Дерево с зарубкой снова впереди. И снова. И снова. Наконец лес сдаётся и отпускает тебя — но что-то в голове остаётся там.",{md:4})],
  ["🪓 Рубить метки",()=>dd("🪓 Ты вырубаешь на каждом дереве метку. Через час понимаешь: меток всё больше, а деревьев тех же. Но к ночи тропа сама находит тебя.")]]},
 f_hunter:{art:"f_hunter",t:"💀 Под елью сидит мёртвый охотник. Пальцы всё ещё сжимают дневник, рядом — разорванная сумка. Следов борьбы нет, только страх на лице.\n\nВороны на ветвях молчат.",ch:[
  ["📖 Прочесть дневник",()=>{const s=mk3("for","Следов собрано");return Object.assign(dd("📖 Почерк дрожит: «Лиса — не зверь. Она ходит на двух ногах, когда думает, что её не видят. Я видел девять хвостов. Не смотри ей в глаза…»\n\n"+s.trim(),{md:2}),bossIf("for","fox"))}],
  ["🎒 Взять сумку",()=>dd("🎒 Ты вытряхиваешь сумку: несколько монет, нож и засушенный амулет. Едва ты берёшь его, вороны взлетают с воплем.",{pn:5,md:4})],
  ["🙏 Помолиться",()=>dd("🙏 Ты закрываешь мертвецу глаза и шепчешь короткую молитву. Ветер стихает, и по телу разливается тёплая тишина.",{hp:6})]]},
 /* --- озеро --- */
 l_fisherman:{art:"l_fisherman",t:"🎣 На шатких мостках сидит старик в заплатанном плаще. Поплавок не дрожит уже, кажется, целую вечность. В ведре серебрится улов.\n\n«Рыба берёт только у тех, кто умеет ждать, — говорит он, не оборачиваясь. — Хочешь рыбы? Могу продать. А могу взять плату другую: из тех, что не пересчитать монетами.»",ch:[
  ["🐟 Купить рыбу (5 £)",()=>P.pn>=5?dd("🐟 Старик, не глядя, достаёт из ведра рыбину и заворачивает в лист. «Съешь сразу, пока она помнит воду.» Рыба жирная, тёплая внутри. Силы возвращаются.",{pn:-5,hp:10}):dd("🐟 «Нет монет — нет рыбы», — усмехается старик и снова смотрит на поплавок. Нужно 5 £.")],
  ["🧠 Отдать воспоминание",()=>dd("🧠 Старик кладёт сухую ладонь тебе на лоб. Ты на миг забываешь, как звали твою первую собаку. Взамен на мостках лежат монеты.",{pn:12,md:3})],
  ["↩ Уйти",()=>dd("↩ Ты кивнул и пошёл дальше. «Приходи, когда будет нечего терять», — доносится вслед. Поплавок так и не дрогнул.")]]},
 l_boat:{art:"l_boat",t:"🛶 У камышей качается лодка без вёсел. Её никто не привязывал, но она всё время возвращается к одному и тому же месту. На скамье лежат письмо с печатью и маленький ключ.\n\nВода вокруг тихая, слишком тихая.",ch:[
  ["🛶 Залезть в лодку",()=>roll()<55?dd("🛶 Лодка сама отходит от берега и мягко утыкается в сваи. В письме адрес тайника под корнем вербы. Ты находишь его и забираешь кошель, а ключ остаётся у тебя в кармане.",{pn:15}):dd("🛶 Лодка внезапно кренится, и ты оказываешься по пояс в ледяной воде. Что-то хватает за ногу и отпускает. Ты выбираешься на берег, дрожа.",{hp:-6,md:2})],
  ["✉ Взять письмо с берега",()=>dd("✉ Ты осторожно тянешься с берега палкой и подцепляешь письмо. Внутри пара монет и короткая строка: «Вернись за ключом, когда будешь готов.»",{pn:4})],
  ["↩ Оттолкнуть лодку",()=>dd("↩ Ты отталкиваешь лодку от берега. Она тихо уплывает в туман, а на душе становится чуть спокойнее.",{md:-2})]]},
 l_lights:{art:"l_lights",t:"🕯 Над болотом плывут бледные огоньки. Они собираются цепочкой и уходят вглубь по гнилым мосткам. Кажется, что кто-то зовёт идти следом.\n\nГоворят, огоньки ведут либо к кладу, либо в трясину. Заранее не узнаешь.",ch:[

let last=0;
function loop(now){
  const dt=Math.min(50,now-(last||now));last=now;
  frT+=dt;if(frT>130){frT=0;fr++}
  if(B){for(const a of B.anim)a.t+=dt/1000;B.anim=B.anim.filter(a=>a.k==="die"||a.t<1.2);if(B.flash>0)B.flash-=dt/1000;if(B.shake>0)B.shake-=dt/1000;for(const f of fx)f.age+=dt/900;fx=fx.filter(f=>f.age<1)}
  if(S.st==="map"){
    if(!mv&&!held){
      if(path.length){const d=path.shift();tryMove(d);if(!mv){path=[];pend=null;mark=null}}
      else if(pend){const p=pend;pend=null;mark=null;const dx=p.x-S.x,dy=p.y-S.y;for(let d=0;d<4;d++)if(DX[d]===dx&&DY[d]===dy){S.dir=d;interact();break}}
      else if(mark&&mark.x===S.x&&mark.y===S.y)mark=null;
    }
    if(mv){mv.t+=dt/150;if(mv.t>=1){mv.t=1;stepDone();if(S.st==="map"&&!mv&&held!==0)tryMove(heldDir)}}
    else if(held)tryMove(heldDir);
  }
  dlgTick(dt);
  draw(now);
  requestAnimationFrame(loop);
}

/* ============ касания по экрану ============ */
function passable(m,x,y,goalX,goalY){
  if(solid(m,x,y)||npcAt(m,x,y))return false;
  if(x===goalX&&y===goalY)return true;
  return !m.warps.some(w=>w.x===x&&w.y===y);
}
function findPath(m,sx,sy,goals,gx,gy){
  const key=(x,y)=>y*100+x,prev=new Map([[key(sx,sy),null]]),q=[[sx,sy]];
  const isGoal=(x,y)=>goals.some(g=>g[0]===x&&g[1]===y);
  if(isGoal(sx,sy))return [];
  while(q.length){
    const [x,y]=q.shift();
    for(let d=0;d<4;d++){
      const nx=x+DX[d],ny=y+DY[d],k=key(nx,ny);
      if(prev.has(k)||!passable(m,nx,ny,gx,gy))continue;
      prev.set(k,[x,y,d]);
      if(isGoal(nx,ny)){const out=[];let c=k;while(prev.get(c)){const p=prev.get(c);out.unshift(p[2]);c=key(p[0],p[1])}return out}
      q.push([nx,ny]);
    }
  }
  return null;
}
cv.addEventListener("pointerdown",e=>{
  if(S.st!=="map")return;
  ac();e.preventDefault();
  const r=cv.getBoundingClientRect(),m=cur();
  const wx=(e.clientX-r.left)*(cv.width/r.width)/scale+Math.round(camX),wy=(e.clientY-r.top)*(cv.height/r.height)/scale+Math.round(camY);
  const tx=Math.floor(wx/TS),ty=Math.floor(wy/TS);
  if(tx<0||ty<0||tx>=m.w||ty>=m.h)return;
  const sx=mv?mv.tx:S.x,sy=mv?mv.ty:S.y;
  const npc=npcAt(m,tx,ty),ob=m.o[ty][tx],inter=npc||ob==="A"||ob==="+";
  if(inter){
    const goals=[];for(let d=0;d<4;d++){const nx=tx+DX[d],ny=ty+DY[d];if(!solid(m,nx,ny)&&!npcAt(m,nx,ny)&&!m.warps.some(w=>w.x===nx&&w.y===ny))goals.push([nx,ny])}
    const p=findPath(m,sx,sy,goals,-1,-1);
    if(p===null)return toast("Туда не пройти");
    path=p;pend={x:tx,y:ty};mark={x:tx,y:ty};
  }else{
    if(solid(m,tx,ty))return;
    const p=findPath(m,sx,sy,[[tx,ty]],tx,ty);
    if(p===null)return toast("Туда не пройти");
    path=p;pend=null;mark={x:tx,y:ty};
  }
  held=0;
});

/* ============ ввод ============ */
document.querySelectorAll("#pad button").forEach(b=>{
  const d=+b.dataset.d;
  b.addEventListener("pointerdown",e=>{e.preventDefault();ac();b.classList.add("on");b.setPointerCapture(e.pointerId);press(d)});
  const up=e=>{b.classList.remove("on");release(d)};
  b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("lostpointercapture",up);
});
$("#btnA").addEventListener("pointerdown",e=>{e.preventDefault();ac();interact()});
$("#btnM").addEventListener("click",()=>{ac();openMenu()});
const KD={ArrowDown:0,s:0,S:0,ArrowLeft:1,a:1,A:1,ArrowRight:2,d:2,D:2,ArrowUp:3,w:3,W:3};
addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT")return;
  if(e.repeat&&(e.key===" "||e.key==="Enter"))return;
  if(e.key in KD&&S.st==="map"){e.preventDefault();ac();press(KD[e.key])}
  else if(e.key===" "||e.key==="Enter"||e.key==="e"||e.key==="E"){e.preventDefault();ac();if(S.st==="map"||S.st==="dialog")interact()}
  else if(e.key==="Escape"||e.key==="m"){if(S.st==="map")openMenu();else if(S.st==="menu")closeMenu()}
});
addEventListener("keyup",e=>{if(e.key in KD)release(KD[e.key])});

/* ============ меню ============ */
function openMenu(){
  S.st="menu";setUI();held=0;
  const q=F.done?"Выполнено: артефакт запечатан.":F.amulet?"Отнеси артефакт капитану Ночных Ястребов.":F.elder?"Забрать запечатанный артефакт из склепа на севере Туманной рощи.":"Поговорить с капитаном Ночных Ястребов (дом справа от главной дороги).";
  $("#mbox").innerHTML="<h2>Потусторонний</h2><dl><dt>Уровень</dt><dd>"+P.lv+"</dd><dt>Здоровье</dt><dd>"+P.hp+" / "+maxHp()+"</dd><dt>Мана</dt><dd>"+P.mp+" / "+maxMp()+"</dd><dt>Сила удара</dt><dd>"+atk()+"</dd><dt>Опыт</dt><dd>"+P.xp+" / "+need()+"</dd><dt>Зелья</dt><dd>"+P.pot+"</dd><dt>Фунты</dt><dd>"+P.pn+" £</dd><dt>Безумие</dt><dd>"+P.md+" 🌀</dd></dl><div class='q'><b>Задание.</b> "+q+"</div><div class='rw'><button class='mbtn' id='mUse'"+(P.pot<1||P.hp>=maxHp()?" disabled":"")+">Выпить зелье</button><button class='mbtn' id='mSnd'>Звук: "+(sound?"вкл":"выкл")+"</button></div><div class='rw'><button class='mbtn' id='mProf'>Профиль</button><button class='mbtn' id='mChat'>Чат</button><button class='mbtn' id='mTop'>Топ</button></div><div class='rw'><button class='mbtn' id='mSave'>Сохранить</button><button class='mbtn pri' id='mBack'>Закрыть</button></div>";
  $("#menu").classList.add("show");
  $("#mBack").onclick=closeMenu;
  $("#mProf").onclick=()=>{$("#menu").classList.remove("show");openSoc("p")};$("#mChat").onclick=()=>{$("#menu").classList.remove("show");openSoc("c")};$("#mTop").onclick=()=>{$("#menu").classList.remove("show");openSoc("t")};
  $("#mSave").onclick=()=>{save();toast("Сохранено");closeMenu()};
  $("#mSnd").onclick=()=>{setSound(!sound);openMenu()};
  $("#mUse").onclick=()=>{if(P.pot>0&&P.hp<maxHp()){P.pot--;P.hp=Math.min(maxHp(),P.hp+25);snd("heal");openMenu()}};
}
function closeMenu(){$("#menu").classList.remove("show");S.st="map";setUI()}

/* ============ старт ============ */
function begin(newg){
  ac();ambient();
  if(newg){try{localStorage.removeItem("sumerki_save")}catch(e){}newGame()}else load();
  $("#title").classList.remove("show");$("#end").classList.remove("show");
  S.st="map";setUI();toastLoc();
  if(newg)setTimeout(()=>say([{t:"Туман над Тингеном. Тебя привела сюда весть о запечатанном артефакте, который теряет силу. Поговори с капитаном Ночных Ястребов, его участок справа от главной дороги."},{t:"Управление: нажми на землю, чтобы идти. Нажми на человека или алтарь, чтобы подойти и заговорить."}]),300);
}
document.querySelectorAll("#soctabs button").forEach(b=>b.onclick=()=>{ac();openSoc(b.dataset.t)});
$("#socX").onclick=closeSoc;
$("#tNew").onclick=()=>begin(true);
$("#tCont").onclick=()=>begin(false);
$("#eBack").onclick=()=>{$("#end").classList.remove("show");S.st="map";setUI()};
try{if(!localStorage.getItem("sumerki_save"))$("#tCont").style.display="none"}catch(e){$("#tCont").style.display="none"}
if(AURL)api({action:"load"}).then(d=>{try{if(d.ok&&d.sv&&!localStorage.getItem("sumerki_save")){localStorage.setItem("sumerki_save",JSON.stringify(d.sv));$("#tCont").style.display=""}}catch(e){}}).catch(()=>{});
try{const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}tg.setHeaderColor&&tg.setHeaderColor("#0b0912");tg.setBackgroundColor&&tg.setBackgroundColor("#0b0912")}}catch(e){}
resize();
// на титуле показываем деревню под затемнением
S.map="village";S.x=12;S.y=11;S.dir=3;
requestAnimationFrame(loop);
window.__g={EV,openEvent,evPick,openSoc,pushSave,AURL,get cam(){return [camX,camY,scale]},P,F,S,MAPS,startBattle,act,say,begin,warp,talk,get B(){return B}};
</script>

</body>
