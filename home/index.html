
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дом — Повелитель Тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Inter, Arial, sans-serif;
}

body {
  background:
    linear-gradient(rgba(10,10,14,.78), rgba(10,10,14,.94)),
    url('../i-72.jpeg') center/cover fixed no-repeat,
    #0a0a0e;
  color: #b8b5ad;
  min-height: 100vh;
}

.wrap {
  max-width: 440px;
  margin: 0 auto;
  padding: 10px 10px 60px;
}

.head {
  padding: 10px 0;
  display: flex;
  gap: 10px;
  align-items: center;
}

.head a {
  color: #b8b5ad;
  text-decoration: none;
  border: 1px solid #3a3a3e;
  border-radius: 8px;
  padding: 6px 10px;
}

.card {
  background: rgba(22,22,26,.90);
  border: 1px solid #3a3a3e;
  border-radius: 16px;
  padding: 14px;
  margin: 8px 0;
}

.btn {
  display: block;
  width: 100%;
  border: 1px solid #3a3a3e;
  background: rgba(38,38,42,.92);
  border-radius: 10px;
  padding: 13px;
  text-align: center;
  margin: 8px 0;
  color: #d4d0c3;
  font-size: 14px;
}

.btn:disabled {
  opacity: .8;
}

h1 {
  font-size: 18px;
  color: #d4d0c3;
  margin-bottom: 8px;
}

p {
  font-size: 12px;
  line-height: 1.5;
  opacity: .75;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="head">
    <a id="backProfile" href="../profileprofile/index.html">← Профиль</a>
    <b>🏠 Дом</b>
  </div>

  <div class="card">
    <h1>Твой дом</h1>
    <p>
      Твоё личное место. Здесь будут помещения,
      которые со временем можно будет развивать.
    </p>
  </div>

  <div class="card" aria-label="Помещения дома">
    <button class="btn" type="button" disabled>
      🧪 Лаборатория
    </button>

    <button class="btn" type="button" disabled>
      🐾 Вольер
    </button>

    <button class="btn" type="button" disabled>
      🌾 Ферма
    </button>
  </div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  const link = document.getElementById("backProfile");

  link.href = "../profileprofile/index.html" + location.search;
})();
</script>
</body>
</html>
