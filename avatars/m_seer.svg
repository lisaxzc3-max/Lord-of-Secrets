<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><style>
.br{animation:br 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.bob{animation:bob 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.eye{animation:eye 4.2s ease-in-out infinite}
.eye2{animation:eye 3.1s ease-in-out -1.2s infinite}
.fl{animation:fl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.dr{animation:dr 16s ease-in-out infinite alternate}
.dr2{animation:dr 22s ease-in-out -6s infinite alternate-reverse}
.sp{animation:sp 7s linear infinite}
.sp2{animation:sp 9s linear -3s infinite}
.sw{animation:sw 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pl{animation:pl 3.4s ease-in-out infinite}
@keyframes br{50%{transform:translateY(-2px) scaleY(1.014)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes eye{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fl{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(1.12) skewX(2deg)}60%{transform:scaleY(.94) skewX(-2deg)}}
@keyframes dr{to{transform:translateX(26px)}}
@keyframes sp{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-60px);opacity:0}}
@keyframes sw{50%{transform:rotate(1.6deg)}}
@keyframes pl{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#241a33"/><stop offset="1" stop-color="#070509"/></radialGradient>
<linearGradient id="mi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a92a6" stop-opacity="0"/><stop offset="1" stop-color="#9a92a6" stop-opacity=".42"/></linearGradient>
<radialGradient id="vg" cx="50%" cy="48%" r="72%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></radialGradient>
<pattern id="ht" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="4" stroke="#000" stroke-opacity=".38" stroke-width="1"/></pattern>
<pattern id="hd" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)"><line x1="0" y1="0" x2="0" y2="4" stroke="#8a7a58" stroke-opacity=".28" stroke-width=".9"/></pattern>
<filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bl"><feGaussianBlur stdDeviation="5"/></filter>
