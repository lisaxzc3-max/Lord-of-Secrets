 82 Q121 112 100 116 Q79 112 79 82 Z" fill="#bdb4a2" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><path d="M79 82 Q79 52 100 52 Q121 52 121 82 Q121 112 100 116 Q79 112 79 82 Z" fill="url(#ht)" opacity="1" /><path d="M86 66 L96 96 M116 70 L108 86" stroke="#a3262e" stroke-width="2"/><g class="eye" filter="url(#gl)"><circle cx="92" cy="80" r="2.8" fill="#d4343f"/><circle cx="92" cy="80" r="1.1" fill="#fff" opacity=".85"/></g><g class="eye2" filter="url(#gl)"><circle cx="108" cy="80" r="2.8" fill="#d4343f"/><circle cx="108" cy="80" r="1.1" fill="#fff" opacity=".85"/></g><path d="M84 74 L98 78 M116 74 L102 78" stroke="#050306" stroke-width="3"/><path d="M88 104 L112 104" stroke="#050306" stroke-width="2.2"/><path d="M92 104 l2 5 l2 -5 M104 104 l2 5 l2 -5" stroke="#cdbf9f" stroke-width="1" fill="#cdbf9f"/><path d="M72 70 Q66 40 84 34 L88 44 L96 28 L104 44 L114 30 L118 44 Q134 40 128 70 Q120 54 100 52 Q80 54 72 70 Z" fill="#0a070b" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><path d="M72 70 Q66 40 84 34 L88 44 L96 28 L104 44 L114 30 L118 44 Q134 40 128 70 Q120 54 100 52 Q80 54 72 70 Z" fill="url(#hd)" opacity="1" /><path d="M168 200 V108 M168 108 q-18 0 -18 16 q0 10 12 12 M168 108 q18 0 18 16 q0 10 -12 12 M156 120 H180" stroke="#7d93a6" stroke-width="3.4" fill="none" stroke-linecap="round"/><circle cx="168" cy="102" r="4" fill="none" stroke="#7d93a6" stroke-width="2"/><g class="dr"><ellipse cx="90" cy="182" rx="130" ry="19.0" fill="#9a92a6" opacity="0.315" filter="url(#bl)"/><ellipse cx="150" cy="189.6" rx="90" ry="15.833333333333334" fill="#b0a8bb" opacity="0.27" filter="url(#bl)"/></g><rect width="200" height="200" fill="url(#vg)"/><rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#8a7a58" stroke-opacity=".45" stroke-width="1"/></svg>
