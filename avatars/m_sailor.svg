ll="#0a070b" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><path d="M72 60 Q100 42 128 60 L130 66 Q100 54 70 66 Z" fill="url(#hd)" opacity="1" /><path d="M70 60 Q100 38 130 60 L126 52 Q100 30 74 52 Z" fill="#0a070b" stroke="#8a7a58" stroke-width="1.2" stroke-linejoin="round" /><path d="M70 60 Q100 38 130 60 L126 52 Q100 30 74 52 Z" fill="url(#hd)" opacity="1" /><path d="M100 40 v8" stroke="#8a7a58" stroke-width="2"/><path d="M168 200 V112 M168 112 q-16 0 -16 14 q0 8 10 10 M168 112 q16 0 16 14 q0 8 -10 10 M158 124 H178" stroke="#7d93a6" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/><g class="dr"><ellipse cx="90" cy="182" rx="130" ry="19.0" fill="#9a92a6" opacity="0.315" filter="url(#bl)"/><ellipse cx="150" cy="189.6" rx="90" ry="15.833333333333334" fill="#b0a8bb" opacity="0.27" filter="url(#bl)"/></g><rect width="200" height="200" fill="url(#vg)"/><rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#8a7a58" stroke-opacity=".45" stroke-width="1"/></svg>
