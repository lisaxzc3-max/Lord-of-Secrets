<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><style>
.br{animation:br 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.bob{animation:bob 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.eye{animation:eye 4.2s ease-in-out infinite}
.eye2{animation:eye 3.1s ease-in-out -1.2s infinite}
.fl{animation:fl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fl2{animation:fl 1.9s ease-in-out -.7s infinite;transform-box:fill-box;transform-origin:50% 100%}
.dr{animation:dr 18s ease-in-out infinite alternate}
.dr2{animation:dr 24s ease-in-out -6s infinite alternate-reverse}
.sp{animation:sp 6s linear infinite}
.sp2{animation:sp 8s linear -3s infinite}
.sp3{animation:sp 7s linear -5s infinite}
.sw{animation:sw 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sw2{animation:sw 5s ease-in-out -2s infinite;transform-box:fill-box;transform-origin:50% 0%}
.pl{animation:pl 3.4s ease-in-out infinite}
.wg{animation:wg 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes br{50%{transform:translateY(-2px) scaleY(1.014)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes eye{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fl{0%,100%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(1.14) skewX(3deg)}60%{transform:scaleY(.92) skewX(-3deg)}}
@keyframes dr{to{transform:translateX(26px)}}
@keyframes sp{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-70px);opacity:0}}
@keyframes sw{50%{transform:rotate(1.8deg)}}
@keyframes pl{50%{opacity:.35}}
@keyframes wg{50%{transform:scaleY(.96) rotate(-1deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<radialGradient id="bg" cx="50%" cy="42%" r="80%"><stop offset="0" stop-color="#2c1510"/><stop offset="1" stop-color="#07050a"/></radialGradient>
<radialGradient id="gw" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8a3a" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/></radialGradient>
<radialGradient id="vg" cx="50%" cy="48%" r="72%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient>
<pattern id="ht" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><line x1="0" y1="0" x2="0" y2="4" stroke="#000" stroke-opacity=".4" stroke-width="1"/></pattern>
<pattern id="hd" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)"><line x1="0" y1="0" x2="0" y2="4" stroke="#a98a5a" stroke-opacity=".28" stroke-width=".9"/></pattern>
<filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bl"><feGaussianBlur stdDeviation="5"/></filter>
