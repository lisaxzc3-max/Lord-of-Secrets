 176 Q82 108 100 96 Q118 108 120 176 Z" fill="#8a1410" stroke="#a98a5a" stroke-width="1.3" stroke-linejoin="round" /><path d="M80 176 Q82 108 100 96 Q118 108 120 176 Z" fill="url(#hd)" opacity="1"/><circle cx="100" cy="86" r="10" fill="#1a0a09" stroke="#a98a5a" stroke-opacity=".5"/><g class="pl"><circle cx="100" cy="86" r="18" fill="url(#gw)"/></g><path d="M72 120 Q50 100 44 76 M128 120 Q150 100 156 76" stroke="#8a1410" stroke-width="3" fill="none"/><g fill="#a98a5a" opacity=".7" font-family="serif" font-size="7"><text x="42" y="66">ᚠᚱᛟ</text><text x="88" y="62">ᛉᚦᚨ</text><text x="136" y="66">ᚲᚷᚹ</text></g><g class="pl"><rect x="126" y="58" width="22" height="2" fill="#d4342a"/></g><path d="M30 40 l8 30 l-6 20 M168 40 l-6 24 l8 18" stroke="#050304" stroke-width="1.2" fill="none"/><g class="dr"><ellipse cx="90" cy="182" rx="130" ry="19" fill="#a08a7a" opacity=".26" filter="url(#bl)"/><ellipse cx="150" cy="189" rx="90" ry="15" fill="#b49a8a" opacity=".22" filter="url(#bl)"/></g><circle class="sp" cx="176" cy="186" r="1.8" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="13" cy="141" r="1.2" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="33" cy="133" r="1.3" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="122" cy="183" r="0.9" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="100" cy="121" r="1.5" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="75" cy="124" r="1.7" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="76" cy="132" r="1.0" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="75" cy="173" r="1.2" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="61" cy="188" r="1.4" fill="#ff8a3a" filter="url(#gl)"/><rect width="200" height="200" fill="url(#vg)"/><rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#a98a5a" stroke-opacity=".45" stroke-width="1"/></svg>