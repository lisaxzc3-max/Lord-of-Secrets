ill="#8a1410"/><ellipse cx="100" cy="99" rx="14" ry="2.6" fill="#d4342a" class="pl"/><g class="fl"><path d="M100 98 Q88 84 96 70 Q100 80 104 72 Q112 86 100 98 Z" fill="#ff7a22"/></g><g class="pl"><path d="M64 80 q4 -6 8 0 M128 74 q4 -6 8 0 M92 60 q4 -6 8 0" stroke="#d4342a" stroke-width="1.4" fill="none"/></g><g class="dr"><ellipse cx="90" cy="182" rx="130" ry="19" fill="#a08a7a" opacity=".26" filter="url(#bl)"/><ellipse cx="150" cy="189" rx="90" ry="15" fill="#b49a8a" opacity=".22" filter="url(#bl)"/></g><circle class="sp2" cx="40" cy="168" r="1.5" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="162" cy="189" r="1.3" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="43" cy="157" r="1.7" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="77" cy="161" r="0.9" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="176" cy="169" r="1.3" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="149" cy="148" r="1.3" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="107" cy="169" r="1.5" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="14" cy="172" r="0.9" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="92" cy="159" r="1.2" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="37" cy="167" r="1.3" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="23" cy="134" r="1.5" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="146" cy="173" r="1.4" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="23" cy="159" r="1.4" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="46" cy="185" r="1.8" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="63" cy="187" r="1.4" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="189" cy="147" r="0.8" fill="#ff8a3a" filter="url(#gl)"/><rect width="200" height="200" fill="url(#vg)"/><rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#a98a5a" stroke-opacity=".45" stroke-width="1"/></svg>