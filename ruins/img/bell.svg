ont-size="6" opacity=".8"><text x="84" y="124">ᚠ ᚱ ᛟ</text><text x="82" y="142">ᛉ ᚦ ᚨ</text></g><ellipse cx="100" cy="166" rx="36" ry="7" fill="#0a0606"/></g><g class="pl"><path d="M44 150 q10 -10 0 -20 M156 150 q-10 -10 0 -20 M30 160 q16 -16 0 -34 M170 160 q-16 -16 0 -34" stroke="#d9b26a" stroke-width="1.2" fill="none" opacity=".5"/></g><g class="dr"><ellipse cx="90" cy="182" rx="130" ry="19" fill="#a08a7a" opacity=".26" filter="url(#bl)"/><ellipse cx="150" cy="189" rx="90" ry="15" fill="#b49a8a" opacity=".22" filter="url(#bl)"/></g><circle class="sp3" cx="145" cy="134" r="1.0" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="108" cy="129" r="1.8" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="18" cy="168" r="1.4" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="87" cy="137" r="1.6" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="162" cy="175" r="1.9" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="130" cy="180" r="1.0" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp2" cx="118" cy="179" r="1.9" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp3" cx="54" cy="161" r="0.8" fill="#ff8a3a" filter="url(#gl)"/><circle class="sp" cx="63" cy="158" r="0.9" fill="#ff8a3a" filter="url(#gl)"/><rect width="200" height="200" fill="url(#vg)"/><rect x="1.5" y="1.5" width="197" height="197" fill="none" stroke="#a98a5a" stroke-opacity=".45" stroke-width="1"/></svg>