<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Руины · Сражение</title>

<script src="../../shared/fast.js"></script>

</head>
<body>
<div id="app"></div>
<script>
/* Настройки локации. Весь остальной код боя общий: shared/battle/page.js */
window.BATTLE_CFG={
 title:"Руины",
 back:"← Руины",
 backDefeat:"← В руины",
 bg:"loc_ruins.jpg",
 bgPos:"50% 100%",
 mist:"#d0b8a026",
 p2glow:"#ff4a7acc",
 shield:"#cfd8e8cc",
 explore:"explore_ruins",
 enemyDefault:"Фанатик с кинжалом",
 mobDefault:"fanatic",
 intro:"Из темноты под сводами выходит противник.",
 win:"Эхо стихает под сводами. Среди камней остаётся награда.",
 note:"Руины помнят каждого, кто приходил сюда.",
 back_hint:"Вернись в руины",
 enter:n=>"Из темноты под сводами выходит противник: "+n+".",
 boss:{msg:"В главном зале, под рухнувшим куполом, горит алтарь. Верховный жрец стоит спиной к тебе и дочитывает последнюю строку обряда. Он знает, что ты здесь.",icon:"💀",color:"#ff8a3c",banner:n=>"БОСС: ВЕРХОВНЫЙ ЖРЕЦ"},
 chips:{sleep:["hero","😵 Оцепенение"],weak:["hero","🔻 Слабость ×{n}"],poison:["hero","☠ Яд ×{n}"],shield:["foe","🛡 Щит"]},
 sleepIcon:"😵",
 mob:{"Фанатик с кинжалом":"fanatic","Каменная горгулья":"gargoyle","Одержимый стражник":"guard","Крыса-мутант":"ratmut","Пепельный культист":"cultist","Верховный жрец":"priest"},
 p2:{priest:"priest2"},
 role:{"Фанатик с кинжалом":"Сектант","Каменная горгулья":"Страж-статуя","Одержимый стражник":"Одержимый","Крыса-мутант":"Мутант","Пепельный культист":"Маг-сектант","Верховный жрец":"Босс"},
 mobsnd:{"Фанатик с кинжалом":"cmrattle","Каменная горгулья":"cmrumble","Одержимый стражник":"cmcreak","Крыса-мутант":"cmgrowl","Пепельный культист":"cmritual","Верховный жрец":"cmtoll"},
 skipRx:/спит|усып|оглуш|пропуска|не может действ|скован|обездвиж|в ловушке/i,
 castRx:/Молитва рвения|Каменная кожа|Стойка стража|Юркнула в щель|Заклинание пепла|Рассеивается пеплом|Призыв прислужников|Проклятие культа|Алтарь жертвы|Высасывание жертвы|Регенерация/,
 castColor:txt=>/Алтарь|Призыв|Молитва/.test(txt)?"#ff8a3a":/Проклятие/.test(txt)?"#b86bff":/Кожа|Стойка/.test(txt)?"#cfc3aa":"#d8b090",
 bossFx:function(text,X){const {st,B,banner,snd,$,P2}=X;
  if(!text)return{heavy:0};
  let heavy=0;
  const E=$("enemyFrame");
  const setsShield=/Каменная кожа|Стойка стража|Призыв прислужников|Алтарь жертвы/.test(text);
  if(/ЧЁРНАЯ ЛИТУРГИЯ/.test(text)){B.flash("#ff7a3a");banner("ЧЁРНАЯ ЛИТУРГИЯ","#ff7a3a");B.shake(2);snd("phase");X.phase2()}
  if(/Молитва рвения/.test(text)){B.aura("foe","#ff8a3a",900);banner("МОЛИТВА","#ff8a3a")}
  if(/Жертвенный удар|Выпад|Бросок из тьмы|Бросок из темноты/.test(text))heavy=1;
  if(/Отравленный кинжал|Гнилой укус/.test(text))B.aura("hero","#9bff6a",800);
  if(/Каменная кожа/.test(text)){st.shield=1;B.aura("foe","#cfc3aa",900);banner("КАМЕННАЯ КОЖА","#cfc3aa")}
  if(/Каменный кулак/.test(text))heavy=2;
  if(/Удар крыла|Пике с высоты/.test(text))heavy=1;
  if(/Стойка стража/.test(text)){st.shield=1;B.aura("foe","#9aa0b8",900)}
  if(/Рассекающий удар/.test(text))heavy=1;
  if(/Чужая воля/.test(text)){B.flash("#b66cff");B.aura("hero","#b66cff",800);banner("ЧУЖАЯ ВОЛЯ","#b66cff")}
  E.classList.toggle("burrow",/Юркнула в щель/.test(text));
  E.classList.toggle("fadeOut",/Рассеивается пеплом/.test(text));
  if(/Пепельный огонь|Огненный шар/.test(text))B.aura("hero","#ff7a22",800);
  if(/Заклинание пепла/.test(text)){banner("ПЕПЕЛ","#d8b090");st.weak=2}
  if(/Призыв прислужников/.test(text)){st.shield=1;B.aura("foe","#ff8a3a",1000);banner("ПРИСЛУЖНИКИ","#ff8a3a")}
  if(/Кара культа|Жертвенный нож|Гнев культа/.test(text))heavy=Math.max(heavy,/нож/.test(text)?2:1);
  if(/Проклятие культа/.test(text)){banner("ПРОКЛЯТИЕ","#b86bff");st.weak=2;st.poison=3}
  if(/Алтарь жертвы/.test(text)){st.shield=1;B.aura("foe","#ff4a4a",1000);banner("АЛТАРЬ","#ff4a4a")}
  if(/Высасывание жертвы|Регенерация/.test(text)||/💚\+/.test(text))B.aura("foe","#7be3a0",900);
  if(/оцепенел/.test(text)){st.sleep=1;banner("ОЦЕПЕНЕНИЕ","#7aa8ff")}
  if(/яд \d×\d|кислота|☠-\d/.test(text)){st.poison=3;B.aura("hero","#6dff7a",800)}
  if(/урон −25%/.test(text))st.weak=2;
  if(/увернулся/.test(text))B.floatNum("foe","Мимо","miss");
  if(!setsShield&&st.shield>0&&/Удар|Рассекающий|Кара|Нож|Гнев|Кулак|Пике|Выпад|Бросок|Крыла/.test(text))st.shield=0;
  return{heavy};
 }
};
</script>
<script src="../../shared/battle/page.js?v=p2"></script>

<script src="../../shared/icons.js?v=i1"></script>
</body>
</html>
