<style>

 seer:{a:"#a58bff",b:"#5a3fa0",glow:"#d8c8ff",faces:["🎭","🃏","😶","🤡","👁"],sym:"𓂀",nm:"Клоун"},
 sailor:{a:"#5fb8ff",b:"#1d5a9a",glow:"#c8e8ff",faces:["🌊","⚓","💀","⚡","🐚"],sym:"⚓",nm:"Народ Ярости"},
 hunter:{a:"#ff6a4a",b:"#8a2a1a",glow:"#ffd0b8",faces:["🐺","🔥","💀","🩸","🌑"],sym:"🏹",nm:"Провокатор"}

 {t:"Глоток",at:0,fx:["flash","shake","pulse"],who:"Ты",L:{

 {t:"Голоса",at:.12,fx:["eyes","whisper"],who:"Шёпот",L:{
  seer:["«Смейся… смейся… никто не заметит, что это маска».","Из темноты по краям зала складываются шёпоты, и каждый знает твоё имя.","Ты: «Это только сон». Шёпот: «Сон тоже умеет кусаться»."],

 {t:"Лица",at:.28,fx:["faces","shake"],who:"Голос из тумана",L:{

 var w=innerWidth,h=innerHeight,path="";
 for(var k=0;k<5;k++){var x=w*(.2+Math.random()*.6),y=h*.1,d="M"+x+" "+y;for(var j=0;j<9;j++){x+=(Math.random()-.5)*70;y+=h*.07+Math.random()*30;d+=" L"+x+" "+y}path+=d+" "}
 s.innerHTML='<svg width="100%" height="100%" viewBox="0 0 '+w+' '+h+'"><path d="'+path+'" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" style="filter:drop-shadow(0 0 8px '+pal().a+')"/></svg>';
 addFx(s,2600);
}
var RING=.3,RING_T=.3; // яркость круга
function runFx(list){
 list.forEach(function(f){
  if(f==="flash"){flash(f==="flash"?"#fff":"#fff",.75,1100);snd("seqpulse")}
  else if(f==="shake"){shake("shake")}
  else if(f==="shake2"){shake("shake2")}
  else if(f==="pulse"){RING_T=Math.min(1,RING_T+.25);snd("seqpulse")}
  else if(f==="eyes"){eyes(5)}
  else if(f==="whisper"){whisper();snd("seqwhisper")}
  else if(f==="faces"){faces(6);snd("whisper")}
  else if(f==="crack"){cracks();snd("cmtoll")}
  else if(f==="red"){redPulse()}
  else if(f==="dawn"){flash("#ffe9a8",.5,2600);RING_T=1;snd("bell")}
 });
}

/* ---------- диалог ---------- */
var tx=$("tx"),who=$("who"),nx=$("nx");
function startChapter(i){
 P.chIdx=i;P.li=0;var c=CH[i];
 var nm=$("chName");nm.textContent="Видение "+(i+1)+" · "+c.t;nm.classList.remove("on");void nm.offsetWidth;nm.classList.add("on");
 who.textContent=c.who;
 runFx(c.fx);
 setLine();
}
function lines(){return CH[P.chIdx].L[P.path]||CH[P.chIdx].L.seer}
function setLine(){
 P.line=lines()[P.li];P.typed=0;P.typeT=0;P.lineDone=false;tx.classList.remove("dim");nx.classList.remove("on");
 if(P.li>0&&CH[P.chIdx].who==="Ты"&&/^Ты:/.test(P.line))who.textContent="Ты";
}
function nextLine(){
 if(!P.lineDone){P.typed=P.line.length;return}
 if(P.li<lines().length-1){P.li++;setLine();snd("vntick");return}
 P.li=lines().length; // очередь прочитана
 showIdle();
}
function showIdle(){
 P.lineDone=true;nx.classList.remove("on");P.idle=true;
}
$("vn").addEventListener("pointerdown",function(){if(!P.ended&&!P.idle)nextLine()});

/* ---------- сцена (canvas) ---------- */
var cv=$("cv"),g=cv.getContext("2d"),W=0,H=0,DPR=1;
var PARTS=[],FOG=[];
function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
 PARTS=[];for(var i=0;i<36;i++)PARTS.push({x:Math.random()*W,y:Math.random()*H,v:.12+Math.random()*.4,a:Math.random()*6.28,s:10+Math.random()*14,c:"ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ"[(Math.random()*24)|0]});
 FOG=[];for(var j=0;j<6;j++)FOG.push({x:Math.random()*W,y:H*(.35+Math.random()*.55),r:W*(.35+Math.random()*.35),v:(Math.random()-.5)*.25,a:.03+Math.random()*.04});
}
addEventListener("resize",resize);
function rgba(hex,a){var n=parseInt(hex.slice(1),16);return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")"}
function draw(t){
 g.setTransform(DPR,0,0,DPR,0,0);
 var p=pal(),pr=P.prog,cx=W/2,cy=(H<520?H*.5:H*.46),rx=Math.min(W*.42,H*.6),ry=rx*.3;
 RING+=(RING_T-RING)*.02;
 // фон
 var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#04020a");bg.addColorStop(.55,"#0d0716");bg.addColorStop(1,"#08040d");
 g.fillStyle=bg;g.fillRect(0,0,W,H);
 // готическая арка-окно
 var ax=cx,aw=Math.min(W*.3,150),ah=H*.5;
 g.save();g.beginPath();g.moveTo(ax-aw,ah);g.lineTo(ax-aw,ah*.45);g.quadraticCurveTo(ax-aw,ah*.1,ax,0);g.quadraticCurveTo(ax+aw,ah*.1,ax+aw,ah*.45);g.lineTo(ax+aw,ah);g.closePath();
 var wg=g.createLinearGradient(0,0,0,ah);wg.addColorStop(0,rgba(p.glow,.10+.12*pr));wg.addColorStop(1,rgba(p.a,.02));g.fillStyle=wg;g.fill();
 g.strokeStyle=rgba(p.glow,.18);g.lineWidth=1.5;g.stroke();
 g.beginPath();g.moveTo(ax,0);g.lineTo(ax,ah);g.moveTo(ax-aw,ah*.55);g.lineTo(ax+aw,ah*.55);g.strokeStyle=rgba(p.glow,.1);g.stroke();g.restore();
 // луч
 g.save();g.globalCompositeOperation="lighter";
 var lb=g.createLinearGradient(0,ah*.3,0,cy);lb.addColorStop(0,rgba(p.glow,.10+.12*pr));lb.addColorStop(1,rgba(p.a,0));
 g.fillStyle=lb;g.beginPath();g.moveTo(ax-aw*.8,ah*.4);g.lineTo(ax+aw*.8,ah*.4);g.lineTo(cx+rx*.55,cy);g.lineTo(cx-rx*.55,cy);g.closePath();g.fill();g.restore();
 // пол
 var fg=g.createRadialGradient(cx,cy,5,cx,cy,rx*1.2);fg.addColorStop(0,rgba(p.b,.35+.25*RING));fg.addColorStop(1,"rgba(0,0,0,0)");
 g.fillStyle=fg;g.beginPath();g.ellipse(cx,cy,rx*1.25,ry*1.5,0,0,6.283);g.fill();
 // круг
 g.save();g.translate(cx,cy);g.scale(1,ry/rx);
 for(var r=0;r<3;r++){
  var R=rx*(.55+r*.22);g.beginPath();g.arc(0,0,R,0,6.283);g.setLineDash([5+r*5,8+r*4]);g.lineDashOffset=t*18*(r%2?-1:1);
  g.strokeStyle=rgba(p.a,.35+.5*RING);g.lineWidth=1.6+RING;g.shadowColor=p.a;g.shadowBlur=8+16*RING;g.stroke();
 }
 g.setLineDash([]);g.shadowBlur=0;
 var RU="ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊ";g.font=Math.round(rx*.085)+"px serif";g.textAlign="center";g.fillStyle=rgba(p.glow,.35+.5*RING);
 for(var k=0;k<16;k++){var an=k/16*6.283+t*.15;g.save();g.translate(Math.cos(an)*rx*.99,Math.sin(an)*rx*.99);g.rotate(an+1.5708);g.fillText(RU[k],0,0);g.restore()}
 // звезда
 g.beginPath();for(var s=0;s<5;s++){var a1=s/5*6.283*2-1.5708+t*.05;var x1=Math.cos(a1)*rx*.54,y1=Math.sin(a1)*rx*.54;s?g.lineTo(x1,y1):g.moveTo(x1,y1)}g.closePath();
 g.strokeStyle=rgba(p.glow,.25+.4*RING);g.lineWidth=1.3;g.stroke();
 g.restore();
 // свечи + фигура
 var C=[];for(var i=0;i<7;i++){var an2=i/7*6.283+.4;C.push({x:cx+Math.cos(an2)*rx*1.02,y:cy+Math.sin(an2)*ry*1.02,i:i})}
 function candle(c){
  var fl=.8+.2*Math.sin(t*9+c.i*2.1)+.07*Math.sin(t*23+c.i),hh=H<520?14:20;
  g.fillStyle="#d8ccb4";g.fillRect(c.x-3,c.y-hh,6,hh);g.fillStyle="#8a7e68";g.fillRect(c.x+1,c.y-hh,2,hh);
  g.save();g.globalCompositeOperation="lighter";var gr=g.createRadialGradient(c.x,c.y-hh-6,1,c.x,c.y-hh-6,70);gr.addColorStop(0,rgba("#ffb85a",.4*fl));gr.addColorStop(1,"rgba(255,120,30,0)");g.fillStyle=gr;g.fillRect(c.x-70,c.y-hh-76,140,140);g.restore();
  g.beginPath();g.moveTo(c.x,c.y-hh-14*fl);g.quadraticCurveTo(c.x+5,c.y-hh-5,c.x,c.y-hh);g.quadraticCurveTo(c.x-5,c.y-hh-5,c.x,c.y-hh-14*fl);g.fillStyle=fl>.95?"#fff2c8":"#ffd27a";g.fill();
 }
 C.filter(function(c){return c.y<cy}).forEach(candle);
 // фигура
 var fh=Math.min(H*.34,190),fy=cy+ry*.2+Math.sin(t*.9)*3;
 g.save();g.translate(cx,fy);
 var aura=g.createRadialGradient(0,-fh*.55,3,0,-fh*.55,fh*(.9+.15*Math.sin(t*1.7)));aura.addColorStop(0,rgba(p.glow,.18+.2*RING));aura.addColorStop(1,rgba(p.a,0));
 g.globalCompositeOperation="lighter";g.fillStyle=aura;g.fillRect(-fh,-fh*1.6,fh*2,fh*1.8);g.globalCompositeOperation="source-over";
 g.beginPath();g.moveTo(-fh*.46,0);g.bezierCurveTo(-fh*.4,-fh*.35,-fh*.24,-fh*.55,-fh*.15,-fh*.72);g.bezierCurveTo(-fh*.11,-fh*.97,fh*.11,-fh*.97,fh*.15,-fh*.72);g.bezierCurveTo(fh*.24,-fh*.55,fh*.4,-fh*.35,fh*.46,0);g.closePath();
 var bd=g.createLinearGradient(0,-fh,0,0);bd.addColorStop(0,"#1a1226");bd.addColorStop(1,"#07040c");g.fillStyle=bd;g.fill();
 g.strokeStyle=rgba(p.a,.55+.35*RING);g.lineWidth=1.6;g.shadowColor=p.a;g.shadowBlur=10;g.stroke();g.shadowBlur=0;
 g.beginPath();g.ellipse(0,-fh*.74,fh*.085,fh*.115,0,0,6.283);g.fillStyle="#000";g.fill();
 var ea=Math.min(1,pr*6);if(P.chIdx>=0){g.fillStyle=rgba(p.glow,.4+.6*ea*(.7+.3*Math.sin(t*3)));g.shadowColor=p.glow;g.shadowBlur=10;
  g.beginPath();g.arc(-fh*.032,-fh*.75,fh*.011,0,6.283);g.arc(fh*.032,-fh*.75,fh*.011,0,6.283);g.fill();g.shadowBlur=0}
 g.restore();
 C.filter(function(c){return c.y>=cy}).forEach(candle);
 // руны вверх
 PARTS.forEach(function(q){q.y-=q.v;q.x+=Math.sin(t*.8+q.a)*.25;if(q.y<-20){q.y=H+10;q.x=Math.random()*W}
  g.globalAlpha=(.1+.28*Math.abs(Math.sin(t*.7+q.a)))*(.5+RING*.7);g.fillStyle=p.glow;g.font=q.s+"px serif";g.fillText(q.c,q.x,q.y)});g.globalAlpha=1;
 // туман
 FOG.forEach(function(f){f.x+=f.v;if(f.x<-f.r)f.x=W+f.r;if(f.x>W+f.r)f.x=-f.r;
  var gr=g.createRadialGradient(f.x,f.y,10,f.x,f.y,f.r);var al=f.a*(1-.7*(P.chIdx>=5?Math.min(1,(pr-.88)*8):0));gr.addColorStop(0,"rgba(190,180,215,"+al+")");gr.addColorStop(1,"rgba(190,180,215,0)");g.fillStyle=gr;g.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2)});
}

/* ---------- основной цикл ---------- */
var last=0;
function loop(now){
 var dt=Math.min(.05,(now-last)/1000||.016);last=now;
 var t=now/1000;
 if(P.dur){
  var rem=Math.max(0,(P.end-Date.now())/1000);P.left=rem;
  $("tmv").textContent=fmt(Math.ceil(rem));
  P.prog=Math.min(1,1-rem/P.dur);setProg(P.prog);
  var idx=-1;for(var i=0;i<CH.length;i++)if(P.prog>=CH[i].at)idx=i;
  if(idx!==P.chIdx&&idx>=0&&!P.ended){P.idle=false;startChapter(idx)}
  // печать
  if(!P.lineDone&&P.line){P.typeT+=dt;while(P.typeT>.028&&P.typed<P.line.length){P.typeT-=.028;P.typed++;if(P.typed%4===0)snd("vntick")}
   tx.textContent=P.line.slice(0,P.typed);
   if(P.typed>=P.line.length){P.lineDone=true;P.autoAt=Date.now()+4200+P.line.length*38;nx.classList.add("on")}}
  else if(P.lineDone&&!P.idle&&P.autoAt&&Date.now()>P.autoAt){P.autoAt=0;nextLine()}
  if(P.idle){var nxt=P.chIdx<CH.length-1?CH[P.chIdx+1].at:1;var secs=Math.max(0,(nxt-P.prog)*P.dur);tx.classList.add("dim");tx.textContent=(P.chIdx<CH.length-1?"Следующее видение через ":"Обряд завершится через ")+fmt(Math.ceil(secs))+"…"}
  // пульс/шёпот/лица
  var pe=2.6-1.5*P.prog;if(Date.now()-P.lastPulse>pe*1000){P.lastPulse=Date.now();snd("seqpulse");RING=Math.min(1,RING+.18)}
  if(Date.now()-P.lastWh>9000){P.lastWh=Date.now();whisper();if(Math.random()<.5)snd("seqwhisper")}
  if(P.chIdx>=2&&Date.now()-P.lastFace>20000){P.lastFace=Date.now();faces(2)}
  if(rem<=0&&!P.ended)finish();
 }
 draw(t);
 requestAnimationFrame(loop);
}

/* ---------- финал ---------- */
async function finish(){
 P.ended=true;ls("lotm_seq_end","0");
 $("lock").style.display="none";
 flash("#fff",1,2400);snd("seqdone");setTimeout(function(){snd("bell")},1600);
 var d=null,tries=0;
 while(!d&&tries<40){try{d=await loadProfile()}catch(e){tries++;await new Promise(function(r){setTimeout(r,2500)})}}
 var pk=(d&&(d.path_key||d.path))||P.path;
 if(!PAL[pk])pk=P.path;
 var nm=(d&&d.sequence_name)||PAL[pk].nm;
 if(d&&d.seq_done&&d.seq_done.name)nm=d.seq_done.name;
 $("endH").textContent=nm;
 var gnd=d&&d.gender==="female"?"f":"m";
 var im=new Image();im.onload=function(){$("endAv").replaceChildren(im)};im.src="../avatars/"+gnd+"_"+pk+"8.webp";
 $("end").classList.add("on");setTimeout(function(){$("end").classList.add("show")},60);
 $("vn").style.display="none";$("hud").style.opacity=0;$("prog").style.opacity=0;$("chName").style.opacity=0;
}
$("endBtn").addEventListener("click",function(){
 snd("tap");
 var p=new URLSearchParams(location.search);["demo","t","path"].forEach(function(k){p.delete(k)});
 location.href="../index.html?"+p.toString();
});

/* ---------- запуск ---------- */
async function boot(){
 resize();buildProg();
 requestAnimationFrame(loop);
 var d;
 try{d=await loadProfile()}catch(e){
  if(e&&e.message==="need_start"){location.replace("../index.html"+location.search);return}
  showErr("Нет связи с сервером. Пробую снова…");
  setTimeout(boot,3500);return;
 }
 var pk=String(d.path_key||"");P.path=PAL[pk]?pk:"seer";P.gender=d.gender||"male";applyPal();
 var left=Number(d.seq_left)||0;
 if(left>0){
  P.dur=Number(d.seq_dur)||left;P.end=Date.now()+left*1000;ls("lotm_seq_end",String(P.end));
  try{window.sndMusic&&sndMusic("cemetery")}catch(e){}
  snd("seqstart");
 }else{
  ls("lotm_seq_end","0");
  if(d.seq_done||Number(d.sequence)<=8){ // переход уже закончился
   P.dur=1;P.end=Date.now();P.prog=1;P.ended=true;finish();
  }else{location.replace("../index.html"+location.search)}
 }
}
// не даём уйти назад
history.pushState(null,"",location.href);
addEventListener("popstate",function(){history.pushState(null,"",location.href)});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&P.end&&Date.now()>=P.end&&!P.ended)finish()});
boot();
window.__P=P;
})();
</script>
