#vn{position:absolute;left:6px;right:6px;bottom:calc(4px + var(--sab));max-width:720px;margin:0 auto;aspect-ratio:2/.92;padding:17% 11% 8%;background:center/100% 100% no-repeat;filter:drop-shadow(0 0 14px #000c);display:flex;flex-direction:column;justify-content:center}

#end .av{display:none;width:150px;height:150px;margin:16px 0 8px;border-radius:50%;border:2px solid #fff3cf;background:#0b0710 center/cover;box-shadow:0 0 50px #ffe9a8aa,0 0 0 8px #ffffff18;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:64px}

#end button{padding:13px 34px;border-radius:30px;border:1px solid #fff3cf;background:#0b0710dd;color:#fff3cf;font:15px Georgia,serif;letter-spacing:.12em;cursor:pointer}

#err{position:absolute;left:10px;right:10px;top:calc(90px + var(--sat));padding:9px 12px;border-radius:10px;background:#3a1620f2;border:1px solid #d9443c;color:#ffd0cc;font-size:12px;display:none;text-align:center}
@media (max-height:520px){#vn{min-height:0;padding:10px 14px 8px;left:auto;right:10px;width:56%;bottom:6px}#tx{min-height:54px;font-size:13px}#lock{display:none}#tm b{font-size:20px}}
@media (prefers-reduced-motion:reduce){#stage.shake,#stage.shake2{animation:none}.face,.wh,.eye{animation-duration:3s}}
</style>

 seer:{a:"#a58bff",b:"#5a3fa0",glow:"#d8c8ff",faces:["🎭","🃏","😶","🤡","👁"],sym:"𓂀",nm:"Клоун"},

};

};
var CH=[
 {t:"Глоток",at:0,fx:["flash","shake","pulse"],who:"Ты",L7:{seer:["Зелье вспыхивает на языке, как магниевая лента. Склянка исчезает прежде, чем ты успеваешь разжать пальцы.", "Свечи гаснут все разом и зажигаются снова уже без огня. Свет идёт от них, а тепла нет.", "Занавес в твоей голове поднимается сам. Ты знаешь, что сейчас начнётся фокус, и знаешь, что фокусник здесь ты."],sailor:["Зелье бьёт в голову компасной стрелкой. Все стороны света разом показывают на тебя.", "Свечи вытягиваются в струнки, словно паруса при внезапном ветре.", "Пол дрожит и становится тёмной водой. Где-то далеко звонит корабельный колокол."],hunter:["Зелье вспыхивает во рту фитилём. Горло горит, но боли нет: только ровный, жадный жар.", "Свечи раздуваются, как угли в кузне. По стенам ползут тени факелов, которых здесь никто не зажигал.", "Ты чувствуешь запах серы и ещё чего-то сладкого. Так пахнет огонь, который ждал тебя долго."]},L:{
  seer:["Зелье обжигает горло холодом. Склянка в пальцах трескается и рассыпается лунной пылью.","Свечи вспыхивают разом, будто кто-то выдохнул на них.","Ты закрываешь глаза. Мир складывается пополам, как карточный лист."],
  sailor:["Зелье горчит солёной водой и железом. Ты словно проглотил кусок шторма.","Свечи пригибаются от ветра, которого здесь нет.","Пол уходит из-под ног. Палуба. Волна. Гром далеко над головой."],
  hunter:["Зелье жжёт, как свежая кровь на морозе. Во рту вкус дыма и железа.","Свечи вспыхивают алым. Пахнет гарью и далёкой охотой.","Сердце бьёт, как барабан перед облавой. За тобой начинают следить."]}},
 {t:"Голоса",at:.12,fx:["eyes","whisper"],who:"Шёпот",L7:{seer:["«Покажи… покажи…» Шёпот хлопает в ладоши, и от каждого хлопка гаснет одна свеча.", "Из зеркал в тёмных углах выходят твои отражения. Каждое держит в руке по карте, и ни одна не твоя.", "Ты: «Это иллюзия». Шёпот: «Иллюзия тоже начинает верить в себя»."],sailor:["«Курс… назови курс…» Голоса идут не из зала, а из глубины под полом.", "Невидимая карта разворачивается в воздухе. Все точки на ней мигают и указывают на одну: на тебя.", "Ты: «Я не заблужусь». Шёпот: «Заблудиться может только тот, у кого есть дом»."],hunter:["«Горит… горит…» Шёпот трещит, как сухие ветки в костре.", "Из темноты загораются десятки глаз. Они не мигают и не боятся огня, потому что сами из него.", "Ты: «Я не боюсь пламени». Шёпот: «Пламя не боится тебя»."]},L:{
  seer:["«Смейся… смейся… никто не заметит, что это маска».","Из темноты по краям зала складываются шёпоты, и каждый знает твоё имя.","Ты: «Это только сон». Шёпот: «Сон тоже умеет кусаться»."],
  sailor:["«Тише… тише… море помнит каждого, кто тонул».","Волны шепчут за стенами зала. Ты слышишь, как они считают твои вдохи.","Ты: «Я не боюсь воды». Шёпот: «Вода не боится тебя»."],
  hunter:["«Беги… беги… он уже идёт по твоему следу».","Из темноты по краям зала смотрят глаза. Они не мигают.","Ты: «Я охотник». Шёпот: «Сегодня ты добыча»."]}},
 {t:"Лица",at:.28,fx:["faces","shake"],who:"Голос из тумана",L7:{seer:["В воздухе повисают карточные лица. Короли смеются, дамы плачут, шуты смотрят молча.", "Тузы выстраиваются в ряд и разворачиваются рубашками к тебе. На каждой рубашке нарисован твой глаз.", "«Угадай, где настоящий, — просит голос. — Или научись не угадывать вовсе»."],sailor:["Над водой всплывают штурвалы без кораблей. Они крутятся сами, и каждый зовёт тебя встать на вахту.", "Из тумана выходит тень со стеклянным компасом вместо сердца. Стрелка бьётся о стекло, как пойманная птица.", "«Курс не выбирают, — шепчет она. — Курс выбирает капитана»."],hunter:["Из дыма поднимаются факелы. Каждый держит рука без тела, обожжённая до кости.", "Тени с рогатыми головами несут горящие ленты и обвязывают ими круг.", "«Горит тот, кто решил гореть, — говорит голос. — Реши, пока тебя не решили»."]},L:{
  seer:["Лица появляются в воздухе одно за другим: смеющиеся, плачущие, пустые.","Каждое твоё. Каждое чужое. Ты не помнишь, какое родилось вместе с тобой.","«Выбери, — просит голос. — Или тебя выберут»."],

  hunter:["Из дыма выходят силуэты охотников. Вместо лиц у них рогатые черепа.","Они обступают круг и молча считают шаги до тебя.","«Дразни зверя, — говорит старший. — Но помни: зверь тоже умеет дразнить»."]}},

  if(Date.now()-P.lastWh>9000){P.lastWh=Date.now();whisper();if(Math.random()<.5)snd("seqwhisper")}
  if(P.chIdx>=2&&Date.now()-P.lastFace>20000){P.lastFace=Date.now();faces(2)}
  if(rem<=0&&!P.ended)finish();
 }
 draw(t);
 requestAnimationFrame(loop);
}

/* ---------- финал ---------- */
async function finish(){
 P.ended=true;ls("lotm_seq_end","0");
 $("lock").style.display="none";
 flash("#fff",1,2400);snd("seqdone");setTimeout(function(){snd("bell")},1600);
 var d=null,tries=0;
 while(!d&&tries<40){try{d=await loadProfile()}catch(e){tries++;await new Promise(function(r){setTimeout(r,2500)})}}
 var pk=(d&&(d.path_key||d.path))||P.path;
 if(!PAL[pk])pk=P.path;
 var nm=(d&&d.sequence_name)||PAL[pk].nm;
 if(d&&d.seq_done&&d.seq_done.name)nm=d.seq_done.name;
 if(d&&d.seq_done&&d.seq_done.seq){var ek=$("endK");if(ek)ek.textContent="Последовательность "+d.seq_done.seq}
 $("endH").textContent=nm;
 var _sq=(d&&d.seq_done&&Number(d.seq_done.seq))||P.tq||8;
 var _ek=$("endK");if(_ek)_ek.textContent="Последовательность "+_sq;
 var EM={seer:{8:"clown",7:"magician"},sailor:{8:"fury",7:"navigator"},hunter:{8:"provoc",7:"pyro"}};
 try{$("endRib").style.backgroundImage="url("+TA+"rib_"+pk+".webp)";$("endAf").src=TA+"af_"+pk+".webp";$("endEm").src=TA+"em_"+((EM[pk]||EM.seer)[_sq]||"clown")+".webp";P.path=pk;applyPal2(pk)}catch(e){}
 var gnd=d&&d.gender==="female"?"f":"m";
 var im=new Image();im.onload=function(){$("endAv").replaceChildren(im)};im.src="../avatars/"+gnd+"_"+pk+_sq+".webp";im.onerror=function(){var i2=new Image();i2.onload=function(){$("endAv").replaceChildren(i2)};i2.src="../avatars/"+gnd+"_"+pk+"8.webp"};
 $("end").classList.add("on");setTimeout(function(){$("end").classList.add("show")},60);
 $("vn").style.display="none";$("hud").style.opacity=0;$("prog").style.opacity=0;$("chName").style.opacity=0;
}
$("endBtn").addEventListener("click",function(){
 snd("tap");
 var p=new URLSearchParams(location.search);["demo","t","path"].forEach(function(k){p.delete(k)});
 location.href="../index.html?"+p.toString();
});

/* ---------- запуск ---------- */
async function boot(){
 resize();buildProg();
 requestAnimationFrame(loop);
 var d;
 try{d=await loadProfile()}catch(e){
  if(e&&e.message==="need_start"){location.replace("../index.html"+location.search);return}
  showErr("Нет связи с сервером. Пробую снова…");
  setTimeout(boot,3500);return;
 }
 var pk=String(d.path_key||"");P.path=PAL[pk]?pk:"seer";P.gender=d.gender||"male";applyPal();
 try{var _tq=(Number(d.sequence)||9)>=9?8:7;P.tq=d.seq_done&&Number(d.seq_done.seq)||(Number(d.seq_left)>0?_tq:_tq);if(DEMO&&qs.get("tq"))P.tq=+qs.get("tq");_tq=P.tq;if(_tq===7){RING_T=RING=.55}var _ls=$("locSeq");if(_ls)_ls.textContent="Переход · Посл. "+_tq}catch(e){}
 var left=Number(d.seq_left)||0;
 if(left>0){
  P.dur=Number(d.seq_dur)||left;P.end=Date.now()+left*1000;ls("lotm_seq_end",String(P.end));
  try{window.sndMusic&&sndMusic("cemetery")}catch(e){}
  snd("seqstart");
 }else{
  ls("lotm_seq_end","0");
  if(d.seq_done||Number(d.sequence)<=8){ // переход уже закончился
   P.dur=1;P.end=Date.now();P.prog=1;P.ended=true;finish();
  }else{location.replace("../index.html"+location.search)}
 }
}
// не даём уйти назад
history.pushState(null,"",location.href);
addEventListener("popstate",function(){history.pushState(null,"",location.href)});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&P.end&&Date.now()>=P.end&&!P.ended)finish()});
boot();
window.__P=P;
})();
</script>
