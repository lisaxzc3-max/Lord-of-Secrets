<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060a">
<title>Лаборатория — Повелитель Тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#08060a;--panel:rgba(18,14,22,.94);--line:#3a3040;--text:#d8cfb8;--muted:#8f8798;--bone:#cdbf9f;--bronze:#8a7a58;--crim:#a3262e;--crimb:#c0343e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--ink)}
body{margin:0;min-height:100vh;color:var(--text);font:14px/1.45 Inter,system-ui,Arial,sans-serif;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0,#2a1a22aa,transparent 58%),radial-gradient(ellipse at 50% 100%,#1a1208cc,transparent 60%),linear-gradient(#0a070b,#050305)}
button{font:inherit;color:inherit;cursor:pointer}button:active{transform:scale(.97)}
.wrap{position:relative;max-width:480px;margin:auto;padding:10px 12px calc(46px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.back{flex-shrink:0;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#120e16cc;font-size:12px}
.eyebrow{font-size:9px;letter-spacing:3px;color:var(--bronze);text-transform:uppercase}
.head h1{font:700 20px Georgia,serif;letter-spacing:.06em;margin:3px 0 0;color:var(--bone)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:0 8px 26px #0008}
.card h3{margin:0 0 6px;font:700 13px Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--bone)}
.muted{color:var(--muted);font-size:12px}
.hidden{display:none!important}

/* сцена котла */
.scene{position:relative;height:300px;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:linear-gradient(#120d12 0 66%,#0b0709 66%);box-shadow:inset 0 0 70px #000,0 10px 30px #000a}
.scene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff05 0 2px,transparent 2px 38px);opacity:.6}
.shelf{position:absolute;left:0;right:0;top:34px;height:6px;background:#241a12;box-shadow:0 8px 14px #000}
.jar{position:absolute;top:8px;width:20px;height:28px;border-radius:4px 4px 8px 8px;border:1px solid #4a3f2c;background:linear-gradient(#1a1410,#0c0908);opacity:.8}
.jar:after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:11px;border-radius:2px 2px 6px 6px;background:var(--c,#3a2a2a);opacity:.5}
.candleL{position:absolute;top:44px;width:6px;height:18px;background:#cdbf9f;border-radius:2px;box-shadow:0 0 0 1px #0008}
.candleL i{position:absolute;left:-2px;top:-14px;width:10px;height:14px;background:radial-gradient(#ffd89a,#c27a2a 60%,transparent 70%);border-radius:50% 50% 40% 40%;filter:blur(.5px) drop-shadow(0 0 8px #c27a2a);animation:flk 1.6s ease-in-out infinite}
@keyframes flk{0%,100%{transform:scale(1,1) rotate(-2deg);opacity:.9}50%{transform:scale(.88,1.12) rotate(2deg);opacity:1}}
.glowFloor{position:absolute;left:50%;bottom:6px;width:300px;height:110px;margin-left:-150px;border-radius:50%;background:radial-gradient(ellipse,#8a3a1a66,transparent 70%);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.6;transform:scale(1.06)}}
.potWrap{position:absolute;left:50%;bottom:16px;width:240px;height:250px;margin-left:-120px}
.potWrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flame{transform-origin:50% 100%;animation:fl 1.1s ease-in-out infinite}
.flame:nth-child(2){animation-delay:-.4s}.flame:nth-child(3){animation-delay:-.7s}.flame:nth-child(4){animation-delay:-.2s}
@keyframes fl{0%,100%{transform:scale(1,1)}50%{transform:scale(.85,1.2)}}
.scene.boil .flame{animation-duration:.45s}
.scene.boil .potWrap{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(0,-1px)}}
.liq{transition:fill .8s}
.bub{position:absolute;border-radius:50%;border:1px solid #cdbf9faa;background:#cdbf9f22;animation:bub 2.6s ease-in infinite;opacity:0}
.scene.boil .bub{animation-duration:.7s}
@keyframes bub{0%{transform:translateY(0) scale(.4);opacity:0}25%{opacity:.8}100%{transform:translateY(-34px) scale(1.2);opacity:0}}
.steam{position:absolute;left:50%;bottom:150px;width:46px;height:120px;margin-left:-23px;filter:blur(7px);opacity:.5;background:radial-gradient(ellipse at 50% 100%,#9a8fa0aa,transparent 70%);animation:st 4s ease-in-out infinite}
.steam.s2{margin-left:-60px;animation-delay:-1.6s;width:34px}
.steam.s3{margin-left:12px;animation-delay:-2.8s;width:38px}
@keyframes st{0%{transform:translateY(20px) scaleX(.8);opacity:0}30%{opacity:.5}100%{transform:translateY(-70px) scaleX(1.5);opacity:0}}
.scene.boil .steam{animation-duration:1.6s}
.drop{position:fixed;z-index:60;width:28px;height:28px;color:var(--bone);pointer-events:none;transition:transform .55s cubic-bezier(.3,.1,.7,1),opacity .55s;filter:drop-shadow(0 0 6px #000)}
.drop svg{width:100%;height:100%}
.poof{position:absolute;left:50%;top:92px;width:200px;height:120px;margin-left:-100px;border-radius:50%;background:radial-gradient(ellipse,#050305dd,transparent 70%);opacity:0;pointer-events:none}
.poof.go{animation:poof 1.6s ease-out}
@keyframes poof{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.8) translateY(-40px)}}

/* в котле */
.inpot{display:flex;flex-wrap:wrap;gap:7px;min-height:52px;align-items:center}
.chip{position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px 9px 6px 7px;background:#0d0a10;font-size:12px;animation:chipIn .25s ease-out}
@keyframes chipIn{from{transform:scale(.6);opacity:0}}
.chip svg{width:20px;height:20px;color:var(--rc,var(--bone))}
.chip b{font-weight:600;color:var(--bone)}
.chip:after{content:"✕";font-size:9px;color:var(--muted);margin-left:2px}
.empty{color:var(--muted);font-size:12px;font-style:italic}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:1px solid #5a4a30;background:linear-gradient(145deg,#2a2014,#150f0a);border-radius:12px;padding:13px;font-weight:700;letter-spacing:.04em;color:var(--bone)}
.btn.main{border-color:var(--bronze);background:linear-gradient(145deg,#5a1218,#2a080c);color:#f0e6cc;box-shadow:0 0 18px #a3262e44}
.btn.ghost{flex:0 0 auto;background:#120e16;border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* ингредиенты */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ing{position:relative;display:flex;gap:9px;align-items:center;text-align:left;border:1px solid var(--rc,var(--line));border-radius:13px;padding:9px;background:linear-gradient(145deg,#17121a,#0d0a10);animation:cardIn .4s ease-out backwards}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}}
.ing .g{flex:0 0 34px;height:34px;border-radius:9px;border:1px solid #ffffff10;background:#0008;display:flex;align-items:center;justify-content:center;color:var(--rc,var(--bone))}
.ing .g svg{width:24px;height:24px}
.ing .nm{font-size:12px;line-height:1.2;color:var(--bone)}
.ing .rr{font-size:10px;color:var(--rc,var(--muted));margin-top:2px}
.ing .cnt{position:absolute;right:7px;top:5px;font-size:11px;font-weight:800;color:var(--bone)}
.ing.rare{box-shadow:0 0 14px #d6b77922}
.ing:disabled{opacity:.35}
.ing.none{opacity:.28;border-style:dashed}
.bagEmpty{text-align:center;padding:18px 8px;color:var(--muted);font-size:12px}

/* рецепты */
.rec{display:flex;gap:11px;align-items:center}
.rec .pv{flex:0 0 58px}
.rec .pv svg{width:58px;height:72px;filter:drop-shadow(0 0 10px var(--pc))}
.rec b{display:block;color:var(--bone)}
.need{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.nd{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 6px;font-size:11px;background:#0d0a10}
.nd svg{width:16px;height:16px;color:var(--rc,var(--bone))}
.nd.ok{border-color:#4a6a52}.nd.lack{border-color:#6a2a30;color:#b89aa0}
.lock{opacity:.55;filter:grayscale(.8)}
.lock .pv svg{filter:none}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.potc{text-align:center;border:1px solid var(--line);border-radius:14px;padding:10px 6px;background:linear-gradient(160deg,#17121a,#0b080e)}
.potc svg{width:46px;height:58px;filter:drop-shadow(0 0 10px var(--pc))}
.potc b{display:block;font-size:12px;color:var(--bone);margin-top:2px}
.potc small{display:block;font-size:10px;color:var(--muted)}

/* результат */
.ov{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(ellipse at 50% 40%,#000000cc,#000000f0);animation:ovIn .4s ease-out}
@keyframes ovIn{from{opacity:0}}
.res{max-width:330px;width:100%;text-align:center;border:1px solid var(--bronze);border-radius:20px;padding:22px 18px;background:linear-gradient(160deg,#1a1218,#0a070c);box-shadow:0 0 60px var(--pc,#000),0 20px 50px #000;animation:resIn .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes resIn{from{transform:translateY(40px) scale(.8);opacity:0}}
.res .bt{position:relative;width:110px;height:130px;margin:0 auto 6px}
.res .bt svg{width:100%;height:100%;filter:drop-shadow(0 0 20px var(--pc));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.res h2{margin:6px 0 4px;font:700 18px Georgia,serif;letter-spacing:.06em;color:var(--bone)}
.res p{margin:6px 0;font-size:12.5px;color:var(--muted)}
.res .fail{font-size:46px;color:#8a7a58;margin:4px 0}
.res .fail svg{width:70px;height:70px}
.res .btn{margin-top:14px;width:100%}
.dust{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--bronze);opacity:.5;pointer-events:none;animation:dust linear infinite}
@keyframes dust{from{transform:translateY(100vh)}to{transform:translateY(-10vh)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;z-index:90;background:#120e16f2;border:1px solid var(--bronze);border-radius:12px;padding:10px 14px;font-size:12px;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* атмосфера */
.scene #labCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.scene .eyeG{position:absolute;width:6px;height:6px;border-radius:50%;background:#d4343f;box-shadow:0 0 8px #d4343f;opacity:0;z-index:2;animation:eyeB 11s infinite}
@keyframes eyeB{0%,70%,100%{opacity:0}72%,76%{opacity:.9}74%{opacity:0}}
.scene .cflick i{animation-duration:.9s}
.scene.boil:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 62%,#a3262e55,transparent 60%);animation:bGl .6s ease-in-out infinite alternate}
@keyframes bGl{from{opacity:.4}to{opacity:1}}
.scene.boil{animation:sceneShk 1.8s ease-in-out}
@keyframes sceneShk{0%,100%{filter:none}30%{filter:hue-rotate(-30deg) brightness(1.25)}60%{filter:hue-rotate(40deg) saturate(1.5)}}
.scene.flash:before{background:#cdbf9f55;opacity:1;transition:none}
.wispT{position:fixed;z-index:30;pointer-events:none;color:#c9b8d8;font-style:italic;font-size:13px;letter-spacing:.1em;opacity:0;text-shadow:0 0 8px #a3262e;animation:whF2 5s ease-in-out forwards}
@keyframes whF2{0%{opacity:0;filter:blur(5px)}30%{opacity:.7;filter:blur(0)}100%{opacity:0;transform:translateY(-20px);filter:blur(6px)}}
</style>
<script src="../shared/auth.js"></script>
<script src="../shared/alchemy.js"></script>
<script src="../shared/sound.js"></script>
<script>try{sndMusic("calm")}catch(e){}</script>
</head>
<body>
<div class="wrap">
<header class="head"><a class="back" id="back" href="../home/index.html">← Дом</a><div><div class="eyebrow">ДОМ · ЛАБОРАТОРИЯ</div><h1>Алхимический котёл</h1></div></div>

<div class="scene" id="scene">
 <div class="shelf"></div>
 <div class="jar" style="left:22px;--c:#5a1218"></div><div class="jar" style="left:52px;--c:#2a3a3a"></div><div class="jar" style="left:84px;--c:#3a2a4a"></div><div class="jar" style="right:26px;--c:#4a3a1a"></div><div class="jar" style="right:58px;--c:#1a2a1a"></div>
 <div class="candleL" style="left:28px"><i></i></div><div class="candleL" style="right:32px;height:24px"><i></i></div>
 <div class="glowFloor"></div>
 <div class="potWrap" id="potWrap">
  <svg viewBox="0 0 240 250">
   <defs>
    <radialGradient id="fireG" cx="50%" cy="80%" r="60%"><stop offset="0" stop-color="#ffcf7a"/><stop offset=".5" stop-color="#c2542a"/><stop offset="1" stop-color="#5a1218" stop-opacity="0"/></radialGradient>
    <linearGradient id="ironG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050406"/><stop offset=".3" stop-color="#2a262c"/><stop offset=".5" stop-color="#1a171c"/><stop offset="1" stop-color="#050406"/></linearGradient>
    <filter id="blr"><feGaussianBlur stdDeviation="2"/></filter>
   </defs>
   <path d="M50 232l12-22M190 232l-12-22" stroke="#15110f" stroke-width="10" stroke-linecap="round"/>
   <g filter="url(#blr)" opacity=".95">
    <path class="flame" d="M70 236c-8-16 2-26 6-40 6 10 18 16 8 40z" fill="url(#fireG)"/>
    <path class="flame" d="M100 238c-10-20 4-34 10-52 8 14 22 24 10 52z" fill="url(#fireG)"/>
    <path class="flame" d="M134 238c-8-16 2-28 8-42 6 12 18 18 8 42z" fill="url(#fireG)"/>
    <path class="flame" d="M160 236c-6-12 0-22 4-32 6 8 14 14 6 32z" fill="url(#fireG)"/>
   </g>
   <path d="M30 118c-6 56 16 94 90 94s96-38 90-94z" fill="url(#ironG)" stroke="#3a343c" stroke-width="2"/>
   <path d="M44 150c10 30 40 42 76 42" stroke="#ffffff10" stroke-width="4" fill="none" stroke-linecap="round"/>
   <path d="M28 112h184" stroke="#3a343c" stroke-width="14" stroke-linecap="round"/>
   <ellipse cx="120" cy="112" rx="88" ry="20" fill="#050305" stroke="#4a424c" stroke-width="2"/>
   <ellipse class="liq" id="liq" cx="120" cy="113" rx="80" ry="15" fill="#3a2a22"/>
   <ellipse cx="108" cy="110" rx="34" ry="5" fill="#ffffff" opacity=".08"/>
   <path d="M30 128c-14 0-20 8-16 16M210 128c14 0 20 8 16 16" stroke="#2a262c" stroke-width="6" fill="none" stroke-linecap="round"/>
   <path d="M90 150q3 4 0 8M150 160q-3 4 0 8M120 176q2 3 0 6" stroke="#cdbf9f" stroke-opacity=".25" stroke-width="1.5" fill="none"/>
  </svg>
  <i class="bub" style="left:78px;top:98px;width:10px;height:10px"></i><i class="bub" style="left:112px;top:104px;width:14px;height:14px;animation-delay:-.9s"></i><i class="bub" style="left:150px;top:100px;width:9px;height:9px;animation-delay:-1.7s"></i><i class="bub" style="left:130px;top:96px;width:6px;height:6px;animation-delay:-.4s"></i>
 </div>
 <div class="steam"></div><div class="steam s2"></div><div class="steam s3"></div>
 <canvas id="labCv"></canvas><i class="eyeG" style="left:14px;top:60px"></i><i class="eyeG" style="left:20px;top:60px;animation-delay:.05s"></i><i class="eyeG" style="right:18px;top:96px;animation-delay:-5s"></i><i class="eyeG" style="right:24px;top:96px;animation-delay:-4.95s"></i>
 <div class="poof" id="poof"></div>
</div>

<div class="card">
 <h3>В котле <span class="muted" id="potCnt" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h3>
 <div class="inpot" id="inpot"></div>
 <div class="row"><button class="btn ghost" id="clear" type="button">Очистить</button><button class="btn" id="fill" type="button">По рецепту</button><button class="btn main" id="brew" type="button">⚗ Варить</button></div>
</div>

<div class="card"><h3>Ингредиенты</h3><div class="grid" id="ings"></div></div>
<div class="card"><h3>Книга рецептов</h3><div id="book"></div></div>
<div class="card" id="potsCard"><h3>Твои зелья</h3><div class="pots" id="pots"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const A=window.LOTM_ALCH;
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.setHeaderColor("#08060a")}catch(_){}
const qs=new URLSearchParams(location.search);
const aEnc=qs.get("a_enc")||qs.get("a")||"";
const ACTION_URL=aEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(aEnc):"";
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const sfx=n=>{try{window.snd&&window.snd(n)}catch(_){}};
function unwrap(v){for(let i=0;i<3;i++){if(v&&v.result&&typeof v.result==="object")v=v.result;else break}return v}
$("back").href="../home/index.html"+location.search;
async function api(payload){
 if(!ACTION_URL)return needStart();
 const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
 if(!r.ok)throw new Error("Ошибка игрового сервера (HTTP "+r.status+").");
 const d=unwrap(await r.json());
 if(!d||typeof d!=="object")throw new Error("Некорректный ответ сервера.");
 return d;
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2600)}
const MAX=12;
let S={ingr:{},pots:{},recipe:null,others:[]};
let pot={};   // что лежит в котле
let busy=false;
const potTotal=()=>Object.values(pot).reduce((a,b)=>a+b,0);
const have=id=>(S.ingr[id]|0)-(pot[id]|0);

function dust(){if(reduce)return;for(let i=0;i<14;i++){const d=document.createElement("i");d.className="dust";d.style.left=Math.random()*100+"%";d.style.animationDuration=(9+Math.random()*10)+"s";d.style.animationDelay=(-Math.random()*12)+"s";document.body.appendChild(d)}}

function renderPot(){
 const box=$("inpot");box.replaceChildren();
 const ids=A.ORDER.filter(k=>pot[k]>0);
 if(!ids.length){const e=document.createElement("div");e.className="empty";e.textContent="Котёл пуст. Коснись ингредиента, чтобы бросить его внутрь.";box.appendChild(e)}
 ids.forEach(k=>{
  const c=document.createElement("button");c.type="button";c.className="chip";c.style.setProperty("--rc",A.RAR[A.ING[k].r]);
  c.innerHTML=A.glyph(k)+"<b>"+A.ING[k].n+"</b> ×"+pot[k];
  c.onclick=()=>{if(busy)return;pot[k]--;if(!pot[k])delete pot[k];sfx("back");render()};
  box.appendChild(c);
 });
 $("potCnt").textContent=potTotal()?"· "+potTotal()+"/"+MAX:"";
 $("brew").disabled=busy||!potTotal();
 $("clear").disabled=busy||!potTotal();
 $("fill").disabled=busy||!S.recipe;
 // цвет жидкости
 const liq=$("liq");let col="#3a2a22";
 if(potTotal()){const s=potTotal();col=["#3a2a22","#4a3a2a","#3a3a2e","#3a4a40","#4a3a4a","#4a2a30"][Math.min(5,s%6)]}
 liq.setAttribute("fill",col);
}
function renderIngs(){
 const g=$("ings");g.replaceChildren();
 let any=false;
 A.ORDER.forEach((k,i)=>{
  const n=S.ingr[k]|0;if(!n)return;any=true;
  const it=A.ING[k],b=document.createElement("button");b.type="button";
  b.className="ing"+(it.r===3?" rare":"");b.style.setProperty("--rc",A.RAR[it.r]);b.style.animationDelay=Math.min(i,10)*30+"ms";
  b.innerHTML='<span class="g">'+A.glyph(k)+'</span><span><div class="nm">'+it.n+'</div><div class="rr">'+A.RARN[it.r]+'</div></span><span class="cnt">×'+have(k)+'</span>';
  b.disabled=busy||have(k)<=0||potTotal()>=MAX;
  b.onclick=e=>addIng(k,b);
  g.appendChild(b);
 });
 if(!any){const e=document.createElement("div");e.className="bagEmpty";e.style.gridColumn="1/-1";e.textContent="Ингредиентов пока нет. Их приносят монстры, события, квесты и сад.";g.appendChild(e)}
}
function addIng(k,btn){
 if(busy||have(k)<=0||potTotal()>=MAX)return;
 pot[k]=(pot[k]|0)+1;sfx("plant");sfx("rune");
 if(!reduce){
  const r=btn.getBoundingClientRect(),t=$("potWrap").getBoundingClientRect();
  const d=document.createElement("div");d.className="drop";d.innerHTML=A.glyph(k);d.style.left=(r.left+10)+"px";d.style.top=(r.top+6)+"px";document.body.appendChild(d);
  requestAnimationFrame(()=>{d.style.transform="translate("+(t.left+t.width/2-r.left-24)+"px,"+(t.top+70-r.top)+"px) scale(.5) rotate(200deg)";d.style.opacity=".1"});
  setTimeout(()=>{d.remove();sfx("dew")},520);
 }
 render();
}
function renderBook(){
 const b=$("book");b.replaceChildren();
 const R=S.recipe;
 if(R){
  const P=A.POT[R.pot],d=document.createElement("div");
  d.innerHTML='<div class="rec" style="--pc:'+P.c+'66"><div class="pv">'+A.potion(R.pot)+'</div><div><b>'+R.name+'</b><div class="muted">'+R.info+'</div></div></div>';
  const nd=document.createElement("div");nd.className="need";
  Object.keys(R.need).forEach(k=>{
   const x=document.createElement("span"),ok=(S.ingr[k]|0)>=R.need[k];
   x.className="nd "+(ok?"ok":"lack");x.style.setProperty("--rc",A.RAR[A.ING[k].r]);
   x.innerHTML=A.glyph(k)+A.ING[k].n+" ×"+R.need[k]+' <span class="muted">('+(S.ingr[k]|0)+')</span>';
   nd.appendChild(x);
  });
  d.appendChild(nd);
  const tip=document.createElement("div");tip.className="muted";tip.textContent="В скобках — сколько у тебя есть. Все компоненты нужны в точных количествах.";d.appendChild(tip);
  b.appendChild(d);
 }else{
  const e=document.createElement("div");e.className="muted";e.textContent="Выбери путь, чтобы открыть рецепт своего зелья.";b.appendChild(e);
 }
 (S.others||[]).forEach(o=>{
  const P=A.POT[o.pot],d=document.createElement("div");d.className="rec lock";d.style.cssText="margin-top:12px;--pc:#0000";
  d.innerHTML='<div class="pv">'+A.potion(o.pot)+'</div><div><b>'+o.name+'</b><div class="muted">'+o.info+'</div><div class="muted">Рецепт неизвестен. Котёл подскажет, насколько близко ты был.</div></div>';
  b.appendChild(d);
 });
}
function renderPots(){
 const g=$("pots");g.replaceChildren();
 const ids=Object.keys(S.pots||{}).filter(k=>S.pots[k]>0&&A.POT[k]);
 if(!ids.length){const e=document.createElement("div");e.className="bagEmpty";e.style.gridColumn="1/-1";e.textContent="Пока нет сваренных зелий. Они попадают в сумку.";g.appendChild(e);return}
 ids.forEach(k=>{const P=A.POT[k],c=document.createElement("div");c.className="potc";c.style.setProperty("--pc",P.c+"88");c.innerHTML=A.potion(k)+'<b>'+P.n+'</b><small>×'+S.pots[k]+' · '+P.info.replace("Последовательность 8 · ","Посл. 8 · ")+'</small>';g.appendChild(c)});
}
function render(){renderPot();renderIngs();renderPots()}

$("clear").onclick=()=>{if(busy)return;pot={};sfx("back");render()};
$("fill").onclick=()=>{
 if(busy||!S.recipe)return;
 pot={};let miss=0;
 Object.keys(S.recipe.need).forEach(k=>{const n=Math.min(S.ingr[k]|0,S.recipe.need[k]);if(n)pot[k]=n;miss+=S.recipe.need[k]-n});
 sfx("scroll");render();
 if(miss)toast("Не хватает компонентов: "+miss+" шт.");
};
$("brew").onclick=async()=>{
 if(busy||!potTotal())return;
 busy=true;render();
 $("scene").classList.add("boil");window.labBoil&&window.labBoil(1);sfx("seqstart");sfx("swirl");[500,1000,1400].forEach((ms,i)=>setTimeout(()=>sfx(i==1?"sizzle":"rune"),ms));
 const items=Object.assign({},pot);
 let d=null,err=null;
 try{const [r]=await Promise.all([api({action:"lab_brew",items}),new Promise(r=>setTimeout(r,1800))]);d=r}catch(e){err=e;await new Promise(r=>setTimeout(r,900))}
 $("scene").classList.remove("boil");window.labBoil&&window.labBoil(0);
 busy=false;
 if(err||!d||d.ok===false){toast(String((d&&(d.text||d.error))||(err&&err.message)||"Не удалось сварить."));if(d&&d.error==="dead"){}pot={};await load();return}
 S.ingr=d.ingr||S.ingr;S.pots=d.pots||S.pots;S.recipe=d.recipe||S.recipe;S.others=d.others||S.others;
 pot={};render();renderBook();
 result(d);
};
function result(d){
 const ov=document.createElement("div");ov.className="ov";
 if(d.success){
  const P=A.POT[d.potion.id];
  ov.innerHTML='<div class="res" style="--pc:'+P.c+'88"><div class="bt">'+A.potion(d.potion.id)+'</div><h2>'+P.n+'</h2><p>'+P.info+'</p><p>'+P.d+'</p><p style="color:#8fb3a6">Зелье лежит в сумке.</p><button class="btn main" type="button">Забрать</button></div>';
  sfx("brewdone");setTimeout(()=>sfx("bell"),900);{const sc=$("scene");sc.classList.add("flash");setTimeout(()=>sc.classList.remove("flash"),400)}
 }else{
  const h=d.hint||{};
  ov.innerHTML='<div class="res" style="--pc:#0008"><div class="fail">'+A.glyph("warn")+'</div><h2>Варево вышло мутным</h2><p>Ингредиенты сгорели в котле.</p><p>Ближе всего к «'+(h.name||"?")+'»: верно '+(h.ok|0)+' из '+(h.need|0)+'.</p><button class="btn" type="button">Понятно</button></div>';
  $("poof").classList.remove("go");void $("poof").offsetWidth;$("poof").classList.add("go");
  sfx("bad");setTimeout(()=>sfx("whisper"),300);
 }
 ov.querySelector("button").onclick=()=>{sfx("tap");ov.remove()};
 document.body.appendChild(ov);
}
async function load(){
 try{
  const d=await api({action:"lab_state"});
  if(d.ok===false){toast(String(d.text||d.error||"Ошибка"));render();renderBook();return}
  S.ingr=d.ingr||{};S.pots=d.pots||{};S.recipe=d.recipe||null;S.others=d.others||[];
  // убрать из котла то, чего уже нет
  Object.keys(pot).forEach(k=>{if((pot[k]|0)>(S.ingr[k]|0)){if(S.ingr[k])pot[k]=S.ingr[k];else delete pot[k]}});
 }catch(e){if(e&&e.message!=="need_start")toast(e.message||"Не удалось загрузить")}
 render();renderBook();
}

/* ===== атмосфера лаборатории ===== */
(function(){
 const sc=$("scene"),cv=$("labCv");if(!cv)return;
 const x=cv.getContext("2d");let w=0,h=0;
 function fit(){w=cv.width=sc.clientWidth;h=cv.height=sc.clientHeight}fit();addEventListener("resize",fit);
 const RU="ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ",M=[];
 for(let i=0;i<22;i++)M.push({x:Math.random()*w,y:Math.random()*h,v:.12+Math.random()*.3,a:Math.random()*6.28,r:.6+Math.random()*1.6,g:Math.random()<.25?RU[(Math.random()*RU.length)|0]:null});
 let boil=0;window.labBoil=v=>{boil=v};
 function loop(){
  const t=Date.now()/1000;x.clearRect(0,0,w,h);
  // руническое кольцо на полу
  x.save();x.translate(w/2,h-26);x.scale(1,.22);
  const k=boil?1.8:1;
  for(let r=0;r<3;r++){x.beginPath();x.arc(0,0,92+r*26,0,6.28);x.strokeStyle="rgba(163,38,46,"+(boil?.75:.32)+")";x.lineWidth=2.2;x.setLineDash([4+r*4,7]);x.lineDashOffset=t*(18*k)*(r%2?-1:1);x.stroke()}
  x.setLineDash([]);x.fillStyle="rgba(180,139,208,"+(boil?.9:.45)+")";x.font="16px serif";
  for(let i=0;i<12;i++){const a=i/12*6.28+t*(.15*k);x.save();x.translate(Math.cos(a)*118,Math.sin(a)*118);x.scale(1,4.5);x.fillText(RU[i*2%RU.length],-6,5);x.restore()}
  x.restore();
  // пылинки и руны
  M.forEach(p=>{p.y-=p.v*(boil?3:1);p.x+=Math.sin(t+p.a)*.4;if(p.y<-12){p.y=h+8;p.x=Math.random()*w}
   x.globalAlpha=.2+.5*Math.abs(Math.sin(t*.7+p.a));
   if(p.g){x.fillStyle="#b48bd0";x.font="12px serif";x.fillText(p.g,p.x,p.y)}else{x.fillStyle=boil?"#ff9a5a":"#cdbf9f";x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()}});
  x.globalAlpha=1;
  requestAnimationFrame(loop);
 }
 if(!reduce)loop();
 // фоновые звуки: пузыри, шёпот, редкий колокол
 const WH=["…ещё…","добавь кровь","он слышит","не мешай","варево живо","отдай ему имя","тише…"];
 setInterval(()=>{if(document.hidden)return;sfx("bubble");if(Math.random()<.5)setTimeout(()=>sfx("bubble"),180)},2600);
 setInterval(()=>{if(document.hidden)return;sfx("whisper");const e=document.createElement("div");e.className="wispT";e.textContent=WH[(Math.random()*WH.length)|0];e.style.left=(10+Math.random()*60)+"%";e.style.top=(18+Math.random()*30)+"%";document.body.appendChild(e);setTimeout(()=>e.remove(),5200)},11000);
 setInterval(()=>{if(!document.hidden&&Math.random()<.4)sfx("bell")},24000);
})();
dust();render();renderBook();load();
</script>
