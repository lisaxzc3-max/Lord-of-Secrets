<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0712">
<title>Лаборатория — Повелитель тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#eadfc6;--muted:#a79db4;--gold:#e2c27a;--bronze:#9a7c45;--line:#5a4730;--crim:#a3262e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0a0710;overflow:hidden}
body{color:var(--text);font:14px/1.4 Inter,system-ui,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#0a0710}

/* ===== сцена ===== */
.scene{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:#0a0710}
.scene .art{position:absolute;left:0;top:0;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none;user-select:none}
.scene:after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;background:linear-gradient(180deg,#07040c99 0,transparent 16%,transparent 78%,#0a0710 100%)}
.fx{position:absolute;pointer-events:none;transform:translate(-50%,-50%)}
.fx.c{border-radius:50%;mix-blend-mode:screen;background:radial-gradient(circle,#ffb35acc 0,#ff9a3c55 36%,transparent 70%);animation:flick var(--d,2.6s) ease-in-out var(--l,0s) infinite;z-index:3}
@keyframes flick{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}20%{opacity:1}35%{opacity:.7;transform:translate(-50%,-50%) scale(1.05)}60%{opacity:.95;transform:translate(-50%,-50%) scale(.98)}80%{opacity:.6}}
.fx.moon{border-radius:50%;mix-blend-mode:screen;background:radial-gradient(circle,#ff4a4a55 0,#ff2a4a1a 45%,transparent 70%);animation:moonP 5s ease-in-out infinite;z-index:3}
@keyframes moonP{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.fx.fire{border-radius:50%;mix-blend-mode:screen;background:radial-gradient(circle,#ff7a2acc 0,#ff3a1a66 38%,transparent 72%);animation:fireP 1.7s ease-in-out infinite;z-index:3}
@keyframes fireP{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.94,.9)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.04,1.1)}65%{opacity:.75;transform:translate(-50%,-50%) scale(.98,.96)}}
.fx.rune{border-radius:50%;mix-blend-mode:screen;background:radial-gradient(ellipse,#ff4a6a33 0,#d6a0ff12 50%,transparent 72%);animation:moonP 6s ease-in-out infinite;z-index:2}
.fx.pot{border-radius:50%;mix-blend-mode:screen;background:radial-gradient(ellipse,var(--lc,#c04a8a88) 0,transparent 68%);opacity:.55;transition:background .6s;animation:moonP 4s ease-in-out infinite;z-index:4}
.steam{position:absolute;width:calc(var(--k)*120px);height:calc(var(--k)*200px);transform:translate(-50%,-100%);border-radius:50%;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 50% 70%,#c9a0d588,#9a6ac044 45%,transparent 72%);filter:blur(calc(var(--k)*7px));opacity:0;animation:steam var(--sd,6s) ease-out var(--sl,0s) infinite}
@keyframes steam{0%{opacity:0;transform:translate(-50%,-80%) scale(.5)}15%{opacity:.8}100%{opacity:0;transform:translate(calc(-50% + var(--sx,12px)),-330%) scale(1.5)}}
.bub{position:absolute;border-radius:50%;pointer-events:none;z-index:5;border:1.5px solid #ffd8f088;background:radial-gradient(circle at 35% 30%,#ffffff88,#ff9ad622 60%,transparent);opacity:0;animation:bub var(--bd,2.4s) ease-in var(--bl,0s) infinite}
@keyframes bub{0%{opacity:0;transform:translate(-50%,0) scale(.4)}25%{opacity:.9}85%{opacity:.8;transform:translate(-50%,calc(var(--k)*-34px)) scale(1)}100%{opacity:0;transform:translate(-50%,calc(var(--k)*-42px)) scale(1.35)}}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd98a;box-shadow:0 0 6px #ffb55a;pointer-events:none;opacity:0;z-index:6;animation:mote var(--t,9s) linear var(--l,0s) infinite}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}15%{opacity:.85}70%{opacity:.6}100%{opacity:0;transform:translate(var(--x,20px),-80px)}}
.scene.boil .steam{animation-duration:2.4s;opacity:0}
.scene.boil .bub{animation-duration:.8s}
.scene.boil .fx.pot{opacity:1;background:radial-gradient(ellipse,#ff4a8ac0 0,transparent 68%);animation:fireP .5s ease-in-out infinite}
.scene.boil .fx.fire{animation-duration:.5s}
.scene.boil .art{animation:shk .12s linear infinite}
@keyframes shk{0%,100%{transform:translate(var(--ox),var(--oy))}25%{transform:translate(calc(var(--ox) + 1.5px),calc(var(--oy) - 1px))}75%{transform:translate(calc(var(--ox) - 1.5px),calc(var(--oy) + 1px))}}
.flashL{position:absolute;inset:0;background:#ffe9b8;opacity:0;pointer-events:none;z-index:8}
.scene.flash .flashL{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
.poof{position:absolute;width:calc(var(--k)*300px);height:calc(var(--k)*220px);transform:translate(-50%,-70%);border-radius:50%;background:radial-gradient(ellipse,#050305e6,transparent 70%);opacity:0;pointer-events:none;z-index:7}
.poof.go{animation:poof 1.6s ease-out}
@keyframes poof{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.5)}}

.top{position:absolute;z-index:12;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.back{flex:none;color:var(--text);text-decoration:none;border:1px solid #8a7348;border-radius:10px;padding:8px 12px;background:#0b0712cc;font-size:13px;font-family:Philosopher,Georgia,serif;backdrop-filter:blur(4px)}
.ttl{flex:1;text-align:center;font:700 17px Philosopher,Georgia,serif;letter-spacing:.06em;color:#f3e4bd;text-shadow:0 2px 8px #000}
.ttl small{display:block;font:400 9px Inter,system-ui,sans-serif;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.cnt{flex:none;min-width:58px;text-align:center;font-size:12px;padding:6px 8px;border:1px solid #8a7348;border-radius:10px;background:#0b0712cc;color:var(--gold)}

/* ===== нижняя панель ===== */
.dock{flex:none;position:relative;z-index:10;margin-top:-8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#120c1af2,#0a0710 70%);border-top:1px solid #6b5636;box-shadow:0 -8px 24px #000a}
.dock:before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4px;background:#c9a55a;transform:rotate(45deg);box-shadow:0 0 8px #e2c27a88;border:1px solid #1a1226}
.inpot{display:flex;gap:6px;align-items:center;height:38px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin-bottom:7px}
.inpot::-webkit-scrollbar{display:none}
.inpot .empty{color:var(--muted);font-size:12px;font-style:italic;white-space:nowrap}
.chip{flex:none;display:flex;align-items:center;gap:5px;height:34px;padding:0 9px 0 4px;border:1px solid var(--rc,#6a5a3a);border-radius:99px;background:#150f1d;color:var(--text);font-size:12px;font-weight:700}
.chip svg{width:26px;height:26px}
.chip.rm{animation:chipOut .3s ease-in forwards}
.acts{display:grid;grid-template-columns:auto auto 1fr;gap:8px;margin-bottom:8px}
.btn{border:1px solid #7a6038;background:linear-gradient(145deg,#2a2014,#150f0a);border-radius:11px;padding:0 14px;height:42px;font-weight:700;font-size:13px;letter-spacing:.03em;color:var(--gold);box-shadow:inset 0 0 0 1px #000a}
.btn.main{border-color:#c9a55a;background:linear-gradient(145deg,#7a1a22,#3a0a10);color:#fff0cf;font-family:Philosopher,Georgia,serif;font-size:16px;letter-spacing:.06em;box-shadow:inset 0 0 0 1px #000a,0 0 18px #a3262e66}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.38;box-shadow:none}
.tray{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:2px 0 3px;scroll-snap-type:x proximity}
.tray::-webkit-scrollbar{display:none}
.ing{flex:none;position:relative;width:58px;height:62px;border:1px solid #4a3d5a;border-radius:12px;background:linear-gradient(160deg,#1c1428,#100a18);display:flex;align-items:center;justify-content:center;scroll-snap-align:start;box-shadow:inset 0 0 12px #00000088}
.ing svg{width:44px;height:44px;filter:drop-shadow(0 3px 4px #000a)}
.ing.rare{border-color:#9a7c45;box-shadow:inset 0 0 12px #00000088,0 0 10px #e2c27a33}
.ing.mid{border-color:#5c7f74}
.ing .cn{position:absolute;right:3px;bottom:2px;min-width:18px;height:16px;padding:0 4px;border-radius:8px;background:#000c;border:1px solid #ffffff22;font-size:10px;font-weight:800;text-align:center;line-height:14px;color:#f4e6c0}
.ing:disabled{opacity:.35;filter:grayscale(.6)}
.ing:active:not(:disabled){transform:scale(.94)}
.trayEmpty{flex:1;text-align:center;padding:14px 8px;color:var(--muted);font-size:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tab{height:38px;border:1px solid #5a4730;border-radius:10px;background:#120d1a;color:var(--text);font-size:13px;font-family:Philosopher,Georgia,serif;letter-spacing:.04em}
.tab b{color:var(--gold)}
.tab:active{background:#1c1428}

.drop{position:fixed;z-index:60;width:40px;height:40px;pointer-events:none;transition:transform .55s cubic-bezier(.3,.1,.7,1),opacity .55s;filter:drop-shadow(0 0 8px #000)}
.drop svg{width:100%;height:100%}

/* ===== шторка ===== */
.shBk{position:fixed;inset:0;z-index:70;background:#02010599;opacity:0;pointer-events:none;transition:opacity .3s}
.shBk.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:71;width:100%;max-width:480px;max-height:78dvh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;border:1px solid #6b5636;border-bottom:0;background:linear-gradient(180deg,#1a1226,#0c0812);transform:translate(-50%,105%);transition:transform .38s cubic-bezier(.2,.85,.25,1);box-shadow:0 -10px 40px #000}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{margin:0 0 4px;font:700 18px Philosopher,Georgia,serif;color:#f3e4bd;letter-spacing:.05em}
.sheet .grip{width:44px;height:4px;border-radius:3px;background:#6b5636;margin:0 auto 10px}
.muted{color:var(--muted);font-size:12px}
.rec{display:flex;gap:12px;align-items:center;margin-top:8px}
.rec .pv{flex:0 0 64px}
.rec .pv svg{width:64px;height:80px;filter:drop-shadow(0 0 12px var(--pc))}
.rec b{display:block;color:#f3e4bd;font-size:15px}
.need{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.nd{display:flex;align-items:center;gap:5px;border:1px solid #4a3d5a;border-radius:10px;padding:3px 9px 3px 4px;font-size:12px;background:#0d0a12}
.nd svg{width:24px;height:24px}
.nd.ok{border-color:#4a8a62}.nd.lack{border-color:#8a3a40;color:#c9a0a6}
.lock{opacity:.75;margin-top:14px;padding-top:12px;border-top:1px solid #ffffff12}
.lock .pv svg{filter:grayscale(.7) brightness(.7)}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.potc{text-align:center;border:1px solid #5a4730;border-radius:14px;padding:12px 6px;background:linear-gradient(160deg,#1c1428,#0d0914)}
.potc svg{width:56px;height:70px;filter:drop-shadow(0 0 12px var(--pc))}
.potc b{display:block;font-size:13px;color:#f3e4bd;margin-top:2px}
.potc small{display:block;font-size:10px;color:var(--muted)}
.bagEmpty{grid-column:1/-1;text-align:center;padding:18px 8px;color:var(--muted);font-size:12px}

/* ===== результат ===== */
.ov{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(ellipse at 50% 40%,#000000cc,#000000f0);animation:ovIn .4s ease-out}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.res{max-width:330px;width:100%;text-align:center;border:1px solid #9a7c45;border-radius:20px;padding:22px 18px;background:linear-gradient(160deg,#1c1424,#0a070c);box-shadow:0 0 60px var(--pc,#000),0 20px 50px #000;animation:resIn .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes resIn{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:none}}
.res .bt{position:relative;width:130px;height:160px;margin:0 auto 6px}
.res .bt svg{width:100%;height:100%;filter:drop-shadow(0 0 22px var(--pc));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.res h2{margin:6px 0 4px;font:700 20px Philosopher,Georgia,serif;letter-spacing:.06em;color:#f3e4bd}
.res p{margin:6px 0;font-size:12.5px;color:var(--muted)}
.res .fail{margin:4px 0}
.res .fail svg{width:70px;height:70px;color:#8a7a58}
.res .btn{margin-top:14px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;z-index:95;background:#120e16f2;border:1px solid #9a7c45;border-radius:12px;padding:10px 14px;font-size:12px;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
/* плавающие кнопки чата и звука переезжают на сцену, чтобы не закрывать панель */
#chFab{top:calc(58px + env(safe-area-inset-top))!important;bottom:auto!important;right:10px!important;width:34px!important;height:34px!important}
button[aria-label="Звук"]{top:calc(98px + env(safe-area-inset-top))!important;bottom:auto!important;right:10px!important;width:34px!important;height:34px!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<script src="../shared/fast.js?v=a7"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/sound.js?v=a4"></script>
<script src="../shared/alchemy.js"></script>
<script>sndMusic("lab")</script>

<body>
<div class="app">
<section class="scene" id="scene">
 <img class="art" id="art" src="../shared/art/alch/lab.webp?v=1" alt="" draggable="false">
 <div id="fxl"></div>
 <div class="flashL"></div><div class="poof" id="poof"></div>
 <div class="top">
  <a class="back" id="back" href="../home/index.html">← Дом</a>
  <div class="ttl"><small>ДОМ · ЛАБОРАТОРИЯ</small>Алхимический котёл</div>
  <div class="cnt" id="potCnt">0/12</div>
 </div>
</section>
<section class="dock">
 <div class="inpot" id="inpot"></div>
 <div class="acts"><button class="btn" id="clear" type="button">Очистить</button><button class="btn main" id="brew" type="button">⚗ Варить</button></div>
 <div class="tray" id="ings"></div>
 <div class="tabs"><button class="tab" id="tPots" type="button">🧪 Твои зелья <b id="potN"></b></button></div>
</section>
</div>

<div class="shBk" id="shBk"></div>
<div class="sheet" id="shPots"><div class="grip"></div><h3>Твои зелья</h3><div class="pots" id="pots"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const A=window.LOTM_ALCH;
const tg=window.Telegram?.WebApp||null;
try{tg?.ready();tg?.expand();tg?.setHeaderColor("#0a0710")}catch(_){}
const qs=new URLSearchParams(location.search);
const aEnc=qs.get("a_enc")||qs.get("a")||"";
const ACTION_URL=aEnc?"https://api.telebotcreator.com/new-webhook?data="+encodeURIComponent(aEnc):"";
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const sfx=n=>{try{window.snd&&window.snd(n)}catch(_){}};
const rnd=(a,b)=>a+Math.random()*(b-a);
function unwrap(v){for(let i=0;i<3;i++){if(v&&v.result&&typeof v.result==="object")v=v.result;else break}return v}
$("back").href="../home/index.html"+location.search;
async function api(payload){
 if(!ACTION_URL)return needStart();
 const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),cache:"no-store"});
 if(!r.ok)throw new Error("Ошибка игрового сервера (HTTP "+r.status+").");
 const d=unwrap(await r.json());
 if(!d||typeof d!=="object")throw new Error("Некорректный ответ сервера.");
 return d;
}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2600)}

/* ===== сцена: координаты арта 1086×1448 → экран ===== */
const AW=1086,AH=1448,FX=.40,FY=.60;
let K=1,POT_XY=[0,0];
const scene=$("scene");
const FXS=[
 ["c",92,885,120,2.4,0],["c",165,985,110,2.9,-1],["c",633,595,120,2.6,-.5],["c",597,632,100,3.1,-1.7],["c",670,640,100,2.7,-1.1],
 ["c",1040,1140,130,2.5,-.8],["c",997,1195,110,3,-2],["c",388,215,200,3.4,-1.4],
 ["moon",945,310,360,0,0],["fire",440,1010,420,0,0],["rune",545,1170,700,0,0],["pot",440,790,360,0,0]
];
function buildFx(){
 const box=$("fxl");box.replaceChildren();
 FXS.forEach(([t,x,y,s,d,l])=>{
  const e=document.createElement("i");e.className="fx "+t;e.dataset.ax=x;e.dataset.ay=y;e.dataset.as=s;
  if(t==="c"){e.style.setProperty("--d",d+"s");e.style.setProperty("--l",l+"s")}
  if(t==="rune"||t==="fire"||t==="moon"||t==="pot")e.dataset.ar=t==="rune"?.3:1;
  box.appendChild(e);
 });
 [[400,760,-10,0],[460,756,14,2.1],[430,764,2,4.2]].forEach(([x,y,sx,sl])=>{
  const e=document.createElement("i");e.className="steam";e.dataset.ax=x;e.dataset.ay=y;e.style.setProperty("--sx",sx+"px");e.style.setProperty("--sl",sl+"s");e.style.setProperty("--sd",rnd(5,7)+"s");box.appendChild(e);
 });
 [[380,774,.0],[418,779,1.1],[455,776,.6],[490,772,1.7],[435,770,.3]].forEach(([x,y,l],i)=>{
  const e=document.createElement("i");e.className="bub";e.dataset.ax=x;e.dataset.ay=y;e.dataset.aw=14+(i%3)*5;e.style.setProperty("--bl",-l+"s");e.style.setProperty("--bd",(2+(i%3)*.5)+"s");box.appendChild(e);
 });
 if(!reduce)for(let i=0;i<14;i++){const d=document.createElement("i");d.className="mote";d.dataset.px=rnd(5,95);d.dataset.py=rnd(30,90);d.style.setProperty("--t",rnd(7,13)+"s");d.style.setProperty("--l",-rnd(0,12)+"s");d.style.setProperty("--x",rnd(-24,24)+"px");box.appendChild(d)}
 place();
}
function place(){
 const W=scene.clientWidth,H=scene.clientHeight;if(!W||!H)return;
 K=Math.max(W/AW,H/AH);
 const ox=(W-AW*K)*FX,oy=(H-AH*K)*FY;
 const art=$("art");art.style.width=AW*K+"px";art.style.height=AH*K+"px";art.style.left="0";art.style.top="0";art.style.setProperty("--ox",ox+"px");art.style.setProperty("--oy",oy+"px");art.style.transform="translate("+ox+"px,"+oy+"px)";
 scene.style.setProperty("--k",K);
 $("fxl").querySelectorAll("[data-ax]").forEach(e=>{
  const x=ox+e.dataset.ax*K,y=oy+e.dataset.ay*K;e.style.left=x+"px";e.style.top=y+"px";
  if(e.dataset.as){const s=e.dataset.as*K;e.style.width=s+"px";e.style.height=s*(+e.dataset.ar||1)+"px"}
  if(e.dataset.aw){const s=e.dataset.aw*K;e.style.width=s+"px";e.style.height=s+"px"}
 });
 $("fxl").querySelectorAll("[data-px]").forEach(e=>{e.style.left=e.dataset.px+"%";e.style.top=e.dataset.py+"%"});
 POT_XY=[ox+440*K,oy+790*K];
 const po=$("poof");po.style.left=POT_XY[0]+"px";po.style.top=POT_XY[1]+"px";
}
addEventListener("resize",place);
new ResizeObserver(place).observe(scene);

/* ===== состояние ===== */
const MAX=12;
let S={ingr:{},pots:{},recipe:null,others:[]};
let pot={};
let busy=false;
const potTotal=()=>Object.values(pot).reduce((a,b)=>a+b,0);
const have=id=>(S.ingr[id]|0)-(pot[id]|0);
const LIQ=["#c04a8a88","#6a8ae088","#4ac0a088","#e0a04a88","#a04ae088","#e04a4a88"];

function renderPot(){
 const box=$("inpot");box.replaceChildren();
 const ids=A.ORDER.filter(k=>pot[k]>0);
 if(!ids.length){const e=document.createElement("div");e.className="empty";e.textContent="Котёл пуст. Коснись ингредиента, чтобы бросить его внутрь.";box.appendChild(e)}
 ids.forEach(k=>{
  const c=document.createElement("button");c.type="button";c.className="chip";c.style.setProperty("--rc",A.RAR[A.ING[k].r]);
  c.innerHTML=A.glyph(k)+"×"+pot[k];c.title=A.ING[k].n;
  c.onclick=()=>{if(busy)return;pot[k]--;if(!pot[k])delete pot[k];sfx("back");render()};
  box.appendChild(c);
 });
 $("potCnt").textContent=potTotal()+"/"+MAX;
 $("brew").disabled=busy||!potTotal();
 $("clear").disabled=busy||!potTotal();
 const lc=potTotal()?LIQ[potTotal()%LIQ.length]:"#c04a8a88";
 const pe=document.querySelector(".fx.pot");if(pe)pe.style.setProperty("--lc",lc);
}
function renderIngs(){
 const g=$("ings");g.replaceChildren();
 let any=false;
 A.ORDER.forEach(k=>{
  const n=S.ingr[k]|0;if(!n)return;any=true;
  const it=A.ING[k],b=document.createElement("button");b.type="button";
  b.className="ing"+(it.r===3?" rare":it.r===2?" mid":"");b.title=it.n;
  b.innerHTML=A.glyph(k)+'<span class="cn">'+have(k)+'</span>';
  b.disabled=busy||have(k)<=0||potTotal()>=MAX;
  b.onclick=()=>addIng(k,b);
  g.appendChild(b);
 });
 if(!any){const e=document.createElement("div");e.className="trayEmpty";e.textContent="Ингредиентов пока нет. Их приносят монстры, события, квесты и сад.";g.appendChild(e)}
}
function addIng(k,btn){
 if(busy||have(k)<=0||potTotal()>=MAX)return;
 pot[k]=(pot[k]|0)+1;sfx("plant");sfx("rune");
 if(!reduce){
  const r=btn.getBoundingClientRect(),sr=scene.getBoundingClientRect();
  const d=document.createElement("div");d.className="drop";d.innerHTML=A.glyph(k);d.style.left=(r.left+r.width/2-20)+"px";d.style.top=(r.top+4)+"px";document.body.appendChild(d);
  const tx=sr.left+POT_XY[0]-r.left-r.width/2,ty=sr.top+POT_XY[1]-r.top-10;
  requestAnimationFrame(()=>{d.style.transform="translate("+tx+"px,"+ty+"px) scale(.45) rotate(200deg)";d.style.opacity=".1"});
  setTimeout(()=>{d.remove();sfx("dew");splash()},540);
 }
 render();
}
function splash(){
 if(reduce)return;
 const e=document.createElement("i");e.className="bub";e.dataset.ax=rnd(395,485);e.dataset.ay=776;e.dataset.aw=22;
 e.style.setProperty("--bd",".7s");e.style.animationIterationCount="1";e.style.animationFillMode="forwards";
 $("fxl").appendChild(e);place();setTimeout(()=>e.remove(),800);
}
function renderPots(){
 const g=$("pots");g.replaceChildren();
 const ids=Object.keys(S.pots||{}).filter(k=>S.pots[k]>0&&A.POT[k]);
 const total=ids.reduce((a,k)=>a+S.pots[k],0);
 $("potN").textContent=total?"· "+total:"";
 if(!ids.length){const e=document.createElement("div");e.className="bagEmpty";e.textContent="Пока нет сваренных зелий. Они попадают в сумку.";g.appendChild(e);return}
 ids.forEach(k=>{const P=A.POT[k],c=document.createElement("div");c.className="potc";c.style.setProperty("--pc",P.c+"99");c.innerHTML=A.potion(k)+'<b>'+P.n+'</b><small>×'+S.pots[k]+' · '+P.info.replace("Последовательность 8 · ","Посл. 8 · ")+'</small>';g.appendChild(c)});
}
function render(){renderPot();renderIngs();renderPots()}

/* шторки */
function openSheet(id){sfx("open");$("shBk").classList.add("on");$(id).classList.add("on")}
function closeSheets(){document.querySelectorAll(".sheet.on").forEach(s=>s.classList.remove("on"));$("shBk").classList.remove("on")}
$("tPots").onclick=()=>{renderPots();openSheet("shPots")};
$("shBk").onclick=()=>{sfx("back");closeSheets()};

$("clear").onclick=()=>{if(busy)return;pot={};sfx("back");render()};
$("brew").onclick=async()=>{
 if(busy||!potTotal())return;
 busy=true;render();
 scene.classList.add("boil");sfx("seqstart");sfx("swirl");[500,1000,1400].forEach((ms,i)=>setTimeout(()=>sfx(i==1?"sizzle":"rune"),ms));
 const items=Object.assign({},pot);
 let d=null,err=null;
 try{const [r]=await Promise.all([api({action:"lab_brew",items}),new Promise(r=>setTimeout(r,1800))]);d=r}catch(e){err=e;await new Promise(r=>setTimeout(r,900))}
 scene.classList.remove("boil");
 busy=false;
 if(err||!d||d.ok===false){toast(String((d&&(d.text||d.error))||(err&&err.message)||"Не удалось сварить."));pot={};await load();return}
 S.ingr=d.ingr||S.ingr;S.pots=d.pots||S.pots;S.recipe=d.recipe||S.recipe;S.others=d.others||S.others;
 pot={};render();
 result(d);
};
function result(d){
 const ov=document.createElement("div");ov.className="ov";
 if(d.success){
  const P=A.POT[d.potion.id];
  ov.innerHTML='<div class="res" style="--pc:'+P.c+'aa"><div class="bt">'+A.potion(d.potion.id)+'</div><h2>'+P.n+'</h2><p>'+P.info+'</p><p>'+P.d+'</p><p style="color:#8fb3a6">Зелье лежит в сумке.</p><button class="btn main" type="button">Забрать</button></div>';
  sfx("brewdone");setTimeout(()=>sfx("bell"),900);scene.classList.add("flash");setTimeout(()=>scene.classList.remove("flash"),700);
 }else{
  const h=d.hint||{};
  ov.innerHTML='<div class="res" style="--pc:#0008"><div class="fail">'+A.glyph("warn")+'</div><h2>Варево вышло мутным</h2><p>Ингредиенты сгорели в котле.</p><p>Ближе всего к «'+(h.name||"?")+'»: верно '+(h.ok|0)+' из '+(h.need|0)+'.</p><button class="btn" type="button">Понятно</button></div>';
  $("poof").classList.remove("go");void $("poof").offsetWidth;$("poof").classList.add("go");
  sfx("bad");setTimeout(()=>sfx("whisper"),300);
 }
 ov.querySelector("button").onclick=()=>{sfx("tap");ov.remove()};
 document.body.appendChild(ov);
}
async function load(){
 try{
  const d=await api({action:"lab_state"});
  if(d.ok===false){toast(String(d.text||d.error||"Ошибка"));render();return}
  S.ingr=d.ingr||{};S.pots=d.pots||{};S.recipe=d.recipe||null;S.others=d.others||[];
  Object.keys(pot).forEach(k=>{if((pot[k]|0)>(S.ingr[k]|0)){if(S.ingr[k])pot[k]=S.ingr[k];else delete pot[k]}});
 }catch(e){if(e&&e.message!=="need_start")toast(e.message||"Не удалось загрузить")}
 render();
}
buildFx();
render();
load();
</script>
<script src="../shared/icons.js?v=i1"></script>
</body>
