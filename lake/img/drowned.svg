</g><rect x="0" y="148" width="200" height="52" fill="url(#water)"/><path d="M0 148 Q25 143 50 148 T100 148 T150 148 T200 148" stroke="#8fe8f0" stroke-opacity=".45" fill="none" stroke-width="1.6"/><path class="sway" d="M8 200 Q12 165.0 6 130" stroke="#0a2a1a" stroke-width="3" fill="none"/><ellipse cx="6" cy="130" rx="2.5" ry="7" fill="#2a1a10"/><path class="sway" d="M18 200 Q22 174.0 16 148" stroke="#0a2a1a" stroke-width="3" fill="none"/><ellipse cx="16" cy="148" rx="2.5" ry="7" fill="#2a1a10"/><path class="sway" d="M184 200 Q188 167.0 182 134" stroke="#0a2a1a" stroke-width="3" fill="none"/><ellipse cx="182" cy="134" rx="2.5" ry="7" fill="#2a1a10"/><path class="sway" d="M194 200 Q198 176.0 192 152" stroke="#0a2a1a" stroke-width="3" fill="none"/><ellipse cx="192" cy="152" rx="2.5" ry="7" fill="#2a1a10"/><path class="sway" d="M172 200 Q176 180.0 170 160" stroke="#0a2a1a" stroke-width="3" fill="none"/><ellipse cx="170" cy="160" rx="2.5" ry="7" fill="#2a1a10"/>
</svg>