<g fill="#12302a"><path d="M72 48 Q60 80 66 110 Q72 84 80 52Z"/><path d="M128 48 Q140 80 134 110 Q128 84 120 52Z"/><path d="M84 44 Q80 86 84 118 Q90 86 92 46Z"/><path d="M116 44 Q120 86 116 118 Q110 86 108 46Z"/></g>
<ellipse cx="88" cy="62" rx="8" ry="10" fill="#041016"/><ellipse cx="112" cy="62" rx="8" ry="10" fill="#041016"/>
<g class="blink" filter="url(#glow)"><circle cx="88" cy="64" r="3" fill="#7af0ff"/><circle cx="112" cy="64" r="3" fill="#7af0ff"/></g>
<path d="M90 82 Q100 90 110 82 Q100 96 90 82Z" fill="#041016"/>
<path d="M62 120 Q40 130 34 150 M138 120 Q160 130 166 150" stroke="#a9c8c8" stroke-width="7" stroke-linecap="round" fill="none"/>
