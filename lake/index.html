<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<title>Озёра · Топи</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: dark;
  --panel: rgba(22,22,27,.94);
  --line: #403c46;
  --text: #ded9d0;
  --gold: #d4b579;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font: 14px Inter, Arial, sans-serif;
  background: #080b0f url('./IMG_20261020_125409.jpg') center/cover fixed no-repeat;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(#090c11aa, #09090df2);
}

.wrap {
  max-width: 480px;
  margin: auto;
  padding: 12px 12px 32px;
}

.head {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 0 14px;
}

.back {
  color: var(--text);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  background: #19181de8;
}

.heading {
  font-size: 16px;
  font-weight: 800;
}

.subheading {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-top: 3px;
}

.card {
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 15px;
  background: var(--panel);
  box-shadow: 0 10px 28px #0003;
}

.button {
  display: block;
  width: 100%;
  padding: 14px 12px;
  margin-top: 9px;
  border: 1px solid #5b4b36;
  border-radius: 11px;
  background: linear-gradient(135deg, #51442f, #302832);
  color: #e7d5ae;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

.button:active {
  transform: scale(.99);
}
</style>
</head>

<body>
<div class="wrap">
  <header class="head">
    <a class="back" href="../index.html">← Зал</a>
    <div>
      <div class="heading">🌊 Озёра · Топи</div>
      <div class="subheading">LORD OF THE MYSTERIES</div>
    </div>
  </header>

  <section class="card">
    <button class="button" id="exploreBtn" type="button">
      🔍 Исследовать берег
    </button>
  </section>
</div>

<script>
"use strict";

document.getElementById("exploreBtn").addEventListener("click", function () {
  window.location.href = "./battle/index.html" + window.location.search;
});
</script>
</body>
</html>
