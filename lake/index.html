<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<title>Озёра · Топи</title>

<style>
* { box-sizing: border-box; }

:root {
  color-scheme: dark;
  --panel: rgba(22,22,27,.94);
  --line: #403c46;
  --text: #ded9d0;
  --gold: #d4b579;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font: 14px Inter, Arial, sans-serif;
  background: #080b0f url('./IMG_20261020_125409.jpg') center/cover fixed no-repeat;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(#090c11aa, #09090df2);
}

.wrap { max-width: 480px; margin: auto; padding: 12px 12px 32px; }
.head { display: flex; align-items: center; gap: 11px; padding: 8px 0 14px; }

.back {
  color: var(--text);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  background: #19181de8;
}

.heading { font-size: 16px; font-weight: 800; }
.subheading { font-size: 10px; letter-spacing: 2px; color: var(--gold); margin-top: 3px; }

.card {
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 15px;
  background: var(--panel);
  box-shadow: 0 10px 28px #0003;
}

.button {
  display: block;
  width: 100%;
  padding: 14px 12px;
  margin-top: 9px;
  border: 1px solid #5b4b36;
  border-radius: 11px;
  background: linear-gradient(135deg, #51442f, #302832);
  color: #e7d5ae;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

.button:active { transform: scale(.99); }
.button:disabled { opacity: .5; }

#msg {
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.5;
  color: #d1c8d6;
  min-height: 18px;
}
#msg.err { color: #f0a3a3; }
</style>
</head>

<body>
<div class="wrap">
  <header class="head">
    <a class="back" href="../index.html">← Зал</a>
    <div>
      <div class="heading">🌊 Озёра · Топи</div>
      <div class="subheading">LORD OF THE MYSTERIES</div>
    </div>
  </header>

  <section class="card">
    <button class="button" id="exploreBtn" type="button">🔍 Исследовать берег</button>
    <div id="msg"></div>
  </section>
</div>

<script>
"use strict";

/* Если в вашем боте действие называется иначе — поменяйте только это слово */
const EXPLORE_ACTION = "explore";

const HANDSHAKE = "https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_99d5d708";
const tg = window.Telegram?.WebApp || null;
const qs = new URLSearchParams(location.search);
const uid = String(qs.get("u") || tg?.initDataUnsafe?.user?.id || "7320193489");
const aEnc = qs.get("a_enc") || qs.get("a") || "";
let ACTION_URL = aEnc ? "https://api.telebotcreator.com/new-webhook?data=" + encodeURIComponent(aEnc) : "";

const btn = document.getElementById("exploreBtn");
const msg = document.getElementById("msg");

function unwrap(v) {
  for (let i = 0; i < 3; i++) {
    if (v && v.result && typeof v.result === "object") v = v.result; else break;
  }
  return v;
}

function say(text, isError) {
  msg.textContent = text || "";
  msg.className = isError ? "err" : "";
}

async function ensure() {
  if (ACTION_URL) return;
  const r = await fetch(HANDSHAKE, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: uid }),
    cache: "no-store"
  });
  if (!r.ok) throw new Error("Не удалось подключиться к игре (HTTP " + r.status + ").");
  const d = unwrap(await r.json());
  const action = d?.action_url || d?.ACTION_URL;
  if (typeof action !== "string" || !action) throw new Error("Сервер не вернул адрес действий.");
  ACTION_URL = new URL(action).href;
}

async function api(payload) {
  await ensure();
  const r = await fetch(ACTION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
    cache: "no-store"
  });
  if (!r.ok) throw new Error("Ошибка игрового сервера (HTTP " + r.status + ").");
  const d = unwrap(await r.json());
  if (!d || typeof d !== "object") throw new Error("Сервер вернул некорректный ответ.");
  return d;
}

btn.addEventListener("click", async function () {
  if (btn.disabled) return;
  btn.disabled = true;
  say("Вы всматриваетесь в туман…", false);
  try {
    const data = await api({ action: EXPLORE_ACTION });

    if (data.error || data.ok === false) {
      say(String(data.text || data.error || "Сейчас ничего не найдено."), true);
      btn.disabled = false;
      return;
    }

    const params = new URLSearchParams(location.search);
    const enemy = data.enemy || data.enemy_name || data.name || "";
    if (enemy) params.set("enemy", enemy);
    const q = params.toString();
    location.href = "./battle/index.html" + (q ? "?" + q : "");
  } catch (e) {
    say(e.message || "Ошибка связи.", true);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
