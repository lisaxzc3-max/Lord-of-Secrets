<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<title>Озёра · Топи | Повелитель Тайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--panel:rgba(22,22,27,.94);--line:#403c46;--text:#ded9d0;--muted:#9b96a2;--gold:#d4b579}
body{margin:0;min-height:100vh;color:var(--text);font:14px Inter,Arial,sans-serif;background:#080b0f url('./IMG_20261020_125409.jpg') center/cover fixed no-repeat}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(#090c11aa,#09090df2)}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit}
.wrap{max-width:480px;margin:auto;padding:12px 12px calc(32px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;gap:11px;padding:8px 0 14px}
.back{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#19181de8;white-space:nowrap}
.heading{font-size:16px;font-weight:800}
.subheading{font-size:10px;letter-spacing:2px;color:var(--gold);margin-top:3px}
.card{border:1px solid var(--line);border-radius:17px;padding:15px;background:var(--panel);box-shadow:0 10px 28px #0003;margin-bottom:12px}
.stats{font-size:13px;line-height:1.7}
.bar{height:7px;background:#333039;border-radius:9px;overflow:hidden;margin:8px 0 13px}
.bar i{display:block;height:100%;width:0;background:#a65353;transition:width .25s}
.button{display:block;width:100%;padding:14px 12px;margin-top:9px;border:1px solid #5b4b36;border-radius:11px;background:linear-gradient(135deg,#51442f,#302832);color:#e7d5ae;font-weight:800;cursor:pointer}
.button:disabled{opacity:.55;cursor:wait}
.button.secondary{background:#242229;border-color:var(--line);color:var(--text)}
.note{text-align:center;font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}
.timerRow{display:flex;gap:8px;margin-bottom:10px}
.timerBox{flex:1;padding:10px;border:1px solid var(--line);border-radius:11px;background:#17151bea}
.timerBox.dead{border-color:#743c43}
.timerBox.regen{border-color:#376544}
.timerTitle{font-size:10px;color:var(--muted);margin-top:3px}
.hidden{display:none!important}
.error{margin-top:12px;padding:11px;border:1px solid #783b42;border-radius:10px;color:#f0a3a3;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5}
.message{margin-top:10px;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <a class="back" id="backHome" href="../index.html">← Зал</a>
    <div>
      <div class="heading">🌊 Озёра · Топи</div>
      <div class="subheading">LORD OF THE MYSTERIES</div>
    </div>
  </header>

  <div class="timerRow">
    <div id="deadBox" class="timerBox dead hidden">
      <strong>💀 <span id="deadTimer">--:--</span></strong>
      <div class="timerTitle">Время до воскрешения</div>
    </div>
    <div id="regenBox" class="timerBox regen hidden">
      <strong>🩹 <span id="regenTimer">--:--</span></strong>
      <div class="timerTitle">Восстановление · <span id="regenHp">—</span></div>
    </div>
  </div>

  <section class="card">
    <div class="stats">
      ❤️ Здоровье: <span id="hp">—</span>
      <br>🌀 Безумие: <span id="mad">—</span>%
      · ⭐ Опыт: <span id="exp">—</span>
    </div>
    <div class="bar"><i id="hpbar"></i></div>

    <button class="button" id="exploreBtn" type="button">🔍 Исследовать берег</button>

    <div class="note">
      В тумане можно встретить жабу, утопленника или обнаружить событие.
      <br>Каждое исследование обращается к игровому серверу.
    </div>

    <div id="message" class="message" aria-live="polite"></div>
    <div id="errorBox" class="error hidden" role="alert">
      <div id="errorText"></div>
      <button class="button secondary" id="retryBtn" type="button">Повторить подключение</button>
    </div>
  </section>
</div>

<script>
"use strict";

const tg = window.Telegram?.WebApp || null;
try {
  tg?.ready();
  tg?.expand();
  tg?.setHeaderColor("#080b0f");
} catch (_) {}

const qs = new URLSearchParams(location.search);
const uid = String(qs.get("u") || tg?.initDataUnsafe?.user?.id || "7320193489");

const pEnc = qs.get("p_enc") || qs.get("p") || "";
const aEnc = qs.get("a_enc") || qs.get("a") || "";

const HANDSHAKE =
  "https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_99d5d708";

let PROFILE_URL = pEnc
  ? "https://api.telebotcreator.com/new-webhook?data=" + encodeURIComponent(pEnc)
  : "";

let ACTION_URL = aEnc
  ? "https://api.telebotcreator.com/new-webhook?data=" + encodeURIComponent(aEnc)
  : "";

let busy = false;
let handshakePromise = null;

const $ = id => document.getElementById(id);

function unwrap(data) {
  let result = data;
  for (let i = 0; i < 3; i++) {
    if (result && result.result && typeof result.result === "object") {
      result = result.result;
    } else {
      break;
    }
  }
  return result;
}

function setMessage(text) {
  $("message").textContent = text || "";
}

function showError(text) {
  $("errorText").textContent = text || "Не удалось подключиться к игре.";
  $("errorBox").classList.remove("hidden");
}

function hideError() {
  $("errorBox").classList.add("hidden");
}

function setBusy(value) {
  busy = value;
  $("exploreBtn").disabled = value || $("exploreBtn").dataset.dead === "true";
  $("exploreBtn").textContent = value
    ? "⏳ Исследуем берег..."
    : "🔍 Исследовать берег";
}

function urlWithQuery(path, removeKeys = []) {
  const params = new URLSearchParams(location.search);
  for (const key of removeKeys) params.delete(key);
  const query = params.toString();
  return path + (query ? "?" + query : "");
}

$("backHome").href = urlWithQuery("../index.html", ["event_data", "enemy"]);

async function ensureUrls() {
  if (PROFILE_URL && ACTION_URL) return true;
  if (handshakePromise) return handshakePromise;

  handshakePromise = (async () => {
    const response = await fetch(HANDSHAKE, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: uid }),
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Ошибка подключения к игровому серверу: HTTP " + response.status);
    }

    const data = unwrap(await response.json());
    const profile = data?.profile_url || data?.PROFILE_URL;
    const action = data?.action_url || data?.ACTION_URL;

    if (typeof profile !== "string" || typeof action !== "string" || !profile || !action) {
      throw new Error("Сервер не вернул адреса игрового профиля и действий.");
    }

    const profileUrl = new URL(profile);
    const actionUrl = new URL(action);

    if (profileUrl.protocol !== "https:" || actionUrl.protocol !== "https:") {
      throw new Error("Сервер вернул некорректный адрес подключения.");
    }

    PROFILE_URL = profileUrl.href;
    ACTION_URL = actionUrl.href;
    return true;
  })();

  try {
    return await handshakePromise;
  } finally {
    handshakePromise = null;
  }
}

async function postJson(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error("Игровой сервер вернул HTTP " + response.status);
  }

  const data = unwrap(await response.json());
  if (!data || typeof data !== "object") {
    throw new Error("Игровой сервер вернул пустой или некорректный ответ.");
  }
  return data;
}

async function api(payload) {
  await ensureUrls();
  return postJson(ACTION_URL, payload);
}

async function loadProfile() {
  await ensureUrls();
  return postJson(PROFILE_URL, {});
}

function formatTime(seconds) {
  const value = Math.max(0, Number(seconds) || 0);
  const minutes = Math.floor(value / 60);
  const secs = Math.floor(value % 60);
  return String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
}

function renderProfile(profile) {
  const hp = Number(profile.hp ?? 0);
  const maxHp = Math.max(1, Number(profile.max_hp ?? 50));
  const madness = Number(profile.madness ?? 0);
  const exp = Number(profile.exp ?? 0);

  $("hp").textContent = hp + "/" + maxHp;
  $("mad").textContent = madness;
  $("exp").textContent = exp;
  $("hpbar").style.width = Math.max(0, Math.min(100, hp / maxHp * 100)) + "%";

  const dead = Boolean(profile.dead);
  $("deadBox").classList.toggle("hidden", !dead);
  $("regenBox").classList.toggle("hidden", !(dead || (profile.regen_left && hp < maxHp)));

  if (dead) {
    $("deadTimer").textContent = profile.dead_mmss || formatTime(profile.dead_left);
  }

  if (dead || (profile.regen_left && hp < maxHp)) {
    $("regenTimer").textContent = profile.regen_mmss ||
      formatTime(profile.regen_left ?? profile.dead_left);
    $("regenHp").textContent = hp + "/" + maxHp;
  }

  $("exploreBtn").dataset.dead = dead ? "true" : "false";
  $("exploreBtn").disabled = busy || dead;
  if (dead) {
    setMessage("Персонаж не может исследовать берег, пока не восстановится.");
  }
}

async function load() {
  hideError();
  try {
    const profile = await loadProfile();
    renderProfile(profile);
  } catch (error) {
    console.error("Lake profile error:", error);
    showError("Не удалось подключиться к игровому профилю.\n" +
      (error.message || "Проверь подключение и попробуй снова."));
  }
}

function goBattle(enemy) {
  const params = new URLSearchParams(location.search);
  params.delete("event_data");
  params.set("enemy", enemy || "Утопленник");
  location.href = "battle/index.html?" + params.toString();
}

function goEvent(data) {
  const params = new URLSearchParams(location.search);
  params.delete("enemy");
  params.set("event_data", JSON.stringify(data));
  location.href = "event/index.html?" + params.toString();
}

async function explore() {
  if (busy || $("exploreBtn").dataset.dead === "true") return;

  hideError();
  setMessage("");
  setBusy(true);

  try {
    const data = await api({ action: "explore_lake" });

    if (data.error === "dead") {
      setMessage(data.text || "Персонаж не может продолжить исследование.");
      await load();
      return;
    }

    if (data.error === "cooldown") {
      setMessage("⌛ Подожди " + (data.left ?? "?") + " секунд.");
      return;
    }

    if (data.type === "battle") {
      goBattle(data.enemy || "Утопленник");
      return;
    }

    if (data.type === "event") {
      goEvent(data);
      return;
    }

    if (data.error) {
      setMessage(data.text || data.message || "Не удалось исследовать берег.");
      return;
    }

    setMessage(data.text || data.message || "Берег затихает. Ничего нового не произошло.");
    await load();
  } catch (error) {
    console.error("Lake explore error:", error);
    showError("Не удалось исследовать берег.\n" +
      (error.message || "Проверь подключение и попробуй снова."));
  } finally {
    setBusy(false);
  }
}

$("exploreBtn").addEventListener("click", explore);
$("retryBtn").addEventListener("click", load);

load();
</script>
</body>
</html>
