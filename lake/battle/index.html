<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бой — Повелитель Тайн v118 escape fix</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial}
body{background:linear-gradient(rgba(10,10,14,.72),rgba(10,10,14,.88)),url('../IMG_20261020_125409.jpg') center/cover fixed no-repeat,#050a0e;color:#b8b5ad;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:10px 10px 60px}
.head{padding:10px 0;display:flex;gap:10px;align-items:center}
.head a{color:#b8b5ad;text-decoration:none;border:1px solid #3a3a3e;border-radius:8px;padding:4px 8px}
.card{background:rgba(22,22,26,.92);border:1px solid #3a3a3e;border-radius:16px;padding:12px;margin:10px 0}
.btn{border:1px solid #3a3a3e;background:rgba(38,38,42,.92);border-radius:10px;padding:10px;text-align:center;margin:4px 0;cursor:pointer;color:#b8b5ad;position:relative}
.btn.gold{background:#3a3a3e;color:#d4d0c3;font-weight:700}
.btn.dis{opacity:.45;pointer-events:none}
.btn small{position:absolute;top:3px;right:6px;font-size:9px;opacity:.9}
.vsGrid{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:center;text-align:center}
.vsImg{width:110px;height:110px;border-radius:14px;object-fit:cover;border:1px solid #4a4a4e;background:#1a1a1e}
.bar{height:7px;background:rgba(30,30,34,.9);border-radius:8px;margin:4px 0;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
.bar.hp i{background:#5a3a3a}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><a id="backHome" href="../index.html">← Озёра</a><b id="enemyName">Бой</b></div>
<div class="card">
<div class="vsGrid">
<div>
<img id="playerImg" class="vsImg" src="../../i-72.jpeg" onerror="this.src='../../i-72.jpeg'">
<div style="margin-top:6px;font-weight:700" id="playerName">Ты</div>
<div style="font-size:11px">❤️ <span id="playerHp">-</span></div>
<div class="bar hp"><i id="playerHpBar" style="width:0%"></i></div>
</div>
<div style="font-size:18px;opacity:.6">VS</div>
<div>
<img id="enemyImg" class="vsImg" src="./fdcd7a60-8785-416e-bb15-4c0ff06b5c23.png" onerror="this.src='./b10d4ddc-2110-4e37-a16b-cc7d5a1d2cc2.png'">
<div style="margin-top:6px;font-weight:700" id="enemyLabel">Враг</div>
<div style="font-size:11px">❤️ <span id="enemyHp">-</span></div>
<div class="bar hp"><i id="enemyHpBar" style="width:0%"></i></div>
</div>
</div>
<div id="battleText" style="font-size:12px;white-space:pre-wrap;opacity:.8;margin-top:8px"></div>
<div id="battleSkills" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"></div>
</div>
<div id="victoryCard" class="card hidden"><div style="text-align:center;font-weight:800;letter-spacing:4px">◆ ПОБЕДА ◆</div><div style="text-align:center;margin:8px 0">📦 <span id="vTenge">+1</span> £ · ✨ <span id="vExp">+1</span></div><div class="btn gold" onclick="exploreAgain()">🔍 Исследовать снова</div><div class="btn" onclick="goLake()">✕ Закрыть</div></div>
<div id="defeatCard" class="card hidden" style="border-color:#6a2a2a"><div style="text-align:center;font-weight:800;color:#ef4444">◆ ПОРАЖЕНИЕ ◆</div><div style="text-align:center;font-size:12px">💀 10:00 до воскрешения</div><div class="btn" onclick="goLake()">← К Озёрам</div></div>
</div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const qs=new URLSearchParams(location.search);
let uid=qs.get("u")||tg.initDataUnsafe?.user?.id||"7320193489";
let p_enc=qs.get("p_enc")||"",a_enc=qs.get("a_enc")||"";
let PROFILE_URL=p_enc?"https://api.telebotcreator.com/new-webhook?data="+p_enc:"";
let ACTION_URL=a_enc?"https://api.telebotcreator.com/new-webhook?data="+a_enc:"";
const HANDSHAKE="https://api.telebotcreator.com/new-webhook?data=TBCSECRET_secret_99d5d708";
function unwrap(j){return j&&j.result&&typeof j.result==='object'?j.result:j}
const pics={"Утопленник":"./fdcd7a60-8785-416e-bb15-4c0ff06b5c23.png","Жаба":"./b10d4ddc-2110-4e37-a16b-cc7d5a1d2cc2.png"};
let PLAYER_PATH="";
function goLake(){location.href="../index.html"+location.search;}
function exploreAgain(){
 api({action:"explore_lake"}).then(d=>{
  if(d.ok&&d.type==="battle"){
   let suffix=location.search.includes("?")?"&"+location.search.slice(1):"";
   location.href="./index.html?enemy="+encodeURIComponent(d.enemy)+suffix;
  } else if(d.ok&&d.type==="event"){
   location.href="../index.html"+location.search;
   // озеро покажет ивент с картинкой
   setTimeout(()=>{},300);
  } else if(d.error==="dead"){alert(d.text);goLake();}
  else if(d.error==="cooldown"){alert("⌛ "+d.left+"с");}
  else if(d.error){goLake();}
 }).catch(()=>goLake());
}
document.addEventListener('DOMContentLoaded',()=>{let a=document.getElementById('backHome');if(a) a.href="../index.html"+location.search;});
async function ensure(){if(PROFILE_URL&&ACTION_URL) return true;const r=await fetch(HANDSHAKE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:String(uid)})});const j=unwrap(await r.json());PROFILE_URL=j.profile_url;ACTION_URL=j.action_url;return true;}
async function api(p){if(!ACTION_URL) await ensure();const r=await fetch(ACTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});return unwrap(await r.json());}
function renderSkills(cds){
 let path=PLAYER_PATH||"";
 let skills=document.getElementById('battleSkills');skills.innerHTML="";
 let acts=[];
 if(path.includes("Шута")||path.includes("Шут")){
  acts=[["divination","🔮 Гадание",cds.divination||0],["boomerang","🪃 Бумеранг",cds.boomerang||0],["acting","🎭 Актёрство",cds.acting||0]];
 } else if(path.includes("Тирана")){
  acts=[["sailor_hit","👊 Сильный удар",cds.hit||0],["sailor_drink","🍺 Перепить",cds.drink||0],["sailor_pray","😡 Гнев",cds.pray||0]];
 } else if(path.includes("Жреца")||path.includes("Красного")){
  acts=[["hunter_dagger","🔥 Берсерк",cds.dagger||0],["hunter_trap","🪤 Ловушка",cds.trap||0],["hunter_boost","😤 Провокация",cds.boost||0]];
 } else {
  acts=[["divination","🔮 Гадание",cds.divination||0],["boomerang","🪃 Бумеранг",cds.boomerang||0],["acting","🎭 Актёрство",cds.acting||0]];
 }
 acts.forEach(a=>{
  let b=document.createElement('div');
  let cd=a[2];
  b.className=cd>0?'btn dis':'btn gold';
  b.innerHTML=a[1]+(cd>0?'<small>'+cd+'</small>':'');
  if(cd>0) b.title='КД '+cd;
  else b.onclick=()=>doBattle(a[0]);
  skills.appendChild(b);
 });
 let bCd=cds.basic||0;
 let bb=document.createElement('div');bb.className=bCd>0?'btn dis':'btn';bb.innerHTML='⚔ Базовая'+(bCd>0?'<small>'+bCd+'</small>':'');if(bCd>0) bb.title='КД '+bCd; else bb.onclick=()=>doBattle('basic');skills.appendChild(bb);
 let f=document.createElement('div');f.className='btn';f.innerText='🏃 Побег';f.onclick=()=>doBattle('flee');skills.appendChild(f);
}
async function load(){
 if(!PROFILE_URL) await ensure();
 let r=await fetch(PROFILE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
 let j=unwrap(await r.json());
 PLAYER_PATH=j.path||"";
 document.getElementById('playerName').innerText=j.nickname;
 document.getElementById('playerHp').innerText=j.hp+"/"+j.max_hp;
 document.getElementById('playerHpBar').style.width=(j.hp/j.max_hp*100)+"%";
 let enemy=qs.get("enemy");
 if(!enemy){try{let s=await api({action:"battle_state"}); if(s.ok&&s.enemy) enemy=s.enemy;}catch(e){}}
 if(!enemy) enemy="Утопленник";
 if(enemy==="Лягушка") enemy="Жаба";
 document.getElementById('enemyLabel').innerText=enemy;
 document.getElementById('enemyName').innerText="⚔ "+enemy;
 document.getElementById('enemyImg').src=pics[enemy]||"./fdcd7a60-8785-416e-bb15-4c0ff06b5c23.png";
 let cds={};
 try{let s=await api({action:"battle_state"}); if(s.ok){document.getElementById('enemyHp').innerText=s.enemy_hp+"/"+s.enemy_max;document.getElementById('enemyHpBar').style.width=(s.enemy_hp/s.enemy_max*100)+"%";if(s.cds) cds=s.cds;}}catch(e){}
 renderSkills(cds);
}
async function doBattle(m){
 if(m==="flee"){
  let d=await api({action:"battle",move:"flee"});
  goLake();
  return;
 }
 let d=await api({action:"battle",move:m});
 if(d.error==="cooldown"){if(d.cds) renderSkills(d.cds);return;}
 if(d.error && d.error!=="cooldown"){return;}
 if(d.type==="victory"){document.getElementById('victoryCard').classList.remove('hidden');document.getElementById('vTenge').innerText="+"+(d.tenge||1);document.getElementById('vExp').innerText="+"+(d.exp_add||1);document.getElementById('battleSkills').style.pointerEvents="none";return;}
 if(d.type==="defeat"){document.getElementById('defeatCard').classList.remove('hidden');document.getElementById('battleSkills').style.pointerEvents="none";return;}
 if(d.type==="flee"){goLake();return;}
 if(d.type==="battle"){
  document.getElementById('enemyHp').innerText=d.enemy_hp+"/"+d.enemy_max;document.getElementById('enemyHpBar').style.width=(d.enemy_hp/d.enemy_max*100)+"%";
  document.getElementById('playerHp').innerText=d.hp+"/"+d.max_hp;document.getElementById('playerHpBar').style.width=(d.hp/d.max_hp*100)+"%";
  document.getElementById('battleText').innerText=(d.log||"")+" "+(d.e_log||"");
  if(d.cds) renderSkills(d.cds);
  else {try{let s=await api({action:"battle_state"}); if(s.ok&&s.cds) renderSkills(s.cds);}catch(e){}}
 }
}
load();
</script>
</body>
</html>
