window.BATTLE_CFG={
 title:"Озёра",
 back:"← Озёра",
 backDefeat:"← К озёрам",
 bg:"loc_lake.jpg",
 bgPos:"42% 100%",
 mist:"#9fd0d826",
 p2glow:"#ff3a2acc",
 shield:"#cfd8e8cc",
 explore:"explore_lake",
 enemyDefault:"Утопленница",
 mobDefault:"drowned",
 intro:"Туман скрывает очертания противника.",
 win:"Противник повержен. Туман расступается, оставляя награду.",
 note:"Не каждый силуэт в тумане дружелюбен.",
 back_hint:"Вернись к озёрам",
 enter:n=>"Из тумана выходит противник: "+n+".",
 alias:{"Лягушка":"Жаба"},
 boss:{msg:"Вода темнеет. Хозяин озёр поднимается из глубины.",icon:"🌊",color:"#7af0ff",banner:n=>"БОСС: "+n.toUpperCase()},
 chips:{poison:["hero","☠ Яд"],coil:["foe","🌀 Кольца"]},
 mob:{"Утопленница":"drowned","Утопленник":"drowned","Жаба":"toad","Лягушка":"toad","Змей":"serpent","Пиявка-великанша":"leech","Зубастая щука":"pike","Кикимора":"kikimora","Водяной":"vodyanoy"},
 p2:{serpent:"serpent2",vodyanoy:"vodyanoy2"},
 role:{"Утопленница":"Утонувшая путница","Утопленник":"Утонувший путник","Жаба":"Болотная тварь","Лягушка":"Болотная тварь","Пиявка-великанша":"Болотная тварь","Зубастая щука":"Речной хищник","Кикимора":"Болотная ведьма","Водяной":"Хозяин вод","Змей":"Змей озёр"},
 mobsnd:{"Утопленница":"lkgurgle","Утопленник":"lkgurgle","Жаба":"frog","Лягушка":"frog","Змей":"lkhiss","Пиявка-великанша":"lksquelch","Зубастая щука":"lksplash","Кикимора":"lkcackle","Водяной":"lkroar"},
 skipRx:/спит|усып|оглуш|пропуска|не может действ|оцепен|скован|обездвиж|в ловушке/i,
 castRx:/Тина липнет|Растворяется в камышах|Скользит в тину|уходит на глубину|Водяной щит|Волна поднимается|переводит дух/,
 bossFx:function(text,X){const {st,B,banner,snd,$,P2}=X;
  if(!text)return{heavy:0};
  let heavy=0;
  if(/ЛИНЬКА/.test(text)){B.flash("#ff8a3c");banner("ЛИНЬКА","#ff5a3a");B.shake(2)}
  if(/кольца/.test(text)){st.coil=1}
  if(/Удушение/.test(text)){banner("УДУШЕНИЕ","#f08b8b");heavy=2}
  if(/Ядовитый укус|Яд\s/.test(text)||/☠/.test(text)){st.poison=3}
  if(/Утягивание на дно/.test(text)){banner("НА ДНО","#7af0ff");heavy=2}
  if(/Ледяной шёпот/.test(text)){banner("ШЁПОТ","#9fb8ff")}
  return{heavy};
 }
};
</script>
